<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Schach mit Rokko</title>
<meta name="theme-color" content="#0E8C7E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rokko">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<!-- Keine Verbindung zu Google: auf iPhone und Mac zeichnet SF Pro Rounded (ui-rounded) die Schrift -->
<style>
:root{padding:0}
body{margin:0}
img{max-width:100%}[hidden]{display:none!important}
/* Layout: eine Handy-Spalte (max. 600px) mit fester Tab-Leiste unten; jede Ansicht ist eine Szene in Peters Schachland. */
:root{
  --bg:#E9F2F4;
  --bg2:#DCEBEF;
  --surface:#FFFFFF;
  --ink:#14232C;
  --muted:#56707C;
  --line:#C9DAE0;
  --peter:#0E8C7E;
  --on-peter:#FFFFFF;
  --peter-soft:#D3EFE9;
  --sun:#F6B91F;
  --sun-ink:#3A2A00;
  --good:#278442;
  --on-good:#FFFFFF;
  --on-danger:#FFFFFF;
  --good-soft:#DDF3E3;
  --danger:#D6402F;
  --danger-soft:#FBE3DF;
  --light-sq:#F0D9B5;
  --dark-sq:#B58863;
  --coord-light:#8D6747;
  --coord-dark:#FBEBD3;
  --last:rgba(246,205,60,.55);
  --shadow:0 4px 0 rgba(20,35,44,.12);
  --font-display:"Fredoka",ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A20;--bg2:#15232A;--surface:#1B2A32;--ink:#E8F1F4;--muted:#9DB4BE;--line:#2D414B;
  --peter:#3CC6B3;--on-peter:#062420;--peter-soft:#173C37;--sun:#F7C64A;--sun-ink:#2A1E00;
  --good:#53C978;--good-soft:#173826;--danger:#F2705E;--on-good:#0B2A14;--on-danger:#2A0A05;--danger-soft:#3D1E1A;
  --light-sq:#E6CFA8;--dark-sq:#A57A55;--coord-light:#7E5C3F;--coord-dark:#FBEBD3;--last:rgba(246,205,60,.5);
  --shadow:0 4px 0 rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A20;--bg2:#15232A;--surface:#1B2A32;--ink:#E8F1F4;--muted:#9DB4BE;--line:#2D414B;
  --peter:#3CC6B3;--on-peter:#062420;--peter-soft:#173C37;--sun:#F7C64A;--sun-ink:#2A1E00;
  --good:#53C978;--good-soft:#173826;--danger:#F2705E;--on-good:#0B2A14;--on-danger:#2A0A05;--danger-soft:#3D1E1A;
  --light-sq:#E6CFA8;--dark-sq:#A57A55;--coord-light:#7E5C3F;--coord-dark:#FBEBD3;--last:rgba(246,205,60,.5);
  --shadow:0 4px 0 rgba(0,0,0,.35);color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

#app{max-width:600px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.view{flex:1;padding-block:12px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.view.full{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}

/* ---------- Tab-Leiste ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1.5px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
.tab{border:0;background:transparent;border-radius:14px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--font-display);font-weight:600;font-size:.78rem;color:var(--muted)}
.tab svg{width:28px;height:28px}
.tab[aria-current="page"]{color:var(--peter);background:var(--peter-soft)}
.tabs[hidden]{display:none}

/* ---------- Kopfzeile ---------- */
.hud{display:flex;align-items:center;gap:10px}
.avatar{flex:0 0 auto;width:52px;height:52px;border-radius:50%;background:var(--surface);border:3px solid var(--peter);display:flex;align-items:center;justify-content:center;padding:0}
.avatar svg{width:36px;height:36px}
.hud-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.hud-name{font-family:var(--font-display);font-weight:700;font-size:1.25rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-rank{font-size:.85rem;color:var(--muted);font-weight:700}
.xpbar{height:10px;border-radius:99px;background:var(--bg2);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),#FF9F2E);border-radius:99px;transition:width .6s ease}
.chips{display:flex;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1.5px solid var(--line);border-radius:99px;padding:4px 10px;font-family:var(--font-display);font-weight:700;font-size:1rem;font-variant-numeric:tabular-nums}
.chip .i{width:20px;height:20px}
.iconbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;padding:0}
.iconbtn svg{width:24px;height:24px}

/* ---------- Peter ---------- */
.peter{width:72px;height:72px;flex:0 0 auto;cursor:pointer;background:none;border:0;padding:0}
.peter svg{width:100%;height:100%;display:block;overflow:visible}
.peterbot .e,.peterbot .m{display:none}
.peterbot .e-smile,.peterbot .m-smile{display:block}
.peter[data-mood] .peterbot .e,.peter[data-mood] .peterbot .m{display:none}
.peter[data-mood="sleep"] .peterbot .e-sleep,.peter[data-mood="sleep"] .peterbot .m-sleep,.peter[data-mood="smile"] .peterbot .e-smile,.peter[data-mood="wow"] .peterbot .e-wow,.peter[data-mood="worry"] .peterbot .e-worry,.peter[data-mood="think"] .peterbot .e-think{display:block}
.peter[data-mood="smile"] .peterbot .m-smile,.peter[data-mood="wow"] .peterbot .m-wow,.peter[data-mood="worry"] .peterbot .m-worry,.peter[data-mood="think"] .peterbot .m-think{display:block}
.peter.talking .peterbot .m{display:none}
.peter.talking .peterbot .m-talk{display:block}
.peter.talking .m-talk rect{transform-box:fill-box;transform-origin:center;animation:eq .32s ease-in-out infinite alternate}
.peter.talking .m-talk .b2{animation-delay:.12s}.peter.talking .m-talk .b3{animation-delay:.22s}
.peter .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.peter[data-mood="think"] .eyes{animation:look 1.1s ease-in-out infinite alternate}
.peter.bounce{animation:bounce .55s ease}
.peter .hat{display:none}
@keyframes eq{from{transform:scaleY(.35)}to{transform:scaleY(1.15)}}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.12)}}
@keyframes look{from{transform:translateX(-3px)}to{transform:translateX(3px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}35%{transform:translateY(-12px) rotate(-5deg)}70%{transform:translateY(0) rotate(3deg)}}
.talkrow{display:flex;gap:10px;align-items:center}
.bubble{position:relative;flex:1;min-width:0;background:var(--surface);border:2.5px solid var(--peter);border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:8px;min-height:64px;box-shadow:var(--shadow)}
.bubble::before{content:"";position:absolute;left:-10px;top:50%;margin-top:-8px;width:16px;height:16px;background:var(--surface);border-left:2.5px solid var(--peter);border-bottom:2.5px solid var(--peter);transform:rotate(45deg)}
.say{flex:1;min-width:0;margin:0;font-family:var(--font-display);font-weight:600;font-size:clamp(1.08rem,4.4vw,1.32rem);line-height:1.25;text-wrap:pretty}
.speak{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:0;background:var(--peter-soft);color:var(--peter);display:flex;align-items:center;justify-content:center;padding:0}
.speak svg{width:22px;height:22px}
.speak.listening{background:var(--danger);color:var(--on-danger);animation:pulse .7s ease-in-out infinite alternate}

/* ---------- Karten & Knöpfe ---------- */
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.card h2{font-size:1.25rem}
.card h3{font-size:1.08rem}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.big{border:0;border-radius:16px;padding:0 18px;font-family:var(--font-display);font-weight:700;font-size:1.15rem;min-height:56px;display:inline-flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .08s}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.big svg{width:26px;height:26px;flex:0 0 auto}
.go{background:var(--peter);color:var(--on-peter)}
.sunbtn{background:var(--sun);color:var(--sun-ink)}
.ghost{background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.dangerbtn{background:var(--danger);color:var(--on-danger)}
.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.big{flex:1 1 140px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

/* ---------- Startseite ---------- */
.hero{display:flex;flex-direction:column;gap:12px;border-radius:22px;padding:16px;color:#fff;background:var(--wc,var(--peter));box-shadow:0 5px 0 rgba(0,0,0,.18);position:relative;overflow:hidden;border:0;text-align:left}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .eyebrow{font-family:var(--font-display);font-weight:600;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.hero h2{font-size:1.6rem;line-height:1.1}
.hero .cta{align-self:flex-start;background:#fff;color:var(--wc,var(--peter));border-radius:14px;padding:10px 18px;font-family:var(--font-display);font-weight:700;font-size:1.1rem;display:inline-flex;gap:8px;align-items:center;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.hero .cta svg{width:22px;height:22px}
.hero .glyph{position:absolute;right:14px;bottom:8px;width:84px;height:84px;opacity:.95}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow);min-height:132px}
.tile .ti{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--tc,var(--peter-soft));color:var(--tci,var(--peter))}
.tile .ti svg{width:30px;height:30px}
.tile b{font-family:var(--font-display);font-size:1.12rem}
.tile span{font-size:.86rem;color:var(--muted)}
.mission li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.mission li:last-child{border-bottom:0}
.mission ul{list-style:none;margin:8px 0 0;padding:0}
.mission .ck{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.mission .ck svg{width:18px;height:18px}
.mission li.done .ck{background:var(--good);border-color:var(--good);color:var(--on-good)}
.mission li.done .t{text-decoration:line-through;color:var(--muted)}
.mission .t{flex:1;min-width:0;font-weight:700}
.mission .n{font-family:var(--font-display);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.chest{width:64px;height:64px;flex:0 0 auto}
.chest.ready{animation:wiggle 1s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}

/* ---------- Abenteuerkarte ---------- */
.world{border-radius:24px;padding:16px 12px 22px;background:color-mix(in srgb,var(--wc) 15%,var(--surface));position:relative;display:flex;flex-direction:column;gap:6px}
.world-head{display:flex;align-items:center;gap:12px;padding:0 4px 6px}
.world-head .wi{width:56px;height:56px;border-radius:18px;background:var(--wc);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.world-head .wi svg{width:42px;height:42px}
.world-head h2{font-size:1.3rem;color:color-mix(in srgb,var(--wc) 72%,var(--ink))}
.world-head p{margin:0;font-size:.88rem;color:var(--muted)}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;position:relative}
.node{--x:0px;transform:translateX(var(--x));display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:0}
.node .disc{width:76px;height:76px;border-radius:50%;background:var(--wc);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 var(--wdark),0 8px 14px rgba(0,0,0,.15);position:relative}
.node .disc svg{width:40px;height:40px}
.node.locked .disc{background:var(--bg2);color:var(--muted);box-shadow:0 6px 0 var(--line)}
.node.current .disc{animation:hop 1.4s ease-in-out infinite}
.node.current .disc::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid var(--wc);opacity:.5;animation:ring 1.4s ease-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes ring{from{transform:scale(.9);opacity:.6}to{transform:scale(1.25);opacity:0}}
.node .lbl{font-family:var(--font-display);font-weight:600;font-size:.92rem;max-width:150px;text-align:center;line-height:1.15;color:var(--ink)}
.node.locked .lbl{color:var(--muted)}
.node .st{display:flex;gap:1px;height:18px}
.node .st svg{width:18px;height:18px}
.node .badge-board{position:absolute;right:-6px;top:-6px;background:var(--sun);color:var(--sun-ink);border-radius:10px;padding:2px 5px;font-size:.7rem;font-weight:700;font-family:var(--font-display);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.friend-pop{position:absolute;right:10px;top:12px;width:64px;height:64px}

/* ---------- Brett ---------- */
.boardwrap{position:relative;width:100%;max-width:520px;margin-inline:auto}
.board{container-type:inline-size;width:100%;aspect-ratio:1/1;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:12px;overflow:hidden;border:5px solid var(--dark-sq);box-shadow:0 6px 0 rgba(0,0,0,.16);user-select:none;-webkit-user-select:none;touch-action:manipulation;background:var(--dark-sq)}
.sq{position:relative;border:0;padding:0;margin:0;display:flex;align-items:center;justify-content:center;background:var(--light-sq);min-width:0;min-height:0}
.sq.dk{background:var(--dark-sq)}
.sq.last::before{content:"";position:absolute;inset:0;background:var(--last)}
.sq .pc{position:relative;z-index:2;width:88%;height:88%;transition:transform .15s;pointer-events:none;filter:drop-shadow(0 .5cqw 0 rgba(0,0,0,.25))}
.sq .pc.flying{z-index:6}
.sq.sel .pc{transform:scale(1.15) translateY(-6%)}
.sq.sel::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 .9cqw var(--peter);z-index:3}
.sq.dot::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(14,110,98,.55);z-index:3;animation:breathe 1.2s ease-in-out infinite alternate}
.sq.ring::after{content:"";position:absolute;inset:5%;border-radius:50%;box-shadow:0 0 0 .9cqw rgba(214,64,47,.8);z-index:3;animation:breathe 1.2s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scale(.85)}to{transform:scale(1.05)}}
.sq.check{background:radial-gradient(circle,#ff5a4a 0%,#e0402f 45%,transparent 75%),var(--light-sq)}
.sq.dk.check{background:radial-gradient(circle,#ff5a4a 0%,#e0402f 45%,transparent 75%),var(--dark-sq)}
.sq.danger::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1.1cqw var(--danger);z-index:3;animation:pulse .6s ease-in-out infinite alternate}
.sq.goal::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1.1cqw var(--sun);z-index:3;animation:pulse .8s ease-in-out infinite alternate}
.sq.which::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1.1cqw var(--peter);z-index:3;animation:pulse .7s ease-in-out infinite alternate}
.sq.ok{background:var(--good)!important}
.sq.ok .nm{color:var(--on-good)!important;opacity:1;text-shadow:none}
.sq.bad{animation:shake .4s ease}
.sq.bad::before{content:"";position:absolute;inset:0;background:rgba(214,64,47,.55);z-index:1}
.sq.found::before{content:"";position:absolute;inset:8%;border-radius:22%;background:var(--good);opacity:.85;z-index:1;animation:popin .3s ease}
.sq.shake{animation:shake .4s ease}
@keyframes pulse{from{opacity:.4}to{opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7%)}75%{transform:translateX(7%)}}
@keyframes popin{from{transform:scale(.6);opacity:.2}to{transform:scale(1);opacity:1}}
.sq .nm{position:absolute;left:0;right:0;bottom:2%;text-align:center;font-family:var(--font-display);font-weight:700;font-size:3.4cqw;color:var(--coord-light);opacity:.85;z-index:1;pointer-events:none}
.sq.dk .nm{color:var(--coord-dark);text-shadow:0 1px 1px rgba(60,35,15,.55)}
.sq:not(.has) .nm{top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:4.6cqw;opacity:.75}
.board.nonames .nm{display:none}
.board.edge .nm{display:none}
.board .cf,.board .cr{position:absolute;font-family:var(--font-display);font-weight:700;font-size:3cqw;z-index:1;color:var(--coord-light);pointer-events:none}
.board .sq.dk .cf,.board .sq.dk .cr{color:var(--coord-dark)}
.board .cf{right:5%;bottom:1%}.board .cr{left:5%;top:1%}
.board:not(.edge) .cf,.board:not(.edge) .cr{display:none}
.sq .star,.sq .rock{position:absolute;inset:14%;z-index:2;pointer-events:none}
.sq .star{animation:twinkle 1.6s ease-in-out infinite alternate}
@keyframes twinkle{from{transform:scale(.9) rotate(-6deg)}to{transform:scale(1.05) rotate(6deg)}}
.sq .star.got{animation:collect .5s ease forwards}
@keyframes collect{to{transform:scale(1.8) translateY(-40%);opacity:0}}
.arrows{position:absolute;inset:5px;width:calc(100% - 10px);height:calc(100% - 10px);pointer-events:none;z-index:7}
.tray{min-height:1.7rem;display:flex;align-items:center;gap:4px;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.tray svg{width:22px;height:22px}

/* ---------- Lektionen ---------- */
.lesson-top{display:flex;align-items:center;gap:10px}
.prog{flex:1;height:16px;border-radius:99px;background:var(--bg2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--wc,var(--peter));border-radius:99px;transition:width .4s ease;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.task{font-family:var(--font-display);font-weight:700;font-size:1.25rem;text-align:center;margin:0}
.task .sqbig{display:inline-block;background:var(--sun);color:var(--sun-ink);border-radius:12px;padding:2px 12px;font-size:1.6rem;margin-left:6px;vertical-align:middle}
.counter{display:flex;justify-content:center;gap:14px;font-family:var(--font-display);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.opt{border:2.5px solid var(--line);background:var(--surface);border-radius:16px;min-height:62px;font-family:var(--font-display);font-weight:700;font-size:1.25rem;box-shadow:0 4px 0 var(--line);padding:8px}
.opt.right{background:var(--good-soft);border-color:var(--good);box-shadow:0 4px 0 var(--good)}
.opt.wrong{background:var(--danger-soft);border-color:var(--danger);box-shadow:0 4px 0 var(--danger);animation:shake .4s ease}
.feedback{border-radius:16px;padding:12px 14px;font-weight:700;display:flex;gap:10px;align-items:center;animation:popin .25s ease}
.feedback.good{background:var(--good-soft);color:var(--ink);border:2px solid var(--good)}
.feedback.bad{background:var(--danger-soft);color:var(--ink);border:2px solid var(--danger)}
.feedback svg{width:30px;height:30px;flex:0 0 auto}
.done-screen{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:20px}
.done-screen h1{font-size:2rem}
.bigstars{display:flex;gap:6px}
.bigstars svg{width:72px;height:72px;opacity:.25;transform:scale(.6);transition:all .4s cubic-bezier(.3,1.6,.5,1)}
.bigstars svg.on{opacity:1;transform:scale(1)}
.bigstars svg:nth-child(2){transform:translateY(-14px) scale(.6)}
.bigstars svg:nth-child(2).on{transform:translateY(-14px) scale(1.1)}
.reward{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--sun);border-radius:16px;padding:10px 14px;font-family:var(--font-display);font-weight:700;animation:popin .4s ease}
.reward svg{width:44px;height:44px}

/* ---------- Partie ---------- */
.status{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.turn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;font-size:1.15rem;padding:6px 14px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-variant-numeric:tabular-nums}
.turn .dot{width:14px;height:14px;border-radius:50%;background:#fff;border:2.5px solid #222;flex:0 0 auto}
.turn.peter-turn{border-color:var(--peter);background:var(--peter-soft)}
.turn.peter-turn .dot{background:#1C1C1C;border-color:#1C1C1C}
.turn svg{width:24px;height:24px}
.voice-row{display:flex;gap:8px}
.voice-row input,.field{flex:1;min-width:0;font:inherit;font-size:1.12rem;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.voice-row input:focus,.field:focus{border-color:var(--peter);outline:none}
.mic{background:var(--sun);color:var(--sun-ink);width:58px;padding:0}
.mic.on{background:var(--danger);color:var(--on-danger);animation:pulse .6s ease-in-out infinite alternate}
.actions{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.act{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--font-display);font-weight:600;font-size:.82rem;box-shadow:0 3px 0 var(--line)}
.act svg{width:28px;height:28px;color:var(--peter)}
.act:active{transform:translateY(2px)}
.act.armed{border-color:var(--danger);color:var(--danger)}
.act.on{background:var(--peter-soft);border-color:var(--peter)}
.ask{border:3px solid var(--danger);animation:popin .3s ease}
.ask p{margin:0 0 10px;font-family:var(--font-display);font-weight:700;font-size:1.2rem}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.choice .tile{min-height:auto}
.level-pick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.rung{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 2px 6px;hyphens:auto;overflow-wrap:anywhere;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:700;line-height:1.1;text-align:center}
.rung svg{width:32px;height:32px}
.rung[aria-pressed="true"]{background:var(--peter-soft);border-color:var(--peter)}

/* ---------- Training ---------- */
.tip{display:flex;gap:12px;align-items:center;border:2.5px solid var(--sun);background:var(--surface);border-radius:20px;padding:14px;box-shadow:0 4px 0 var(--sun)}
.tip .ti{width:54px;height:54px;border-radius:16px;background:var(--sun);color:var(--sun-ink);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.tip .ti svg{width:34px;height:34px}
.tip div{flex:1;min-width:0}
.mastery{display:flex;gap:1px}
.mastery svg{width:15px;height:15px}
.trainlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.trainlist .tile{min-height:150px}
.piecepick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.piecepick button{border:2px solid var(--line);background:var(--surface);border-radius:16px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;padding:6px}
.piecepick svg{width:100%;height:100%}

/* ---------- Album ---------- */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--bg2);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:11px;padding:9px 4px;font-family:var(--font-display);font-weight:700;font-size:.95rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fcard{border-radius:20px;padding:12px;background:var(--fc);color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.2);border:0;min-height:210px;position:relative;overflow:hidden}
.fcard .art{width:100%;max-width:120px;aspect-ratio:1/1;background:rgba(255,255,255,.18);border-radius:50%;display:flex;align-items:center;justify-content:center}
.fcard .art svg{width:80%;height:80%}
.fcard b{font-family:var(--font-display);font-size:1.15rem}
.fcard span{font-size:.82rem;line-height:1.25;opacity:.95}
.fcard.locked{background:var(--bg2);color:var(--muted);box-shadow:0 5px 0 var(--line)}
.fcard.locked .art svg{filter:grayscale(1) brightness(.35);opacity:.45}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:0;background:none;padding:0}
.badge .medal{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bc,#F6B91F);box-shadow:0 5px 0 rgba(0,0,0,.2),inset 0 -6px 0 rgba(0,0,0,.12);border:4px solid rgba(255,255,255,.7)}
.badge .medal svg{width:46px;height:46px;color:#fff}
.badge b{font-family:var(--font-display);font-size:.88rem;line-height:1.15}
.badge.locked .medal{background:var(--bg2);box-shadow:0 5px 0 var(--line);border-color:var(--line)}
.badge.locked .medal svg{color:var(--muted);opacity:.5}
.badge.locked b{color:var(--muted)}
.wardrobe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.wardrobe button{border:2px solid var(--line);background:var(--surface);border-radius:16px;aspect-ratio:1/1;padding:6px;display:flex;align-items:center;justify-content:center;position:relative}
.wardrobe button[aria-pressed="true"]{border-color:var(--peter);background:var(--peter-soft)}
.wardrobe button:disabled{opacity:.45}
.wardrobe svg{width:100%;height:100%}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:46px;height:46px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.swatches button:disabled{opacity:.3}

/* ---------- Eltern ---------- */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--bg);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--font-display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.82rem;color:var(--muted)}
.skills{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.skill{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) 2.6em;gap:8px;align-items:center;font-size:.9rem}
.skill .bar{height:12px;border-radius:99px;background:var(--bg2);overflow:hidden}
.skill .bar i{display:block;height:100%;border-radius:99px}
.skill .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.skill .lbl{display:flex;align-items:center;gap:6px;min-width:0}
.skill .lbl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.insight{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.insight:last-child{border-bottom:0}
.insight .dotc{width:12px;height:12px;border-radius:50%;margin-top:5px;flex:0 0 auto}
.gamelist{list-style:none;margin:8px 0 0;padding:0}
.gamelist li{border-bottom:1px solid var(--line)}
.gamelist button{width:100%;display:flex;align-items:center;gap:10px;padding:10px 2px;border:0;background:none;text-align:left}
.gamelist .res{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;color:var(--surface);flex:0 0 auto}
.gamelist .meta{flex:1;min-width:0}
.gamelist .meta b{display:block}
.gamelist .meta span{font-size:.82rem;color:var(--muted)}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.setting:last-child{border-bottom:0}
.setting label{font-weight:700}
.setting small{display:block;color:var(--muted);font-weight:400}
.toggle{appearance:none;-webkit-appearance:none;width:54px;height:32px;border-radius:99px;background:var(--line);position:relative;flex:0 0 auto;cursor:pointer;transition:background .2s;margin:0}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle:checked{background:var(--peter)}
.toggle:checked::after{transform:translateX(22px)}
select.field{font-size:1rem}
.moments{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.moments button{width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;display:flex;gap:8px;align-items:center}
.moments button[aria-pressed="true"]{border-color:var(--peter);background:var(--peter-soft)}
.moments .k{width:10px;height:10px;border-radius:50%;flex:0 0 auto}

/* ---------- Overlays ---------- */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(10,20,26,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .2s ease}
@media (min-height:700px){.overlay{align-items:center}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--surface);border-radius:24px;max-width:480px;width:100%;padding:20px 18px;display:flex;flex-direction:column;gap:14px;max-height:calc(100% - 20px);overflow:auto;animation:rise .3s cubic-bezier(.2,1.2,.4,1)}
@keyframes rise{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
.sheet h2{font-size:1.5rem}
.center{text-align:center;align-items:center}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 16px;font-family:var(--font-display);font-weight:700;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:drop .35s cubic-bezier(.2,1.4,.4,1);max-width:calc(100% - 32px)}
.toast svg{width:30px;height:30px;flex:0 0 auto}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:10px;height:14px;border-radius:2px;animation:fall 1.8s cubic-bezier(.3,.6,.5,1) forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(560deg)}}
.splash{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.splash-in{max-width:420px;width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.splash .peter{width:150px;height:150px}
.splash h1{font-size:2.3rem;line-height:1.05}
.profiles{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.profiles button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--font-display);font-weight:700;font-size:1.1rem}
.profiles .avatar{width:84px;height:84px}
.profiles .avatar svg{width:58px;height:58px}
.avatars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.avatars button{border:2.5px solid var(--line);background:var(--surface);border-radius:50%;aspect-ratio:1/1;padding:6px;display:flex;align-items:center;justify-content:center}
.avatars button[aria-pressed="true"]{border-color:var(--peter);background:var(--peter-soft)}
.avatars svg{width:100%;height:100%}
.hint-line{font-size:.85rem;color:var(--muted);text-align:center;margin:0}
.kbd{display:inline-flex;vertical-align:-4px}
.kbd svg{width:18px;height:18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Figuren ---------- */
.pw .sil{fill:#FFFFFF;stroke:#FFFFFF;stroke-width:24;stroke-linejoin:round}
.pw .lin{fill:#1E1E1E;stroke:#1E1E1E;stroke-width:14;stroke-linejoin:round}
.pb .sil{fill:#B9B2A6;stroke:#232323;stroke-width:46;stroke-linejoin:round}
.pb .lin{fill:#232323;stroke:#232323;stroke-width:8;stroke-linejoin:round}
/* Sammelfiguren (Figurenfreunde) */
.friend{overflow:visible}
.pfw .sil{fill:url(#px-ivory);stroke:#FFFFFF;stroke-width:26;stroke-linejoin:round}
.pfw .shade{fill:url(#px-shade);stroke:none}
.pfw .lin{fill:#2A3B44;stroke:#2A3B44;stroke-width:6;stroke-linejoin:round;opacity:.78}
.pfb .sil{fill:url(#px-ebony);stroke:#151F24;stroke-width:40;stroke-linejoin:round}
.pfb .shade{fill:none}
.pfb .lin{fill:#151F24;stroke:#151F24;stroke-width:6}
svg.i{width:22px;height:22px;flex:0 0 auto}
.sq .slot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;pointer-events:none}
.tile .ti svg.i,.tip .ti svg.i{width:34px;height:34px}
.node .disc svg.i{width:46px;height:46px}
.chip svg.i{width:22px;height:22px}

.chestbtn{border:0;background:none;padding:0;width:70px;height:70px;flex:0 0 auto}
.chestbtn .chest{width:70px;height:70px}
.fcard.locked .art svg.i{width:60%;height:60%;opacity:.35}

.node.shake .disc{animation:shake .4s ease}

/* ---------- Lesefrei: Bildzeichen, Vorlesen, Bild-Antworten ---------- */
.taskline{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--surface);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow);text-align:left}
.taskline .tpic{flex:0 0 auto;width:46px;height:46px;border-radius:14px;background:color-mix(in srgb,var(--wc,var(--peter)) 16%,var(--surface));color:var(--wc,var(--peter));display:flex;align-items:center;justify-content:center}
.taskline .tpic svg{width:32px;height:32px}
.taskline .task{flex:1;min-width:0;text-align:left;font-size:1.2rem}
.taskline .tspk{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:var(--peter-soft);color:var(--peter);display:flex;align-items:center;justify-content:center}
.taskline .tspk svg{width:20px;height:20px}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--wc,var(--peter))}
.cnt{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-display);font-weight:700;font-size:1.25rem;color:var(--ink);background:var(--surface);border-radius:99px;padding:4px 14px;border:2px solid var(--line)}
.cnt svg{width:24px;height:24px;color:var(--good)}
.cnt.over{border-color:var(--sun)}
.options.pics{grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
.opt.pic{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;min-height:120px}
.opt.pic>span:last-child{font-size:1rem;color:var(--muted)}
.opt:disabled{opacity:1}
.qp{display:flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%}
.qp svg{width:40px;height:40px}
.qp.yes{background:var(--good);color:var(--on-good)}
.qp.no{background:var(--danger);color:var(--on-danger)}
.qp.sqsw{border-radius:10px;border:3px solid var(--ink)}
.qp.sqsw.light{background:var(--light-sq)}
.qp.sqsw.dark{background:var(--dark-sq)}
.qp.mini{width:100%;max-width:120px;height:auto;aspect-ratio:3/2;border-radius:8px;overflow:hidden;border:3px solid var(--dark-sq)}
.nextbtn{min-height:64px;font-size:1.3rem;justify-content:space-between;padding:0 10px 0 22px}
.nextbtn .nexticon{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center}
.nextbtn .nexticon svg{width:30px;height:30px}
.mission .mi{width:30px;height:30px;flex:0 0 auto;color:var(--peter)}
.mission .mi svg{width:30px;height:30px}
.seg button{display:flex;flex-direction:column;align-items:center;gap:2px}
.seg button svg{width:24px;height:24px}

/* =================== Version 4: kompakter, klarer, hochwertiger =================== */
.ptitle{font-size:1.7rem}
.hud .chips{flex-direction:row}
/* Startseite */
.home{gap:12px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:16px 12px 16px 18px;background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--wc) 70%,#fff) 0%,var(--wc) 55%,var(--wdark,var(--wc)) 100%)}
.hero::after{display:none}
.hero-txt{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.hero .glyph{position:static;width:104px;height:104px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center}
.hero .glyph svg{width:84px;height:84px}
.quick{gap:10px}
.qtile{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow);text-align:left;min-height:72px}
.qtile .ti{flex:0 0 auto;width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--tc) 14%,var(--surface));color:var(--tc)}
.qtile .ti svg{width:30px;height:30px}
.qtile .qt{display:flex;flex-direction:column;min-width:0}
.qtile b{font-family:var(--font-display);font-size:1.12rem}
.qtile .qt span{font-size:.82rem;color:var(--muted);line-height:1.15}
.qtile:active,.mode:active,.ttile:active,.sktile:active,.gtile:active{transform:translateY(2px)}
.mission2{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:10px 12px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.mtitle{display:flex;align-items:center;justify-content:space-between}
.eyebrow-ink{font-family:var(--font-display);font-weight:700;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dots3{display:flex;gap:5px}.dots3 i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots3 i.on{background:var(--good)}
.mrow{display:flex;align-items:center;gap:8px}
.mpill{flex:1;min-width:0;border:0;background:var(--bg);border-radius:16px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.mpill .ring{width:58px;height:58px}
.mpill .rin{position:absolute;top:8px;left:50%;width:58px;height:58px;margin-left:-29px;display:flex;align-items:center;justify-content:center;color:var(--peter)}
.mpill .rin svg{width:28px;height:28px}
.mpill.done .rin{color:var(--good)}
.mpill .mn{font-family:var(--font-display);font-weight:700;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.mrow .chestbtn{width:66px;height:66px}.mrow .chestbtn .chest{width:66px;height:66px}

/* Abenteuer: eine Welt pro Seite */
.advent{gap:10px}
.wstrip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:9px 8px 10px;margin-inline:-4px;scroll-snap-type:x proximity}
.wstrip::-webkit-scrollbar{display:none}
.wdot{flex:0 0 auto;width:52px;height:52px;border-radius:50%;border:0;padding:4px;background:var(--wc);position:relative;scroll-snap-align:center;box-shadow:0 3px 0 rgba(0,0,0,.18);transition:transform .2s}
.wdot svg{width:100%;height:100%}
.wdot.locked{background:var(--bg2);color:var(--muted);box-shadow:0 3px 0 var(--line);padding:13px}
.wdot.on{transform:scale(1.08);box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--wc)}
.wdot.locked.on{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--muted)}
.wdot .wok{position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;background:var(--good);color:var(--on-good);display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.wdot .wok svg{width:13px;height:13px;stroke-width:3.4}
.wpage{border-radius:26px;padding:16px 14px 18px;background:linear-gradient(180deg,color-mix(in srgb,var(--wc) 18%,var(--surface)) 0%,color-mix(in srgb,var(--wc) 8%,var(--surface)) 100%);border:1.5px solid color-mix(in srgb,var(--wc) 25%,var(--line));display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.wpage::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(color-mix(in srgb,var(--wc) 7%,transparent) 0 25%,transparent 0 50%) 0 0/44px 44px;mask:linear-gradient(180deg,transparent 30%,#000 100%);-webkit-mask:linear-gradient(180deg,transparent 30%,#000 100%);pointer-events:none}
.wpage>*{position:relative}
.wpage.in-r{animation:inR .32s cubic-bezier(.2,.9,.3,1)}.wpage.in-l{animation:inL .32s cubic-bezier(.2,.9,.3,1)}
@keyframes inR{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
.wtop{display:flex;align-items:center;gap:10px}
.wtitle{flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:2px}
.wtitle .eyebrow{font-family:var(--font-display);font-weight:700;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:color-mix(in srgb,var(--wc) 55%,var(--ink))}
.wtitle h1{font-size:1.75rem;line-height:1.05;color:var(--ink)}
.wtitle p{margin:0;color:var(--muted);font-size:.92rem}
.wfig{flex:0 0 auto;width:92px;height:92px;border-radius:50%;background:var(--wc);display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 var(--wdark)}
.wfig svg{width:74px;height:74px}
.wpage.locked .wfig{background:var(--bg2);box-shadow:0 5px 0 var(--line)}
.wpage.locked .wfig .pfw .sil{fill:var(--line);stroke:var(--line)}.wpage.locked .wfig .pfw .lin{fill:var(--muted);stroke:var(--muted);opacity:.35}
.wprog{display:flex;align-items:center;gap:10px}
.wst{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.wst b{color:var(--ink);font-size:1.1rem}
.wprog .bar{flex:1;height:12px;border-radius:99px;background:color-mix(in srgb,var(--wc) 14%,var(--surface));overflow:hidden}
.wprog .bar i{display:block;height:100%;background:var(--sun);border-radius:99px}
.wfr{width:26px;height:26px;border-radius:50%;background:var(--good);color:var(--on-good);display:flex;align-items:center;justify-content:center}.wfr svg{width:16px;height:16px}
.lpath{display:grid;grid-template-columns:1fr 1fr;row-gap:26px;position:relative;padding:4px 0}
.lconn{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.lnode{border:0;background:none;padding:2px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;z-index:1}
.lnode .disc{width:88px;height:88px;border-radius:50%;background:var(--wc);color:#fff;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 6px 0 var(--wdark),0 10px 18px rgba(0,0,0,.12);border:4px solid rgba(255,255,255,.35)}
.lnode .disc svg{width:44px;height:44px}
.lnode .disc svg.i{width:52px;height:52px}
.lnode.done .disc{background:color-mix(in srgb,var(--wc) 88%,#fff)}
.lnode.locked .disc{background:var(--bg2);color:var(--muted);box-shadow:0 6px 0 var(--line);border-color:transparent}
.lnode.locked .disc svg{width:34px;height:34px}
.lnode.current .disc{animation:hop 1.4s ease-in-out infinite;border-color:#fff}
.lnode.current .disc::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid var(--wc);opacity:.5;animation:ring 1.4s ease-out infinite}
.lnode .nowp{position:absolute;left:-4px;bottom:-4px;width:30px;height:30px;border-radius:50%;background:var(--sun);color:var(--sun-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.lnode .nowp svg{width:16px;height:16px}
.lnode .realb{position:absolute;right:-6px;top:-6px;width:32px;height:32px;border-radius:50%;background:var(--sun);color:var(--sun-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(0,0,0,.2);border:2px solid #fff}
.lnode .realb svg{width:18px;height:18px}
.lnode .st{display:flex;gap:1px;height:20px}
.lnode .st svg{width:20px;height:20px}
.lnode .lbl{font-family:var(--font-display);font-weight:600;font-size:.95rem;line-height:1.15;text-align:center;max-width:150px;color:var(--ink)}
.lnode.locked .lbl{color:var(--muted)}
.lnode.shake .disc{animation:shake .4s ease}
.wlock{margin:0;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-display);font-weight:700;color:var(--muted)}
.wlock svg{width:22px;height:22px}
.wnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.navbtn{width:56px;height:56px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--line);padding:0;color:var(--ink)}
.navbtn svg{width:28px;height:28px}
.navbtn:disabled{opacity:.35}
.wdots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.wdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.wdots i.on{width:22px;border-radius:99px;background:var(--wc)}

/* Spielen */
.modes{display:flex;flex-direction:column;gap:10px}
.mode{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--surface);border-radius:20px;padding:10px 12px;box-shadow:var(--shadow);text-align:left}
.mode .mart{flex:0 0 auto;width:62px;height:62px;border-radius:18px;background:color-mix(in srgb,var(--mc) 16%,var(--surface));display:flex;align-items:center;justify-content:center;padding:6px;color:var(--mc)}
.mode .mart svg{width:100%;height:100%}
.mode .mart.fam svg{width:38px;height:38px}
.mode .mtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mode b{font-family:var(--font-display);font-size:1.18rem}
.mode .mtx span{font-size:.85rem;color:var(--muted)}
.mode>svg{width:24px;height:24px;color:var(--muted);flex:0 0 auto}
.howto summary{font-family:var(--font-display);font-weight:700;font-size:1.05rem;cursor:pointer}
.howto ol{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.howto li{display:flex;gap:10px;align-items:flex-start}
.howto li svg{width:26px;height:26px;flex:0 0 auto;color:var(--peter)}
.namechips{display:flex;flex-wrap:wrap;gap:8px}
.namechips .chip{cursor:pointer;padding:8px 14px}
.namechips .chip.on{background:var(--peter);border-color:var(--peter);color:var(--on-peter)}

/* Training */
.tiph{font-family:var(--font-display);font-size:1.1rem;display:block}
.tip{text-align:left}
.hud-rank{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tip .tipgo{flex:0 0 auto;width:44px;height:44px;border-radius:50%;background:var(--sun);color:var(--sun-ink);display:flex;align-items:center;justify-content:center}
.tip .tipgo svg{width:20px;height:20px}
.trainlist{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ttile{display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:12px 4px 10px;box-shadow:var(--shadow);text-align:center}
.ttile .ti{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--tc) 14%,var(--surface));color:var(--tc)}
.ttile .ti svg{width:30px;height:30px}
.ttile b{font-family:var(--font-display);font-size:.88rem;line-height:1.12;min-height:2.3em;display:flex;align-items:center;justify-content:center;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere;max-width:100%}
.ttile .mastery{min-height:15px}

/* Ich */
.mehead{display:flex;align-items:center;gap:12px}
.avatar.lg{width:64px;height:64px}.avatar.lg svg{width:44px;height:44px}
.parentbtn{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.72rem;font-weight:700;color:var(--muted)}
.parentbtn svg{width:22px;height:22px}
.segpeter{width:26px;height:26px;display:block}.segpeter svg{width:100%;height:100%}
.wk-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:10px}
.wkd{display:flex;flex-direction:column;align-items:center;gap:3px}
.wkd .wkc{width:100%;max-width:40px;aspect-ratio:1/1;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center}
.wkd.on .wkc{background:#FFE7CC}
.wkd .wkc svg{width:60%;height:60%}
.wkd.today .wkc{box-shadow:0 0 0 2.5px var(--peter)}
.wkd small{font-weight:700;color:var(--muted);font-size:.75rem}
.skgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.sktile{border:1.5px solid var(--line);background:var(--bg);border-radius:16px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.sktile .skic{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--peter)}
.sktile .skic svg{width:32px;height:32px}.sktile .skic svg.i{width:38px;height:38px}
.sktile .skn{font-family:var(--font-display);font-weight:600;font-size:.8rem;line-height:1.1;min-height:2.2em;display:flex;align-items:center}
.sktile.new{opacity:.6}
.mastery.q{font-family:var(--font-display);font-weight:700;color:var(--muted)}
.score{display:flex;gap:6px}
.sc{display:inline-flex;align-items:center;gap:3px;font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums;border-radius:99px;padding:3px 9px;font-size:.95rem}
.sc svg{width:16px;height:16px}
.sc.w{background:var(--good-soft);color:var(--good)}.sc.d{background:var(--bg2);color:var(--muted)}.sc.l{background:var(--danger-soft);color:var(--danger)}
.glist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.gtile{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:8px 10px;text-align:left}
.gtile .gi{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:var(--bg2);color:var(--muted)}
.gtile .gi svg{width:24px;height:24px}
.gtile.r-w .gi{background:var(--good);color:var(--on-good)}
.gtile.r-b .gi{background:var(--danger-soft);color:var(--danger)}
.gtile .gm{flex:1;min-width:0;display:flex;flex-direction:column}
.gtile .gm b{font-family:var(--font-display)}
.gtile .gm span{font-size:.82rem;color:var(--muted)}
.gtile>svg{width:18px;height:18px;color:var(--muted)}
.fcard{min-height:0;padding:14px 10px 12px}
.fcard .art{max-width:132px}
.fcard .art svg{width:86%;height:86%}
.fcard.locked .art svg{filter:none;opacity:.5}

/* Eltern */
.phead{display:flex;align-items:center;gap:10px}
.phead h1{font-size:1.5rem}
.seg5{grid-template-columns:repeat(5,minmax(0,1fr))}
.seg5 button{font-size:.85rem;padding:9px 2px}

/* Pause */
.pause{position:fixed;inset:0;z-index:35;background:linear-gradient(180deg,#22305C,#141C38);color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .4s ease}
.pause-in{max-width:420px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.pause .peter{width:150px;height:150px;animation:sleepy 3s ease-in-out infinite}
.pause h1{font-size:2rem}
.pause p{margin:0;opacity:.85;font-size:1.1rem}
.pause .ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35);box-shadow:none;margin-top:18px;font-size:1rem;min-height:48px}
@keyframes sleepy{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(6px) rotate(2deg)}}
.sbars{display:inline-flex;align-items:flex-end;gap:1.5px;height:22px;vertical-align:middle}
.sbars i{width:3.5px;border-radius:2px;background:var(--line)}
.sbars i.on{background:var(--peter)}
.rung .rn{font-family:var(--font-display);font-size:1.3rem;line-height:1}

/* =================== Version 5: iPhone-Statusleiste =================== */
/* iOS legt über die Uhrzeile einen Glas-Effekt. Inhalt darf nie darunter rutschen:
   ein fester Streifen in Seitenfarbe deckt den Bereich ab, die Ansicht beginnt darunter. */
:root{--sat:env(safe-area-inset-top,0px)}
.view{padding-top:calc(var(--sat) + 14px)}
body::before{content:"";position:fixed;z-index:14;left:0;right:0;top:0;height:calc(var(--sat) + 12px);background:linear-gradient(180deg,var(--bg) calc(100% - 12px),transparent);pointer-events:none}
.overlay{padding-top:calc(var(--sat) + 16px)}
.pause{padding-top:calc(var(--sat) + 24px)}
/* Stummschalter und Titelzeile */
.topbar{display:flex;align-items:center;gap:10px}
.topbar .ptitle{flex:1;min-width:0}
.mutebtn{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--peter);display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 3px 0 var(--line)}
.mutebtn svg{width:24px;height:24px}
.mutebtn.on{background:var(--danger-soft);border-color:var(--danger);color:var(--danger);box-shadow:0 3px 0 var(--danger)}
.mutebtn:active{transform:translateY(2px)}
.status .mutebtn{width:40px;height:40px}
.hud .chips{margin-left:auto}
/* Abenteuer-Karussell */
.wcar{display:grid;grid-auto-flow:column;grid-auto-columns:100%;column-gap:16px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.wcar::-webkit-scrollbar{display:none}
.wcar .wpage{scroll-snap-align:center;scroll-snap-stop:always;min-width:0}
.wtitle h2{font-size:1.75rem;line-height:1.05;color:var(--ink)}
.wfig{border:0;padding:0;cursor:pointer;position:relative}
.wfig .wspk{position:absolute;right:-4px;bottom:-4px;width:32px;height:32px;border-radius:50%;background:var(--surface);color:var(--peter);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 var(--line);border:1.5px solid var(--line)}
.wfig .wspk svg{width:18px;height:18px}
.advent .wdot{transition:transform .25s,box-shadow .25s}
.wdots i{transition:width .25s,background .25s}
/* Kopfzeile: Level antippbar */
button.hud-main{border:0;background:none;padding:0;text-align:left;color:inherit;cursor:pointer}
button.hud-main .hud-name,button.hud-main .hud-rank{display:block}
button.hud-main .xpbar{display:block}
/* Training in drei Gruppen */
.sect{display:flex;align-items:center;gap:8px;font-size:1.15rem;margin-top:4px}
.sect svg{width:22px;height:22px;color:var(--peter)}
.trainlist.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.ttile.new{opacity:.75}
.ttile .mastery.q{font-size:.8rem}
.ttile.real .tdesc{font-size:.78rem;color:var(--muted);line-height:1.2}
/* Mein Weg: Level */
.lvlcard{display:flex;flex-direction:column;gap:14px}
.lvlnow{display:flex;align-items:center;gap:14px}
.lvlnow>div{flex:1;min-width:0}
.lvlnow h2{font-size:1.25rem;margin:2px 0 8px}
.xpbar.xl{height:14px}
.rmedal{position:relative;flex:0 0 auto;width:56px;height:56px;border-radius:50%;background:var(--rc);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 color-mix(in srgb,var(--rc) 70%,#000);padding:6px}
.rmedal svg{width:100%;height:100%}
.rmedal>svg:not(.friend){width:30px;height:30px}
.rmedal b{position:absolute;left:-4px;top:-4px;min-width:22px;height:22px;border-radius:11px;background:var(--surface);color:var(--ink);font-family:var(--font-display);font-size:.8rem;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 0 var(--line);border:1.5px solid var(--line)}
.rmedal .rok{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:var(--good);color:var(--on-good);display:flex;align-items:center;justify-content:center;border:2px solid var(--surface)}
.rmedal .rok svg{width:12px;height:12px;stroke-width:3.4}
.rmedal.now{width:72px;height:72px;box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--sun),0 5px 0 6px color-mix(in srgb,var(--sun) 60%,transparent)}
.rmedal.todo{background:var(--bg2);color:var(--muted);box-shadow:0 4px 0 var(--line);padding:16px}
.road{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px 6px}
.rstep{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink)}
.rstep span:last-child{font-size:.68rem;font-weight:700;line-height:1.1;text-align:center;color:var(--muted);hyphens:auto;-webkit-hyphens:auto}
.rstep .rmedal.now{width:56px;height:56px}
.xprules{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.xpr{display:flex;align-items:center;gap:10px}
.xpr .xpi{width:34px;height:34px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--peter);flex:0 0 auto}
.xpr .xpi svg{width:22px;height:22px}
.xpr .xpt{flex:1;font-weight:700}
.xpr b{font-family:var(--font-display);color:var(--good);font-size:1.05rem;font-variant-numeric:tabular-nums}
.linkcard{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:12px;box-shadow:var(--shadow);text-align:left}
.linkcard .ti{width:46px;height:46px;border-radius:14px;background:var(--peter-soft);color:var(--peter);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.linkcard .ti svg{width:28px;height:28px}
.linkcard>span:nth-child(2){flex:1;display:flex;flex-direction:column}
.linkcard b{font-family:var(--font-display);font-size:1.05rem}
.linkcard>svg{width:22px;height:22px;color:var(--muted)}
.toast .rmedal{width:40px;height:40px;padding:4px}.toast .rmedal b,.toast .rmedal .rok{display:none}
.hud-sub{display:flex;align-items:center;gap:6px;margin-top:2px}
.hud-sub .xpbar{flex:1;min-width:40px}
.chip.sm{padding:1px 8px 1px 5px;font-size:.88rem;gap:2px}
.chip.sm svg.i{width:17px;height:17px}
/* Partie: Statuszeile in einer Reihe */
.status{flex-wrap:nowrap}
.status .turn{flex:1;min-width:0;font-size:1rem;padding:6px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status .chip{flex:0 1 auto;min-width:0;font-size:.9rem;white-space:nowrap;overflow:hidden}

/* ---------- v7: Ton-Hilfe, Brett prüfen, Vor-Knopf, Fortsetzen ---------- */
.act.off{opacity:.42}
.soundhelp{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:2.5px solid var(--sun);background:var(--surface)}
.soundhelp .sh-ic{width:40px;height:40px;border-radius:12px;background:var(--sun);color:var(--sun-ink);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.soundhelp .sh-ic svg{width:24px;height:24px}
.soundhelp .sh-tx{flex:1 1 150px;display:flex;flex-direction:column;gap:2px;min-width:0}
.soundhelp .big{flex:1 1 100%}
.soundhelp.float{position:fixed;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:45;max-width:480px;margin-inline:auto;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.soundhelp.float .iconbtn{position:absolute;top:8px;right:8px;width:36px;height:36px}
.awakevid{position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none;z-index:-1}
.resume{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.resume-board{width:min(62vw,240px);pointer-events:none}
.resume-board .board{border-width:4px}
.resume-board .nm,.resume-board .cr,.resume-board .cf{display:none}
.cbstep{display:flex;gap:10px;justify-content:center}
.cbstep .big{flex:0 0 72px;min-height:56px}
.cbply{text-align:center;font-family:var(--font-display);font-weight:700;margin:0;min-height:1.4em}
.plylist{display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-height:132px;overflow:auto;padding:2px}
.plyno{font-family:var(--font-display);font-weight:700;color:var(--muted);font-size:.8rem;margin-left:6px}
.plychip{display:inline-flex;align-items:center;gap:3px;border:1.5px solid var(--line);border-radius:999px;padding:3px 9px 3px 5px;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600;font-size:.85rem;min-height:34px}
.plychip svg{width:20px;height:20px}
.plychip[aria-pressed="true"]{border-color:var(--peter);background:var(--peter-soft);box-shadow:0 0 0 2px var(--peter) inset}
.moregrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.moregrid .act{min-height:84px;font-size:.95rem}
.diaglog{white-space:pre-wrap;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px;max-height:220px;overflow:auto;margin:0}

/* ---------- Staffel 2: Karten-Umschalter, Taktik-Antworten ---------- */
.seasons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.season{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--font-display);font-weight:700;font-size:1rem;position:relative;padding:6px 10px}
.season svg{width:24px;height:24px;flex:0 0 auto;color:var(--wc)}
.season.on{border-color:var(--wc);background:color-mix(in srgb,var(--wc) 14%,var(--surface));box-shadow:0 3px 0 var(--wc)}
.season.locked{color:var(--muted)}
.season.locked svg{color:var(--muted)}
.season .sok{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--good);color:var(--on-good);display:flex;align-items:center;justify-content:center}
.season .sok svg{width:14px;height:14px;color:inherit}
.season.shake{animation:shake .4s}
.lockcard{display:flex;gap:12px;align-items:center}
.lockcard .ti{width:44px;height:44px;border-radius:14px;background:var(--bg2);color:var(--muted);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.options.pics.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.qp.cm{background:#4F46E5;color:#fff}
.qp.cp{background:#0E7490;color:#fff}
.qp.cs{background:#C2410C;color:#fff}
.reward .nsi{width:56px;height:56px;border-radius:50%;background:#0E7490;color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.reward .nsi svg{width:32px;height:32px}

/* ---------- Medaillen: Bronze, Silber, Gold ---------- */
.medalsvg{width:100%;height:100%;display:block}
.lnode .disc{position:relative}
.lmedal{position:absolute;left:-8px;top:-8px;width:28px;height:32px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tier{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:12px 6px;color:var(--ink);font-family:var(--font-display)}
.tier b{font-size:1.05rem}
.tier .small{font-family:var(--font-body,inherit);line-height:1.2}
.tier .tmedal{position:relative;width:56px;height:64px}
.tier .tlock,.tier .tok{position:absolute;right:-6px;bottom:0;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.tier .tlock{background:var(--bg2);color:var(--muted)}
.tier .tok{background:var(--good);color:var(--on-good)}
.tier .tlock svg,.tier .tok svg{width:14px;height:14px}
.tier.locked{opacity:.6}
.tier:not(.locked):active{transform:translateY(2px)}
.reward .mw{width:48px;height:56px;flex:0 0 auto}
.hero .glyph .medalsvg{width:84px;height:96px}
.mixcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2.5px solid #7454FF;background:var(--surface);border-radius:20px;padding:12px 14px;box-shadow:0 4px 0 #7454FF;color:var(--ink)}
.mixcard .ti{width:48px;height:48px;border-radius:14px;background:#7454FF;color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.mixcard .ti svg{width:28px;height:28px}
.mixcard .mxt{flex:1;min-width:0;display:flex;flex-direction:column}
.mixcard .mxt b{font-family:var(--font-display);font-size:1.1rem}
.mixcard .rnum{display:flex;flex-direction:column;align-items:center;font-family:var(--font-display);line-height:1}
.mixcard .rnum small{font-size:.65rem;color:var(--muted);font-weight:700}
.mixcard .rnum b{font-size:1.5rem;color:#7454FF}
.rvtext{display:flex;gap:10px;align-items:flex-start;margin:0;font-family:var(--font-display);font-weight:600;font-size:1.05rem;line-height:1.35;min-height:3em}
.rvk{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.rvk svg{width:20px;height:20px}
.rvk.good{background:var(--good);color:var(--on-good)}
.rvk.learn{background:var(--sun);color:var(--sun-ink)}
.rvdots{display:flex;gap:6px;align-items:center}
.rvdots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.rvdots i.on{background:var(--peter)}
/* ---------- Urkunde ---------- */
.certprev svg{width:100%;height:auto;display:block;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.certrw{width:100%;text-align:left;color:var(--ink);cursor:pointer}
.certrw svg{width:32px;height:32px;color:#B07800}
.printcert{display:none}
@media print{
  body>*:not(.printcert){display:none!important}
  body::before{display:none!important}
  .printcert{display:block!important;position:static}
  .printcert svg{width:100%;height:auto}
  @page{size:A4 landscape;margin:10mm}
}

/* ---------- Figuren-Themen ---------- */
body.pthemed .pw .sil{fill:var(--pc-w)}
body.pthemed .pb .sil{fill:var(--pc-b)}
.themegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:10px}
.themebtn{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:8px;color:var(--ink);font-family:var(--font-display);font-weight:700;font-size:.85rem;position:relative}
.themebtn[aria-pressed="true"]{border-color:var(--peter);box-shadow:0 0 0 2px var(--peter) inset}
.themebtn.locked{opacity:.65}
.themebtn .tprev{width:64px;height:64px;border-radius:10px;overflow:hidden;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);border:3px solid var(--line)}
.themebtn .tprev i{display:block}
.themebtn .tneed{display:inline-flex;align-items:center;gap:3px;font-size:.75rem;color:var(--muted)}
.themebtn .tneed svg{width:14px;height:14px}
.themebtn .ppair{display:flex;gap:2px;height:56px;align-items:flex-end}
.themebtn .ppair svg{width:34px;height:40px}
.mboard{display:grid;grid-template-columns:repeat(8,1fr);width:100%;aspect-ratio:1/1;border-radius:8px;overflow:hidden;border:3px solid var(--dark-sq)}
.mboard i{display:flex;align-items:center;justify-content:center;background:var(--light-sq)}
.mboard i.d{background:var(--dark-sq)}
.mboard i svg{width:90%;height:90%}
.minigrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.minipick{display:flex;flex-direction:column;gap:6px;align-items:center;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:8px;color:var(--ink);font-family:var(--font-display);font-size:.85rem}
.minipick b{display:flex;align-items:center;gap:2px}
.minipick b svg{width:18px;height:22px}
.tiers.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tier .tmedal.big{width:72px;height:72px}
.mart.dark{background:#E9EEF1}
/* ---------- Mini-Modus ---------- */
.view.mini{padding-bottom:24px}
.minitop{display:flex;align-items:center;gap:12px}
.minitop h1{flex:1;margin:0;font-size:1.6rem}
.minigrid3{display:grid;grid-template-columns:1fr;gap:14px}
.minitile{display:flex;align-items:center;gap:18px;border:3px solid var(--tc);background:var(--surface);border-radius:28px;padding:14px 18px;box-shadow:0 6px 0 var(--tc);color:var(--ink);font-family:var(--font-display);font-size:1.6rem;min-height:110px}
.minitile:active{transform:translateY(3px);box-shadow:0 3px 0 var(--tc)}
.minitile .mt-art{width:84px;height:84px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.minitile .mt-art svg{width:84px;height:84px}
.mcol{display:flex;gap:6px}.mcol i{width:36px;height:60px;border-radius:12px;border:3px solid #14232C}.mcol i.w{background:#fff}.mcol i.b{background:#14232C}
.minipick3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:8px}
.minipick3.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.mpbtn{aspect-ratio:1/1;border:3px solid var(--line);background:var(--surface);border-radius:24px;padding:8px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 var(--line)}
.mpbtn svg{width:100%;height:100%}
.mpbtn.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 15%,var(--surface));box-shadow:0 5px 0 var(--good)}
.mpbtn.wiggle{animation:shake .45s}
/* ---------- Rätsel-Duell, Rallye ---------- */
.duelscore{display:flex;align-items:center;justify-content:center;gap:10px}
.duelscore .ds{flex:1;display:flex;flex-direction:column;align-items:center;border:2px solid var(--line);border-radius:16px;padding:6px 8px;background:var(--surface);font-family:var(--font-display)}
.duelscore .ds b{font-size:.95rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.duelscore .ds i{font-style:normal;font-weight:800;font-size:1.8rem;line-height:1}
.duelscore .ds.on{border-color:var(--wc);box-shadow:0 0 0 2px var(--wc) inset}
.duelscore .dsv{font-weight:800;font-size:1.4rem;color:var(--muted)}
.rallybar{height:12px;border-radius:999px;background:var(--bg2);overflow:hidden}
.rallybar i{display:block;height:100%;width:100%;background:var(--wc);transition:width .2s linear}
.mixcard.rally{border-color:#C2410C;box-shadow:0 4px 0 #C2410C}
.mixcard.rally .ti{background:#C2410C}
.mixcard.rally .rnum b{color:#C2410C}
