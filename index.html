  legal(pos){pos=pos||this.pos;return this.variant==='give'?giveLegal(pos):pos.legal()},
  /* Königsjagd: König und Dame (oder Turm) gegen den König, zufällig aufgestellt */
  huntFen(rook){
    for(let n=0;n<500;n++){
      const r=a=>a[Math.floor(Math.random()*a.length)];
      const kb=r(ALL_SQ.filter(s=>(s>>4)>=2&&(s>>4)<=5&&(s&7)>=2&&(s&7)<=5)),wk=r(ALL_SQ.filter(s=>(s>>4)<=1)),wq=r(ALL_SQ);
      if(new Set([kb,wk,wq]).size<3)continue;
      const pos=new Pos(Trainer.fenFrom([{sq:wk,c:'w',t:'k'},{sq:wq,c:'w',t:rook?'r':'q'},{sq:kb,c:'b',t:'k'}],'w'));
      if(Math.max(Math.abs((wk&7)-(kb&7)),Math.abs((wk>>4)-(kb>>4)))<2)continue;
      if(pos.inCheck('b')||pos.inCheck('w'))continue;
      return pos.fen();
    }
    return '4k3/8/8/8/8/8/8/3QK3 w - - 0 1';
  },
  start(opt){
    opt=opt||{};Voice.stop();
    this.lessonCb=opt.lessonCb||null;
    const cur=P().game.current;
    if(!opt.fresh&&cur&&cur.moves&&(cur.moves.length||cur.side==='b')&&(!opt.variant||opt.variant===cur.variant)){this.restore(cur)}
    else this.reset(opt.variant||'standard',opt.side||'w',opt.rook);
    if(P().game.current)P().game.current.lesson=opt.lesson||null;
    this.family=this.variant==='family';
    this.state=opt.resumed||this.family||this.pos.turn===this.me?'human':'peter';
    UI.go('play');
    const my=++this.flow;
    if(opt.resumed)return this.resumeTalk(my);
    if(this.played.length===0)setTimeout(()=>this.greet(my),250);
    else if(this.pos.turn===this.rk&&!this.family)this.peterTurn(my,{});
    else if(this.family)Peter.say(this.pos.turn==='w'?`Weiter geht's! ${P().name}, du bist dran.`:`Weiter geht's! ${this.opp()} ist dran.`,'smile').then(()=>this.autoListen(my));
    else Peter.say(pick(['Weiter geht\'s! Du bist dran.','Da bist du ja wieder! Du bist am Zug.']),'smile').then(()=>this.autoListen(my));
  },
  reset(variant,side,rook){
    this.variant=variant;this.family=variant==='family';
    this.me=this.family?'w':(side||'w');this.rk=this.me==='w'?'b':'w';
    this.fen0=variant==='hunt'?this.huntFen(rook):(this.VARIANTS[variant]&&this.VARIANTS[variant].fen)||START_FEN;
    this.pos=new Pos(this.fen0);this.played=[];this.keys=[this.pos.key()];
    this.sel=-1;this.pending=null;this.hint=null;this.danger=[];this.events=[];this.tipsSaid={};this.startedAt=Date.now();this.fwd=[];this.endSnap=null;
    P().game.current={variant,side:this.me,fen:this.fen0,moves:[],events:[],fwd:[],level:P().game.level,started:Date.now()};save();
  },
  restore(cur){
    this.variant=cur.variant||'standard';this.family=this.variant==='family';
    this.me=this.family?'w':(cur.side||'w');this.rk=this.me==='w'?'b':'w';
    this.fen0=cur.fen||(this.VARIANTS[this.variant]&&this.VARIANTS[this.variant].fen)||START_FEN;
    this.pos=new Pos(this.fen0);this.played=[];this.keys=[this.pos.key()];
    for(const u of cur.moves){const m=this.legal().find(x=>sqName(x.from)+sqName(x.to)+(x.promo||'')===u);if(!m)break;m.color=this.pos.turn;this.pos.make(m);this.played.push(m);this.keys.push(this.pos.key())}
    this.events=cur.events||[];this.sel=-1;this.pending=null;this.hint=null;this.danger=[];this.tipsSaid={};this.startedAt=cur.started||Date.now();
    this.fwd=Array.isArray(cur.fwd)?cur.fwd.slice():[];this.endSnap=null;
  },
  persist(){const c=P().game.current||(P().game.current={variant:this.variant,started:this.startedAt||Date.now(),level:P().game.level});c.variant=this.variant;c.side=this.me;c.fen=this.fen0;c.moves=this.played.map(m=>this.uci(m));c.events=this.events;c.fwd=this.fwd.slice(-60);save()},
  uci(m){return sqName(m.from)+sqName(m.to)+(m.promo||'')},
  /* ---------- Zurück und Vor ----------
     Zurückgenommene Züge landen auf einem Stapel. „Vor“ holt sie wieder.
     Ein neuer, anderer Zug leert den Stapel; derselbe Zug nimmt ihn einfach mit. */
  back(n){
    const out=[];
    for(let i=0;i<n&&this.played.length;i++){this.pos.unmake();const m=this.played.pop();this.keys.pop();this.fwd.push(this.uci(m));out.push(m)}
    this.sel=-1;this.pending=null;this.hint=null;this.danger=[];
    return out;
  },
  forward(n){
    const out=[];
    for(let i=0;i<n&&this.fwd.length;i++){
      const u=this.fwd[this.fwd.length-1];const m=this.legal().find(x=>this.uci(x)===u);
      if(!m){this.fwd=[];break}
      this.fwd.pop();m.color=this.pos.turn;this.pos.make(m);this.played.push(m);this.keys.push(this.pos.key());out.push(m);
    }
    this.sel=-1;this.pending=null;this.hint=null;this.danger=[];
    return out;
  },
  noteMove(m){const u=this.uci(m);if(this.fwd.length&&this.fwd[this.fwd.length-1]===u)this.fwd.pop();else this.fwd=[]},
  /* Wer ist wer, und wie heißt die Figur im Satz (Familienpartie: weiß/schwarz) */
  whoOf(c){return this.family?(c==='w'?P().name:this.opp()):(c===this.me?'Du':'Ich')},
  accOf(c,t){
    if(this.family)return (c==='w'?{p:'den weißen Bauern',n:'den weißen Springer',b:'den weißen Läufer',r:'den weißen Turm',q:'die weiße Dame',k:'den weißen König'}:{p:'den schwarzen Bauern',n:'den schwarzen Springer',b:'den schwarzen Läufer',r:'den schwarzen Turm',q:'die schwarze Dame',k:'den schwarzen König'})[t];
    return c===this.me?ACC_DEIN[t]:ACC_MEIN[t];
  },
  moveSay(m){
    if(m.flag==='k'||m.flag==='q')return (m.flag==='k'?'kurze':'lange')+' Rochade';
    let t=`${NAME[m.piece]} von ${SQ(m.from)} nach ${SQ(m.to)}`;
    if(m.cap)t+=` und schlägt ${this.accOf(m.color==='w'?'b':'w',m.cap)}`;

  },
  fwdText(m){return `${this.whoOf(m.color)}: ${this.moveSay(m)}.`},
  /* genau sagen, was man auf dem echten Brett zurückstellen muss – auch geschlagene Figuren */
  backText(m){
    let t;
    if(m.flag==='k'||m.flag==='q'){const r=m.color==='w'?1:8;t=`Stell ${this.accOf(m.color,'k')} zurück auf E${r} und ${this.accOf(m.color,'r')} zurück auf ${m.flag==='k'?'H':'A'}${r}.`}
    else if(m.promo)t=`Nimm ${this.accOf(m.color,m.promo)} von ${SQ(m.to)} weg und stell wieder einen Bauern auf ${SQ(m.from)}.`;
    else t=`Stell ${this.accOf(m.color,m.piece)} von ${SQ(m.to)} zurück auf ${SQ(m.from)}.`;
    if(m.cap){const cs=m.flag==='e'?m.to+(m.color==='w'?-16:16):m.to;t+=` Und stell ${this.accOf(m.color==='w'?'b':'w',m.cap)} wieder auf ${SQ(cs)}.`}
    return t;
  },
  shortMove(m){return m.flag==='k'?'O-O':m.flag==='q'?'O-O-O':SQ(m.from)+(m.cap?'×':'–')+SQ(m.to)},
  opp(){return P().settings.familyName||'Papa'},
  /* gegnerische Figur benennen: Rokko sagt „mein“, in der Familienpartie „der schwarze“ */
  oN(t){return this.family?{p:'der schwarze Bauer',n:'der schwarze Springer',b:'der schwarze Läufer',r:'der schwarze Turm',q:'die schwarze Dame',k:'der schwarze König'}[t]:NOM_MEIN[t]},
  oA(t){return this.family?{p:'den schwarzen Bauern',n:'den schwarzen Springer',b:'den schwarzen Läufer',r:'den schwarzen Turm',q:'die schwarze Dame',k:'den schwarzen König'}[t]:ACC_MEIN[t]},
  familySetup(){

    UI.sheet(`<h2>Familienpartie</h2><p class="muted" style="margin:0">${esc(P().name)} spielt Weiß, du spielst Schwarz. Rokko ist Schiedsrichter und hilft ${esc(P().name)}. Beide sagen ihre Züge an oder tippen sie.</p>
      <div class="namechips">${names.map(n=>`<button class="chip ${n===cur?'on':''}" data-n="${n}">${n}</button>`).join('')}</div>
      <input class="field" id="famIn" maxlength="16" placeholder="Oder Name eingeben" value="${names.includes(cur)?'':esc(cur)}">

  async greet(my){

    else if(this.variant==='hunt'){await Peter.say(`Königsjagd! Stell die Figuren so auf wie auf dem Handy. Du hast ${this.pos.pieces('w').some(p=>p.type==='q')?'eine Dame':'einen Turm'} und deinen König. Treib meinen König an den Rand und setz ihn matt. Aber Vorsicht vor dem Patt!`,'smile')}

  mount(el){

    el.addEventListener('click',e=>{const a=e.target.closest('[data-act],[data-lvl]');if(!a)return;audioUnlock();

  unmount(){Ears.stop()},
  refresh(){

    this.board.mark('last',last?[last.from,last.to]:[]).mark('sel',this.sel>=0?[this.sel]:[]).mark('dot',targets.filter(m=>!m.cap).map(m=>m.to)).mark('ring',targets.filter(m=>m.cap).map(m=>m.to))

  /* ---------- Eingaben ---------- */
  onSquare(i){
    if(this.state!=='human'){if(this.state==='peter')Peter.say(pick(['Moment, ich überlege noch!','Pssst, ich denke gerade nach!']),'think');return}

    const kidSide=this.family?me==='w':true;
    if(this.pending&&this.pending.type==='which'&&this.pending.froms.includes(i)){const c=this.legal().filter(m=>m.from===i&&m.to===this.pending.to);if(c.length)return this.humanMove(pickPromo(c))}
    if(this.sel>=0){
      const c=this.legal().filter(m=>m.from===this.sel&&m.to===i);
      if(c.length)return this.humanMove(pickPromo(c));
      if(!(p&&p[0]===me)){
        const pt=pos.board[this.sel][1];const pseudo=pos.pseudoFrom(this.sel).some(m=>m.to===i);
        this.board.flash(i,'bad');sfx.nope();
        if(pseudo&&this.variant==='give')Peter.say('Im Schlagschach musst du schlagen, wenn du kannst! Die roten Ringe zeigen, was du schlagen kannst.','worry');
        else if(pseudo)Peter.say('Vorsicht! Dann wäre dein König im Schach.','worry');
        else{Peter.say(pick([`So kann ${ART[pt]} ${NAME[pt]} nicht ziehen.`,`Da kann ${ART[pt]} ${NAME[pt]} nicht hin.`]),'think');this.illegal(pt)}
        return;
      }
    }
    if(p&&p[0]===me){
      if(this.sel===i){this.sel=-1;this.pending=null;this.refresh();return}
      this.sel=i;this.pending={type:'from',from:i};this.hint=null;sfx.select();this.refresh();
      if(!this.legal().some(m=>m.from===i)){this.board.flash(i,'shake');Peter.say(this.variant==='give'&&this.legal().some(m=>m.cap)?'Diese Figur kann gerade nichts schlagen. Du musst schlagen!':`${cap1(kidSide?NOM_DEIN[p[1]]:this.oN(p[1]))} kann gerade nicht ziehen.`,'think')}
      return;
    }
    if(p&&p[0]!==me){this.board.flash(i,'shake');sfx.nope();Peter.say(this.family?(me==='w'?`Du spielst Weiß, ${P().name}!`:`${this.opp()} spielt Schwarz und ist dran.`):pick(['Halt, das ist meine Figur!','Hihi, die gehört mir!']),'wow');return}

  illegal(piece){Skills.record('move_'+piece,false,.35);this.events.push({ply:this.played.length,kind:'illegal',piece,text:`Versuchter Zug, den ${ART[piece]==='die'?'die':'der'} ${NAME[piece]} nicht kann`});this.persist()},
  async handleText(raw){

    if(r.cmd==='stop'){Ears.stop();P().settings.handsFree=false;save();return Peter.say('Gut, ich höre erst wieder zu, wenn du auf das Mikrofon tippst.')}
    if(r.cmd==='new')return this.newGame();
    if(r.cmd==='check')return this.checkBoard();
    if(this.state==='over'){if(r.cmd==='yes')return this.newGame();if(r.cmd==='undo')return this.undo();return Peter.say('Sag „Neues Spiel“, dann spielen wir nochmal!')}
    if(this.state!=='human')return Peter.say('Moment, ich überlege noch!','think');

      const res=resolveMove(this.pos,r,this.pending&&this.pending.type==='from'?this.pending.from:null,p=>this.legal(p));
      if(res.move)return this.humanMove(res.move,'voice');
      if(this.pending&&this.pending.type==='which'&&r.squares.length===1){const f=sqIdx(r.squares[0]);const c=this.legal().filter(m=>m.from===f&&m.to===this.pending.to);if(c.length)return this.humanMove(pickPromo(c,r.promo),'voice')}
      if(res.select!=null){this.sel=res.select;this.pending={type:'from',from:this.sel};this.hint=null;sfx.select();this.refresh();const pt=this.pos.board[this.sel][1];await Peter.say(pick([`Und wohin soll ${ART[pt]} ${NAME[pt]}? Die Punkte zeigen es dir.`,'Gute Wahl! Und wohin damit?']),'smile');return this.autoListen(my)}
      if(res.which){this.pending={type:'which',froms:res.which,to:res.to};this.sel=-1;this.refresh();await Peter.say('Da können mehrere Figuren hin. Welche meinst du? Sag mir, wo sie steht, oder tipp sie an.','think');return this.autoListen(my)}
      sfx.nope();
      if(res.illegalPiece)this.illegal(res.illegalPiece);
      if(res.error){if(res.show!=null){this.sel=res.show;this.pending={type:'from',from:this.sel};this.refresh();this.board.flash(res.show,'shake')}
        await Peter.say('Oh, '+res.error.charAt(0).toLowerCase()+res.error.slice(1)+' Stell die Figur bitte wieder zurück.','worry');return this.autoListen(my)}
    }

      const ans=await Brain.ask(`Das Kind sagt oder fragt gerade: ${raw}\nAntworte in höchstens drei kurzen Sätzen. Wenn es einen Schachzug meint, den du nicht sicher verstehst, sag ihm freundlich, wie es ihn sagen kann, zum Beispiel: Springer nach F3. Erfinde keine Züge.\nStellung – Weiß: ${pcs('w')}. Schwarz: ${pcs('b')}.`,9000);
      if(ans){await Peter.say(ans,'smile');return this.autoListen(my)}
    }
    await Peter.say(pick(['Hmm, das habe ich nicht verstanden. Sag zum Beispiel: Bauer nach E4.','Oh, das hab ich nicht kapiert. Versuch mal: Springer nach F3.']),'think');
    this.autoListen(my);
  },
  /* ---------- Alexanders Zug analysieren ---------- */
  analyzeKid(m,before){
    const pos=this.pos,ply=this.played.length-1,mv=Math.floor(ply/2)+1,ev=[];
    let warn=null,comment=null,mood='smile',star=false;
    const add=(kind,text,extra)=>ev.push({ply,kind,text,move:moveText(m),...(extra||{})});
    Skills.record('move_'+m.piece,true,.06);
    const K=this.family?'w':this.me,O=K==='w'?'b':'w';
    if(this.variant==='pawns'){
      const passer=m.to>>4>=5;if(passer){comment=pick(['Uii, dein Bauer kommt näher!','Dein Bauer marschiert nach vorne!']);mood='wow'}
      return{warn,comment,mood,star,ev};
    }
    if(this.variant==='give'){
      if(m.cap)comment=pick(['Hihi, jetzt musste ich dir eine Figur schenken. Du hast eine mehr zum Loswerden!','Geschlagen! Aber Achtung, hier willst du ja eigentlich Figuren loswerden.']);
      const left=pos.pieces(K).length;if(left<=3){comment=`Nur noch ${left===1?'eine Figur':left+' Figuren'}! Du bist fast alles los.`;mood='wow'}
      return{warn,comment,mood,star,ev};
    }
    /* Matt verpasst oder gefunden */
    if(before.mates.length){
      if(pos.isMate()){add('goodMate','Schachmatt gesetzt');Skills.record('mate',true,1)}
      else{add('missedMate',`Matt in 1 übersehen (${moveText(before.mates[0])})`,{best:sqName(before.mates[0].from)+sqName(before.mates[0].to)});Skills.record('mate',false,1);comment=`Oh! Mit ${moveText(before.mates[0])} hättest du mich schachmatt gesetzt!`;mood='wow'}
    }
    /* freie Figur gesehen oder übersehen */
    const fc=before.free.filter(x=>VAL[x.cap]>=300);
    if(fc.length&&!pos.isMate()){
      const took=fc.some(x=>x.from===m.from&&x.to===m.to);
      if(took){add('goodCapture',`Freie Figur geschlagen (${NAME[m.cap]})`);Skills.record('capture',true,1);star=true;comment=comment||`Adlerauge! Du hast ${this.oA(m.cap)} geschnappt.`;mood='wow'}
      else if(!(m.cap&&VAL[m.cap]>=VAL[fc[0].cap])){add('missedCapture',`Freie Figur übersehen: ${NAME[fc[0].cap]} auf ${SQ(fc[0].to)}`,{best:sqName(fc[0].from)+sqName(fc[0].to)});Skills.record('capture',false,1);comment=comment||`Psst: ${cap1(this.oN(fc[0].cap))} auf ${SQ(fc[0].to)} stand ganz allein. Den hättest du schlagen können!`.replace('Den hättest',fc[0].cap==='q'?'Die hättest':'Den hättest');mood='wow'}
    }
    /* Bedrohte Figur gerettet oder nicht */
    const after=threatsAgainst(pos,K).filter(h=>h.value>=300);
    const fair=m.cap&&VAL[m.cap]>=VAL[m.piece];
    const mateThreat=!pos.isMate()&&mateInOne(pos);
    if(before.threat.length){
      const still=after.filter(h=>before.threat.some(t=>t.sq===h.sq));
      if(!still.length&&!(m.cap&&VAL[m.cap]>=before.threat[0].value)){add('saved','Bedrohte Figur gerettet');Skills.record('protect',true,.8)}
    }
    const newHang=after.find(h=>!(h.sq===m.to&&fair)&&!(m.cap&&VAL[m.cap]>=h.value));
    if(mateThreat){warn={text:this.family?`Uh-oh! Jetzt könnte ${this.opp()} dich mit einem einzigen Zug schachmatt setzen!`:'Uh-oh! Jetzt könnte ich dich mit einem einzigen Zug schachmatt setzen!',sqs:[mateThreat.from,mateThreat.to],fact:`Rokko könnte jetzt mit ${moveFacts(mateThreat,'peter')} mattsetzen.`};add('blunderMate','Matt in 1 für Rokko zugelassen');Skills.record('protect',false,1)}
    else if(newHang){warn={text:`Oh oh! ${cap1(NOM_DEIN[newHang.piece])} auf ${SQ(newHang.sq)} ist in Gefahr. ${cap1(this.oN(newHang.byPiece))} auf ${SQ(newHang.by)} könnte ${PRON_A[newHang.piece]} schlagen.`,sqs:[newHang.sq,newHang.by],fact:`${NAME[newHang.piece]} auf ${SQ(newHang.sq)} kann von Rokkos ${NAME[newHang.byPiece]} auf ${SQ(newHang.by)} geschlagen werden.`};
      add('blunder',`${NAME[newHang.piece]} auf ${SQ(newHang.sq)} ungeschützt gelassen`,{piece:newHang.piece});Skills.record('protect',false,1)}
    if(before.check)Skills.record('escape',true,.5);
    /* Eröffnung und Spezialzüge */
    if(m.flag==='k'||m.flag==='q'){add('castle','Rochiert');Skills.record('opening',true,1);P().stats.castled++;star=true;comment=comment||'Rochade! Klasse, jetzt ist dein König schön sicher.'}
    else if(m.piece==='q'&&mv<=4&&!m.cap){add('earlyQueen','Dame sehr früh gezogen');Skills.record('opening',false,.5);if(!this.tipsSaid.queen){this.tipsSaid.queen=1;comment=comment||'Kleiner Tipp: Die Dame lieber noch nicht so früh rausholen, sonst muss sie ständig weglaufen.';mood='think'}}
    else if(mv===1&&m.piece==='p'&&((m.to&7)===3||(m.to&7)===4)){Skills.record('opening',true,.6);comment=comment||'Prima, ein Bauer in die Mitte! So fangen Profis an.';star=true}
    else if(mv<=8&&(m.piece==='n'||m.piece==='b')&&(m.from>>4)===(K==='w'?0:7)){Skills.record('opening',true,.3);if(!this.tipsSaid['dev'+m.from]){this.tipsSaid['dev'+m.from]=1;comment=comment||`Gut so, ${NOM_DEIN[m.piece]} kommt ins Spiel!`}}
    else if(m.piece==='k'&&mv<=10&&!before.check){Skills.record('opening',false,.4);if(!this.tipsSaid.king){this.tipsSaid.king=1;comment=comment||'Kleiner Tipp: Den König schützt du am besten mit der Rochade.';mood='think'}}
    if(m.promo){P().stats.promos++;add('promo','Bauer umgewandelt');comment=comment||'Juhu, dein Bauer ist jetzt eine Dame!';star=true}
    /* Gabel */
    if(!pos.isMate()&&!pos.attacked(m.to,O)){const tg=Trainer.forkTargets(pos,m.to);if(tg.length>=2){add('fork','Gabel gespielt');Skills.record('fork',true,1);P().stats.forks++;comment=`Gabel! Du greifst zwei Figuren gleichzeitig an!`;mood='wow';star=true}}
    if(pos.inCheck()&&!pos.isMate()&&!comment){comment=this.family?'Schach! Stark!':pick(['Uiii, Schach! Mein König muss weglaufen.','Schach! Stark!']);mood='wow'}
    if(m.cap){P().stats.captures++;if(!comment&&VAL[m.cap]>=300){comment=this.family?`Stark, ${this.oA(m.cap)} geschlagen!`:`Oh nein, ${NOM_MEIN[m.cap]}! Gut geschlagen.`;mood='wow'}}
    return{warn,comment,mood,star,ev};
  },
  async humanMove(m,src){
    if(this.family&&this.pos.turn==='b')return this.oppMove(m);
    const my=++this.flow;Ears.stop();Voice.stop();
    const pos=this.pos;
    const pl=this.plain();
    const before={mates:pl?[]:allMatesInOne(pos),free:pl?[]:Trainer.freeCaptures(pos),threat:pl?[]:threatsAgainst(pos,pos.turn).filter(h=>h.value>=300),check:!pl&&pos.inCheck()};
    this.noteMove(m);
    m.color=pos.turn;pos.make(m);this.played.push(m);this.keys.push(pos.key());
    /* gesagte Züge kurz bestätigen: so fällt ein falsch verstandener Zug sofort auf */
    const echo=src==='voice'?`Verstanden: ${this.moveSay(m)}.`:'';
    this.sel=-1;this.pending=null;this.hint=null;this.danger=[];
    this.refresh();this.board.animate(m.from,m.to);
    m.cap?sfx.capture():sfx.move();
    const a=this.analyzeKid(m,before);
    this.events.push(...a.ev);this.persist();
    if(a.star){P().stars++;Rewards.addXP(5);sfx.star();Peter.bounce();save()}
    const st=this.status();if(st)return this.endGame(st,m,echo);
    if(a.warn&&(this.family||P().game.level<=5)){
      this.state='ask';this.danger=a.warn.sqs;this.refresh();sfx.bad();this.blunderCtx={flow:my,warn:a.warn};
      $('#askText').textContent='Willst du den Zug zurücknehmen?';$('#ask').hidden=false;
      Peter.show('…','worry');
      const ai=await Brain.ask(`Das Kind hat gerade gezogen: ${moveFacts(m,'kid')}.\nGefahr: ${a.warn.fact}\nWarne es lieb und aufgeregt in ein bis zwei kurzen Sätzen, nenne die Felder, und frag dann, ob es den Zug lieber zurücknehmen möchte. Es soll Ja oder Nein sagen.`,4500,t=>/\?/.test(t));
      if(my!==this.flow||this.state!=='ask')return;
      await Peter.say((echo?echo+' ':'')+(ai?ai+' Roter Knopf heißt zurück.':a.warn.text+' Willst du den Zug lieber zurücknehmen? Dann tipp auf den roten Knopf.'),'worry');
      return this.autoListen(my);
    }
    if(this.family){await Peter.say((echo?echo+' ':'')+((a.warn?a.warn.text:a.comment)||'')+` ${this.opp()}, du bist dran.`,a.warn?'worry':a.mood||'smile');return this.autoListen(my)}
    await this.peterTurn(my,{m,echo,kidFb:a.warn?a.warn.text:a.comment,mood:a.warn?'worry':a.mood,kidFact:a.warn?a.warn.fact:a.comment});
  },
  /* Familienpartie: Zug von Mama/Papa. Rokko sagt ihn an und coacht danach das Kind. */

  async answerAsk(yes){

      this.state='human';this.refresh();

    await this.peterTurn(this.flow,{kidFb:'Gut, du bist mutig!',kidFact:'Das Kind wollte den Zug trotz Warnung nicht zurücknehmen. Sag kurz: gut, mutig.'});

  /* ---------- Rokkos Zug ---------- */
  async peterTurn(my,ctx){
    this.state='peter';Peter.mood('think');this.refresh();
    const t0=Date.now();await sleep(30);
    const pos=this.pos,lvl=P().game.level;
    /* gleicher Zug wie vor dem Zurücknehmen? Dann spielt Rokko auch wieder seinen alten Zug – so bleibt alles wie auf dem Brett */
    const again=this.fwd.length?this.legal(pos).find(x=>this.uci(x)===this.fwd[this.fwd.length-1]):null;
    const v=this.variant;
    const m=again||(v==='pawns'?choosePawnMove(pos,lvl):v==='give'?chooseGiveMove(pos,lvl):v==='hunt'?bestMove(pos,{depth:2,q:2,noise:0}):chooseMove(pos,lvl));
    if(!m)return;
    pos.make(m);
    const check=v!=='give'&&pos.inCheck(),st=this.status();let warn=null,look=false;
    if(!check&&!st&&!this.plain()&&v!=='hunt'){
      const h=threatsAgainst(pos,this.me).find(h=>h.value>=(lvl<=2?100:300));
      if((lvl<=4||(lvl<=6&&Math.random()<.5))&&h)warn=h;
      else if(lvl<=4){const f=Trainer.freeCaptures(pos).filter(x=>VAL[x.cap]>=300);if(f.length&&Math.random()<.6)look=true}
    }
    pos.unmake();
    const first=!this.tipsSaid.board;this.tipsSaid.board=1;
    const facts=[];
    if(ctx.m)facts.push(`Das Kind hat gerade gezogen: ${moveFacts(ctx.m,'kid')}.`);
    if(ctx.kidFact)facts.push(`Dazu: ${ctx.kidFact}`);
    facts.push(`Dein Gegenzug, den du jetzt ansagen musst: ${moveFacts(m,'peter')}.`);
    if(check)facts.push('Dein Zug gibt Schach! Sag laut Schach und dass das Kind seinen König retten muss.');
    if(warn)facts.push(`Warne kurz: Dein ${NAME[warn.byPiece]} auf ${SQ(warn.by)} greift den ${NAME[warn.piece]} auf ${SQ(warn.sq)} an.`);
    if(look)facts.push('Gib den Hinweis, genau hinzuschauen, ob es etwas von dir schlagen kann. Verrate nicht was.');
    if(first)facts.push('Bitte das Kind, deinen Zug auch auf dem echten Brett zu machen.');
    if(st)facts.push('Mit diesem Zug ist das Spiel vorbei: '+(st.t==='mate'||st.t==='pawns'?'du hast gewonnen. Sei ganz lieb und tröstend.':'unentschieden.'));
    const aiP=Brain.ask(`${facts.join('\n')}\nSag das jetzt in zwei bis drei kurzen, lebendigen Sätzen (höchstens 40 Wörter). Reagiere zuerst kurz auf den Zug des Kindes, dann sag deinen Zug genau mit Figur, Startfeld und Zielfeld an.`,5000,
      txt=>(m.flag==='k'||m.flag==='q')?/rochade/i.test(txt):new RegExp('\\b'+sqName(m.to)+'\\b','i').test(txt.replace(/([A-Ha-h])\s+([1-8])/g,'$1$2')));
    if(ctx.kidFb&&!Brain.on())Peter.show(ctx.kidFb,ctx.mood);
    const minWait=lvl>=7?450:1100;
    const ai=await aiP;const rest=minWait-(Date.now()-t0);if(rest>0)await sleep(rest);
    if(my!==this.flow)return;
    this.noteMove(m);
    m.color=pos.turn;pos.make(m);this.played.push(m);this.keys.push(pos.key());
    this.state='human';if(warn)this.danger=[warn.sq,warn.by];
    this.refresh();this.board.animate(m.from,m.to);this.persist();
    m.cap?sfx.capture():sfx.move();if(check)sfx.check();
    let text=ai;
    if(!text){
      const parts=[];if(ctx.kidFb)parts.push(ctx.kidFb);
      parts.push(fbPeterMove(m));
      if(check)parts.push('Schach! Rette deinen König!');
      if(warn)parts.push(`Pass auf, ${NOM_MEIN[warn.byPiece]} greift ${ACC_DEIN[warn.piece]} an!`);
      if(look)parts.push('Schau mal ganz genau hin. Kannst du vielleicht etwas schlagen?');
      if(first&&!st)parts.push('Mach meinen Zug bitte auch auf dem Brett.');
      text=parts.join(' ');
    }
    if(v==='give'&&!st&&this.legal().some(x=>x.cap))text+=' '+pick(['Und jetzt musst du schlagen!','Achtung, du musst schlagen!']);
    if(ctx.echo)text=ctx.echo+' '+text;
    if(st)return this.endGame(st,m,text);
    await Peter.say(text,check||m.cap?'wow':warn?'think':'smile');
    this.autoListen(my);
  },
  /* ---------- Ende ---------- */
  status(){
    const pos=this.pos;
    if(this.variant==='pawns'){const r=pawnGameResult(pos);return r?{t:'pawns',winner:r}:null}
    if(this.variant==='give'){
      const r=giveResult(pos);if(r)return{t:'give',winner:r};
      if(pos.half>=100)return{t:'draw',why:'Fünfzig Züge lang wurde nichts geschlagen.'};
      const k=this.keys[this.keys.length-1];if(this.keys.filter(x=>x===k).length>=3)return{t:'draw',why:'Die gleiche Stellung war dreimal da.'};
      return null;
    }
    const ms=pos.legal();
    if(!ms.length)return pos.inCheck()?{t:'mate',winner:opp(pos.turn)}:{t:'stalemate'};
    if(pos.half>=100)return{t:'draw',why:'Fünfzig Züge lang wurde nichts geschlagen.'};
    if(pos.insufficient())return{t:'draw',why:'Mit den Figuren, die noch da sind, kann keiner mehr mattsetzen.'};
    const k=this.keys[this.keys.length-1];if(this.keys.filter(x=>x===k).length>=3)return{t:'draw',why:'Die gleiche Stellung war dreimal da.'};
    return null;
  },
  async endGame(st,m,pre){
    this.state='over';$('#ask')&&($('#ask').hidden=true);Ears.stop();
    const p=P(),g=p.game,kidC=this.family?'w':this.me,res=st.winner?(st.winner===kidC?'w':'b'):'d';
    const v=this.variant;
    /* falls der letzte Zug falsch verstanden war: alles merken, damit „Zurück“ die Partie wieder öffnen kann */
    this.endSnap=this.lessonCb?null:{g:{level:g.level,winsAt:g.winsAt,lossStreak:g.lossStreak,w:g.w,l:g.l,d:g.d},stars:p.stars,cur:JSON.parse(JSON.stringify(p.game.current||{}))};
    let msg,title;let lvlUp=false,lvlDown=false;
    if(this.family){
      const o=this.opp();
      if(res==='w'){title='Gewonnen!';msg=(pre?pre+' ':'')+`Schachmatt! ${p.name} gewinnt gegen ${o}! Wahnsinn!`;sfx.win();UI.confetti(110);Peter.bounce();Rewards.addXP(60);p.stars+=3}
      else if(res==='b'){title=o+' gewinnt';msg=(pre?pre+' ':'')+`Schachmatt. Diesmal gewinnt ${o}. ${p.name}, du hast toll gekämpft!`;Rewards.addXP(25)}

      title='Gewonnen!';msg=(pre&&/^Verstanden/.test(pre)?pre+' ':'')+(v==='pawns'?`Du hast es geschafft! Dein Bauer ist ganz hinten angekommen. Gewonnen!`:v==='give'?`Du bist alles los! Im Schlagschach heißt das: gewonnen!`:v==='hunt'?`Schachmatt! Du hast die Königsjagd geschafft, ${p.name}!`:`Schachmatt! Wahnsinn, ${p.name}, du hast gewonnen!`);
      if(lvlUp)msg+=` Und weißt du was? Ab jetzt spiele ich ${LEVELS[g.level].say}: Stärke ${g.level} von 10!`;
      sfx.win();UI.confetti(110);Peter.bounce();Rewards.addXP(60);p.stars+=3;
    }else if(res==='b'){

      title='Rokko hat gewonnen';msg=(pre?pre+' ':'')+(v==='pawns'?'Mein Bauer ist hinten angekommen. Diesmal habe ich gewonnen!':v==='give'?'Ich bin zuerst alle Figuren los. Diesmal habe ich gewonnen!':'Schachmatt! Diesmal habe ich gewonnen.')+' Aber du hast toll mitgespielt!';
      if(lvlDown)msg+=' Beim nächsten Mal spiele ich etwas gemütlicher.';

    }else{
      if(v==='standard')g.d++;
      title='Unentschieden';msg=(pre?pre+' ':'')+(st.t==='stalemate'?(v==='hunt'?'Oh, Patt! Mein König kann nicht mehr ziehen, steht aber nicht im Schach. Das war die Patt-Falle. Probier es gleich nochmal!':'Patt! Wer dran ist, kann nicht mehr ziehen, steht aber nicht im Schach. Unentschieden!'):'Unentschieden! '+st.why);Rewards.addXP(35);
    }
    /* Partie für die Eltern-Auswertung speichern */
    const summary={date:new Date().toISOString(),variant:this.variant,side:this.me,fen:this.fen0!==START_FEN?this.fen0:undefined,opp:this.family?this.opp():undefined,level:p.game.level,result:res,moves:this.played.map(x=>sqName(x.from)+sqName(x.to)+(x.promo||'')),events:this.events.slice(0,60),plies:this.played.length,minutes:Math.max(1,Math.round((Date.now()-(this.startedAt||Date.now()))/60000))};
    p.games.unshift(summary);if(p.games.length>40)p.games.pop();if(this.endSnap)this.endSnap.summary=summary;
    p.game.current=null;Rewards.progress('game');Skills.snapshot();save();
    this.lastResult={res,title,msg};
    this.refresh();this.showEnd(this.lastResult);
    Rewards.checkBadges();
    if(res==='w'&&this.variant==='standard'&&!this.family&&!(pre&&/^Verstanden/.test(pre))){Peter.show('Schachmatt! Du hast gewonnen!','wow');const ai=await Brain.ask(`Das Kind hat dich gerade mit ${moveFacts(m,'kid')} schachmatt gesetzt und gewonnen! Freu dich riesig mit ihm.${lvlUp?` Verrate, dass du ab jetzt stärker spielst: ${LEVELS[g.level].name}.`:''} Höchstens drei kurze Sätze. Frag am Ende, ob es noch eine Runde spielen will.`,5000);await Peter.say(ai||msg,'wow')}
    else await Peter.say(msg,res==='w'?'wow':'smile');
    if(!this.lessonCb&&this.endSnap&&this.endSnap.summary&&this.endSnap.summary.plies>=6&&this.state==='over')Peter.say('Willst du sehen, was in der Partie wichtig war? Tipp auf den gelben Knopf!','smile');
    if(this.lessonCb){const cb=this.lessonCb;this.lessonCb=null;setTimeout(()=>cb(res),600)}
  },
  showEnd(r){
    const el=$('#endCard');if(!el)return;el.hidden=false;
    const gm=this.endSnap&&this.endSnap.summary;
    el.innerHTML=`<h2>${esc(r.title||'')}</h2>${gm&&gm.plies>=6?`<button class="big sunbtn wide" data-act="review">${ICON.eye} Rückblick: die wichtigsten Momente</button>`:''}${this.lessonCb?'':`<div class="row"><button class="big go" data-act="again">${ICON.refresh} Nochmal spielen</button><button class="big ghost" data-act="tomap">${ICON.map} Zur Karte</button></div>`}`;
  },
  /* ---------- Werkzeuge ---------- */
  async giveHint(){
    if(this.state!=='human')return;

    const m=this.variant==='pawns'?choosePawnMove(this.pos,4):this.variant==='give'?chooseGiveMove(this.pos,9):bestMove(this.pos,{depth:this.variant==='hunt'?3:2,q:4,noise:0});if(!m)return;
    this.hint=m;this.sel=m.from;this.pending={type:'from',from:m.from};this.refresh();
    this.events.push({ply:this.played.length,kind:'hint',text:'Tipp genutzt'});this.persist();
    let t;
    if(m.flag==='k'||m.flag==='q')t='Psst, mein Tipp: Mach die Rochade!';
    else if(m.cap)t=`Psst, schau mal: ${cap1(NOM_DEIN[m.piece])} auf ${SQ(m.from)} kann auf ${SQ(m.to)} etwas schlagen!`;
    else t=pick([`Psst, wie wäre es mit ${DAT_DEIN[m.piece]} von ${SQ(m.from)} nach ${SQ(m.to)}?`,`Mein Tipp: ${NAME[m.piece]} von ${SQ(m.from)} nach ${SQ(m.to)}. Der gelbe Pfeil zeigt es dir.`]);
    await Peter.say(t,'smile');this.autoListen(this.flow);
  },
  /* Partie nach dem Ende wieder öffnen (z. B. wenn der Matt-Zug falsch verstanden wurde) */
  reopen(){
    const sn=this.endSnap;if(!sn)return false;
    const p=P();Object.assign(p.game,sn.g);p.stars=sn.stars;
    const i=p.games.indexOf(sn.summary);if(i>=0)p.games.splice(i,1);
    p.game.current=sn.cur;this.endSnap=null;this.lastResult=null;

  },
  async undo(){
    if(this.state==='ask')return this.answerAsk(true);
    if(this.state==='peter')return Peter.say('Moment, ich überlege noch!','think');
    if(this.state==='over'){if(!this.reopen())return Peter.say('Das Spiel ist schon vorbei. Sag „Neues Spiel“, dann spielen wir nochmal!')}
    if(this.state!=='human'||!this.played.length)return Peter.say('Da gibt es noch nichts zurückzunehmen.');
    this.flow++;Ears.stop();Voice.stop();
    /* gegen Rokko: so weit zurück, bis Weiß wieder dran ist (meist dein Zug und meiner) */
    let n=1;if(!this.family){n=this.pos.turn===this.me?2:1;if(n>this.played.length)n=this.played.length}
    const undone=this.back(n);
    this.events.push({ply:this.played.length,kind:'takeback',text:'Zug zurückgenommen'});this.persist();
    this.state='human';this.refresh();
    const who=this.family?(this.pos.turn==='w'?P().name+', du bist':this.opp()+' ist'):'Du bist';
    await Peter.say(`Zurück! ${undone.map(m=>this.backText(m)).join(' ')} ${who} dran.`,'smile');
    if(!this.family&&this.pos.turn===this.rk){return this.peterTurn(this.flow,{})}
    this.autoListen(this.flow);
  },
  async redo(){
    if(this.state==='ask'||this.state==='peter')return Peter.say('Moment, gleich!','think');
    if(this.state==='over')return;
    if(!this.fwd.length)return Peter.say('Da gibt es nichts zum Vorspulen. Vor geht nur, wenn du vorher zurück getippt hast.');
    this.flow++;const my=this.flow;Ears.stop();Voice.stop();
    const n=this.family?1:(this.fwd.length>=2?2:1);
    const done=this.forward(n);if(!done.length)return;
    this.events.push({ply:this.played.length,kind:'redo',text:'Wieder vor'});this.persist();
    this.state='human';this.refresh();const last=done[done.length-1];this.board.animate(last.from,last.to);sfx.move();
    const st=this.status();
    const say=`Wieder vor! ${done.map(m=>this.fwdText(m)).join(' ')} Stell das auf dem Brett auch so.`;
    if(st)return this.endGame(st,last,say);
    if(!this.family&&this.pos.turn===this.rk){await Peter.say(say,'smile');if(my!==this.flow)return;return this.peterTurn(my,{})}
    const who=this.family?(this.pos.turn==='w'?P().name+', du bist':this.opp()+' ist'):'Du bist';
    await Peter.say(`${say} ${who} dran.`,'smile');
    this.autoListen(my);
  },
  /* ---------- Brett prüfen: Partie Zug für Zug ansehen und ab einer Stelle weiterspielen ---------- */
  checkBoard(opt){
    opt=opt||{};
    if(this.state==='peter')return Peter.say('Moment, ich überlege noch!','think');
    if(this.state==='ask')return Peter.say('Sag erst Ja oder Nein: Willst du den Zug zurücknehmen?','think');
    Ears.stop();this.flow++;
    const g=new Pos(this.fen0),fens=[g.fen()],mv=[];
    for(const m of this.played){const x=this.legal(g).find(y=>this.uci(y)===this.uci(m));if(!x)break;x.color=g.turn;g.make(x);fens.push(g.fen());mv.push(x)}
    const last=fens.length-1;let ply=last;
    const chips=mv.map((m,i)=>`${i%2===0?`<span class="plyno">${i/2+1}</span>`:''}<button class="plychip ${m.color}" data-ply="${i+1}">${pieceSVG(m.color,m.piece,'i')}${esc(this.shortMove(m))}</button>`).join('');
    UI.sheet(`<div style="display:flex;align-items:center;gap:10px"><h2 style="flex:1">${opt.resume?'Stimmt dein Brett noch?':'Brett prüfen'}</h2><button class="iconbtn" data-x aria-label="Schließen">${ICON.close}</button></div>
      <p class="small muted" style="margin:0">Sieht dein Brett genauso aus? Wenn nicht: mit den Pfeilen zurückgehen, bis es passt, dann „Ab hier weiter“ tippen.</p>
      <div id="cbBoard"></div>
      <div class="cbstep"><button class="big ghost" data-prev aria-label="Einen Zug zurück">${ICON.back}</button><button class="big ghost" data-say aria-label="Vorlesen">${ICON.speaker}</button><button class="big ghost" data-next aria-label="Einen Zug vor">${ICON.next}</button></div>
      <p class="cbply" id="cbPly"></p>
      ${mv.length?`<div class="plylist">${chips}</div>`:''}
      <div class="row"><button class="big go" data-ok>${ICON.check} Stimmt so</button><button class="big sunbtn" data-here hidden>${ICON.undo} Ab hier weiter</button></div>`,(sh,close)=>{
      const b=new Board($('#cbBoard',sh),{names:'edge',flip:this.me==='b'});
      const label=()=>ply?`Zug ${Math.ceil(ply/2)} · ${this.whoOf(mv[ply-1].color)}: ${this.moveSay(mv[ply-1])}`:'Anfangsstellung';
      const show=speak=>{
        b.clearMarks();b.setPos(new Pos(fens[ply]));const m=mv[ply-1];if(m)b.mark('last',[m.from,m.to]).arrows([{from:m.from,to:m.to,kind:m.color===(this.family?'w':this.me)?'hint':''}]);b.render();
        $('#cbPly',sh).textContent=label()+(ply===last?' · jetzt':'');
        $$('.plychip',sh).forEach(c=>c.setAttribute('aria-pressed',String(+c.dataset.ply===ply)));
        const cur=$(`.plychip[data-ply="${ply}"]`,sh);if(cur&&cur.scrollIntoView)try{cur.scrollIntoView({block:'nearest',inline:'nearest'})}catch(e){}
        $('[data-ok]',sh).hidden=ply!==last;$('[data-here]',sh).hidden=ply===last;
        if(speak)Voice.speak(ply?`Zug ${Math.ceil(ply/2)}. ${this.fwdText(m)}`:'So fängt die Partie an.',{interrupt:true});
      };
      show(false);
      let shut=false;const finish=()=>{if(shut)return;shut=true;close();this.afterCheck(opt)};
      sh.parentElement.addEventListener('click',e=>{if(e.target===sh.parentElement)finish()});
      sh.onclick=e=>{
        audioUnlock();
        if(e.target.closest('[data-x]')||e.target.closest('[data-ok]')){sfx.tap();return finish()}
        if(e.target.closest('[data-prev]')&&ply>0){ply--;sfx.tap();show(true)}
        if(e.target.closest('[data-next]')&&ply<last){ply++;sfx.tap();show(true)}
        if(e.target.closest('[data-say]'))show(true);
        const c=e.target.closest('[data-ply]');if(c){ply=+c.dataset.ply;sfx.tap();show(true)}
        if(e.target.closest('[data-here]')){shut=true;close();this.rewindTo(ply)}
      };
    });
    if(opt.resume){
      const lm=this.played[this.played.length-1];
      const turn=this.family?(this.pos.turn==='w'?`${P().name} ist dran.`:`${this.opp()} ist dran.`):(this.pos.turn===this.me?'Du bist dran.':'Ich bin dran.');
      Peter.say(`Da sind wir wieder! Schau mal, ob dein Brett genauso aussieht wie auf dem Handy. ${lm?'Der letzte Zug war: '+this.fwdText(lm):''} ${turn}`,'smile');
    }else Peter.say(pick(['Vergleich mal das Handy mit deinem Brett.','Schau mal: Sieht dein Brett genauso aus?']),'think');
  },
  afterCheck(opt){
    const my=++this.flow;
    if(this.state==='over')return;
    if(!this.family&&this.pos.turn===this.rk)return Peter.say('Super, dann überlege ich jetzt meinen Zug.','smile').then(()=>{if(my===this.flow)this.peterTurn(my,{})});
    if(opt.resume){const who=this.family?(this.pos.turn==='w'?P().name+', du bist':this.opp()+', du bist'):'Du bist';return Peter.say(`Prima! Weiter geht's. ${who} dran.`,'smile',{interrupt:true}).then(()=>this.autoListen(my))}
    this.autoListen(my);
  },
  async rewindTo(ply){
    if(this.state==='over'&&!this.reopen())return;
    const n=this.played.length-ply;if(n<=0)return this.afterCheck({});
    this.flow++;const my=this.flow;Voice.stop();
    this.back(n);
    this.events.push({ply:this.played.length,kind:'takeback',text:`Zurückgespult auf Zug ${Math.ceil(ply/2)||0}`});this.persist();
    this.state='human';this.refresh();sfx.move();

    if(!this.family&&this.pos.turn===this.rk){await Peter.say(base+tip+' Jetzt bin ich dran.','smile');if(my===this.flow)this.peterTurn(my,{});return}
    const who=this.family?(this.pos.turn==='w'?P().name+', du bist':this.opp()+' ist'):'Du bist';
    await Peter.say(`${base}${tip} ${who} dran.`,'smile');
    this.autoListen(my);
  },
  resumeTalk(my){
    if(this.state==='over')return;
    setTimeout(()=>{if(my===this.flow&&UI.current==='play')this.checkBoard({resume:true})},350);
  },
  /* ---------- Mehr: seltenere Knöpfe ---------- */
  moreSheet(){
    const s=P().settings,ears=Ears.available();
    UI.sheet(`<div style="display:flex;align-items:center;gap:10px"><h2 style="flex:1">Mehr</h2><button class="iconbtn" data-x aria-label="Schließen">${ICON.close}</button></div>

  newGame(){

    this.reset(this.variant,this.me,this.variant==='hunt'&&!this.pos.pieces('w').some(p=>p.type==='q'));this.state=this.pos.turn===this.me||this.family?'human':'peter';

  },
  setLevel(n){
    const g=P().game;if(n===g.level)return;g.level=n;g.winsAt=0;g.lossStreak=0;save();

/* ===================================================================
   Rokko-Schach · Ansichten: Start, Karte, Spielen, Training, Album, Eltern

const TABS=[
  {id:'home',label:'Start',icon:'home'},

  {id:'playhub',label:'Spielen',icon:'board'},
  {id:'train',label:'Training',icon:'target'},
  {id:'me',label:'Ich',icon:'user'}
];
function lessonIcon(l){
  if(ICON[l.icon])return ICON[l.icon];
  if(l.icon==='star')return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17l-5.7 3.1 1.2-6.4L2.8 9.3l6.4-.8z" fill="currentColor"/></svg>`;
  if(l.icon==='rock')return ROCK.replace('class="rock"','');
  if('pnbrqk'.includes(l.icon))return pieceSVG('w',l.icon,'i');
  return ICON.star;
}
function avatarSVG(a){return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="50" fill="${a.color}"/><svg x="12" y="10" width="76" height="80" class="pw">${pieceUses('w',a.fig)}</svg></svg>`}
function masteryStars(id){const n=Skills.stars(id);let h='';for(let i=0;i<5;i++)h+=STAR(i<n);return `<span class="mastery" aria-label="${n} von 5 Sternen">${h}</span>`}

const UI={
  current:null,screen:null,
  screens:{},
  go(id,arg){
    if(this.screen&&this.screen.unmount)try{this.screen.unmount()}catch(e){}
    /* Mini-Modus für kleine Geschwister: eigener Startbildschirm, keine Tabs */
    if(P()&&P().mini&&['home','map','playhub','train','me','album'].includes(id))id='mini';
    if(id!=='lesson'&&id!=='play'&&id!==this.current&&this.current)Voice.stop();
    this.current=id;
    const scr=id==='lesson'?Runner:id==='play'?Game:this.screens[id];
    this.screen=scr;
    const view=$('#view');view.innerHTML=scr.render(arg);
    const el=view.firstElementChild;
    $('#tabs').hidden=(id==='lesson'||id==='mini'||(id==='done'));
    const tabId=id==='play'?'playhub':(id==='parents'||id==='album')?'me':id;
    $$('.tab').forEach(t=>t.setAttribute('aria-current',t.dataset.tab===tabId?'page':'false'));
    window.scrollTo(0,0);
    if(scr.mount)scr.mount(el,arg);
    if(typeof Pause!=='undefined'&&id!=='lesson'&&id!=='play')setTimeout(()=>Pause.check(),300);
  },
  tabs(){
    $('#tabs').innerHTML=`<div class="tabs-in">${TABS.map(t=>`<button class="tab" data-tab="${t.id}">${ICON[t.icon]}<span>${t.label}</span></button>`).join('')}</div>`;
    $('#tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(!t)return;audioUnlock();sfx.tap();
      if(t.dataset.tab==='playhub'&&Game.pos&&Game.state!=='idle'&&Game.state!=='over'&&UI.current!=='play')return this.go('play');
      this.go(t.dataset.tab)});
  },
  /* ---------- kleine Bausteine ---------- */
  toast(icon,text){
    const t=document.createElement('div');t.className='toast';t.innerHTML=`${icon||''}<span>${esc(text)}</span>`;
    document.body.appendChild(t);setTimeout(()=>{t.style.transition='opacity .3s';t.style.opacity='0';setTimeout(()=>t.remove(),320)},2600);
  },
  confetti(n){
    if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    const box=document.createElement('div');box.className='confetti';
    const cols=['#F6B91F','#0E8C7E','#D6402F','#38C3B1','#7A5CFF','#FF8A3D','#2B7BD8'];
    for(let i=0;i<n;i++){const s=document.createElement('i');s.style.left=Math.random()*100+'%';s.style.background=cols[i%cols.length];s.style.animationDelay=(Math.random()*.5)+'s';s.style.width=(6+Math.random()*8)+'px';box.appendChild(s)}
    document.body.appendChild(box);setTimeout(()=>box.remove(),2600);
  },
  sheet(html,onMount){
    const o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
    document.body.appendChild(o);
    const close=()=>{o.remove()};

  celebrate(title,text,icon,cert){

    Voice.speak(title+' '+text);
  },
  /* Ton-Hilfe: in der Ansicht, wenn sie Platz dafür hat, sonst als kleine Karte unten */
  soundHint(){
    let h=$('#soundHelp');
    if(!h){const slot=$('#soundSlot');const w=document.createElement('div');w.innerHTML=soundHelpHTML();h=w.firstElementChild;
      if(slot)slot.appendChild(h);else if(navigator.webdriver)return; /* automatische Tests: keine schwebende Karte */
      else{h.classList.add('float');h.insertAdjacentHTML('beforeend',`<button class="iconbtn" data-shx aria-label="Schließen">${ICON.close}</button>`);document.body.appendChild(h);$('[data-shx]',h).onclick=()=>h.remove()}}
    h.hidden=false;
  },
  heard(text,final){const h=$('#heard');if(h)h.textContent=(final?'Gehört: „':'Ich höre: „')+text+'“'},
  listenState(on){const b=$('#earBtn');if(b)b.classList.toggle('listening',on);$$('[data-act="mic"]').forEach(x=>x.classList.toggle('on',on));const h=$('#heard');if(h&&on&&!h.textContent.startsWith('Ich höre'))h.textContent='Ich höre zu … sag deinen Zug!';if(h&&!on&&h.textContent.startsWith('Ich höre zu'))h.textContent='Tippe auf das Mikrofon, wenn du etwas sagen willst.'},
  listenBlocked(){this.toast(ICON.mic,'Das Mikrofon ist hier gesperrt. Nimm das Mikrofon deiner Tastatur.');$$('[data-act="mic"],[data-act="hands"]').forEach(x=>x.hidden=true)},
  pickPiece(tr,cb){
    const figs=tr.figs||(tr.allowPawn?['r','b','q','k','n','p']:['r','b','q','k','n']);
    this.sheet(`<h2>Welche Figur?</h2><div class="piecepick" style="grid-template-columns:repeat(${figs.length},minmax(0,1fr))">${figs.map(f=>`<button data-f="${f}" aria-label="${NAME[f]}">${friendSVG(f,'w')}</button>`).join('')}</div><div class="grid3">${figs.slice(0,0).join('')}</div>`,(s,close)=>{

    });
  },
  showDone(r){
    if(this.screen&&this.screen.unmount)try{this.screen.unmount()}catch(e){}

    const nl=nextLesson();

      <h1>${r.stars===3?'Perfekt!':r.stars===2?'Super gemacht!':'Geschafft!'}</h1>
      <div class="bigstars">${[1,2,3].map(i=>STAR(false)).join('')}</div>
      <p class="say" data-live style="text-align:center"></p>

        <button class="big ghost" data-act="back">${r.training?ICON.target:ICON.map} ${r.training?'Training':'Karte'}</button>
      </div></div></div>`;
    const svgs=$$('.bigstars svg',view);
    svgs.forEach((s,i)=>setTimeout(()=>{if(i<r.stars){s.outerHTML=STAR(true);sfx.star()}},500+i*450));
    setTimeout(()=>{$$('.bigstars svg',view).forEach((s,i)=>{if(i<r.stars)s.classList.add('on')})},520+r.stars*450);
    const rw=$('#rewards',view);
    if(r.newStars>0)rw.insertAdjacentHTML('beforeend',`<div class="reward">${STARCHIP}<span>+${r.newStars} ${r.newStars===1?'Stern':'Sterne'} gesammelt</span></div>`);
    if(r.medal)rw.insertAdjacentHTML('beforeend',`<div class="reward medalrw"><span class="mw">${medalSVG(r.medal)}</span><span>${TIER_NAME[r.medal]}medaille!</span></div>`);

    if(r.friend)rw.insertAdjacentHTML('beforeend',`<div class="reward" style="border-color:${r.friend.c}"><span style="width:56px;height:56px;border-radius:50%;background:${r.friend.c};display:flex;align-items:center;justify-content:center">${friendSVG(r.friend.fig,'w')}</span><span>Neue Sammelkarte: ${esc(r.friend.name)}!</span></div>`);
    if(r.worldNow){rw.insertAdjacentHTML('beforeend',`<div class="reward">${CHEST(false)}<span>Eine Schatztruhe wartet unter „Ich“!</span></div>`);setTimeout(()=>this.confetti(70),1600)}
    if(r.seasonNow)rw.insertAdjacentHTML('beforeend',`<button class="reward certrw" data-act="cert">${ICON.trophy}<span>Urkunde: ${esc(SEASONS[r.seasonNow-1].name)} geschafft!</span></button>`);
    if(r.newSeason)rw.insertAdjacentHTML('beforeend',`<div class="reward" style="border-color:#0E7490"><span class="nsi">${ICON[r.newSeason.icon]}</span><span>Neue Karte: ${esc(r.newSeason.name)}!</span></div>`);
    const said=r.medal?(r.medal===3?'Gold! Wahnsinn, du bist ein echter Profi!':'Silber! Super, das war richtig schwer.'):r.newSeason?`Wahnsinn! Du hast ${r.lesson.world.acc} geschafft. Und jetzt öffnet sich eine neue Karte: die ${r.newSeason.name}! Dort lernst du die Tricks der Profis.`:r.friend?`Du hast ${r.lesson.world.acc} geschafft! ${r.friend.name} ist jetzt dein Freund.`:r.worldNow?`Du hast ${r.lesson.world.acc} geschafft! Eine Schatztruhe wartet auf dich.`:r.stars===3?pick(['Drei Sterne! Du bist ein echter Schach-Held!','Alles richtig! Ich bin stolz auf dich.']):pick(['Gut gemacht! Weiter so!','Super! Mit jeder Übung wirst du besser.']);
    setTimeout(()=>Peter.say(said,'wow'),400);
    view.firstElementChild.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;audioUnlock();
      if(a.dataset.act==='next')openLesson(nl);
      if(a.dataset.act==='cert')Cert.open({kind:'season',season:r.seasonNow});
      if(a.dataset.act==='back'){UI.screens.map.wi=null;UI.screens.map.season=null;this.go(r.training?'train':'map')}
    });
  }
};

function hudHTML(){

function openLesson(l,resume,tier){
  if(!l)return;
  if(!resume&&P().resume&&P().resume.id===l.id&&(!tier||tier===(P().resume.tier||1)))resume=P().resume;
  tier=tier||(resume&&resume.tier)||1;
  Runner.start({title:l.name+(tier>1?' · '+TIER_NAME[tier]:''),color:l.world.c,steps:hardenSteps(l.steps,tier),lesson:l,resume,tier});
}
/* Medaille als Bild: Bronze, Silber, Gold */
const MEDAL_C=['','#C27C3A','#9AA7B4','#E2A400'];
function medalSVG(t,on){const c=on===false?'var(--line)':MEDAL_C[t];return `<svg viewBox="0 0 40 46" class="medalsvg" aria-hidden="true"><path d="M12 2h7l3 12h-7zM28 2h-7l-3 12h7z" fill="${on===false?'var(--line)':'#E5484D'}"/><circle cx="20" cy="28" r="15" fill="${c}"/><circle cx="20" cy="28" r="11" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"/><path d="M20 20.5l2.3 4.7 5.2.7-3.8 3.6.9 5.1-4.6-2.4-4.6 2.4.9-5.1-3.8-3.6 5.2-.7z" fill="#fff" fill-opacity=".9"/></svg>`}
/* Geschaffte Lektion antippen: Stufe wählen */
function tierSheet(l){
  const have=lessonTier(l);
  const desc=['','Wie beim ersten Mal','Schwerer, ohne Erklärung','Für Profis: wenig Hilfe'];
  Voice.speak(have>=3?'Gold! Du bist ein echter Profi. Willst du nochmal spielen?':'Diese Lektion hast du schon geschafft! Willst du es schwerer probieren? Silber ist schwieriger, Gold ist für echte Profis.',{interrupt:true});
  UI.sheet(`<div style="display:flex;align-items:center;gap:10px"><h2 style="flex:1">${esc(l.name)}</h2><button class="iconbtn" data-x aria-label="Schließen">${ICON.close}</button></div>
    <div class="tiers">${[1,2,3].map(t=>{const lock=t>have+1,got=have>=t;return `<button class="tier ${got?'got':''} ${lock?'locked':''}" data-tier="${t}" aria-label="${TIER_NAME[t]}${lock?' (verschlossen)':''}"><span class="tmedal">${medalSVG(t,!lock)}${lock?`<i class="tlock">${ICON.lock}</i>`:got?`<i class="tok">${ICON.check}</i>`:''}</span><b>${TIER_NAME[t]}</b><span class="small muted">${desc[t]}</span></button>`}).join('')}</div>`,(sh,close)=>{
    sh.onclick=e=>{if(e.target.closest('[data-x]'))return close();const b=e.target.closest('[data-tier]');if(!b)return;const t=+b.dataset.tier;
      if(t>have+1){sfx.nope();Voice.speak(`Hol dir zuerst ${TIER_NAME[t-1]}!`,{interrupt:true});return}
      sfx.tap();close();openLesson(l,null,t)};
  });
}
/* nächste Medaille, die sich lohnt (wenn alle Lektionen geschafft sind) */
function nextMedal(){for(const t of [2,3]){const l=LESSONS.find(x=>lessonTierable(x)&&P().lessons[x.id]&&lessonTier(x)<t);if(l)return{l,t}}return null}
function resumeLesson(){const r=P().resume;if(!r)return null;const l=LESSONS.find(x=>x.id===r.id);return l&&lessonUnlocked(l)?l:null}
const worldUnlocked=w=>lessonUnlocked(w.lessons[0]);
const worldStars=w=>w.lessons.reduce((n,l)=>n+(P().lessons[l.id]||0),0);
/* Fortschrittsring um ein Symbol (Tagesmission) */
function ringHTML(frac,inner,col){const r=21,c=2*Math.PI*r;return `<svg viewBox="0 0 50 50" class="ring" aria-hidden="true"><circle cx="25" cy="25" r="${r}" fill="none" stroke="var(--bg2)" stroke-width="5"/>${frac>0?`<circle cx="25" cy="25" r="${r}" fill="none" stroke="${col||'var(--peter)'}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(c*clamp(frac,0,1)).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 25 25)"/>`:''}</svg><span class="rin">${inner}</span>`}
function missionIcon(t){return t.id==='skill'?(SKILLS[t.skill].fig?pieceSVG('w',SKILLS[t.skill].fig,'i'):ICON[SKILLS[t.skill].icon]):t.id==='lesson'?ICON.map:t.id==='game'?ICON.board:ICON.bulb}

        <button class="qtile" data-act="train" style="--tc:#B07800"><span class="ti">${ICON.target}</span><span class="qt"><b>Training</b><span>${weak?esc(SKILLS[weak].name):'Rätsel'}</span></span></button>
      </div>
      <div class="mission2">

/* ---------- Abenteuer: Wisch-Karussell, eine Welt pro Seite ----------
   Die Seiten liegen nebeneinander und rasten beim Wischen ein (native Scroll-Snap).
   Beim Blättern wird nichts neu aufgebaut und Rokko bleibt still. */
function worldPageHTML(w,wi,nl,list){
  const unl=worldUnlocked(w),got=worldStars(w),max=w.lessons.length*3,fr=FRIENDS.find(f=>f.world===w.id),rl=resumeLesson();
  const pos=[[1,1],[1,2],[2,2],[2,1]];
  const nodes=w.lessons.map((l,li)=>{
    const st=P().lessons[l.id]||0,u=lessonUnlocked(l),cur=(rl||nl)===l;
    const [r,c]=pos[li]||[3,1];
    return `<button class="lnode ${u?'':'locked'} ${cur?'current':''} ${st?'done':''}" data-l="${l.id}" style="grid-row:${r};grid-column:${c}" aria-label="${esc(l.name)}${u?'':' (verschlossen)'}">
      <span class="disc">${u?lessonIcon(l):ICON.lock}${l.real?`<span class="realb" title="Am echten Brett">${ICON.board}</span>`:''}${cur?'<span class="nowp">'+ICON.play+'</span>':''}${st&&lessonTierable(l)?`<span class="lmedal t${lessonTier(l)}" title="${TIER_NAME[lessonTier(l)]}">${medalSVG(lessonTier(l))}</span>`:''}</span>
      <span class="st">${[1,2,3].map(i=>STAR(i<=st)).join('')}</span>
      <span class="lbl">${esc(l.name)}</span></button>`}).join('');

UI.screens.map={
  wi:null,season:null,
  list(){return seasonWorlds(this.season)},
  pickDefault(){
    const L=resumeLesson()||nextLesson();
    const w=L?L.world:WORLDS[WORLDS.length-1];
    if(this.season==null)this.season=seasonOf(w);
    const list=this.list();
    if(this.wi==null){const i=list.indexOf(w);this.wi=i>=0?i:(seasonDone(this.season)?list.length-1:0)}
  },
  render(){
    const nl=nextLesson();this.pickDefault();
    const list=this.list(),wi=clamp(this.wi,0,list.length-1);this.wi=wi;
    const strip=list.map((x,i)=>{const u=worldUnlocked(x),d=worldDone(x);
      return `<button class="wdot ${i===wi?'on':''} ${u?'':'locked'}" data-w="${i}" style="--wc:${x.c}" aria-label="${esc(x.name)}">${u?friendSVG(x.fig,'w'):ICON.lock}${d?`<span class="wok">${ICON.check}</span>`:''}</button>`}).join('');
    const seasons=`<div class="seasons" role="tablist" aria-label="Karten">${SEASONS.map(z=>{const u=seasonUnlocked(z.id);return `<button class="season ${z.id===this.season?'on':''} ${u?'':'locked'}" data-season="${z.id}" role="tab" aria-selected="${z.id===this.season}">${u?ICON[z.icon]:ICON.lock}<span>${esc(z.name)}</span>${seasonDone(z.id)?`<i class="sok">${ICON.check}</i>`:''}</button>`}).join('')}</div>`;
    return `<div class="view advent" style="--wc:${list[wi].c}">
      ${topbarHTML('Abenteuer')}
      ${seasons}
      <div class="wstrip" aria-label="Welten">${strip}</div>
      <div class="wcar" id="wcar">${list.map((w,i)=>worldPageHTML(w,i,nl,list)).join('')}</div>
      <div class="wnav">
        <button class="navbtn" data-nav="-1" ${wi===0?'disabled':''} aria-label="Vorherige Welt">${ICON.back}</button>
        <span class="wdots">${list.map((x,i)=>`<i class="${i===wi?'on':''}"></i>`).join('')}</span>
        <button class="navbtn" data-nav="1" ${wi===list.length-1?'disabled':''} aria-label="Nächste Welt">${ICON.next}</button>
      </div>
    </div>`;
  },
  step(car){const pg=car.querySelector('.wpage');if(!pg)return car.clientWidth;return pg.getBoundingClientRect().width+parseFloat(getComputedStyle(car).columnGap||0)},
  scrollTo(i,smooth){
    const car=$('#wcar');if(!car)return;i=clamp(i,0,this.list().length-1);
    car.scrollTo({left:i*this.step(car),behavior:smooth&&!matchMedia('(prefers-reduced-motion: reduce)').matches?'smooth':'auto'});
  },
  /* Nur Markierungen umschalten – kein Neuaufbau, kein Springen */
  setActive(i){
    if(i===this.wi&&this._init)return;this.wi=i;this._init=true;
    const el=$('.advent');if(!el)return;const list=this.list();
    el.style.setProperty('--wc',list[i].c);
    $$('.wdot',el).forEach((b,k)=>b.classList.toggle('on',k===i));
    $$('.wdots i',el).forEach((d,k)=>d.classList.toggle('on',k===i));
    const [pv,nx]=$$('.navbtn',el);if(pv)pv.disabled=i===0;if(nx)nx.disabled=i===list.length-1;
    const st=$('.wstrip',el),b=$$('.wdot',el)[i];
    if(st&&b){const left=b.offsetLeft-st.clientWidth/2+b.clientWidth/2;st.scrollTo({left,behavior:'smooth'})}
  },
  drawPath(page){
    const lp=$('.lpath',page),svg=$('.lconn',page);if(!lp||!svg)return;
    const box=lp.getBoundingClientRect();if(!box.width)return;
    const pts=$$('.lnode .disc',lp).map(d=>{const r=d.getBoundingClientRect();return[r.left+r.width/2-box.left,r.top+r.height/2-box.top]});
    if(pts.length<2){svg.innerHTML='';return}
    svg.setAttribute('viewBox',`0 0 ${box.width} ${box.height}`);
    let d=`M${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i];d+=Math.abs(y0-y1)<2?` L${x1} ${y1}`:` C${x0+(x0<box.width/2?-60:60)} ${y0} ${x1+(x1<box.width/2?-60:60)} ${y1} ${x1} ${y1}`}
    svg.innerHTML=`<path d="${d}" fill="none" stroke="var(--wdark)" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 14" opacity=".35"/>`;
  },
  mount(el){
    const car=$('#wcar',el);this._init=false;
    el.addEventListener('click',e=>{audioUnlock();
      const se=e.target.closest('[data-season]');if(se){const n=+se.dataset.season;
        if(!seasonUnlocked(n)){sfx.nope();se.classList.add('shake');setTimeout(()=>se.classList.remove('shake'),400);Voice.speak(`Die ${SEASONS[n-1].name} öffnen sich, wenn du alle Welten im ${SEASONS[n-2].name} geschafft hast!`,{interrupt:true,force:true});return}
        if(n!==this.season){sfx.tap();this.season=n;const L=resumeLesson()||nextLesson();const i=L?this.list().indexOf(L.world):-1;this.wi=i>=0?i:0;UI.go('map');Voice.speak(SEASONS[n-1].name+'. '+SEASONS[n-1].desc,{interrupt:true})}return}
      const wd=e.target.closest('[data-w]');if(wd){sfx.tap();this.scrollTo(+wd.dataset.w,true);return}
      const nv=e.target.closest('[data-nav]');if(nv){sfx.tap();this.scrollTo(this.wi+(+nv.dataset.nav),true);return}
      const sy=e.target.closest('[data-say]');if(sy){const w=WORLDS[+sy.dataset.say];sfx.tap();Voice.speak(w.name+'. '+w.desc,{interrupt:true,force:true});return}
      const n=e.target.closest('.lnode');if(!n)return;
      const l=LESSONS.find(x=>x.id===n.dataset.l);
      if(!lessonUnlocked(l)){sfx.nope();n.classList.add('shake');setTimeout(()=>n.classList.remove('shake'),400);Voice.speak('Diese Lektion ist noch verschlossen. Schaff zuerst die davor!',{interrupt:true});return}
      sfx.tap();if(P().lessons[l.id]&&lessonTierable(l)&&!(P().resume&&P().resume.id===l.id))tierSheet(l);else openLesson(l)});
    let raf=0;
    car.addEventListener('scroll',()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;const i=clamp(Math.round(car.scrollLeft/this.step(car)),0,this.list().length-1);this.setActive(i)})},{passive:true});
    const start=this.wi;
    requestAnimationFrame(()=>{this.scrollTo(start,false);this._init=false;this.setActive(start);$$('.wpage',el).forEach(p=>this.drawPath(p))});
    if(!this._rs){this._rs=true;addEventListener('resize',()=>{if(UI.current==='map'){$$('.wpage').forEach(p=>this.drawPath(p));this.scrollTo(this.wi,false)}})}
  }
};

      <label class="setting" style="cursor:pointer"><div><b>Mini-Modus</b><small>Für Kleine ab 3 Jahren: Figuren, Farben und Sterne entdecken, ganz ohne Regeln.</small></div><input type="checkbox" class="toggle" id="pmini" ${p&&p.mini?'checked':''}></label>
      <button class="big go wide" data-save>${p?'Speichern':'Los geht\'s!'}</button>`,(s,close)=>{
      const redraw=()=>{$$('[data-fig]',s).forEach(b=>{b.innerHTML=avatarSVG({fig:b.dataset.fig,color:col});b.setAttribute('aria-pressed',String(b.dataset.fig===fig))});$$('[data-c]',s).forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.c===col)))};
      s.onclick=e=>{const f=e.target.closest('[data-fig]');if(f){fig=f.dataset.fig;redraw()}const c=e.target.closest('[data-c]');if(c){col=c.dataset.c;redraw()}
        if(e.target.closest('[data-save]')){const name=$('#pname',s).value.trim()||'Schachkind';
          const mini=$('#pmini',s).checked;
          if(p){p.name=name;p.avatar={fig,color:col};p.mini=mini}else{const np=newProfile(name,{fig,color:col});np.mini=mini;Store.data.profiles[np.id]=np;Store.data.current=np.id;UI.greeted=false}
          save();applyTheme();close();UI.go(UI.current==='parents'?'parents':'home')}};
    });
  }
};

/* ===================================================================
   Rokko-Schach · Elternbereich: Auswertung, Schwächen, Partien, Einstellungen
   =================================================================== */
const Parents={
  naturalRow(){
    if(!Piper.allowed())return '<div id="psetting" hidden></div>';
    const st=Piper.state;
    if(st==='ready')return `<div class="setting" id="psetting"><div><label for="sNatural">Natürliche Stimme (Thorsten)</label><small>Aus: Rokko nutzt die Stimme des iPhones.</small></div><input type="checkbox" class="toggle" id="sNatural" ${P().settings.natural!==false?'checked':''}></div>`;
    if(st==='broken')return `<div class="setting" id="psetting"><div><label>Natürliche Stimme (Thorsten)</label><small>Funktioniert auf diesem Gerät leider nicht. Rokko nutzt die Stimme des iPhones.</small></div></div>`;
    if(st==='loading')return `<div class="setting" id="psetting"><div style="flex:1"><label>Natürliche Stimme wird geladen</label><div class="xpbar" style="margin-top:6px"><i style="width:${Piper.progress}%"></i></div></div><span class="small muted">${Piper.progress} %</span></div>`;
    return `<div class="setting" id="psetting"><div><label>Natürliche Stimme (Thorsten)</label><small>Einmalig ca. ${Piper.SIZE_MB} MB laden. Klingt viel weniger nach Roboter.</small></div><button class="big sunbtn" style="min-height:44px;font-size:1rem" data-act="piperload">Laden</button></div>`;
  },
  gate(){
    this.gateThen(()=>UI.go('parents'));
  },
  gateThen(ok,title){
    const a=6+Math.floor(Math.random()*4),b=6+Math.floor(Math.random()*4);
    UI.sheet(`<h2>${title||'Für Eltern'}</h2><p class="muted" style="margin:0">Bitte rechne kurz, damit nur Erwachsene hier reinkommen.</p>
      <label for="gateIn" style="font-family:var(--font-display);font-weight:700;font-size:1.5rem">${a} × ${b} = ?</label>
      <input class="field" id="gateIn" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
      <div class="row"><button class="big go" data-ok>Weiter</button><button class="big ghost" data-no>Abbrechen</button></div>`,(s,close)=>{
      const go=()=>{if(+$('#gateIn',s).value===a*b){close();ok()}else{sfx.nope();$('#gateIn',s).value='';$('#gateIn',s).placeholder='Nochmal versuchen'}};
      $('[data-ok]',s).onclick=go;$('[data-no]',s).onclick=close;$('#gateIn',s).addEventListener('keydown',e=>{if(e.key==='Enter')go()});
      setTimeout(()=>$('#gateIn',s).focus(),50);
    });
  },
  insights(){
    const p=P(),out=[];
    const sk=Object.entries(p.skills).filter(([k,v])=>v.n>=3&&SKILLS[k]);
    const strong=sk.filter(([k,v])=>v.v>=68).sort((a,b)=>b[1].v-a[1].v).slice(0,2);
    const weak=sk.filter(([k,v])=>v.v<55).sort((a,b)=>a[1].v-b[1].v).slice(0,3);
    const recent=p.games.filter(g=>g.variant!=='pawns'&&g.plies>6).slice(0,6);
    const count=k=>recent.reduce((n,g)=>n+g.events.filter(e=>e.kind===k).length,0);
    const gamesWith=k=>recent.filter(g=>g.events.some(e=>e.kind===k)).length;
    const name=p.name;
    if(recent.length){
      const bl=gamesWith('blunder')+gamesWith('blunderMate');
      if(bl>=Math.ceil(recent.length/2))out.push({c:'#D6402F',t:`${name} lässt oft Figuren ungeschützt stehen (in ${bl} von ${recent.length} Partien). Vor jedem Zug fragen: „Was greift Rokko an?“`,train:'rescue'});
      const mc=count('missedCapture');if(mc>=2)out.push({c:'#E8743B',t:`${mc}-mal stand eine Figur von Rokko frei und wurde nicht geschlagen. Das Adlerauge-Training übt genau das.`,train:'capture'});
      const mm=count('missedMate');if(mm>=1)out.push({c:'#4F46E5',t:`${mm}-mal war ein Matt in einem Zug möglich und wurde übersehen. Matt-Blick hilft dabei.`,train:'mate'});
      const eq=gamesWith('earlyQueen');if(eq>=2)out.push({c:'#D99A00',t:`Die Dame kommt oft sehr früh ins Spiel. Besser zuerst Springer und Läufer entwickeln.`,train:'castle'});
      const cs=gamesWith('castle');if(recent.length>=3&&cs===0)out.push({c:'#C8553D',t:`In den letzten Partien wurde nie rochiert. Die Rochade bringt den König in Sicherheit.`,train:'castle'});
      if(cs>=2)out.push({c:'#2E9E4F',t:`Rochiert schon regelmäßig, sehr gut!`});
      const gc=count('goodCapture');if(gc>=3)out.push({c:'#2E9E4F',t:`Erkennt freie Figuren immer öfter (${gc}-mal geschnappt).`});
    }
    const ill={};for(const g of p.games.slice(0,10))for(const e of g.events)if(e.kind==='illegal')ill[e.piece]=(ill[e.piece]||0)+1;
    const worstPiece=Object.entries(ill).sort((a,b)=>b[1]-a[1])[0];
    if(worstPiece&&worstPiece[1]>=3)out.push({c:'#7A5CFF',t:`${worstPiece[0]==='q'?'Bei der Dame':'Beim '+NAME[worstPiece[0]]} gab es ${worstPiece[1]} ungültige Zugversuche. Die Zugregeln dieser Figur lohnen sich zu wiederholen.`,trainSkill:'move_'+worstPiece[0]});
    for(const [k,v] of weak)if(!out.some(o=>o.train===SKILLS[k].train))out.push({c:'#D6402F',t:`Schwäche: ${SKILLS[k].name} (${Math.round(v.v)} von 100). ${SKILLS[k].desc}.`,trainSkill:k});
    for(const [k,v] of strong)out.push({c:'#2E9E4F',t:`Stärke: ${SKILLS[k].name} (${Math.round(v.v)} von 100).`});
    return out;
  },
  tab:'overview',
  render(){
    const p=P(),g=p.game,rk=rankInfo(p.xp),t=this.tab;

      const days=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');days.push({k,m:Math.round(((p.stats.daySecs||{})[k]||0)/60),wd:'SMDMDFS'[d.getDay()]})}
      const maxM=Math.max(10,...days.map(d=>d.m));
      const skillRows=Object.keys(SKILLS).map(id=>{const s=p.skills[id];if(!s)return `<div class="skill"><span class="lbl"><span>${esc(SKILLS[id].name)}</span></span><span class="small muted">noch nicht geübt</span><span></span></div>`;
        const v=Math.round(s.v),col=v<40?'var(--danger)':v<68?'var(--sun)':'var(--good)',tr=Skills.trend(id);
        return `<div class="skill"><span class="lbl"><span>${esc(SKILLS[id].name)}</span></span><span class="bar"><i style="width:${v}%;background:${col}"></i></span><span class="v">${v}${tr?`<small style="display:block;font-weight:400;color:${tr>0?'var(--good)':'var(--danger)'}">${tr>0?'+':''}${tr}</small>`:''}</span></div>`}).join('');
      body=`<div class="card">
        <div class="stats">
          <div class="stat"><b>${mins}</b><span>Minuten gespielt</span></div>
          <div class="stat"><b>${p.streak.count}</b><span>Tage in Folge (${p.stats.days} gesamt)</span></div>
          <div class="stat"><b>${lessonsDone}/${LESSONS.length}</b><span>Lektionen geschafft</span></div>
          <div class="stat"><b>${p.stats.puzzlesOk}</b><span>Rätsel gelöst (${rate} % sofort)</span></div>
          <div class="stat"><b>${g.w}–${g.d}–${g.l}</b><span>Siege, Remis, Niederlagen gegen Rokko</span></div>
          <div class="stat"><b>${g.level}</b><span>Rokkos Stärke von 10 (${esc(LEVELS[g.level].name)})</span></div>
        </div></div>
      <div class="card"><h2>Rokkos Einschätzung</h2>
        ${ins.length?ins.map(o=>`<div class="insight"><span class="dotc" style="background:${o.c}"></span><div style="flex:1;min-width:0"><div>${esc(o.t)}</div>${o.train||o.trainSkill?`<button class="big ghost" style="min-height:40px;font-size:.95rem;margin-top:6px" data-train="${o.train||''}" data-tskill="${o.trainSkill||''}">${ICON.target} Jetzt üben</button>`:''}</div></div>`).join('')
        :`<p class="muted" style="margin:8px 0 0">Noch zu wenig gespielt. Nach ein paar Lektionen und Partien zeigt Rokko hier, was gut klappt und was ihr üben solltet.</p>`}
      </div>
      <div class="card"><h2>Spielzeit, 14 Tage</h2>
        <svg viewBox="0 0 280 110" style="width:100%;margin-top:10px" role="img" aria-label="Minuten pro Tag">
          <line x1="0" y1="90" x2="280" y2="90" stroke="var(--line)"/>
          ${days.map((d,i)=>{const h=d.m/maxM*76,x=i*20+3;return `<rect x="${x}" y="${90-h}" width="14" height="${Math.max(h,d.m?2:0)}" rx="3" fill="${d.k===today()?'var(--sun)':'var(--peter)'}"/><text x="${x+7}" y="104" font-size="9" text-anchor="middle" fill="var(--muted)">${d.wd}</text>${d.m?`<text x="${x+7}" y="${86-h}" font-size="8.5" text-anchor="middle" fill="var(--ink)">${d.m}</text>`:''}`}).join('')}
        </svg>${p.settings.dayLimit?`<p class="small muted" style="margin:6px 0 0">Spielzeit-Wecker: ${p.settings.dayLimit} Minuten pro Tag.</p>`:''}</div>
      <div class="card"><h2>Fähigkeiten</h2><p class="small muted" style="margin:4px 0 0">0 bis 100. Die kleine Zahl zeigt die Veränderung der letzten zwei Wochen.</p><div class="skills">${skillRows}</div></div>`;
    }
    if(t==='games'){
      body=`<div class="card"><h2>Alle Partien</h2>
        ${p.games.length?`<ul class="gamelist">${p.games.slice(0,40).map((gm,i)=>{const d=new Date(gm.date);const col=gm.result==='w'?'var(--good)':gm.result==='b'?'var(--danger)':'var(--muted)';const lab=gm.result==='w'?'S':gm.result==='b'?'N':gm.result==='d'?'R':'–';
          const bad=gm.events.filter(e=>/blunder|missed/.test(e.kind)).length,good=gm.events.filter(e=>/good|castle|fork|saved/.test(e.kind)).length;
          const vn=gm.variant==='pawns'?'Bauernschlacht':gm.variant==='family'?'Familienpartie'+(gm.opp?' gegen '+esc(gm.opp):''):'Gegen Rokko';
          return `<li><button data-game="${i}"><span class="res" style="background:${col}">${lab}</span><span class="meta"><b>${vn} · ${d.toLocaleDateString('de-DE',{day:'numeric',month:'short'})}</b><span>${Math.ceil(gm.plies/2)} Züge${gm.variant==='family'?'':' · Stärke '+gm.level} · ${good} gute Momente · ${bad} Fehler</span></span>${ICON.next.replace('<svg','<svg width="20" height="20"')}</button></li>`}).join('')}</ul>`:'<p class="muted" style="margin:8px 0 0">Noch keine Partie gespielt.</p>'}
        <p class="small muted" style="margin:10px 0 0">Antippen zum Nachspielen. Rokko zeigt wichtige Momente und bessere Züge mit einem gelben Pfeil.</p></div>`;
    }
    if(t==='settings'){
      const voices=Voice.list();
      body=`<div class="card"><h2>Rokko</h2>
        <div class="setting" style="flex-wrap:wrap"><div><label for="voiceSel">Stimme</label><small>Stimmen mit ★ klingen am natürlichsten.</small></div>
          <div class="voice-row" style="width:100%"><select class="field" id="voiceSel">${voices.length?voices.map(v=>`<option value="${esc(v.id)}" ${v.id===p.settings.voice?'selected':''}>${esc(v.name)}${v.good?' ★':''}</option>`).join(''):'<option value="">Standardstimme</option>'}</select><button class="big go" style="min-height:50px" data-act="testvoice">Probe</button></div></div>
        ${Parents.naturalRow()}
        <div class="setting"><div><label for="rate">Sprechtempo</label><small>${p.settings.speechRate<0.95?'langsam':p.settings.speechRate>1.05?'schnell':'normal'}</small></div><input type="range" id="rate" min="0.8" max="1.2" step="0.05" value="${p.settings.speechRate||1}" style="width:140px"></div>
        <div class="setting"><div><label for="sHands">Zuhören nach jedem Zug</label><small>${Ears.available()?'Rokko hört automatisch zu, wenn das Kind dran ist.':'Auf diesem Gerät nur mit der iPhone-App möglich.'}</small></div><input type="checkbox" class="toggle" id="sHands" ${p.settings.handsFree?'checked':''}></div>
        ${Brain.fn?`<div class="setting"><div><label for="sAi">Rokko plaudert frei</label><small>Claude formuliert Rokkos Sätze in Partien und beantwortet Fragen.</small></div><input type="checkbox" class="toggle" id="sAi" ${p.settings.ai?'checked':''}></div>`:''}
        <div class="setting"><div><label for="sSound">Töne und Stimme</label></div><input type="checkbox" class="toggle" id="sSound" ${p.settings.sound?'checked':''}></div>
        <div class="setting"><div><label for="sNames">Feldnamen auf dem Brett</label><small>Hilft beim Lernen der Koordinaten.</small></div><input type="checkbox" class="toggle" id="sNames" ${p.settings.names?'checked':''}></div>

      <div class="card"><h2>Spielzeit</h2>

          <div class="seg seg5" style="width:100%">${[0,15,20,30,45].map(m=>`<button data-limit="${m}" aria-pressed="${(p.settings.dayLimit||0)===m}">${m?m+' Min':'Aus'}</button>`).join('')}</div></div>
        <div class="setting"><div><label for="famName">Familienpartie: Gegner</label><small>So nennt Rokko den Gegner am Brett.</small></div><input class="field" id="famName" maxlength="16" value="${esc(p.settings.familyName||'')}" placeholder="Papa" style="max-width:140px"></div>
      </div>
      <div class="card"><h2>Profil</h2>
        <div class="setting"><div><label>${esc(p.name)}</label><small>Level ${rk.lvl} · ${esc(rk.title)}</small></div><button class="big ghost" style="min-height:44px;font-size:1rem" data-act="editprofile">Ändern</button></div>
        <div class="setting"><div><label>Neues Profil</label><small>Für Geschwister: jedes Kind hat eigenen Fortschritt.</small></div><button class="big ghost" style="min-height:44px;font-size:1rem" data-act="newprofile">Anlegen</button></div>
        <div class="setting"><div><label>Fortschritt zurücksetzen</label><small>Löscht alles von ${esc(p.name)}.</small></div><button class="big ghost" style="min-height:44px;font-size:1rem;color:var(--danger)" data-act="reset">Zurücksetzen</button></div>

      </div>
      <div class="card"><h2>Hilfe bei Problemen</h2>

        <details style="margin-top:10px"><summary>Protokoll ansehen (${Diag.list().length} Einträge)</summary><pre class="diaglog" id="diagLog">${esc(Diag.text())}</pre></details>

        <p class="small muted" style="margin:8px 0 0">Version ${esc(window.ROKKO_VERSION||'')}</p>

    }
    return `<div class="view">
      <div class="phead"><button class="iconbtn" data-act="back" aria-label="Zurück">${ICON.back}</button><div style="flex:1;min-width:0"><h1>Für Eltern</h1><div class="small muted">${esc(p.name)} · Level ${rk.lvl}</div></div><span class="avatar">${avatarSVG(p.avatar)}</span></div>

  mount(el){
    el.addEventListener('click',e=>{audioUnlock();const a=e.target.closest('[data-act]');const p=P();
      const pt=e.target.closest('[data-ptab]');if(pt){this.tab=pt.dataset.ptab;sfx.tap();UI.go('parents');return}
      const lm=e.target.closest('[data-limit]');if(lm){p.settings.dayLimit=+lm.dataset.limit;save();$$('[data-limit]',el).forEach(x=>x.setAttribute('aria-pressed',String(x===lm)));sfx.tap();return}
      const gb=e.target.closest('[data-game]');if(gb){this.replay(p.games[+gb.dataset.game]);return}
      const tr=e.target.closest('[data-train]');if(tr){if(tr.dataset.tskill)trainingForSkill(tr.dataset.tskill)();else startTraining(tr.dataset.train);return}
      if(!a)return;const act=a.dataset.act;
      if(act==='back')UI.go('me');
