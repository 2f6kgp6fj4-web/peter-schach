/* ---------- Sprache verstehen ---------- */
const NUMW={eins:1,ein:1,eine:1,einz:1,zwei:2,zwo:2,drei:3,vier:4,'fünf':5,fuenf:5,funf:5,sechs:6,sieben:7,acht:8};
const LETW={a:'a',ah:'a',aa:'a',b:'b',be:'b',bee:'b',c:'c',ce:'c',zeh:'c',tse:'c',ze:'c',see:'c',d:'d',de:'d',dee:'d',e:'e',eh:'e',ee:'e',f:'f',ef:'f',eff:'f',g:'g',ge:'g',geh:'g',gay:'g',h:'h',ha:'h',hah:'h',haa:'h'};
const PIECEW=[[/^(bauer|bauern|bäuerchen|bauerchen|bauers)$/,'p'],[/^(springer|springers|pferd|pferdchen|pferdes|rössel|roessel|rössl|ross|pony|springa)$/,'n'],[/^(läufer|laeufer|laufer|leufer|läufers|läuferin)$/,'b'],[/^(turm|türme|tuerme|turme|turms|thurm)$/,'r'],[/^(dame|damen|königin|koenigin|konigin)$/,'q'],[/^(könig|koenig|konig|königs)$/,'k']];
function parseSpeech(raw){
  const s=(' '+String(raw||'').toLowerCase()+' ').replace(/[.,!?;:–—\-_/"'„“()]/g,' ').replace(/\s+/g,' ');
  const tokens=s.trim().split(' ').filter(Boolean);
  const out={squares:[],piece:null,castle:null,promo:null,cmd:null,text:raw};
  for(let i=0;i<tokens.length;i++){
    const tok=tokens[i];let mm;
    if((mm=tok.match(/^([a-h])([1-8])$/))){out.squares.push(mm[1]+mm[2]);continue}
    if((mm=tok.match(/^([a-h][1-8])([a-h][1-8])$/))){out.squares.push(mm[1],mm[2]);continue}
    if(LETW[tok]&&i+1<tokens.length){const nx=tokens[i+1];const n=/^[1-8]$/.test(nx)?+nx:NUMW[nx];if(n){out.squares.push(LETW[tok]+n);i++;continue}}
    for(const [re,pc] of PIECEW){if(re.test(tok)){if(/^(wird|zur|zum|umwandeln|umwandlung|in)$/.test(tokens[i-1]||''))out.promo=pc;else if(!out.piece)out.piece=pc;break}}
  }
  if(/rochade|rochier/.test(s))out.castle=/kurz/.test(s)?'k':/lang/.test(s)?'q':'any';
  if(!out.squares.length&&!out.castle){
    if(/zurück|zurueck|rückgängig|rueckgaengig|zurücknehmen/.test(s))out.cmd='undo';
    else if(/^ ?(ja|jo|jap|jawohl|ok|okay|gerne|bitte|klar) /.test(s))out.cmd='yes';
    else if(/^ ?(nein|nee|ne|nö|weiter|lass) /.test(s))out.cmd='no';
    else if(/tipp|tip |hilfe|hilf mir|was soll ich/.test(s))out.cmd='hint';
    else if(/neues spiel|von vorne|von vorn|nochmal spielen|noch mal spielen|neu anfangen/.test(s))out.cmd='new';
    else if(/wiederhol|nochmal sagen|noch mal sagen|was hast du gesagt|nicht verstanden|was hast du gezogen|wohin hast du|welchen zug|was war dein zug/.test(s))out.cmd='repeat';
    else if(/aufhören|aufhoeren|stopp|stop|pause|hör auf/.test(s))out.cmd='stop';
  }
  return out;
}
function pickPromo(c,promo){return c.find(m=>m.promo===(promo||'q'))||c[0]}
function resolveMove(pos,r,pendingFrom){
  const legal=pos.legal();
  if(r.castle){
    const c=legal.filter(m=>m.flag==='k'||m.flag==='q');
    const want=r.castle==='any'?c:c.filter(m=>m.flag===r.castle);
    if(want.length===1)return{move:want[0]};
    if(want.length>1)return{error:'Kurze oder lange Rochade?'};
    return{error:'Eine Rochade geht gerade nicht. König und Turm dürfen noch nicht gezogen haben, dazwischen muss alles frei sein, und dein König darf nicht im Schach stehen.'};
  }
  const sq=r.squares.map(sqIdx);
  if(sq.length>=2){
    const f=sq[0],t=sq[1];const c=legal.filter(m=>m.from===f&&m.to===t);
    if(c.length)return{move:pickPromo(c,r.promo)};
    const p=pos.board[f];
    if(!p||p[0]!==pos.turn)return{error:`Auf ${SQ(f)} steht keine Figur von dir.`};
    return{error:`${cap1(NOM_DEIN[p[1]])} auf ${SQ(f)} kann nicht nach ${SQ(t)} ziehen.`,show:f,illegalPiece:p[1]};
  }
  if(sq.length===1){
    const t=sq[0];
    if(pendingFrom!=null&&pendingFrom>=0){const c=legal.filter(m=>m.from===pendingFrom&&m.to===t);if(c.length)return{move:pickPromo(c,r.promo)}}
    let c=legal.filter(m=>m.to===t);
    if(r.piece)c=c.filter(m=>m.piece===r.piece);
    if(!c.length){
      const p=pos.board[t];
      if(p&&p[0]===pos.turn&&(!r.piece||r.piece===p[1]))return legal.some(m=>m.from===t)?{select:t}:{error:`${cap1(NOM_DEIN[p[1]])} auf ${SQ(t)} kann gerade nirgendwohin.`};
      if(r.piece)return{error:`${cap1(NOM_DEIN[r.piece])} kann nicht nach ${SQ(t)} ziehen.`,illegalPiece:r.piece};
      return{error:`Keine deiner Figuren kann nach ${SQ(t)} ziehen.`};
    }
    if(!r.piece){const pw=c.filter(m=>m.piece==='p');if(pw.length)c=pw}
    const froms=[...new Set(c.map(m=>m.from))];
    if(froms.length===1)return{move:pickPromo(c,r.promo)};
    return{which:froms,to:t};
  }
  if(r.piece){
    const fr=[...new Set(legal.filter(m=>m.piece===r.piece).map(m=>m.from))];
    if(fr.length===1)return{select:fr[0]};
    if(!fr.length)return{error:`${cap1(NOM_DEIN[r.piece])} kann gerade nicht ziehen.`};
    return{error:`Welcher ${NAME[r.piece]}, und wohin? Sag zum Beispiel: ${NAME[r.piece]} nach ${SQ(legal.find(m=>m.piece===r.piece).to)}.`};
  }
  return{error:null};
}
function moveText(m){
  if(m.flag==='k')return 'O-O';if(m.flag==='q')return 'O-O-O';
  return (LETTER[m.piece]?LETTER[m.piece]+' ':'')+SQ(m.from)+(m.cap?' × ':' – ')+SQ(m.to)+(m.promo?' = '+LETTER[m.promo]:'');
}
function moveFacts(m,who){
  const mine=who==='peter';
  if(m.flag==='k'||m.flag==='q'){const r=mine?8:1;return `${m.flag==='k'?'kurze':'lange'} Rochade (König von E${r} nach ${m.flag==='k'?'G':'C'}${r}, Turm von ${m.flag==='k'?'H':'A'}${r} nach ${m.flag==='k'?'F':'D'}${r})`}
  let s=`${NAME[m.piece]} von ${SQ(m.from)} nach ${SQ(m.to)}`;
  if(m.flag==='e')s+=', schlägt en passant';else if(m.cap)s+=`, schlägt ${mine?'den':'Peters'} ${NAME[m.cap]}`;
  if(m.promo)s+=`, der Bauer wird zur ${m.promo==='q'?'Dame':NAME[m.promo]}`;
  return s;
}
function fbPeterMove(m){
  if(m.flag==='k')return pick(['So, ich mache die kurze Rochade. Mein König hüpft nach G8 und der Turm auf F8.','Ich verstecke meinen König: kurze Rochade! König nach G8, Turm nach F8.']);
  if(m.flag==='q')return 'Ich mache die lange Rochade. Mein König geht nach C8 und der Turm nach D8.';
  if(m.flag==='e')return `Achtung, Spezialtrick! Mein Bauer schlägt en passant und landet auf ${SQ(m.to)}. Nimm deinen Bauern daneben vom Brett.`;
  let t;
  if(m.cap)t=pick([`Hehe, erwischt! ${cap1(NOM_MEIN[m.piece])} von ${SQ(m.from)} schnappt sich ${ACC_DEIN[m.cap]} auf ${SQ(m.to)}.`,`Zack! Ich schlage mit ${DAT_MEIN[m.piece]} von ${SQ(m.from)} auf ${SQ(m.to)}. Nimm ${ACC_DEIN[m.cap]} bitte vom Brett.`]);
  else t=pick([`Okay, ich hab's! ${cap1(NOM_MEIN[m.piece])} geht von ${SQ(m.from)} nach ${SQ(m.to)}.`,`Ich nehme ${ACC_MEIN[m.piece]} von ${SQ(m.from)} und stelle ${PRON_A[m.piece]} auf ${SQ(m.to)}.`,`Hmm, lass mich mal … ja! ${cap1(NOM_MEIN[m.piece])} zieht von ${SQ(m.from)} nach ${SQ(m.to)}.`,`Jetzt bin ich dran: ${NAME[m.piece]} von ${SQ(m.from)} nach ${SQ(m.to)}.`]);
  if(m.promo)t+=` Und mein Bauer wird zur ${m.promo==='q'?'Dame':NAME[m.promo]}!`;
  return t;
}

/* ---------- Die Partie ---------- */
const Game={
  pos:null,played:[],keys:[],state:'idle',sel:-1,pending:null,hint:null,danger:[],flow:0,
  variant:'standard',lessonCb:null,events:[],tipsSaid:{},blunderCtx:null,board:null,newArmed:null,
  start(opt){
    opt=opt||{};
    this.lessonCb=opt.lessonCb||null;
    const cur=P().game.current;
    if(!opt.fresh&&cur&&cur.moves&&cur.moves.length&&(!opt.variant||opt.variant===cur.variant)){this.restore(cur)}
    else this.reset(opt.variant||'standard');
    if(P().game.current)P().game.current.lesson=opt.lesson||null;
    this.state=this.pos.turn==='w'?'human':'peter';
    UI.go('play');
    const my=++this.flow;
    if(this.played.length===0)setTimeout(()=>this.greet(my),250);
    else if(this.pos.turn==='b')this.peterTurn(my,{});
    else Peter.say(pick(['Weiter geht\'s! Du bist dran.','Da bist du ja wieder! Du bist am Zug.']),'smile').then(()=>this.autoListen(my));
  },
  reset(variant){
    this.variant=variant;this.pos=new Pos(variant==='pawns'?PAWNS_FEN:START_FEN);this.played=[];this.keys=[this.pos.key()];
    this.sel=-1;this.pending=null;this.hint=null;this.danger=[];this.events=[];this.tipsSaid={};this.startedAt=Date.now();
    P().game.current={variant,moves:[],events:[],level:P().game.level,started:Date.now()};save();
  },
  restore(cur){
    this.variant=cur.variant||'standard';this.pos=new Pos(this.variant==='pawns'?PAWNS_FEN:START_FEN);this.played=[];this.keys=[this.pos.key()];
    for(const u of cur.moves){const m=this.pos.legal().find(x=>sqName(x.from)+sqName(x.to)+(x.promo||'')===u);if(!m)break;m.color=this.pos.turn;this.pos.make(m);this.played.push(m);this.keys.push(this.pos.key())}
    this.events=cur.events||[];this.sel=-1;this.pending=null;this.hint=null;this.danger=[];this.tipsSaid={};this.startedAt=cur.started||Date.now();
  },
  persist(){const c=P().game.current||(P().game.current={});c.variant=this.variant;c.moves=this.played.map(m=>sqName(m.from)+sqName(m.to)+(m.promo||''));c.events=this.events;save()},
  async greet(my){
    const n=P().name;
    if(this.variant==='pawns'){await Peter.say(`Bauernschlacht! Du fängst an, ${n}. Sag mir deinen Zug oder tipp ihn auf dem Handy an.`,'smile')}
    else{
      Peter.show(`Hallo ${n}!`,'smile');
      const ai=await Brain.ask('Begrüße das Kind zum Spiel. Es spielt Weiß und fängt an. Es kann dir seinen Zug sagen oder auf dem Handy antippen. Höchstens drei kurze Sätze.',6000);
      if(my!==this.flow)return;
      await Peter.say(ai||pick([`Hallo ${n}! Ich bin bereit. Du spielst Weiß und fängst an. Sag mir deinen Zug!`,`Los geht's, ${n}! Mach deinen ersten Zug am Brett und sag ihn mir.`]),'smile');
    }
    this.autoListen(my);
  },
  /* ---------- Ansicht ---------- */
  render(){
    const s=P().settings,L=LEVELS[P().game.level];
    return `<div class="view">
      <div class="talkrow"><button class="peter" data-live data-mood="smile" data-act="peter" aria-label="Peter">${peterSVG(P().outfit)}</button>
      <div class="bubble"><p class="say" data-live aria-live="polite">${esc(Peter.last||'')}</p><button class="speak" id="earBtn" data-act="ear" aria-label="${Ears.available()?'Zuhören':'Nochmal vorlesen'}">${Ears.available()?ICON.mic:ICON.speaker}</button></div></div>
      <div class="card" id="soundHelp" hidden style="border-color:var(--sun)"><b>Peter ist stumm?</b> <span class="small">Lautstärke hochdrehen. Am iPhone den Stummschalter an der Seite auf „laut“ stellen.</span><div class="row" style="margin-top:8px"><button class="big sunbtn" data-act="testsound">Ton testen</button></div></div>
      <div class="status"><span class="turn" id="turnPill"><span class="dot"></span><span id="turnText"></span></span>
      <span class="chip" title="Peters Stärke">${pieceSVG('b',L.fig,'i')} ${esc(this.variant==='pawns'?'Bauernschlacht':L.name)}</span></div>
      <div id="gboard"></div>
      <div class="tray" id="trays"></div>
      <div class="card ask" id="ask" hidden><p id="askText"></p><div class="row"><button class="big dangerbtn" data-act="askyes">${ICON.undo} Zurück</button><button class="big ghost" data-act="askno">${ICON.play} Weiter</button></div></div>
      <div class="card center" id="endCard" hidden style="display:flex;flex-direction:column;gap:10px;border:3px solid var(--sun)"></div>
      <form class="voice-row" id="moveForm" autocomplete="off"><input id="moveInput" type="text" enterkeyhint="send" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Zug sagen oder tippen" aria-label="Dein Zug"><button class="big mic" type="button" data-act="mic" aria-label="Sprechen" ${Ears.available()?'':'hidden'}>${ICON.mic}</button><button class="big go" type="submit">Los</button></form>
      <p class="hint-line" id="heard">Figur antippen, dann das Ziel. Oder deinen Zug sagen.</p>
      <div class="actions">
        <button class="act" data-act="hint">${ICON.bulb}Tipp</button>
        <button class="act" data-act="undo">${ICON.undo}Zurück</button>
        <button class="act ${s.handsFree&&Ears.available()?'on':''}" data-act="hands" ${Ears.available()?'':'hidden'}>${ICON.ear}Zuhören</button>
        <button class="act" data-act="new" id="newBtn">${ICON.plus}<span>Neu</span></button>
        <button class="act" data-act="names">${ICON.grid}Namen</button>
      </div>
      <details class="card"><summary>Peters Stärke</summary>
        <div class="level-pick" style="margin-top:10px">${[1,2,3,4,5].map(n=>`<button class="rung" data-lvl="${n}" aria-pressed="${n===P().game.level}">${pieceSVG('b',LEVELS[n].fig,'i')}${esc(LEVELS[n].name)}</button>`).join('')}</div>
        <p class="small muted" style="margin:10px 0 0">Peter passt sich an: Nach zwei Siegen spielt er stärker, nach drei Niederlagen gemütlicher.</p>
      </details>
      <details class="card"><summary>Alle Züge</summary><ol id="mlist" style="margin:10px 0 0;padding-left:1.4em;columns:2;font-variant-numeric:tabular-nums"></ol></details>
    </div>`;
  },
  mount(el){
    this.board=new Board($('#gboard',el),{names:P().settings.names?true:'edge',onTap:sq=>this.onSquare(sq)});
    el.addEventListener('click',e=>{const a=e.target.closest('[data-act],[data-lvl]');if(!a)return;audioUnlock();
      if(a.dataset.lvl){this.setLevel(+a.dataset.lvl);return}
      const act=a.dataset.act;
      if(act==='peter'){Peter.bounce();sfx.boing();if(this.state!=='peter')Peter.say(pick(['Hihi, das kitzelt!','Ich freu mich, dass wir spielen!','Weißt du, wie der Springer springt? Wie ein L!','Denk dran: Schau immer, was ich angreife!']),'wow')}
      if(act==='ear'){if(Ears.available()){if(Ears.on)Ears.stop();else this.listenNow()}else Peter.repeat()}
      if(act==='mic')this.listenNow();
      if(act==='testsound'){sfx.star();Voice.speak('Hallo! Kannst du mich hören?')}
      if(act==='hint')this.giveHint();
      if(act==='undo')this.undo();
      if(act==='hands'){P().settings.handsFree=!P().settings.handsFree;save();a.classList.toggle('on',P().settings.handsFree);UI.toast(ICON.ear,P().settings.handsFree?'Peter hört nach jedem Zug zu.':'Zuhören nur auf Knopfdruck.');if(P().settings.handsFree)this.autoListen(this.flow)}
      if(act==='names'){P().settings.names=!P().settings.names;save();this.board.setNames(P().settings.names?true:'edge')}
      if(act==='new')this.askNew(a);
      if(act==='askyes')this.answerAsk(true);
      if(act==='askno')this.answerAsk(false);
      if(act==='again'){if(this.lessonCb)return;this.reset(this.variant);this.state='human';this.refresh();const my=++this.flow;this.greet(my)}
      if(act==='tomap'){UI.go('map')}
    });
    $('#moveForm',el).addEventListener('submit',e=>{e.preventDefault();audioUnlock();const v=$('#moveInput').value;$('#moveInput').value='';this.handleText(v)});
    this.refresh();
    if(this.state==='over')this.showEnd(this.lastResult||{});
  },
  unmount(){Ears.stop()},
  refresh(){
    if(!this.board||!document.body.contains(this.board.el))return;
    const pos=this.pos,last=this.played[this.played.length-1];
    const targets=this.sel>=0&&this.state==='human'?pos.legal().filter(m=>m.from===this.sel):[];
    this.board.clearMarks();this.board.setPos(pos);
    this.board.mark('last',last?[last.from,last.to]:[]).mark('sel',this.sel>=0?[this.sel]:[]).mark('dot',targets.filter(m=>!m.cap).map(m=>m.to)).mark('ring',targets.filter(m=>m.cap).map(m=>m.to))
      .mark('check',pos.inCheck()?[pos.kings[pos.turn]]:[]).mark('danger',this.danger).mark('which',this.pending&&this.pending.type==='which'?this.pending.froms:[]);
    const ar=[];if(last&&last.color==='b')ar.push({from:last.from,to:last.to});if(this.hint)ar.push({from:this.hint.from,to:this.hint.to,kind:'hint'});
    this.board.arrows(ar).render();
    const capW=[],capB=[];for(const m of this.played){if(m.cap)(m.color==='w'?capW:capB).push(m.cap)}
    const ord='qrbnp',srt=a=>a.sort((x,y)=>ord.indexOf(x)-ord.indexOf(y));
    const tr=$('#trays');if(tr)tr.innerHTML=(capW.length?`<span>Du hast:</span>${srt(capW).map(c=>pieceSVG('b',c,'i')).join('')}`:'')+(capB.length?`<span style="margin-left:auto">Peter hat:</span>${srt(capB).map(c=>pieceSVG('w',c,'i')).join('')}`:'');
    const ml=$('#mlist');if(ml){let h='';for(const m of this.played)h+=`<li>${moveText(m)}</li>`;ml.innerHTML=h}
    const pill=$('#turnPill'),tt=$('#turnText');if(!pill)return;
    pill.classList.remove('peter-turn');
    if(this.state==='peter'){pill.classList.add('peter-turn');tt.textContent='Peter überlegt …'}
    else if(this.state==='over')tt.textContent='Spiel vorbei';
    else if(this.state==='ask')tt.textContent='Zurücknehmen?';
    else if(this.sel>=0&&pos.board[this.sel]){tt.innerHTML=`${pieceSVG('w',pos.board[this.sel][1],'i')} ${NAME[pos.board[this.sel][1]]}: wohin?`}
    else if(last&&last.color==='b'){pill.classList.add('peter-turn');tt.innerHTML=`Peter: ${pieceSVG('b',last.piece,'i')} ${last.flag==='k'?'kurze Rochade':last.flag==='q'?'lange Rochade':SQ(last.from)+' → '+SQ(last.to)}`}
    else tt.textContent='Du bist dran!';
  },
  /* ---------- Zuhören ---------- */
  autoListen(my){
    if(my!==this.flow||this.state==='peter'||this.state==='over')return;
    if(P().settings.handsFree&&Ears.available()&&UI.current==='play')this.listenNow();
  },
  listenNow(){
    if(!Ears.available())return;
    Ears.listen((text,alts)=>{
      const good=(alts||[]).find(a=>{const r=parseSpeech(a);return r.squares.length||r.castle||r.cmd})||text;
      Ears.stop();this.handleText(good);
    });
  },
  /* ---------- Eingaben ---------- */
  onSquare(i){
    if(this.state!=='human'){if(this.state==='peter')Peter.say(pick(['Moment, ich überlege noch!','Pssst, ich denke gerade nach!']),'think');return}
    const pos=this.pos,p=pos.board[i];
    if(this.pending&&this.pending.type==='which'&&this.pending.froms.includes(i)){const c=pos.legal().filter(m=>m.from===i&&m.to===this.pending.to);if(c.length)return this.humanMove(pickPromo(c))}
    if(this.sel>=0){
      const c=pos.legal().filter(m=>m.from===this.sel&&m.to===i);
      if(c.length)return this.humanMove(pickPromo(c));
      if(!(p&&p[0]==='w')){
        const pt=pos.board[this.sel][1];const pseudo=pos.pseudoFrom(this.sel).some(m=>m.to===i);
        this.board.flash(i,'bad');sfx.nope();
        if(pseudo)Peter.say('Vorsicht! Dann wäre dein König im Schach.','worry');
        else{Peter.say(pick([`So kann ${ART[pt]} ${NAME[pt]} nicht ziehen.`,`Da kann ${ART[pt]} ${NAME[pt]} nicht hin.`]),'think');this.illegal(pt)}
        return;
      }
    }
    if(p&&p[0]==='w'){
      if(this.sel===i){this.sel=-1;this.pending=null;this.refresh();return}
      this.sel=i;this.pending={type:'from',from:i};this.hint=null;sfx.select();this.refresh();
      if(!pos.legal().some(m=>m.from===i)){this.board.flash(i,'shake');Peter.say(`${cap1(NOM_DEIN[p[1]])} kann gerade nicht ziehen.`,'think')}
      return;
    }
    if(p&&p[0]==='b'){this.board.flash(i,'shake');sfx.nope();Peter.say(pick(['Hey, das ist meine Figur!','Hihi, die gehört mir!']),'wow');return}
    this.sel=-1;this.pending=null;this.refresh();
  },
  illegal(piece){Skills.record('move_'+piece,false,.35);this.events.push({ply:this.played.length,kind:'illegal',piece,text:`Versuchter Zug, den ${ART[piece]==='die'?'die':'der'} ${NAME[piece]} nicht kann`});this.persist()},
  async handleText(raw){
    raw=String(raw||'').trim();if(!raw)return;
    const hd=$('#heard');if(hd)hd.textContent='Gehört: „'+raw+'“';
    const r=parseSpeech(raw);const my=this.flow;
    if(this.state==='ask'){if(r.cmd==='yes'||r.cmd==='undo')return this.answerAsk(true);if(r.cmd==='no')return this.answerAsk(false);await Peter.say('Sag einfach Ja oder Nein.');return this.autoListen(my)}
    if(r.cmd==='repeat'){await Peter.repeat();return this.autoListen(my)}
    if(r.cmd==='stop'){Ears.stop();P().settings.handsFree=false;save();return Peter.say('Okay, ich höre erst wieder zu, wenn du auf das Mikrofon tippst.')}
    if(r.cmd==='new')return this.newGame();
    if(this.state==='over'){if(r.cmd==='yes')return this.newGame();return Peter.say('Sag „Neues Spiel“, dann spielen wir nochmal!')}
    if(this.state!=='human')return Peter.say('Moment, ich überlege noch!','think');
    if(r.cmd==='hint')return this.giveHint();
    if(r.cmd==='undo')return this.undo();
    if(r.squares.length||r.castle||r.piece){
      const res=resolveMove(this.pos,r,this.pending&&this.pending.type==='from'?this.pending.from:null);
      if(res.move)return this.humanMove(res.move);
      if(this.pending&&this.pending.type==='which'&&r.squares.length===1){const f=sqIdx(r.squares[0]);const c=this.pos.legal().filter(m=>m.from===f&&m.to===this.pending.to);if(c.length)return this.humanMove(pickPromo(c,r.promo))}
      if(res.select!=null){this.sel=res.select;this.pending={type:'from',from:this.sel};this.hint=null;sfx.select();this.refresh();const pt=this.pos.board[this.sel][1];await Peter.say(pick([`Und wohin soll ${ART[pt]} ${NAME[pt]}? Die Punkte zeigen es dir.`,'Gute Wahl! Und wohin damit?']),'smile');return this.autoListen(my)}
      if(res.which){this.pending={type:'which',froms:res.which,to:res.to};this.sel=-1;this.refresh();await Peter.say('Da können mehrere Figuren hin. Welche meinst du? Sag mir, wo sie steht, oder tipp sie an.','think');return this.autoListen(my)}
      sfx.nope();
      if(res.illegalPiece)this.illegal(res.illegalPiece);
      if(res.error){if(res.show!=null){this.sel=res.show;this.pending={type:'from',from:this.sel};this.refresh();this.board.flash(res.show,'shake')}
        await Peter.say('Oh, '+res.error.charAt(0).toLowerCase()+res.error.slice(1)+' Stell die Figur bitte wieder zurück.','worry');return this.autoListen(my)}
    }
    if(Brain.on()){
      Peter.show('Peter überlegt …','think');
      const pcs=c=>this.pos.pieces(c).map(p=>NAME[p.type]+' '+SQ(p.sq)).join(', ');
      const ans=await Brain.ask(`Das Kind sagt oder fragt gerade: ${raw}\nAntworte in höchstens drei kurzen Sätzen. Wenn es einen Schachzug meint, den du nicht sicher verstehst, sag ihm freundlich, wie es ihn sagen kann, zum Beispiel: Springer nach F3. Erfinde keine Züge.\nStellung – Weiß: ${pcs('w')}. Schwarz: ${pcs('b')}.`,9000);
      if(ans){await Peter.say(ans,'smile');return this.autoListen(my)}
    }
    await Peter.say(pick(['Hmm, das habe ich nicht verstanden. Sag zum Beispiel: Bauer nach E4.','Oh, das hab ich nicht kapiert. Versuch mal: Springer nach F3.']),'think');
    this.autoListen(my);
  },
  /* ---------- Alexanders Zug analysieren ---------- */
  analyzeKid(m,before){
    const pos=this.pos,ply=this.played.length-1,mv=Math.floor(ply/2)+1,ev=[];
    let warn=null,comment=null,mood='smile',star=false;
    const add=(kind,text,extra)=>ev.push({ply,kind,text,move:moveText(m),...(extra||{})});
    Skills.record('move_'+m.piece,true,.06);
    if(this.variant==='pawns'){
      const passer=m.to>>4>=5;if(passer){comment=pick(['Uii, dein Bauer kommt näher!','Dein Bauer marschiert nach vorne!']);mood='wow'}
      return{warn,comment,mood,star,ev};
    }
    /* Matt verpasst oder gefunden */
    if(before.mates.length){
      if(pos.isMate()){add('goodMate','Schachmatt gesetzt');Skills.record('mate',true,1)}
      else{add('missedMate',`Matt in 1 übersehen (${moveText(before.mates[0])})`,{best:sqName(before.mates[0].from)+sqName(before.mates[0].to)});Skills.record('mate',false,1);comment=`Oh! Mit ${moveText(before.mates[0])} hättest du mich schachmatt gesetzt!`;mood='wow'}
    }
    /* freie Figur gesehen oder übersehen */
    const fc=before.free.filter(x=>VAL[x.cap]>=300);
    if(fc.length&&!pos.isMate()){
      const took=fc.some(x=>x.from===m.from&&x.to===m.to);
      if(took){add('goodCapture',`Freie Figur geschlagen (${NAME[m.cap]})`);Skills.record('capture',true,1);star=true;comment=comment||`Adlerauge! Du hast ${ACC_MEIN[m.cap]} geschnappt.`;mood='wow'}
      else if(!(m.cap&&VAL[m.cap]>=VAL[fc[0].cap])){add('missedCapture',`Freie Figur übersehen: ${NAME[fc[0].cap]} auf ${SQ(fc[0].to)}`,{best:sqName(fc[0].from)+sqName(fc[0].to)});Skills.record('capture',false,1);comment=comment||`Psst: ${cap1(NOM_MEIN[fc[0].cap])} auf ${SQ(fc[0].to)} stand ganz allein. Den hättest du schlagen können!`.replace('Den hättest',fc[0].cap==='q'?'Die hättest':'Den hättest');mood='wow'}
    }
    /* Bedrohte Figur gerettet oder nicht */
    const after=threatsAgainst(pos,'w').filter(h=>h.value>=300);
    const fair=m.cap&&VAL[m.cap]>=VAL[m.piece];
    const mateThreat=!pos.isMate()&&mateInOne(pos);
    if(before.threat.length){
      const still=after.filter(h=>before.threat.some(t=>t.sq===h.sq));
      if(!still.length&&!(m.cap&&VAL[m.cap]>=before.threat[0].value)){add('saved','Bedrohte Figur gerettet');Skills.record('protect',true,.8)}
    }
    const newHang=after.find(h=>!(h.sq===m.to&&fair)&&!(m.cap&&VAL[m.cap]>=h.value));
    if(mateThreat){warn={text:'Uh-oh! Jetzt könnte ich dich mit einem einzigen Zug schachmatt setzen!',sqs:[mateThreat.from,mateThreat.to],fact:`Peter könnte jetzt mit ${moveFacts(mateThreat,'peter')} mattsetzen.`};add('blunderMate','Matt in 1 für Peter zugelassen');Skills.record('protect',false,1)}
    else if(newHang){warn={text:`Oh oh! ${cap1(NOM_DEIN[newHang.piece])} auf ${SQ(newHang.sq)} ist in Gefahr. ${cap1(NOM_MEIN[newHang.byPiece])} auf ${SQ(newHang.by)} könnte ${PRON_A[newHang.piece]} schlagen.`,sqs:[newHang.sq,newHang.by],fact:`${NAME[newHang.piece]} auf ${SQ(newHang.sq)} kann von Peters ${NAME[newHang.byPiece]} auf ${SQ(newHang.by)} geschlagen werden.`};
      add('blunder',`${NAME[newHang.piece]} auf ${SQ(newHang.sq)} ungeschützt gelassen`,{piece:newHang.piece});Skills.record('protect',false,1)}
    if(before.check)Skills.record('escape',true,.5);
    /* Eröffnung und Spezialzüge */
    if(m.flag==='k'||m.flag==='q'){add('castle','Rochiert');Skills.record('opening',true,1);P().stats.castled++;star=true;comment=comment||'Rochade! Klasse, jetzt ist dein König schön sicher.'}
    else if(m.piece==='q'&&mv<=4&&!m.cap){add('earlyQueen','Dame sehr früh gezogen');Skills.record('opening',false,.5);if(!this.tipsSaid.queen){this.tipsSaid.queen=1;comment=comment||'Kleiner Tipp: Die Dame lieber noch nicht so früh rausholen, sonst muss sie ständig weglaufen.';mood='think'}}
    else if(mv===1&&m.piece==='p'&&((m.to&7)===3||(m.to&7)===4)){Skills.record('opening',true,.6);comment=comment||'Prima, ein Bauer in die Mitte! So fangen Profis an.';star=true}
    else if(mv<=8&&(m.piece==='n'||m.piece==='b')&&(m.from>>4)===0){Skills.record('opening',true,.3);if(!this.tipsSaid['dev'+m.from]){this.tipsSaid['dev'+m.from]=1;comment=comment||`Gut so, ${NOM_DEIN[m.piece]} kommt ins Spiel!`}}
    else if(m.piece==='k'&&mv<=10&&!before.check){Skills.record('opening',false,.4);if(!this.tipsSaid.king){this.tipsSaid.king=1;comment=comment||'Kleiner Tipp: Den König schützt du am besten mit der Rochade.';mood='think'}}
    if(m.promo){P().stats.promos++;add('promo','Bauer umgewandelt');comment=comment||'Juhu, dein Bauer ist jetzt eine Dame!';star=true}
    /* Gabel */
    if(!pos.isMate()&&!pos.attacked(m.to,'b')){const tg=Trainer.forkTargets(pos,m.to);if(tg.length>=2){add('fork','Gabel gespielt');Skills.record('fork',true,1);P().stats.forks++;comment=`Gabel! Du greifst zwei Figuren gleichzeitig an!`;mood='wow';star=true}}
    if(pos.inCheck()&&!pos.isMate()&&!comment){comment=pick(['Uiii, Schach! Mein König muss weglaufen.','Schach! Stark!']);mood='wow'}
    if(m.cap){P().stats.captures++;if(!comment&&VAL[m.cap]>=300){comment=`Oh nein, ${NOM_MEIN[m.cap]}! Gut geschlagen.`;mood='wow'}}
    return{warn,comment,mood,star,ev};
  },
  async humanMove(m){
    const my=++this.flow;Ears.stop();Voice.stop();
    const pos=this.pos;
    const before={mates:this.variant==='pawns'?[]:allMatesInOne(pos),free:this.variant==='pawns'?[]:Trainer.freeCaptures(pos),threat:this.variant==='pawns'?[]:threatsAgainst(pos,'w').filter(h=>h.value>=300),check:pos.inCheck()};
    pos.make(m);m.color='w';this.played.push(m);this.keys.push(pos.key());
    this.sel=-1;this.pending=null;this.hint=null;this.danger=[];
    this.refresh();this.board.animate(m.from,m.to);
    m.cap?sfx.capture():sfx.move();
    const a=this.analyzeKid(m,before);
    this.events.push(...a.ev);this.persist();
    if(a.star){P().stars++;Rewards.addXP(5);sfx.star();Peter.bounce();save()}
    const st=this.status();if(st)return this.endGame(st,m);
    if(a.warn&&P().game.level<=3){
      this.state='ask';this.danger=a.warn.sqs;this.refresh();sfx.bad();this.blunderCtx={flow:my,warn:a.warn};
      $('#askText').textContent='Willst du den Zug zurücknehmen?';$('#ask').hidden=false;
      Peter.show('…','worry');
      const ai=await Brain.ask(`Das Kind hat gerade gezogen: ${moveFacts(m,'kid')}.\nGefahr: ${a.warn.fact}\nWarne es lieb und aufgeregt in ein bis zwei kurzen Sätzen, nenne die Felder, und frag dann, ob es den Zug lieber zurücknehmen möchte. Es soll Ja oder Nein sagen.`,4500,t=>/\?/.test(t));
      if(my!==this.flow||this.state!=='ask')return;
      await Peter.say(ai?ai+' Roter Knopf heißt zurück.':a.warn.text+' Willst du den Zug lieber zurücknehmen? Dann tipp auf den roten Knopf.','worry');
      return this.autoListen(my);
    }
    await this.peterTurn(my,{m,kidFb:a.warn?a.warn.text:a.comment,mood:a.warn?'worry':a.mood,kidFact:a.warn?a.warn.fact:a.comment});
  },
  async answerAsk(yes){
    if(this.state!=='ask')return;
    $('#ask').hidden=true;this.danger=[];
    const ctx=this.blunderCtx;this.blunderCtx=null;
    if(yes){
      this.flow++;const m=this.pos.unmake();this.played.pop();this.keys.pop();
      this.events.push({ply:this.played.length,kind:'takeback',text:'Zug nach Peters Warnung zurückgenommen'});this.persist();
      this.state='human';this.refresh();
      await Peter.say(pick([`Gute Entscheidung! Stell ${ACC_DEIN[m.piece]} zurück nach ${SQ(m.from)} und schau nochmal ganz genau.`,`Okay! ${cap1(NOM_DEIN[m.piece])} geht zurück nach ${SQ(m.from)}. Überleg nochmal in Ruhe.`]),'smile');
      return this.autoListen(this.flow);
    }
    if(!ctx||ctx.flow!==this.flow)return;
    await this.peterTurn(this.flow,{kidFb:'Okay, du bist mutig!',kidFact:'Das Kind wollte den Zug trotz Warnung nicht zurücknehmen. Sag kurz okay, mutig.'});
  },
  /* ---------- Peters Zug ---------- */
  async peterTurn(my,ctx){
    this.state='peter';Peter.mood('think');this.refresh();
    const t0=Date.now();await sleep(30);
    const pos=this.pos,lvl=P().game.level;
    const m=this.variant==='pawns'?choosePawnMove(pos,lvl):chooseMove(pos,lvl);
    if(!m)return;
    pos.make(m);
    const check=pos.inCheck(),st=this.status();let warn=null,look=false;
    if(!check&&!st&&this.variant!=='pawns'){
      const h=threatsAgainst(pos,'w').find(h=>h.value>=(lvl===1?100:300));
      if((lvl<=2||(lvl===3&&Math.random()<.5))&&h)warn=h;
      else if(lvl<=2){const f=Trainer.freeCaptures(pos).filter(x=>VAL[x.cap]>=300);if(f.length&&Math.random()<.6)look=true}
    }
    pos.unmake();
    const first=!this.tipsSaid.board;this.tipsSaid.board=1;
    const facts=[];
    if(ctx.m)facts.push(`Das Kind hat gerade gezogen: ${moveFacts(ctx.m,'kid')}.`);
    if(ctx.kidFact)facts.push(`Dazu: ${ctx.kidFact}`);
    facts.push(`Dein Gegenzug, den du jetzt ansagen musst: ${moveFacts(m,'peter')}.`);
    if(check)facts.push('Dein Zug gibt Schach! Sag laut Schach und dass das Kind seinen König retten muss.');
    if(warn)facts.push(`Warne kurz: Dein ${NAME[warn.byPiece]} auf ${SQ(warn.by)} greift den ${NAME[warn.piece]} auf ${SQ(warn.sq)} an.`);
    if(look)facts.push('Gib den Hinweis, genau hinzuschauen, ob es etwas von dir schlagen kann. Verrate nicht was.');
    if(first)facts.push('Bitte das Kind, deinen Zug auch auf dem echten Brett zu machen.');
    if(st)facts.push('Mit diesem Zug ist das Spiel vorbei: '+(st.t==='mate'||st.t==='pawns'?'du hast gewonnen. Sei ganz lieb und tröstend.':'unentschieden.'));
    const aiP=Brain.ask(`${facts.join('\n')}\nSag das jetzt in zwei bis drei kurzen, lebendigen Sätzen (höchstens 40 Wörter). Reagiere zuerst kurz auf den Zug des Kindes, dann sag deinen Zug genau mit Figur, Startfeld und Zielfeld an.`,5000,
      txt=>(m.flag==='k'||m.flag==='q')?/rochade/i.test(txt):new RegExp('\\b'+sqName(m.to)+'\\b','i').test(txt.replace(/([A-Ha-h])\s+([1-8])/g,'$1$2')));
    if(ctx.kidFb&&!Brain.on())Peter.show(ctx.kidFb,ctx.mood);
    const minWait=lvl>=4?450:1100;
    const ai=await aiP;const rest=minWait-(Date.now()-t0);if(rest>0)await sleep(rest);
    if(my!==this.flow)return;
    pos.make(m);m.color='b';this.played.push(m);this.keys.push(pos.key());
    this.state='human';if(warn)this.danger=[warn.sq,warn.by];
    this.refresh();this.board.animate(m.from,m.to);this.persist();
    m.cap?sfx.capture():sfx.move();if(check)sfx.check();
    let text=ai;
    if(!text){
      const parts=[];if(ctx.kidFb)parts.push(ctx.kidFb);
      parts.push(fbPeterMove(m));
      if(check)parts.push('Schach! Rette deinen König!');
      if(warn)parts.push(`Pass auf, ${NOM_MEIN[warn.byPiece]} greift ${ACC_DEIN[warn.piece]} an!`);
      if(look)parts.push('Schau mal ganz genau hin. Kannst du vielleicht etwas schlagen?');
      if(first&&!st)parts.push('Mach meinen Zug bitte auch auf dem Brett.');
      text=parts.join(' ');
    }
    if(st)return this.endGame(st,m,text);
    await Peter.say(text,check||m.cap?'wow':warn?'think':'smile');
    this.autoListen(my);
  },
  /* ---------- Ende ---------- */
  status(){
    const pos=this.pos;
    if(this.variant==='pawns'){const r=pawnGameResult(pos);return r?{t:'pawns',winner:r}:null}
    const ms=pos.legal();
    if(!ms.length)return pos.inCheck()?{t:'mate',winner:opp(pos.turn)}:{t:'stalemate'};
    if(pos.half>=100)return{t:'draw',why:'Fünfzig Züge lang wurde nichts geschlagen.'};
    if(pos.insufficient())return{t:'draw',why:'Mit den Figuren, die noch da sind, kann keiner mehr mattsetzen.'};
    const k=this.keys[this.keys.length-1];if(this.keys.filter(x=>x===k).length>=3)return{t:'draw',why:'Die gleiche Stellung war dreimal da.'};
    return null;
  },
  async endGame(st,m,pre){
    this.state='over';$('#ask')&&($('#ask').hidden=true);Ears.stop();
    const p=P(),g=p.game,res=st.winner==='w'?'w':st.winner==='b'?'b':'d';
    let msg,title;let lvlUp=false,lvlDown=false;
    if(res==='w'){
      if(this.variant==='standard'){g.w++;g.lossStreak=0;g.winsAt++;if(g.winsAt>=2&&g.level<5){g.level++;g.winsAt=0;lvlUp=true}p.stats.mates++}
      else p.stats.pawnWins++;
      title='Gewonnen!';msg=this.variant==='pawns'?`Du hast es geschafft! Dein Bauer ist ganz hinten angekommen. Gewonnen!`:`Schachmatt! Wahnsinn, ${p.name}, du hast gewonnen!`;
      if(lvlUp)msg+=` Und weißt du was? Ab jetzt spiele ich stärker: ${LEVELS[g.level].name}!`;
      sfx.win();UI.confetti(110);Peter.bounce();Rewards.addXP(60);p.stars+=3;
    }else if(res==='b'){
      if(this.variant==='standard'){g.l++;g.lossStreak++;if(g.lossStreak>=3&&g.level>1){g.level--;g.lossStreak=0;g.winsAt=0;lvlDown=true}}
      title='Peter hat gewonnen';msg=(pre?pre+' ':'')+(this.variant==='pawns'?'Mein Bauer ist hinten angekommen. Diesmal habe ich gewonnen!':'Schachmatt! Diesmal habe ich gewonnen.')+' Aber du hast toll mitgespielt!';
      if(lvlDown)msg+=' Beim nächsten Mal spiele ich etwas gemütlicher.';
      Rewards.addXP(25);
    }else{
      if(this.variant==='standard')g.d++;
      title='Unentschieden';msg=(pre?pre+' ':'')+(st.t==='stalemate'?'Patt! Wer dran ist, kann nicht mehr ziehen, steht aber nicht im Schach. Unentschieden!':'Unentschieden! '+st.why);Rewards.addXP(35);
    }
    /* Partie für die Eltern-Auswertung speichern */
    const summary={date:new Date().toISOString(),variant:this.variant,level:p.game.level,result:res,moves:this.played.map(x=>sqName(x.from)+sqName(x.to)+(x.promo||'')),events:this.events.slice(0,60),plies:this.played.length,minutes:Math.max(1,Math.round((Date.now()-(this.startedAt||Date.now()))/60000))};
    p.games.unshift(summary);if(p.games.length>40)p.games.pop();
    p.game.current=null;Rewards.progress('game');Skills.snapshot();save();
    this.lastResult={res,title,msg};
    this.refresh();this.showEnd(this.lastResult);
    Rewards.checkBadges();
    if(res==='w'&&this.variant==='standard'){Peter.show('Schachmatt! Du hast gewonnen!','wow');const ai=await Brain.ask(`Das Kind hat dich gerade mit ${moveFacts(m,'kid')} schachmatt gesetzt und gewonnen! Freu dich riesig mit ihm.${lvlUp?` Verrate, dass du ab jetzt stärker spielst: ${LEVELS[g.level].name}.`:''} Höchstens drei kurze Sätze. Frag am Ende, ob es noch eine Runde spielen will.`,5000);await Peter.say(ai||msg,'wow')}
    else await Peter.say(msg,res==='w'?'wow':'smile');
    if(this.lessonCb){const cb=this.lessonCb;this.lessonCb=null;setTimeout(()=>cb(res),600)}
  },
  showEnd(r){
    const el=$('#endCard');if(!el)return;el.hidden=false;
    el.innerHTML=`<h2>${esc(r.title||'')}</h2>${this.lessonCb?'':`<div class="row"><button class="big go" data-act="again">${ICON.refresh} Nochmal spielen</button><button class="big ghost" data-act="tomap">${ICON.map} Zur Karte</button></div>`}`;
  },
  /* ---------- Werkzeuge ---------- */
  async giveHint(){
    if(this.state!=='human')return;
    const m=this.variant==='pawns'?choosePawnMove(this.pos,4):bestMove(this.pos,{depth:2,q:4,noise:0});if(!m)return;
    this.hint=m;this.sel=m.from;this.pending={type:'from',from:m.from};this.refresh();

    else if(m.cap)t=`Psst, schau mal: ${cap1(NOM_DEIN[m.piece])} auf ${SQ(m.from)} kann auf ${SQ(m.to)} etwas schlagen!`;
    else t=pick([`Psst, wie wäre es mit ${DAT_DEIN[m.piece]} von ${SQ(m.from)} nach ${SQ(m.to)}?`,`Mein Tipp: ${NAME[m.piece]} von ${SQ(m.from)} nach ${SQ(m.to)}. Der gelbe Pfeil zeigt es dir.`]);
    await Peter.say(t,'smile');this.autoListen(this.flow);
  },
  async undo(){
    if(this.state==='ask')return this.answerAsk(true);
    if(this.state!=='human'||this.played.length<2)return Peter.say('Da gibt es noch nichts zurückzunehmen.');
    this.flow++;
    const a=this.pos.unmake();this.played.pop();this.keys.pop();const b=this.pos.unmake();this.played.pop();this.keys.pop();
    this.sel=-1;this.pending=null;this.hint=null;this.danger=[];this.refresh();
    this.events.push({ply:this.played.length,kind:'takeback',text:'Zug zurückgenommen'});this.persist();
    await Peter.say(`Okay, zurückgespult! Stell ${a.piece===b.piece?'die beiden Figuren':ACC_MEIN[a.piece]+' und '+ACC_DEIN[b.piece]} so hin wie auf dem Handy. Du bist dran.`,'smile');
    this.autoListen(this.flow);
  },
  askNew(btn){
    if(!this.played.length||this.state==='over')return this.newGame();
    if(this.newArmed){clearTimeout(this.newArmed);this.newArmed=null;return this.newGame()}

    this.reset(this.variant);this.state='human';
    $('#endCard')&&($('#endCard').hidden=true);$('#ask')&&($('#ask').hidden=true);
    this.refresh();const my=this.flow;

  }
};

      rw.insertAdjacentHTML('beforeend',`<div class="reward">${CHEST(false)}<span>Eine Schatztruhe wartet im Album!</span></div>`);
      setTimeout(()=>this.confetti(70),1600);
    }
    const said=r.friend?`Du hast ${r.lesson.world.acc} geschafft! ${r.friend.name} ist jetzt dein Freund.`:r.stars===3?pick(['Drei Sterne! Du bist ein Schach-Star!','Alles richtig! Ich bin stolz auf dich.']):pick(['Gut gemacht! Weiter so!','Super! Mit jeder Übung wirst du besser.']);
    setTimeout(()=>Peter.say(said,'wow'),400);

    });

};

function openLesson(l,resume){
  if(!l)return;
  if(!resume&&P().resume&&P().resume.id===l.id)resume=P().resume;
  Runner.start({title:l.name,color:l.world.c,steps:l.steps,lesson:l,resume});
}
function resumeLesson(){const r=P().resume;if(!r)return null;const l=LESSONS.find(x=>x.id===r.id);return l&&lessonUnlocked(l)?l:null}

  insights(){
    const p=P(),out=[];
    const sk=Object.entries(p.skills).filter(([k,v])=>v.n>=3&&SKILLS[k]);
    const strong=sk.filter(([k,v])=>v.v>=68).sort((a,b)=>b[1].v-a[1].v).slice(0,2);
    const weak=sk.filter(([k,v])=>v.v<55).sort((a,b)=>a[1].v-b[1].v).slice(0,3);
    const recent=p.games.slice(0,6).filter(g=>g.variant==='standard'&&g.plies>6);
    const count=k=>recent.reduce((n,g)=>n+g.events.filter(e=>e.kind===k).length,0);
    const gamesWith=k=>recent.filter(g=>g.events.some(e=>e.kind===k)).length;
    const name=p.name;
    if(recent.length){
      const bl=gamesWith('blunder')+gamesWith('blunderMate');
      if(bl>=Math.ceil(recent.length/2))out.push({c:'#D6402F',t:`${name} lässt oft Figuren ungeschützt stehen (in ${bl} von ${recent.length} Partien). Vor jedem Zug fragen: „Was greift Peter an?“`,train:'rescue'});
      const mc=count('missedCapture');if(mc>=2)out.push({c:'#E8743B',t:`${mc}-mal stand eine Figur von Peter frei und wurde nicht geschlagen. Das Adlerauge-Training übt genau das.`,train:'capture'});
      const mm=count('missedMate');if(mm>=1)out.push({c:'#4F46E5',t:`${mm}-mal war ein Matt in einem Zug möglich und wurde übersehen. Matt-Blick hilft dabei.`,train:'mate'});
      const eq=gamesWith('earlyQueen');if(eq>=2)out.push({c:'#D99A00',t:`Die Dame kommt oft sehr früh ins Spiel. Besser zuerst Springer und Läufer entwickeln.`,train:'castle'});
      const cs=gamesWith('castle');if(recent.length>=3&&cs===0)out.push({c:'#C8553D',t:`In den letzten Partien wurde nie rochiert. Die Rochade bringt den König in Sicherheit.`,train:'castle'});
      if(cs>=2)out.push({c:'#2E9E4F',t:`Rochiert schon regelmäßig, sehr gut!`});
      const gc=count('goodCapture');if(gc>=3)out.push({c:'#2E9E4F',t:`Erkennt freie Figuren immer öfter (${gc}-mal geschnappt).`});
    }
    const ill={};for(const g of p.games.slice(0,10))for(const e of g.events)if(e.kind==='illegal')ill[e.piece]=(ill[e.piece]||0)+1;
    const worstPiece=Object.entries(ill).sort((a,b)=>b[1]-a[1])[0];
    if(worstPiece&&worstPiece[1]>=3)out.push({c:'#7A5CFF',t:`${worstPiece[0]==='q'?'Bei der Dame':'Beim '+NAME[worstPiece[0]]} gab es ${worstPiece[1]} ungültige Zugversuche. Die Zugregeln dieser Figur lohnen sich zu wiederholen.`,trainSkill:'move_'+worstPiece[0]});
    for(const [k,v] of weak)if(!out.some(o=>o.train===SKILLS[k].train))out.push({c:'#D6402F',t:`Schwäche: ${SKILLS[k].name} (${Math.round(v.v)} von 100). ${SKILLS[k].desc}.`,trainSkill:k});
    for(const [k,v] of strong)out.push({c:'#2E9E4F',t:`Stärke: ${SKILLS[k].name} (${Math.round(v.v)} von 100).`});
    return out;
  },

          <div class="stat"><b>${lessonsDone}/${LESSONS.length}</b><span>Lektionen geschafft</span></div>
          <div class="stat"><b>${Object.keys(p.badges).length}</b><span>Abzeichen</span></div>
        </div>
      </div>
      <div class="card"><h2>Spielzeit der letzten 14 Tage</h2>
        <svg viewBox="0 0 280 110" style="width:100%;margin-top:10px" role="img" aria-label="Minuten pro Tag">

        </svg></div>

        :`<p class="muted" style="margin:8px 0 0">Noch zu wenig gespielt. Nach ein paar Lektionen und Partien zeigt Peter hier, was gut klappt und was ihr üben solltet.</p>`}

  mount(el){
    el.addEventListener('click',e=>{audioUnlock();const a=e.target.closest('[data-act]');const p=P();
      const gb=e.target.closest('[data-game]');if(gb){this.replay(p.games[+gb.dataset.game]);return}
      const tr=e.target.closest('[data-train]');if(tr){if(tr.dataset.tskill)trainingForSkill(tr.dataset.tskill)();else startTraining(tr.dataset.train);return}
      if(!a)return;const act=a.dataset.act;
      if(act==='back')UI.go('home');
      if(act==='export')this.exportSheet();
      if(act==='import')this.importSheet();
      if(act==='editprofile')Profiles.create(true);
      if(act==='piperload')Piper.download();
      if(act==='newprofile')Profiles.create(false);
      if(act==='testvoice'){Voice.speak(`Hallo ${p.name}! Ich bin Peter. Wollen wir eine Runde Schach spielen?`)}
      if(act==='reset')UI.confirm('Wirklich zurücksetzen?',`Alle Sterne, Lektionen und Partien von ${p.name} werden gelöscht.`,'Abbrechen','Ja, löschen').then(keep=>{if(keep)return;const np=newProfile(p.name,p.avatar);np.id=p.id;Store.data.profiles[p.id]=np;save();UI.go('parents')});
    });
    const bind=(id,fn)=>{const x=$('#'+id,el);if(x)x.addEventListener('change',fn)};
    bind('voiceSel',e=>{P().settings.voice=e.target.value;save();Voice.pickVoice();Voice.speak('So klinge ich jetzt.')});
    bind('rate',e=>{P().settings.speechRate=+e.target.value;save();Voice.speak('So schnell spreche ich jetzt.')});
    bind('sHands',e=>{P().settings.handsFree=e.target.checked;save()});
    el.addEventListener('change',e=>{if(e.target.id==='sNatural'){P().settings.natural=e.target.checked;save();Voice.speak(e.target.checked?'Das ist meine neue Stimme.':'Das ist die Stimme des iPhones.')}});
    bind('sAi',e=>{P().settings.ai=e.target.checked;save()});
    bind('sSound',e=>{P().settings.sound=e.target.checked;save()});
    bind('sNames',e=>{P().settings.names=e.target.checked;save()});
  },
  exportSheet(){
    save();const code=Store.exportCode();
    UI.sheet(`<h2>Spielstand sichern</h2><p class="muted" style="margin:0">Diesen Code aufbewahren. Mit „Wiederherstellen“ holst du den Spielstand zurück.</p>
      <textarea class="field" id="expCode" rows="5" readonly style="font-size:.8rem;font-family:ui-monospace,monospace;word-break:break-all">${esc(code)}</textarea>

  importSheet(){

      ${navigator.clipboard&&navigator.clipboard.readText?'<button class="big" data-paste>Aus Zwischenablage einfügen</button>':''}
      <textarea class="field" id="impCode" rows="5" placeholder="PETER1:…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="font-size:.8rem;font-family:ui-monospace,monospace;word-break:break-all"></textarea>
      <div class="row"><button class="big go" data-ok>Übernehmen</button><button class="big ghost" data-x>Abbrechen</button></div>`,(s,close)=>{
      $('[data-x]',s).onclick=close;
      const ta=$('#impCode',s);
      const apply=txt=>{if(Store.importCode(txt)){close();UI.toast(ICON.check,'Spielstand wiederhergestellt');UI.go('parents');return true}

  replay(gm){
    if(!gm)return;
    const start=new Pos(gm.variant==='pawns'?PAWNS_FEN:START_FEN);const fens=[start.fen()],moves=[];
    for(const u of gm.moves){const m=start.legal().find(x=>sqName(x.from)+sqName(x.to)+(x.promo||'')===u);if(!m)break;start.make(m);moves.push(m);fens.push(start.fen())}
    let ply=fens.length-1;
    const keyEv=gm.events.filter(e=>!/illegal|hint/.test(e.kind));
    const evColor=k=>/blunder|missed/.test(k)?'var(--danger)':/good|castle|fork|saved|promo/.test(k)?'var(--good)':'var(--muted)';
    UI.sheet(`<div style="display:flex;align-items:center;gap:10px"><h2 style="flex:1">Partie ansehen</h2><button class="iconbtn" data-x aria-label="Schließen">${ICON.close}</button></div>
      <div id="rb"></div>
      <div class="row" style="align-items:center"><button class="big ghost" data-prev style="flex:0 0 64px">${ICON.back}</button><span id="rply" style="flex:1;text-align:center;font-family:var(--font-display);font-weight:700"></span><button class="big ghost" data-next style="flex:0 0 64px">${ICON.next}</button></div>
      ${keyEv.length?`<h3>Wichtige Momente</h3><ul class="moments">${keyEv.map((e,i)=>`<li><button data-ev="${i}"><span class="k" style="background:${evColor(e.kind)}"></span><span><b>Zug ${Math.floor(e.ply/2)+1}</b> · ${esc(e.text)}${e.move?' ('+esc(e.move)+')':''}</span></button></li>`).join('')}</ul>`:'<p class="muted" style="margin:0">Keine besonderen Momente.</p>'}`,(s,close)=>{
      const b=new Board($('#rb',s),{names:'edge'});
      const show=()=>{const pos=new Pos(fens[ply]);b.clearMarks();b.setPos(pos);const m=moves[ply-1];
        let best=null;const ev=keyEv.find(e=>e.best&&e.ply===ply);
        if(m)b.mark('last',[m.from,m.to]);
        if(ev)best={from:sqIdx(ev.best.slice(0,2)),to:sqIdx(ev.best.slice(2,4)),kind:'hint'};
        b.arrows(best?[best]:[]).render();
        $('#rply',s).textContent=ply?`Zug ${Math.ceil(ply/2)}${ply%2?' (Weiß)':' (Peter)'}: ${moveText(m)}`:'Anfangsstellung';
        if(ev)$('#rply',s).textContent+=' · Gelber Pfeil: besserer Zug';
        $$('[data-ev]',s).forEach(x=>{const k=keyEv[+x.dataset.ev];x.setAttribute('aria-pressed',String(k.best?k.ply===ply:k.ply===ply-1))});
      };
      show();
      s.onclick=e=>{if(e.target.closest('[data-x]'))close();if(e.target.closest('[data-prev]')&&ply>0){ply--;show()}if(e.target.closest('[data-next]')&&ply<fens.length-1){ply++;show()}
        const ev=e.target.closest('[data-ev]');if(ev){const k=keyEv[+ev.dataset.ev];ply=Math.min(fens.length-1,k.best?k.ply:k.ply+1);show()}};
    });
  }
};
UI.screens.parents=Parents;
UI.refreshVoiceSelect=()=>{if(UI.current==='parents'){const sel=$('#voiceSel');if(sel){const v=Voice.list();sel.innerHTML=v.length?v.map(x=>`<option value="${esc(x.id)}" ${x.id===P().settings.voice?'selected':''}>${esc(x.name)}${x.good?' ★':''}</option>`).join(''):'<option value="">Standardstimme</option>'}}};

   Peter-Schach · Start
   =================================================================== */
function splash(){
  const d=Store.data,list=Object.values(d.profiles),p=P();
  const el=$('#splash');el.hidden=false;
  el.innerHTML=`<div class="splash-in">
    <div class="peter" data-mood="smile">${peterSVG(p.outfit)}</div>
    <h1>Schach mit Peter</h1>
    <p class="muted" style="margin:0">Lernen, rätseln und am echten Brett gegen Peter spielen.</p>
    ${list.length>1?`<div class="profiles">${list.map(x=>`<button data-p="${x.id}"><span class="avatar" style="${x.id===d.current?'border-color:var(--sun)':''}">${avatarSVG(x.avatar)}</span>${esc(x.name)}</button>`).join('')}</div>`
      :`<button class="big go wide" data-go style="min-height:66px;font-size:1.35rem">${ICON.play} Los geht's, ${esc(p.name)}!</button>
        <button class="big ghost" data-other style="min-height:44px;font-size:1rem">Jemand anderes spielt</button>`}
    <p class="hint-line">Ton an! Peter spricht mit dir.</p>
  </div>`;
  el.onclick=e=>{
    const b=e.target.closest('[data-p],[data-go],[data-other]');if(!b)return;
    audioUnlock();
    if(b.dataset.p)d.current=b.dataset.p;
    if(b.hasAttribute('data-other')){el.hidden=true;Profiles.create(false);boot();return}
    save();Voice.pickVoice();
    /* iOS gibt die Stimme nur nach einem Tippen frei: sofort ein kurzes Wort sprechen */
    sfx.star();Voice.speak('Hallo!');
    el.hidden=true;boot();
  };
}
function boot(){
  Rewards.touchDay();
  UI.go('home');
  setTimeout(()=>Rewards.checkBadges(),1500);
}
function trackTime(){
  setInterval(()=>{
    if(document.visibilityState!=='visible'||!$('#splash').hidden)return;
    const p=P();p.stats.seconds+=15;p.stats.daySecs=p.stats.daySecs||{};const d=today();p.stats.daySecs[d]=(p.stats.daySecs[d]||0)+15;
    const keys=Object.keys(p.stats.daySecs);if(keys.length>40)delete p.stats.daySecs[keys.sort()[0]];
    if(p.streak.last!==d)Rewards.touchDay();
    save();
  },15000);
}
async function keepAwake(){try{if('wakeLock' in navigator&&document.visibilityState==='visible')await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keepAwake()});

(function init(){
  Store.load();
  Voice.init();Ears.init();Brain.init();Piper.init();
  UI.tabs();
  trackTime();
  document.addEventListener('pointerdown',()=>{audioUnlock();keepAwake()},{once:true});
  splash();
})();

if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
