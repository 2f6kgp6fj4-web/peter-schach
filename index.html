/* ---------- Wohin kann ich ziehen? ---------- */
function fenFrom(pieces,turn){
  const b=new Array(128).fill(null);for(const p of pieces)b[p.sq]=p.c+p.t;
  let s='';
  for(let r=7;r>=0;r--){let e=0;for(let f=0;f<8;f++){const p=b[r*16+f];if(!p){e++;continue}if(e){s+=e;e=0}s+=p[0]==='w'?p[1].toUpperCase():p[1]}if(e)s+=e;if(r)s+='/'}
  return s+' '+(turn||'w')+' - - 0 1';
}
function genReach(type,level){
  for(let tries=0;tries<200;tries++){
    const pieces=[];const used=new Set();
    let from;
    if(type==='p'){from=sq(ri(0,7),level>=2?ri(1,5):1)}
    else from=level<=1?sq(ri(2,5),ri(2,5)):pickR(ALL_SQ);
    used.add(from);pieces.push({sq:from,c:'w',t:type});
    const nOwn=level<=1?0:ri(1,level),nEnemy=level<=1?(type==='p'?ri(1,2):0):ri(1,level+1);
    const near=()=>{const cand=ALL_SQ.filter(s=>!used.has(s)&&Math.abs((s&7)-(from&7))<=3&&Math.abs((s>>4)-(from>>4))<=3);return cand.length?pickR(cand):null};
    for(let i=0;i<nOwn;i++){const s=near();if(s==null)break;used.add(s);pieces.push({sq:s,c:'w',t:'p'})}
    for(let i=0;i<nEnemy;i++){let s;
      if(type==='p'&&i===0){const r=(from>>4)+1,f=(from&7)+pickR([-1,1]);if(f<0||f>7)continue;s=sq(f,r);if(used.has(s))continue}
      else s=near();
      if(s==null)break;used.add(s);pieces.push({sq:s,c:'b',t:pickR(['p','n','b','r'])})}
    if(pieces.some(p=>p.t==='p'&&((p.sq>>4)===0||(p.sq>>4)===7)))continue;
    const pos=new Pos(fenFrom(pieces,'w'));
    const targets=[...new Set(pos.pseudoFrom(from).map(m=>m.to))];
    if(targets.length<2)continue;
    return{type,from,fen:pos.fen(),targets};
  }
  return null;
}

/* ---------- Zufallsstellungen ---------- */
function place(spec){
  /* spec: Liste von {c,t,where} – where: Funktion(sq)->bool */
  const b=[],used=new Set();
  for(const p of spec){
    let s,g=0;
    do{s=pickR(ALL_SQ);g++}while(g<200&&(used.has(s)||(p.where&&!p.where(s))||(p.t==='p'&&((s>>4)===0||(s>>4)===7))));
    if(g>=200)return null;
    used.add(s);b.push({sq:s,c:p.c,t:p.t});
  }
  return b;
}
function kingsOk(pos){
  const w=pos.kings.w,b=pos.kings.b;if(w<0||b<0)return false;
  return Math.max(Math.abs((w&7)-(b&7)),Math.abs((w>>4)-(b>>4)))>1;
}
const edge=s=>(s>>4)===7;
const anyw=()=>true;
const not8=s=>(s>>4)<7;

/* Matt in 1 */
function genMate(level){
  for(let tries=0;tries<6000;tries++){
    let spec;const fam=level<=1?pickR(['Q','R','RR']):level===2?pickR(['Q','R','BR','RR','QB']):pickR(['BR','QB','QN','RB','BRx']);
    if(fam==='BR'||fam==='BRx'){
      const kf=ri(5,7),ks=sq(kf,7);
      spec=[{c:'b',t:'k',where:s=>s===ks}];
      for(const f of [kf-1,kf,kf+1])if(f>=0&&f<=7&&rand()<.85)spec.push({c:'b',t:'p',where:(ff=>s=>s===sq(ff,6))(f)});
      spec.push({c:'w',t:'k',where:s=>(s>>4)<=2});
      spec.push({c:'w',t:pickR(['r','q']),where:s=>(s>>4)<=4});
      if(fam==='BRx'){spec.push({c:'b',t:pickR(['r','n','b']),where:s=>(s>>4)>=4});spec.push({c:'w',t:pickR(['p','n','b']),where:s=>(s>>4)<=4})}
    }else if(fam==='Q'){spec=[{c:'b',t:'k',where:edge},{c:'w',t:'k',where:s=>(s>>4)>=4},{c:'w',t:'q',where:anyw}]}
    else if(fam==='R'){spec=[{c:'b',t:'k',where:edge},{c:'w',t:'k',where:s=>(s>>4)===5},{c:'w',t:'r',where:not8}]}
    else if(fam==='RR'){spec=[{c:'b',t:'k',where:edge},{c:'w',t:'k',where:s=>(s>>4)<=3},{c:'w',t:'r',where:s=>(s>>4)===6},{c:'w',t:'r',where:s=>(s>>4)<=5}]}
    else if(fam==='QB'){spec=[{c:'b',t:'k',where:s=>(s>>4)>=6},{c:'b',t:'p',where:s=>(s>>4)>=5},{c:'b',t:'p',where:s=>(s>>4)>=5},{c:'w',t:'k',where:s=>(s>>4)<=2},{c:'w',t:'q',where:anyw},{c:'w',t:'b',where:anyw}]}
    else if(fam==='QN'){spec=[{c:'b',t:'k',where:s=>(s>>4)>=6},{c:'b',t:'p',where:s=>(s>>4)>=5},{c:'b',t:pickR(['r','b']),where:s=>(s>>4)>=5},{c:'w',t:'k',where:s=>(s>>4)<=2},{c:'w',t:'q',where:anyw},{c:'w',t:'n',where:anyw}]}
    else{spec=[{c:'b',t:'k',where:s=>(s>>4)>=6},{c:'b',t:'p',where:s=>(s>>4)>=5},{c:'b',t:'p',where:s=>(s>>4)>=5},{c:'w',t:'k',where:s=>(s>>4)<=2},{c:'w',t:'r',where:anyw},{c:'w',t:'b',where:anyw}]}
    const pcs=place(spec);if(!pcs)continue;
    const pos=new Pos(fenFrom(pcs,'w'));
    if(!kingsOk(pos)||pos.inCheck('b')||pos.inCheck('w'))continue;
    const ms=pos.legal();if(ms.length<6)continue;
    const mates=allMatesInOne(pos);
    const maxM=level<=1?2:1;
    if(mates.length<1||mates.length>maxM)continue;
    if(mates.some(m=>m.promo))continue;
    /* keine Figur von Weiß steht einfach so herum, die Schwarz nehmen könnte, damit die Stellung "fair" aussieht */
    return{kind:'mate',fen:pos.fen(),sol:mates.map(m=>sqName(m.from)+sqName(m.to))};
  }
  return null;
}

/* Adlerauge: eine freie Figur schlagen */
function freeCaptures(pos){
  const res=[];
  for(const m of pos.legal()){
    if(!m.cap)continue;
    const defended=pos.attackers(m.to,opp(pos.turn)).length>0;
    if(!defended||VAL[m.cap]>VAL[m.piece]+50){
      /* nach dem Schlagen kein sofortiges Matt gegen uns */
      pos.make(m);const bad=mateInOne(pos);pos.unmake();
      if(!bad)res.push(m);
    }
  }
  return res;
}
function genCapture(level){
  for(let tries=0;tries<4000;tries++){
    const wN=level<=1?1:level===2?2:3,bN=level<=1?2:level===2?3:4;
    const spec=[{c:'w',t:'k',where:s=>(s>>4)<=2},{c:'b',t:'k',where:s=>(s>>4)>=5}];
    for(let i=0;i<wN;i++)spec.push({c:'w',t:pickR(['n','b','r','q','n','b','r']),where:anyw});
    for(let i=0;i<bN;i++)spec.push({c:'b',t:pickR(['p','n','b','r','q','p','n','b','r']),where:anyw});
    if(level>=2)spec.push({c:'w',t:'p',where:s=>(s>>4)>=1&&(s>>4)<=4},{c:'b',t:'p',where:s=>(s>>4)>=3&&(s>>4)<=6});
    const pcs=place(spec);if(!pcs)continue;
    const pos=new Pos(fenFrom(pcs,'w'));
    if(!kingsOk(pos)||pos.inCheck('b')||pos.inCheck('w'))continue;
    const fc=freeCaptures(pos);
    const targets=[...new Set(fc.map(m=>m.to))];
    if(targets.length!==1)continue;
    const val=VAL[pos.board[targets[0]][1]];
    if(val<300&&level>=2)continue;
    /* es gibt andere Schlagzüge, die schlecht wären – nur ab Stufe 2 */
    const allCaps=pos.legal().filter(m=>m.cap);
    if(level>=3&&allCaps.length<2)continue;
    return{kind:'capture',fen:pos.fen(),target:sqName(targets[0]),sol:fc.map(m=>sqName(m.from)+sqName(m.to))};
  }
  return null;
}

/* Schutzschild: eine bedrohte Figur retten */
function rescueOk(pos,m){
  pos.make(m);
  let ok=!mateInOne(pos);
  if(ok){const th=hanging(pos,'w').filter(h=>h.value>=300&&pos.legal().some(x=>x.to===h.sq));ok=th.length===0}
  pos.unmake();
  return ok;
}
function genRescue(level){
  for(let tries=0;tries<4000;tries++){
    const spec=[{c:'w',t:'k',where:s=>(s>>4)<=2},{c:'b',t:'k',where:s=>(s>>4)>=5}];
    const nW=level<=1?1:2,nB=level<=1?1:level===2?2:3;
    for(let i=0;i<nW;i++)spec.push({c:'w',t:pickR(['n','b','r','q']),where:anyw});
    for(let i=0;i<nB;i++)spec.push({c:'b',t:pickR(['p','n','b','r']),where:anyw});
    if(level>=2)spec.push({c:'w',t:'p',where:s=>(s>>4)>=1&&(s>>4)<=3},{c:'w',t:'p',where:s=>(s>>4)>=1&&(s>>4)<=3});
    const pcs=place(spec);if(!pcs)continue;
    const pos=new Pos(fenFrom(pcs,'w'));
    if(!kingsOk(pos)||pos.inCheck('b')||pos.inCheck('w'))continue;
    const th=threatsAgainst(pos,'w').filter(h=>h.value>=300);
    if(th.length!==1)continue;
    if(freeCaptures(pos).length)continue; /* sonst wäre "schlagen" die einfachere Idee */
    const ms=pos.legal();const good=ms.filter(m=>rescueOk(pos,m));
    if(!good.length||good.length>ms.length*0.6)continue;
    return{kind:'rescue',fen:pos.fen(),target:sqName(th[0].sq),by:sqName(th[0].by),sol:good.map(m=>sqName(m.from)+sqName(m.to))};
  }
  return null;
}

/* Schach-Retter: der weiße König steht im Schach */
function genEscape(level){
  for(let tries=0;tries<4000;tries++){
    const spec=[{c:'w',t:'k',where:anyw},{c:'b',t:'k',where:anyw},{c:'b',t:pickR(['r','q','b','n']),where:anyw}];
    if(level>=2)spec.push({c:'w',t:pickR(['r','b','n']),where:anyw},{c:'w',t:'p',where:s=>(s>>4)<=3});
    if(level>=3)spec.push({c:'b',t:pickR(['r','b','n','p']),where:anyw});
    const pcs=place(spec);if(!pcs)continue;
    const pos=new Pos(fenFrom(pcs,'w'));
    if(!kingsOk(pos)||!pos.inCheck('w')||pos.inCheck('b'))continue;
    const ms=pos.legal();if(!ms.length)continue;
    const kingMoves=ms.filter(m=>m.piece==='k').length;
    if(level>=2&&ms.length>6)continue;
    if(level===1&&kingMoves<1)continue;
    const checker=pos.attackers(pos.kings.w,'b');
    return{kind:'escape',fen:pos.fen(),checker:sqName(checker[0]),sol:ms.map(m=>sqName(m.from)+sqName(m.to))};
  }
  return null;
}

/* Gabel: eine Figur greift zwei Ziele gleichzeitig an */
function forkTargets(pos,sqTo){
  const me=pos.board[sqTo];if(!me)return[];
  const meVal=AVAL[me[1]],c=me[0],o=opp(c),out=[];
  const t=pos.clone();t.turn=c;t.ep=-1;
  for(const m of t.gen()){
    if(m.from!==sqTo||!m.cap)continue;
    const tgt=t.board[m.to];
    if(tgt[1]==='k'){out.push(m.to);continue}
    const def=t.attackers(m.to,o).length>0;
    if(VAL[tgt[1]]>=300&&(!def||VAL[tgt[1]]>meVal))out.push(m.to);
  }
  return out;
}
function genFork(level,opt){
  const want=opt&&opt.forker;
  for(let tries=0;tries<8000;tries++){
    const forker=want?pickR(want.split('')):level<=1?'n':pickR(['n','n','b','r','q','p']);
    const spec=[{c:'w',t:'k',where:s=>(s>>4)<=2},{c:'b',t:'k',where:s=>(s>>4)>=4},{c:'w',t:forker,where:anyw},
      {c:'b',t:pickR(['r','q','r']),where:anyw},{c:'b',t:pickR(['r','q','b','n']),where:anyw}];
    if(level>=2)spec.push({c:'b',t:'p',where:s=>(s>>4)>=4},{c:'w',t:'p',where:s=>(s>>4)<=3});
    const pcs=place(spec);if(!pcs)continue;
    const pos=new Pos(fenFrom(pcs,'w'));
    if(!kingsOk(pos)||pos.inCheck('b')||pos.inCheck('w'))continue;
    if(freeCaptures(pos).length)continue;
    const sols=[];
    for(const m of pos.legal()){
      if(m.cap)continue;
      pos.make(m);
      const safe=!pos.attacked(m.to,'b');
      const tg=safe?forkTargets(pos,m.to):[];
      pos.unmake();
      if(tg.length>=2)sols.push({m,tg});
    }
    if(sols.length!==1)continue;
    if(want?!want.includes(sols[0].m.piece):level<=1&&sols[0].m.piece!=='n')continue;
    return{kind:'fork',fen:pos.fen(),sol:[sqName(sols[0].m.from)+sqName(sols[0].m.to)],targets:sols[0].tg.map(sqName)};
  }
  return null;
}

/* Bauern schlagen schräg (ohne Könige) */
function genPawnCap(level){
  for(let tries=0;tries<3000;tries++){
    const spec=[];const nP=level<=1?2:level===2?3:4,nB=level<=1?2:level===2?3:4;
    for(let i=0;i<nP;i++)spec.push({c:'w',t:'p',where:s=>(s>>4)>=1&&(s>>4)<=5});
    for(let i=0;i<nB;i++)spec.push({c:'b',t:pickR(['n','b','r','q','p']),where:s=>(s>>4)>=2&&(s>>4)<=6});
    const pcs=place(spec);if(!pcs)continue;
    const pos=new Pos(fenFrom(pcs,'w'));
    const caps=pos.legal().filter(m=>m.cap&&m.piece==='p'&&!m.promo);
    if(caps.length!==1)continue;
    /* Bauern, die gerade nach vorne "schlagen" könnten (das geht nicht), als Falle */
    const fake=pos.pieces('w').some(p=>p.type==='p'&&pos.board[p.sq+16]&&pos.board[p.sq+16][0]==='b');
    if(level>=2&&!fake)continue;
    return{kind:'pawncap',fen:pos.fen(),sol:caps.map(m=>sqName(m.from)+sqName(m.to))};
  }
  return null;
}

/* Bauer wird Dame */
function genPromote(level){
  for(let tries=0;tries<3000;tries++){
    const spec=[{c:'w',t:'p',where:s=>(s>>4)===6}];
    if(level>=2)spec.push({c:'w',t:'p',where:s=>(s>>4)===6});
    for(let i=0;i<level;i++)spec.push({c:'b',t:pickR(['n','b','r']),where:s=>(s>>4)===7});
    spec.push({c:'w',t:'p',where:s=>(s>>4)>=2&&(s>>4)<=4});
    const pcs=place(spec);if(!pcs)continue;
    const pos=new Pos(fenFrom(pcs,'w'));
    const pr=pos.legal().filter(m=>m.promo==='q');
    if(!pr.length)continue;
    if(level>=2&&pr.length>2)continue;
    return{kind:'promote',fen:pos.fen(),sol:pr.map(m=>sqName(m.from)+sqName(m.to))};
  }
  return null;
}

/* Rochade */
function genCastle(level){
  const variants=[
    {fen:'r3k2r/pppq1ppp/2npbn2/2b1p3/2B1P3/2NP1N2/PPP2PPP/R2QK2R w KQkq - 0 1',want:'k'},
    {fen:'rnbqk2r/pppp1ppp/5n2/2b1p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 0 1',want:'k'},
    {fen:'r1bqk2r/pppp1ppp/2n2n2/2b1p3/2B1P3/3P1N2/PPP2PPP/RNBQK2R w KQkq - 0 1',want:'k'},
    {fen:'rn2kbnr/ppp1pppp/3q4/3p1b2/3P1B2/2NQ4/PPP1PPPP/R3KBNR w KQkq - 0 1',want:'q'},
    {fen:'r3kbnr/ppp2ppp/2nq4/3pp3/3P1Bb1/2NQ4/PPP1PPPP/R3KBNR w KQkq - 0 1',want:'q'},
    {fen:'r1bqk2r/ppp2ppp/2np1n2/2b1p3/2B1P3/2NP1N2/PPP2PPP/R1BQK2R w KQkq - 0 1',want:'k'}
  ];
  const v=variants[ri(0,variants.length-1)];
  const pos=new Pos(v.fen);
  const ms=pos.legal().filter(m=>m.flag==='k'||m.flag==='q');
  return{kind:'castle',fen:v.fen,sol:ms.map(m=>sqName(m.from)+sqName(m.to))};
}

/* Ist das Schachmatt? (Ja/Nein) */
function genIsMate(level){
  const p=genMate(level);if(!p)return null;
  const pos=new Pos(p.fen);
  const mates=allMatesInOne(pos);
  if(rand()<.5){const m=mates[0];pos.make(m);return{kind:'ismate',fen:pos.fen(),answer:true,last:sqName(m.from)+sqName(m.to)}}
  const checks=pos.legal().filter(m=>{pos.make(m);const r=pos.inCheck()&&!pos.isMate();pos.unmake();return r});
  if(!checks.length){const m=mates[0];pos.make(m);return{kind:'ismate',fen:pos.fen(),answer:true,last:sqName(m.from)+sqName(m.to)}}
  const m=pickR(checks);pos.make(m);
  const esc=pos.legal()[0];
  return{kind:'ismate',fen:pos.fen(),answer:false,last:sqName(m.from)+sqName(m.to),escape:sqName(esc.from)+sqName(esc.to)};
}


/* ===================================================================
   Staffel 2: Taktik-Inseln
   Patt, en passant, Zählen, Fesselung, Spieß, Abzug. Alle Rätsel werden
   zufällig erzeugt und geprüft: Ein Taktik-Zug zählt nur, wenn Weiß danach
   gegen jede Antwort eine Figur gewinnt (oder mattsetzt).
   =================================================================== */
const uciOf=m=>sqName(m.from)+sqName(m.to);
const LINES={r:R_OFF,b:B_OFF,q:K_OFF};
/* Hinter einem Langschrittler: erste fremde Figur x, dann die nächste fremde Figur t auf derselben Linie */
function rayPairs(pos,s){
  const p=pos.board[s];if(!p||!LINES[p[1]])return[];const o=opp(p[0]),out=[];
  for(const d of LINES[p[1]]){let t=s+d,first=-1;
    while(onBoard(t)){const q=pos.board[t];if(q){if(q[0]!==o)break;if(first<0)first=t;else{out.push({x:first,t,d});break}}t+=d}}
  return out;
}
/* Was Weiß (am Zug) sofort gewinnt: Matt = 9999, sonst die beste Schlag-Bilanz */
function gainNow(pos){
  if(mateInOne(pos))return 9999;
  let best=0;
  for(const x of pos.legal()){
    if(!x.cap)continue;
    pos.make(x);const back=pos.attacked(x.to,pos.turn);pos.unmake();
    const g=VAL[x.cap]-(back?VAL[x.piece]:0);if(g>best)best=g;
  }
  return best;
}
/* Gewinnt der weiße Zug m mindestens min Material, egal was Schwarz antwortet? */
function winsMaterial(pos,m,min){
  min=min||300;pos.make(m);
  if(pos.isMate()){pos.unmake();return true}
  const reps=pos.legal();let ok=reps.length>0;
  for(const r of reps){
    if(!ok)break;
    pos.make(r);const lost=r.cap?VAL[r.cap]:0;const g=gainNow(pos);pos.unmake();
    if(g-lost<min)ok=false;
  }
  pos.unmake();return ok;
}
/* die zäheste Antwort von Schwarz (für den zweiten Zug im Rätsel) */
function toughestReply(pos){
  let best=null,bestScore=1e9;
  for(const r of pos.legal()){pos.make(r);const lost=r.cap?VAL[r.cap]:0;const sc=gainNow(pos)-lost;pos.unmake();if(sc<bestScore){bestScore=sc;best=r}}
  return best;
}
/* Züge, die jetzt mindestens min gewinnen (zweiter Zug im Rätsel) */
function winningCaptures(pos,min){
  min=min||300;const out=[];
  for(const x of pos.legal()){
    pos.make(x);const mate=pos.isMate(),back=x.cap?pos.attacked(x.to,pos.turn):true;pos.unmake();
    if(mate||(x.cap&&VAL[x.cap]-(back?VAL[x.piece]:0)>=min))out.push(x);
  }
  return out;
}
function quietStart(pos){
  if(!kingsOk(pos)||pos.inCheck('b')||pos.inCheck('w'))return false;
  if(freeCaptures(pos).some(m=>VAL[m.cap]>=300))return false; /* nichts liegt schon einfach herum */
  if(mateInOne(pos))return false;
  return true;
}
function tacticGen(kind,level,specFn,patternFn,tries){
  for(let n=0;n<(tries||2500);n++){
    const pcs=place(specFn(level));if(!pcs)continue;
    const pos=new Pos(fenFrom(pcs,'w'));
    if(!quietStart(pos))continue;
    const hits=[];
    for(const m of pos.legal()){
      const sh=patternFn(pos,m);if(!sh)continue;
      if(winsMaterial(pos,m))hits.push({m,sh});
      if(hits.length>1)break;
    }
    if(hits.length!==1)continue;
    return{kind,fen:pos.fen(),sol:[uciOf(hits[0].m)],show:hits[0].sh,follow:true};
  }
  return null;
}
const slider=()=>pickR(['b','r','q','b','r']);
const lowHalf=s=>(s>>4)<=3,highHalf=s=>(s>>4)>=4;
/* Fesselung: der gezogene Langschrittler hält eine Figur vor dem König (oder der Dame) fest */
function pinPattern(pos,m){
  if(!LINES[m.piece])return null;
  pos.make(m);let sh=null;
  for(const pr of rayPairs(pos,m.to)){
    const X=pos.board[pr.x],T=pos.board[pr.t];
    if(X[1]!=='k'&&(T[1]==='k'||AVAL[T[1]]>AVAL[X[1]])){sh=[[sqName(m.to),sqName(pr.t)]];break}
  }
  pos.unmake();return sh;
}
function genPin(level){
  return tacticGen('pin',level,lv=>{
    const spec=[{c:'w',t:'k',where:lowHalf},{c:'b',t:'k',where:highHalf},{c:'w',t:slider(),where:anyw},
      {c:'b',t:pickR(['n','b','r','n']),where:highHalf},{c:'b',t:pickR(['q','r','n','b']),where:anyw}];

/* ---------- Speicher & Profile ---------- */
const STORE_KEY='peterSchach.v2';
const Store={
  data:null,
  read(key){try{const d=JSON.parse(localStorage.getItem(key));return d&&d.profiles&&Object.keys(d.profiles).length?d:null}catch(e){return null}},
  load(){
    let d=this.read(STORE_KEY);
    /* Spielstand beschädigt? Dann die letzte Sicherung nehmen */
    if(!d)d=this.read(STORE_KEY+'.backup')||this.read(STORE_KEY+'.daily');
    if(!d){d={v:2,current:null,profiles:{}};
      let old=null;try{old=JSON.parse(localStorage.getItem('peterSchach.v1'))}catch(e){}
      const p=newProfile('Alexander',{fig:'n',color:'#2B7BD8'});
      if(old&&old.prof){p.game.level=old.prof.level||1;p.game.w=old.prof.w||0;p.game.l=old.prof.l||0;p.game.d=old.prof.d||0}
      d.profiles[p.id]=p;d.current=p.id;
    }else{
      /* Sicherung beim Start: so geht bei einem Update nichts verloren */
      try{localStorage.setItem(STORE_KEY+'.backup',JSON.stringify(d))}catch(e){}
      try{const day=localStorage.getItem(STORE_KEY+'.dailyDate');if(day!==today()){localStorage.setItem(STORE_KEY+'.daily',JSON.stringify(d));localStorage.setItem(STORE_KEY+'.dailyDate',today())}}catch(e){}
    }
    /* Rokko hatte früher 5 Stärken, jetzt 10: alte Stufe auf die neue Skala übertragen */
    for(const id in d.profiles){const g=d.profiles[id].game;if(g&&!g.l10){g.level={1:1,2:3,3:5,4:7,5:9}[g.level]||1;g.l10=1}}
    /* neue Felder ergänzen, ohne etwas zu überschreiben */
    for(const id in d.profiles)fillDefaults(d.profiles[id],newProfile(d.profiles[id].name||'Kind',d.profiles[id].avatar||{fig:'n',color:'#2B7BD8'}));
    if(!d.profiles[d.current])d.current=Object.keys(d.profiles)[0];
    d.v=2;this.data=d;return d;
  },
  save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(this.data))}catch(e){}},
  exportCode(){return 'ROKKO1:'+btoa(unescape(encodeURIComponent(JSON.stringify(this.data))))},
  decodeCode(code){
    // Robust gegen alles, was iOS beim Kopieren/Teilen dazupackt: unsichtbare Zeichen, Umbrüche, Titelzeilen, fehlendes Padding
    let s=String(code||'').normalize('NFKC');
    const U=s.toUpperCase(),i=Math.max(U.lastIndexOf('PETER1'),U.lastIndexOf('ROKKO1'));
    if(i>=0)s=s.slice(i+6);
    s=s.replace(/-/g,'+').replace(/_/g,'/').replace(/[^A-Za-z0-9+/]/g,'');
    const j=s.indexOf('eyJ');if(j>0)s=s.slice(j);
    if(!s)return null;
    for(let cut=0;cut<Math.min(s.length,400);cut++){
      let t=s.slice(0,s.length-cut);while(t.length%4)t+='=';
      try{const d=JSON.parse(decodeURIComponent(escape(atob(t))));if(d&&d.profiles&&Object.keys(d.profiles).length)return d}catch(e){}
    }
    return null;
  },
  importCode(code){
    const d=this.decodeCode(code);if(!d)return false;
    try{localStorage.setItem(STORE_KEY+'.beforeImport',JSON.stringify(this.data))}catch(e){}
    this.data=d;this.save();try{this.load()}catch(e){}return true;
  }
};
function fillDefaults(obj,def){
  for(const k in def){
    if(obj[k]===undefined||obj[k]===null&&def[k]!==null)obj[k]=def[k];
    else if(def[k]&&typeof def[k]==='object'&&!Array.isArray(def[k])&&obj[k]&&typeof obj[k]==='object'&&!Array.isArray(obj[k]))fillDefaults(obj[k],def[k]);
  }
  return obj;
}

/* ---------- Fehlerprotokoll: hilft, Abstürze und Tonausfälle später nachzuvollziehen ---------- */
const Diag={
  KEY:'rokko.diag',
  list(){try{return JSON.parse(localStorage.getItem(this.KEY)||'[]')}catch(e){return []}},
  log(k,m){
    try{
      m=String(m==null?'':m).slice(0,220);const l=this.list(),last=l[l.length-1];
      if(last&&last.k===k&&last.m===m&&Date.now()-last.t<60000){last.n=(last.n||1)+1;last.t=Date.now()}
      else l.push({t:Date.now(),k,m});
      while(l.length>120)l.shift();
      localStorage.setItem(this.KEY,JSON.stringify(l));
    }catch(e){}
    try{if(Native.ok)Native.post({type:'log',k,m})}catch(e){}
  },
  clear(){try{localStorage.removeItem(this.KEY)}catch(e){}},
  text(){
    const env=`${navigator.userAgent}\nVersion ${window.ROKKO_VERSION||'?'} · ${Native.ok?'iPhone-App':(navigator.standalone||matchMedia('(display-mode: standalone)').matches)?'Home-Bildschirm':'Browser'}`;
    return env+'\n\n'+this.list().map(e=>new Date(e.t).toLocaleString('de-DE')+' · '+e.k+(e.m?' · '+e.m:'')+(e.n>1?` (${e.n}×)`:'')).join('\n');

/* ---------- Töne ----------
   iOS kann den Ton unterwegs verlieren: nach dem Zuhören (Mikrofon), nach Anrufen, Siri oder dem Sperrbildschirm.
   Deshalb wird der Ton bei jeder Berührung neu freigegeben und vor jedem Satz geprüft. */
let ac=null;
function setSession(t){try{if(navigator.audioSession&&navigator.audioSession.type!==t)navigator.audioSession.type=t}catch(e){}}
function newAC(){
  try{if(ac&&ac.state!=='closed')ac.close().catch(()=>{})}catch(e){}
  ac=null;
  try{const C=window.AudioContext||window.webkitAudioContext;if(C)ac=new C()}catch(e){ac=null}
  return ac;
}
function audioUnlock(){
  if(!(typeof Ears!=='undefined'&&Ears.on))setSession('playback');
  try{if(!ac||ac.state==='closed')newAC();if(ac&&ac.state!=='running'){const r=ac.resume();if(r&&r.catch)r.catch(()=>{})}}catch(e){}
}
/* wartet kurz, bis der Ton wirklich läuft; false heißt: gerade kein Ton möglich */
async function audioReady(ms){
  audioUnlock();if(!ac)return false;if(ac.state==='running')return true;
  const t0=Date.now();while(Date.now()-t0<(ms||500)){await sleep(50);if(ac&&ac.state==='running')return true}
  return false;
}
/* nach dem Zuhören: Ausgabe wieder auf den Lautsprecher legen */

/* ---------- Natürliche Stimme: Piper (Thorsten) läuft direkt im Browser ---------- */
const Piper={
  VOICE:'de_DE-thorsten-medium',LIB:'https://cdn.jsdelivr.net/npm/@diffusionstudio/vits-web@1.0.3/+esm',SIZE_MB:63,
  mod:null,state:'off',progress:0,cache:new Map(),listeners:[],
  allowed(){return !Native.ok&&!window.claude&&/^https?:$/.test(location.protocol)&&!!(navigator.storage&&navigator.storage.getDirectory)},
  emit(){this.listeners.forEach(f=>{try{f()}catch(e){}})},
  async lib(){if(!this.mod)this.mod=await import(this.LIB);return this.mod},
  async init(){
    if(!this.allowed())return;
    try{const t=await this.lib();const s=await t.stored();if(s&&s.includes(this.VOICE)){this.state='ready';this.emit()}}catch(e){this.mod=null}
  },
  async download(){
    if(!this.allowed()||this.state==='loading'||this.state==='ready')return;
    this.state='loading';this.progress=0;this.emit();
    try{
      const t=await this.lib();
      await t.download(this.VOICE,p=>{if(p&&p.total){this.progress=Math.round(p.loaded/p.total*100);this.emit()}});
      this.state='ready';P().settings.natural=true;save();this.emit();
      try{await this.synth('Hallo!')}catch(e){}
    }catch(e){this.state='error';this.emit()}
  },
  /* Die Stimme rechnet in einem eigenen Hintergrund-Thread, immer nur ein Satz auf einmal.
     Wichtig fürs iPhone: Die Bibliothek legt für JEDEN Satz das ganze Sprachmodell (63 MB) neu im Speicher an
     und gibt es nie wieder frei. Nach ein paar Sätzen wird der Speicher so knapp, dass iOS die App beendet
     (zurück zum Startbildschirm). Darum bekommt jeder Satz einen frischen Thread, der danach sofort
     beendet wird – so wird der Speicher jedes Mal komplett frei. */
  worker:null,wcount:0,busy:false,q:[],reqId:0,PER_WORKER:1,
  makeWorker(){
    if(this.worker)return this.worker;
    try{
      const src=`let t=null;onmessage=async e=>{const d=e.data;try{if(!t)t=await import(d.lib);if(d.warm){postMessage({id:d.id,warm:1});return}const b=await t.predict({text:d.text,voiceId:d.voice});const buf=await b.arrayBuffer();postMessage({id:d.id,buf},[buf])}catch(err){postMessage({id:d.id,err:String(err&&err.message||err)})}}`;
      if(!this.wurl)this.wurl=URL.createObjectURL(new Blob([src],{type:'text/javascript'}));
      this.worker=new Worker(this.wurl,{type:'module'});
      this.worker.onerror=e=>{Diag.log('Stimme','Thread-Fehler '+(e&&e.message||''));this.killWorker()};
      this.wcount=0;
    }catch(e){this.worker=null;Diag.log('Stimme','Thread ging nicht: '+(e&&e.message||e))}
    return this.worker;
  },
  killWorker(){if(this.worker){try{this.worker.terminate()}catch(e){}this.worker=null}},
  synth(text){
    if(this.cache.has(text))return Promise.resolve(this.cache.get(text));
    const gen=Voice.pseq;
    const p=new Promise((res,rej)=>{this.q.push({text,gen,res,rej});this.pump()});
    p.catch(()=>{});
    return p;
  },
  async pump(){
    if(this.busy)return;
    const it=this.q.shift();if(!it)return;
    if(it.gen!==Voice.pseq){it.rej(new Error('alt'));return this.pump()}
    this.busy=true;
    try{
      audioUnlock();if(!ac)throw new Error('kein Audio');
      const w=this.makeWorker();
      if(!w)throw new Error('kein Thread');
      const data=await new Promise((res,rej)=>{
        const id=++this.reqId;
        const to=setTimeout(()=>{w.removeEventListener('message',on);this.killWorker();rej(new Error('Zeit'))},15000);
        const on=e=>{if(e.data.id!==id)return;clearTimeout(to);w.removeEventListener('message',on);e.data.err?rej(new Error(e.data.err)):res(e.data.buf)};
        w.addEventListener('message',on);
        w.postMessage({id,text:it.text,voice:this.VOICE,lib:this.LIB});
      });
      if(++this.wcount>=this.PER_WORKER)this.killWorker();
      const buf=await ac.decodeAudioData(data);
      if(it.text.length<=60){this.cache.set(it.text,buf);if(this.cache.size>24)this.cache.delete(this.cache.keys().next().value)}
      it.res(buf);
    }catch(e){this.killWorker();if(e&&e.message!=='alt')Diag.log('Stimme','Satz ging nicht: '+(e&&e.message||e));it.rej(e)}
    finally{this.busy=false;if(this.q.length)this.pump();else this.warm()}
  },
  /* den nächsten Thread schon mal vorbereiten (lädt nur die Bibliothek, nicht das Modell) */
  warm(){
    if(this.worker||!this.usable())return;
    clearTimeout(this.warmT);this.warmT=setTimeout(()=>{if(this.worker||this.busy||!this.usable())return;const w=this.makeWorker();if(w)try{w.postMessage({id:-1,warm:1,lib:this.LIB})}catch(e){}},400);
  },
  reset(){this.killWorker();this.q.forEach(x=>x.rej(new Error('alt')));this.q=[];this.busy=false;this.fails=0;if(this.state==='broken')this.state='ready';this.emit()},
  /* einzelne Sätze, damit Rokko schon spricht, während der nächste Satz entsteht */
  sentences(t){return (t.match(/[^.!?…]+[.!?…]*/g)||[t]).map(x=>x.trim()).filter(Boolean)},
  usable(){return this.state==='ready'&&P().settings.natural!==false&&P().settings.sound}
};

    if(/eddy|flo|grandma|grandpa|oma|opa|reed|rocko|sandy|shelley|compact|kompakt|eloquence|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|albert|fred|junior|kathy|ralph/i.test(n))s-=25;

  async speakNatural(text,it){

    const first=await Promise.race([next,sleep(9000).then(()=>{throw new Error('zu langsam')})]);
    for(let i=0;i<parts.length;i++){
      if(my!==this.pseq||this.cutHere(it,i))break;
      const buf=i===0?first:await next;
      if(my!==this.pseq)return;

        src.onended=()=>{clearTimeout(safety);clearTimeout(watch);if(this.src===src)this.src=null;this.pdone=null;res(true)};

/* ---------- Ton reparieren: alles rund um den Ton neu starten (muss aus einem Tippen heraus kommen) ---------- */
function repairAudio(){
  Diag.log('Ton','Ton reparieren gedrückt');
  Voice.stop();
  try{if(window.speechSynthesis){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}}catch(e){}
  setSession('auto');setSession('playback');
  newAC();try{ac&&ac.resume().catch(()=>{})}catch(e){}
  Piper.reset();
  Voice.failed=false;Voice.failedAt=0;Voice.natPause=0;Voice.badSince=0;Voice.troubled=false;
  const s=P().settings;let note='';
  if(s.muted){s.muted=false;note=' Ich war stumm geschaltet.'}
  if(!s.sound){s.sound=true;note=' Die Töne waren aus.'}
  save();$$('[data-mute]').forEach(b=>{b.outerHTML=muteBtnHTML()});
  if(Native.ok)Native.post({type:'repairAudio'});
  $$('#soundHelp').forEach(h=>h.hidden=true);
  sfx.star();

const Ears={
  native:Native.ok,web:!!(window.SpeechRecognition||window.webkitSpeechRecognition)&&!Native.ok,
  on:false,rec:null,cb:null,blocked:false,
  available(){return(this.native||this.web)&&!this.blocked},
  init(){
    if(this.native){
      Native.on('heard',m=>{if(m.final&&this.cb){const cb=this.cb;cb(m.text,m.alternatives||[])}UI.heard&&UI.heard(m.text,m.final)});
      Native.on('listenState',m=>{this.on=!!m.on;UI.listenState&&UI.listenState(this.on)});
      Native.on('listenError',m=>{if(m.denied){this.blocked=true;UI.toast(ICON.mic,'Mikrofon ist ausgeschaltet. Erlaube es in den iPhone-Einstellungen.')}});
    }
  },
  listen(cb){
    this.cb=cb;if(!this.available())return false;
    Voice.stop();
    if(this.native){Native.post({type:'listen'});return true}
    try{
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(this.rec)try{this.rec.abort()}catch(e){}
      setSession('auto'); /* Mikrofon braucht eine andere Ton-Einstellung; danach wieder zurück auf Lautsprecher */
      const r=new SR();this.rec=r;r.lang='de-DE';r.interimResults=true;r.maxAlternatives=4;
      r.onresult=e=>{const res=e.results[e.results.length-1];const alts=[...res].map(a=>a.transcript);UI.heard&&UI.heard(alts[0],res.isFinal);if(res.isFinal&&this.cb)this.cb(alts[0],alts)};
      r.onerror=e=>{if(/not-allowed|service-not-allowed|audio-capture/.test(e.error)){this.blocked=true;UI.listenBlocked&&UI.listenBlocked()}if(e.error&&!/no-speech|aborted/.test(e.error))Diag.log('Zuhören',e.error)};
      r.onend=()=>{if(this.rec===r){this.on=false;this.rec=null;UI.listenState&&UI.listenState(false)}audioAfterMic()};
      r.start();this.on=true;UI.listenState&&UI.listenState(true);return true;
    }catch(e){this.blocked=true;Diag.log('Zuhören','Start ging nicht: '+(e&&e.message||e));audioAfterMic();return false}
  },
  stop(){const was=this.on||!!this.rec;this.cb=null;if(this.native)Native.post({type:'stopListen'});else if(this.rec)try{this.rec.abort()}catch(e){}this.on=false;UI.listenState&&UI.listenState(false);if(was&&!this.native)audioAfterMic()}
};

/* ---------- Claude formuliert Rokkos Sätze (nur im Claude-Artefakt) ---------- */
const Brain={
  fn:null,dead:false,
  async init(){try{if(window.claude&&window.claude.use)this.fn=await window.claude.use('sample')}catch(e){this.fn=null}},
  on(){return !!this.fn&&!this.dead&&P().settings.ai},
  clean(t){return String(t||'').replace(/[*_#`>"„“”«»]/g,'').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,'').replace(/\s+/g,' ').trim()},
  persona(){const n=P().name;return `Du bist Rokko, ein lustiger, warmherziger Schachroboter. Du spielst an einem echten Schachbrett mit ${n}, einem Kind, das gerade Schach lernt. ${typeof Game!=='undefined'&&Game.me==='b'?n+' spielt Schwarz, du spielst Weiß.':n+' spielt Weiß, du spielst Schwarz.'} Was du schreibst, wird laut vorgelesen.
So sprichst du: wie ein netter großer Freund, natürlich und locker, begeistert und kindgerecht, mit einfachen Wörtern und kurzen Sätzen. Nie belehrend, nie steif, nie roboterhaft. Fang nicht jedes Mal gleich an. Sprich ${n} mit du an und ab und zu mit Namen.
Regeln: Schachfelder immer als Großbuchstabe plus Zahl, zum Beispiel E4. Keine Emojis, keine Sternchen, keine Listen, keine Anführungszeichen. Antworte nur mit dem, was Rokko laut sagt. Benutze keine englischen Wörter wie Wow, Okay, Cool, Star oder Level, sondern deutsche: Boah, Gut, Klasse, Held, Stufe.${Peter.last?`\nZuletzt hast du gesagt: ${Peter.last}\nFormuliere diesmal anders.`:''}`},
  async ask(task,timeout,check){
    if(!this.on())return null;
    const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),timeout||5000);
    try{
      const r=await this.fn(this.persona()+'\n\n'+task,{modelTier:'quick',cache:false,signal:ctl.signal});
      const txt=this.clean(r&&r.text);
      if(!txt||txt.length>420)return null;if(check&&!check(txt))return null;
      return txt;
    }catch(e){if(e&&/not_granted|unavailable/.test(e.code||''))this.dead=true;return null}
    finally{clearTimeout(t)}
  }
};

class Board{
  constructor(host,opt){
    opt=opt||{};this.opt=opt;this.host=host;
    this.cells={};this.pieces=new Array(128).fill(null);
    this.marks={};this.arrowsList=[];
    host.innerHTML=`<div class="boardwrap"><div class="board" role="grid" aria-label="Schachbrett"></div>
      <svg class="arrows" viewBox="0 0 8 8" aria-hidden="true"><defs>
      <marker id="ahP" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--peter)"/></marker>
      <marker id="ahH" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--sun)"/></marker>
      <marker id="ahR" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--danger)"/></marker>
      </defs><g class="ag"></g></svg></div>`;
    this.el=$('.board',host);this.ag=$('.ag',host);
    /* flip: Sicht von Schwarz (Reihe 8 unten, H links) */
    const fl=!!opt.flip;this.flip=fl;
    const rows=fl?[0,1,2,3,4,5,6,7]:[7,6,5,4,3,2,1,0],cols=fl?[7,6,5,4,3,2,1,0]:[0,1,2,3,4,5,6,7];
    for(const r of rows)for(const f of cols){
      const i=r*16+f,b=document.createElement('button');
      b.type='button';b.className='sq'+((r+f)%2===0?' dk':'');b.setAttribute('role','gridcell');
      const edgeF=fl?7:0,edgeR=fl?7:0;
      b.innerHTML=`<span class="nm">${SQ(i)}</span>${f===edgeF?`<span class="cr">${r+1}</span>`:''}${r===edgeR?`<span class="cf">${FILES[f].toUpperCase()}</span>`:''}<span class="slot"></span>`;
      b.addEventListener('click',()=>{audioUnlock();this.opt.onTap&&this.opt.onTap(i)});
      this.el.appendChild(b);this.cells[i]=b;
    }
    this.setNames(opt.names!==undefined?opt.names:true);
  }
  setNames(mode){/* true = Namen auf allen Feldern, 'edge' = nur am Rand, false = keine */
    this.el.classList.toggle('nonames',mode===false);this.el.classList.toggle('edge',mode==='edge');
  }
  setPos(pos){for(const i of ALL_SQ)this.pieces[i]=pos.board[i];this.render()}
  setPieces(arr){for(const i of ALL_SQ)this.pieces[i]=arr[i]||null;this.render()}
  mark(name,list){this.marks[name]=new Set(list||[]);return this}
  clearMarks(){this.marks={};this.arrowsList=[];return this}
  arrows(list){this.arrowsList=list||[];return this}
  render(){
    const M=this.marks,has=(n,i)=>!!(M[n]&&M[n].has(i));
    for(const i of ALL_SQ){
      const el=this.cells[i],p=this.pieces[i],slot=el.lastElementChild;
      let html='';
      if(p)html=pieceSVG(p[0],p[1]);
      if(has('star',i))html+=STARSHAPE;
      if(has('rock',i))html+=ROCK;
      if(slot.innerHTML!==html)slot.innerHTML=html;
      el.classList.toggle('has',!!p||has('star',i)||has('rock',i));
      for(const c of ['last','sel','dot','ring','check','danger','goal','which','found','ok'])el.classList.toggle(c,has(c,i));
      el.setAttribute('aria-label',SQ(i)+(p?', '+(p[0]==='w'?'weiß ':'schwarz ')+NAME[p[1]]:has('star',i)?', Stern':', leer'));
    }
    const xy=this.flip?(i=>[7-(i&7)+.5,(i>>4)+.5]):(i=>[(i&7)+.5,7-(i>>4)+.5]);
    this.ag.innerHTML=this.arrowsList.map(a=>{
      const[x1,y1]=xy(a.from),[x2,y2]=xy(a.to);const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),k=(len-.3)/len;
      const col=a.kind==='hint'?'--sun':a.kind==='bad'?'--danger':'--peter',mk=a.kind==='hint'?'ahH':a.kind==='bad'?'ahR':'ahP';
      return `<line x1="${x1}" y1="${y1}" x2="${(x1+dx*k).toFixed(3)}" y2="${(y1+dy*k).toFixed(3)}" stroke="var(${col})" stroke-width=".18" stroke-linecap="round" opacity=".9" marker-end="url(#${mk})"/>`;
    }).join('');
  }
  flash(i,cls,ms){const el=this.cells[i];if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),ms||450)}
  animate(from,to){
    if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    const pc=this.cells[to]&&this.cells[to].querySelector('.slot .pc');if(!pc)return;
    const a=this.cells[from].getBoundingClientRect(),b=this.cells[to].getBoundingClientRect();
    pc.classList.add('flying');pc.style.transition='none';pc.style.transform=`translate(${a.left-b.left}px,${a.top-b.top}px) scale(1.2)`;
    void pc.getBoundingClientRect();pc.style.transition='transform .6s cubic-bezier(.2,.8,.2,1)';pc.style.transform='';
    setTimeout(()=>{pc.classList.remove('flying');pc.style.transition=''},650);
  }
  collectStar(i){const s=this.cells[i]&&this.cells[i].querySelector('.star');if(s)s.classList.add('got')}
}

const Skills={
  get(id){const s=P().skills[id];return s?s.v:null},
  record(id,ok,w){
    if(!SKILLS[id])return;w=w||1;
    const sk=P().skills[id]||(P().skills[id]={v:40,n:0,ok:0,last:null});
    const a=clamp(0.16*w,0.03,0.4);
    sk.v=Math.round((sk.v+a*((ok?100:0)-sk.v))*10)/10;sk.n++;if(ok)sk.ok++;sk.last=today();
  },
  level(id){const v=this.get(id);if(v==null)return 1;return v<45?1:v<72?2:3},
  stars(id){const v=this.get(id);return v==null?0:Math.round(clamp(v,0,100)/20)},
  weakest(ids){
    ids=ids||Object.keys(SKILLS);
    const known=ids.filter(id=>{const s=P().skills[id];return s&&s.n>=2});
    if(known.length){return known.sort((a,b)=>this.get(a)-this.get(b))[0]}
    return null;
  },
  snapshot(){
    const p=P(),d=today();const last=p.snapshots[p.snapshots.length-1];
    const snap={d,s:Object.fromEntries(Object.entries(p.skills).map(([k,v])=>[k,Math.round(v.v)]))};
    if(last&&last.d===d)p.snapshots[p.snapshots.length-1]=snap;else p.snapshots.push(snap);
    if(p.snapshots.length>60)p.snapshots.shift();
  },
  trend(id){
    const p=P(),now=this.get(id);if(now==null)return 0;
    const old=p.snapshots.find(s=>dayDiff(s.d,today())<=14&&s.s[id]!=null);
    return old?Math.round(now-old.s[id]):0;
  }
};

const LESSONS=[];WORLDS.forEach((w,wi)=>w.lessons.forEach((l,li)=>{l.world=w;l.wi=wi;l.li=li;LESSONS.push(l)}));
function lessonUnlocked(l){const i=LESSONS.indexOf(l);return i===0||!!P().lessons[LESSONS[i-1].id]}
function nextLesson(){return LESSONS.find(l=>!P().lessons[l.id])||null}
function worldDone(w){return w.lessons.every(l=>P().lessons[l.id])}
/* Staffeln: jede Staffel ist eine eigene Karte, die nächste öffnet sich nach der letzten Welt */
const SEASONS=[
  {id:1,name:'Schachland',icon:'map',desc:'Die Grundlagen'},
  {id:2,name:'Taktik-Inseln',icon:'island',desc:'Die Tricks der Profis'}
];
const seasonOf=w=>w.season||1;
const seasonWorlds=n=>WORLDS.filter(w=>seasonOf(w)===n);
function seasonUnlocked(n){const w=seasonWorlds(n)[0];return !!w&&lessonUnlocked(w.lessons[0])}
function seasonDone(n){return seasonWorlds(n).every(worldDone)}

/* Punkte, die man für ein Level braucht: Level n beginnt bei rankStart(n) */
function rankStart(n){let base=0;for(let l=1;l<n;l++)base+=l===1?60:60+l*30;return base}
const XP_RULES=[{icon:'map',t:'Lektion geschafft',xp:15},{star:true,t:'Jeder neue Stern',xp:10},{icon:'target',t:'Training geschafft',xp:10},{icon:'board',t:'Partie gespielt',xp:25},{icon:'trophy',t:'Partie gewonnen',xp:60},{chest:true,t:'Schatztruhe geöffnet',xp:30}];
function rankInfo(xp){
  let lvl=1,need=60,base=0;
  while(xp>=base+need){base+=need;lvl++;need=60+lvl*30}
  return{lvl,title:RANKS[Math.min(RANKS.length-1,lvl-1)],into:xp-base,need,pct:Math.round((xp-base)/need*100)};
}

const Rewards={
  touchDay(){
    const p=P(),d=today();

    p.streak.count=diff===1?p.streak.count+1:1;p.streak.last=d;p.stats.days++;

  },
  addXP(n){
    const p=P(),before=rankInfo(p.xp).lvl;p.xp+=n;const after=rankInfo(p.xp);
    if(after.lvl>before)setTimeout(()=>UI.celebrate(`Neuer Rang: ${after.title}!`,'Du bist jetzt auf Level '+after.lvl+'.','trophy',{kind:'level',lvl:after.lvl}),500);
  },

  checkBadges(){
    const p=P();const got=[];
    for(const b of BADGES){if(!p.badges[b.id]&&b.test(p)){p.badges[b.id]=today();got.push(b)}}

      if(t.id==='lesson'&&kind==='lesson'){t.have++;changed=true}

/* Wie schwer ein Rätsel ist (für die Rätselzahl) und in welcher Lektion es eingeführt wird */
const KIND_BASE={pawncap:120,promote:100,capture:150,escape:150,castle:150,ismate:200,mate:250,rescue:250,fork:350,mps:300,count:330,enpassant:300,nostale:380,pinned:400,pin:520,skewer:520,discover:560,mate2:650};

/* Rätselzahl: steigt mit jedem Rätsel, das beim ersten Versuch klappt (wie eine Elo-Zahl, nur kindgerecht) */
const Rating={
  cur:null,
  get(){return Math.round(P().prating||300)},
  diff(kind,level){return (KIND_BASE[kind]||250)+((level||1)-1)*70},
  update(ok){
    const d=this.cur;if(d==null)return;this.cur=null;
    const p=P(),r=p.prating||300,exp=1/(1+Math.pow(10,(d-r)/250));
    let delta=24*((ok?1:0)-exp);if(ok)delta=Math.max(3,delta);else delta=Math.max(-8,delta);
    p.prating=Math.max(100,Math.round((r+delta)*10)/10);
  },
  learned(){return Object.keys(KIND_LESSON).filter(k=>P().lessons[KIND_LESSON[k]])},
  /* passende Rätsel für den Rätsel-Mix: knapp unter bis knapp über der eigenen Zahl */
  mix(n){
    const r=this.get();let kinds=this.learned();if(!kinds.length)kinds=['capture','pawncap'];
    const opts=[];for(const k of kinds)for(const lv of [1,2,3]){const d=this.diff(k,lv);opts.push({kind:k,level:lv,d,w:Math.exp(-Math.pow((d-(r+30))/140,2))})}
    const out=[];let last=null;
    for(let i=0;i<n;i++){const pool=opts.filter(o=>o.kind!==last);const tot=pool.reduce((a,o)=>a+o.w,0);let x=Math.random()*tot,o=pool[0];for(const q of pool){x-=q.w;if(x<=0){o=q;break}}out.push({t:'puzzle',kind:o.kind,count:1,level:o.level});last=o.kind}
    return out;
  }
};

  progress(n){const c=this.cur;c.done=Math.min(c.items,c.done+(n===0?0:(n||1)));const b=$('.prog i');if(b)b.style.width=Math.round(c.done/c.items*100)+'%'},
  mistake(){this.cur.mistakes++},
  quit(){
    Voice.speak('Möchtest du aufhören? Grün heißt weiterspielen.',{interrupt:true});
    UI.confirm('Aufhören?','Du kannst später genau hier weitermachen.','Weiterspielen','Aufhören',{yesIcon:'play',noIcon:'home'}).then(stay=>{if(!stay){this.cur.alive=false;Voice.stop();UI.go(this.cur.training?'train':'home')}else Voice.stop()});
  },
  async run(){
    const c=this.cur;
    setTimeout(()=>this.progress(0),50);
    for(c.stepIdx=c.startStep||0;c.stepIdx<c.steps.length;c.stepIdx++){
      if(!c.alive)return;
      const step=c.steps[c.stepIdx];
      if(c.lesson){P().resume={id:c.lesson.id,step:c.stepIdx,mistakes:c.mistakes,date:today(),tier:c.tier};save()}
      const fn=STEP[step.t];if(!fn)continue;
      const stage=$('#stage');if(!stage)return;
      stage.innerHTML='';
      await fn(step,stage,c);
      if(!c.alive)return;
      /* Rokko darf seinen Satz zu Ende sprechen, bevor die nächste Aufgabe kommt */
      if(step.t!=='duel'&&step.t!=='talk')await Promise.race([Voice.idle(),sleep(8000)]);
      if(!c.alive)return;
      if(step.t==='duel')return; /* Partie übernimmt */
    }
    this.finish();
  },
  starsFor(c){
    if(c.starsFromDuel!=null)return c.starsFromDuel;
    const r=c.mistakes/Math.max(1,c.items);
    return c.mistakes<=2?3:r<=.5?2:1;
  },
  finish(){
    const c=this.cur;if(!c||!c.alive)return;c.alive=false;
    const p=P(),stars=this.starsFor(c);
    if(c.lesson)p.resume=null;
    let newStars=stars,friend=null,worldNow=false,newSeason=null,medal=null,seasonNow=null;
    if(c.lesson&&c.tier>=2){
      /* Silber oder Gold: zählt ab zwei Sternen, gibt Extra-Sterne beim ersten Mal */
      const had=p.medals[c.lesson.id]||1;newStars=0;
      if(stars>=2&&c.tier>had){p.medals[c.lesson.id]=c.tier;medal=c.tier;newStars=c.tier===3?3:2;Rewards.addXP(c.tier===3?40:25)}
    }else if(c.lesson){
      const prev=p.lessons[c.lesson.id]||0;newStars=Math.max(0,stars-prev);
      const wasDone=worldDone(c.lesson.world);
      const nextSeason=SEASONS.find(z=>z.id===seasonOf(c.lesson.world)+1),wasOpen=nextSeason&&seasonUnlocked(nextSeason.id);
      p.lessons[c.lesson.id]=Math.max(prev,stars);
      if(!prev){p.stats.lessons++;Rewards.progress('lesson')}
      if(!wasDone&&worldDone(c.lesson.world)){worldNow=true;friend=FRIENDS.find(f=>f.world===c.lesson.world.id);p.chests++}
      if(nextSeason&&!wasOpen&&seasonUnlocked(nextSeason.id))newSeason=nextSeason;
      const sid=seasonOf(c.lesson.world);if(!wasDone&&worldDone(c.lesson.world)&&seasonDone(sid))seasonNow=sid;
    }
    Rewards.addStars(newStars);Rewards.addXP(c.lesson?15:10);
    save();
    const badges=Rewards.checkBadges();
    UI.showDone({stars,newStars,lesson:c.lesson,training:c.training,friend,worldNow,newSeason,seasonNow,medal,tier:c.tier,title:c.title,color:c.color});
  }
};

   Silber: ohne Erklärungen, schwerere Rätsel, mehr Sterne und Steine.

const TIER_NAME=['','Bronze','Silber','Gold'];

function lessonTier(l){return P().lessons[l.id]?(P().medals[l.id]||1):0}
function hardenSteps(steps,tier){
  if(!tier||tier<=1)return steps;
  return steps.filter(s=>s.t!=='talk').map(s0=>{const s={...s0};
    if(s.t==='puzzle'){s.level=Math.min(3,Math.max(s.level||1,tier));if(tier>=3)s.count=(s.count||1)+1}
    if(s.t==='stars'){s.stars=Math.min(6,(s.stars||3)+tier-1);if(s.type!=='n'&&s.type!=='k')s.rocks=(s.rocks||0)+(tier-1)*2}
    if(s.t==='reach'){s.level=Math.min(3,(s.level||1)+tier-1);if(tier>=3)s.count=(s.count||1)+1}
    if(s.t==='coordFind'){s.names=tier>=3?false:'edge';s.count=(s.count||4)+2;s.region=null}
    if(s.t==='coordName')s.count=(s.count||4)+2;
    return s});
}

  async reach(step,stage,c){

      const found=new Set();let wrong=0;

  async stars(step,stage,c){

      const lv=Trainer.genStars(type,{stars:nStars,rocks:step.rocks,maxPar:step.maxPar||Math.max(6,nStars+3)});
      if(!lv){Runner.progress(1);continue}
      let cur,left,moves,wrong=0;
      let helping=false;
      const showHelp=(say)=>{
        const path=Trainer.starPath(type,cur,[...left],new Set(lv.rocks));
        if(!path.length)return;helping=true;b.mark('goal',[path[0]]).render();
        if(say)Peter.say(pick(['Ich helfe dir! Zieh auf das gelbe Feld.','Schau mal, das gelbe Feld! Da geht es weiter.']),'smile');
      };
      const reset=()=>{cur=lv.start;left=new Set(lv.stars);moves=0;helping=false;const arr=new Array(128).fill(null);arr[cur]='w'+type;b.clearMarks();b.setPieces(arr);b.mark('star',[...left]).mark('rock',lv.rocks).mark('sel',[cur]).render();upd()};
      const upd=()=>{$('#mv').innerHTML=`${ICON.footprints.replace('<svg','<svg aria-label="Züge"')}<b>${moves}</b>&nbsp;/ ${lv.par}`;$('#mv').classList.toggle('over',moves>lv.par)};
      ctl.innerHTML=`<button class="big ghost wide" data-reset>${ICON.refresh} Nochmal von vorne</button>`;window.__stars={lv,get cur(){return cur},get left(){return [...left]}};
      reset();
      Peter.say(i===0?`Sammle alle Sterne ein! Schaffst du es in ${lv.par} Zügen?`:pick([`Neue Sterne! Ziel: ${lv.par} Züge.`,`Weiter geht's! Wie wäre es mit ${lv.par} Zügen?`]),'smile');
      await new Promise(res=>{
        $('[data-reset]',ctl).onclick=()=>{sfx.tap();reset()};
        b.opt.onTap=sq=>{
          if(sq===cur)return;
          const ok=Trainer.starMoves(type,cur,new Set(lv.rocks),left).includes(sq);
          if(!ok){sfx.nope();b.flash(sq,'bad');wrong++;if(wrong===1){Runner.mistake();recordTask('move_'+type,false,.4,false)}
            if(wrong>=3||moves>=lv.par+3){showHelp(true);return}
            Peter.say(lv.rocks.includes(sq)?'Auf einen Stein kannst du nicht ziehen.':pick([`So kann ${ART[type]} ${NAME[type]} nicht ziehen.`,'Da kommst du nicht in einem Zug hin.']),'think');return}
          const from=cur;cur=sq;moves++;

          b.mark('goal',[]);

  async famduel(step,stage,c){

    stage.innerHTML=`<div class="duelscore"><span class="ds" id="ds0"><b>${esc(kid)}</b><i>0</i></span><span class="dsv">:</span><span class="ds" id="ds1"><b>${esc(adult)}</b><i>0</i></span></div>
      <button class="taskline" data-act="repeat"><span class="tpic">${ICON.bulb}</span><span class="task"></span><span class="tspk">${ICON.speaker}</span></button><div class="bd"></div><div class="ctl"></div>`;
    const b=new Board($('.bd',stage),{names:'edge'});
    const MOVE=['mate','capture','rescue','escape','fork','pawncap','promote','nostale','enpassant','pin','skewer','discover','mate2'];
    let kidKinds=Rating.learned().filter(k=>MOVE.includes(k));if(!kidKinds.length)kidKinds=['capture','pawncap','escape'];
    const adultKinds=['mate2','pin','skewer','discover','fork','mate'];
    for(let i=0;i<step.rounds*2;i++){

      $('.task',stage).textContent=`${name}: ${KIND_TASK[kind]}`;

      c.noRecord=false;
      const pts=wrong===0?2:wrong<4?1:0;score[who]+=pts;
      $(`#ds${who} i`,stage).textContent=score[who];if(pts)sfx.star();
      Peter.say(pts===2?`Zwei Punkte für ${name}!`:pts===1?`Ein Punkt für ${name}.`:`Diesmal kein Punkt für ${name}.`,'smile');
      Runner.progress(1);$('.ctl',stage).innerHTML='';
      await sleep(900);
    }
    const win=score[0]>score[1]?0:score[1]>score[0]?1:-1;
    if(win===0){UI.confetti(90);sfx.win()}
    await Peter.say(win<0?`Unentschieden, ${score[0]} zu ${score[1]}! Ihr seid beide super.`:`${names[win]} gewinnt ${Math.max(...score)} zu ${Math.min(...score)}! ${win===0?'Wahnsinn!':'Nächstes Mal holst du ihn ein, '+kid+'!'}`,'wow');
    await continueBtn(stage,'Fertig');
  },

  async rally(step,stage,c){

    stage.innerHTML=stageHTML('Sammle so viele Sterne wie du kannst!','<div class="rallybar"><i id="rbar"></i></div><div class="counter"><span class="cnt" id="rcnt"></span></div>',pieceSVG('w',type,'i'));

    let cur=type==='b'?sqIdx('c1'):sqIdx('b1'),got=0,star=-1,ends=0;
    const place=()=>{const cand=ALL_SQ.filter(s=>s!==cur&&(type!=='b'||((s>>4)+(s&7))%2===((cur>>4)+(cur&7))%2));
      for(let k=0;k<60;k++){const s=pick(cand);const d=Trainer.solveStars(type,cur,[s],new Set());if(d>=2&&d<=3){star=s;return}}star=pick(cand)};
    const draw=()=>{const arr=new Array(128).fill(null);arr[cur]='w'+type;b.clearMarks();b.setPieces(arr);b.mark('star',[star]).mark('sel',[cur]).render();$('#rcnt').innerHTML=`${STARCHIP}<b>${got}</b>`};
    place();draw();
    Peter.say(`Rallye! Sammle mit ${type==='n'?'dem Springer':'dem Läufer'} so viele Sterne, wie du in einer Minute schaffst. Los!`,'smile');
    await sleep(1800);
    const t0=Date.now();ends=t0+secs*1000;
    await new Promise(res=>{
      const tick=setInterval(()=>{const left=Math.max(0,ends-Date.now());const bar=$('#rbar');if(bar)bar.style.width=(left/(secs*1000)*100)+'%';if(left<=0||!c.alive){clearInterval(tick);b.opt.onTap=null;res()}},200);
      b.opt.onTap=sq=>{
        const ok=Trainer.starMoves(type,cur,new Set(),new Set([star])).includes(sq);
        if(!ok){sfx.nope();b.flash(sq,'bad');return}
        const from=cur;cur=sq;if(sq===star){got++;sfx.star();place()}else sfx.move();draw();b.animate(from,cur);
      };
    });
    if(!c.alive)return;
    const p=P(),key='rally_'+type,best=(p.stats[key]||0);if(got>best){p.stats[key]=got;save()}
    await Peter.say(got>best&&best>0?`Neuer Rekord! ${got} Sterne!`:`Zeit um! Du hast ${got} Sterne gesammelt.${best?' Dein Rekord sind '+Math.max(got,best)+'.':''}`,'wow');
    if(got>best&&best>0){UI.confetti(70);sfx.win()}
    Runner.progress(1);
    await continueBtn(stage,'Fertig');
  }
});

/* ---------- Bilder für Antworten (für Kinder, die noch nicht lesen) ---------- */
function quizPic(p){
  if(p==='yes')return `<span class="qp yes">${ICON.check}</span>`;
  if(p==='no')return `<span class="qp no">${ICON.close}</span>`;
  if(p==='light'||p==='dark')return `<span class="qp sqsw ${p}"></span>`;
  if(p.startsWith('sq:')){const[,s,pc]=p.split(':');return miniBoard(sqIdx(s),pc)}
  return '';
}
function miniBoard(hl,pc){
  /* Ausschnitt: 3×2 Felder rund um das Feld, groß genug, um Farbe und Figur zu erkennen */
  const hx=hl&7,hr=hl>>4,c0=Math.max(0,Math.min(5,hx-1)),r0=Math.max(0,Math.min(6,hr));let r='';
  for(let y=0;y<2;y++)for(let x=0;x<3;x++){const rank=r0+1-y,file=c0+x,sq=rank*16+file;r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${(file+rank)%2===0?'var(--dark-sq)':'var(--light-sq)'}"/>`;if(sq===hl)r+=`<rect x="${x+.04}" y="${y+.04}" width=".92" height=".92" fill="none" stroke="var(--sun)" stroke-width=".08"/>`}
  const x=hx-c0,y=r0+1-hr;const col=pc&&pc===pc.toUpperCase()?'w':'b';
  return `<svg class="qp mini" viewBox="0 0 3 2" aria-hidden="true">${r}${pc?`<svg x="${x+.06}" y="${y+.04}" width=".88" height=".88" class="p${col}">${pieceUses(col,pc.toLowerCase())}</svg>`:''}</svg>`;
}

/* ---------- Rätsel mit Zug ---------- */
function solveMove(pz,b,stage,c,i,skill,kind){
  return new Promise(res0=>{
    const pos=new Pos(pz.fen);let sel=-1,wrong=0,solved=false;window.__pz=pz;
    const res=()=>res0(wrong);
    b.clearMarks();b.setPos(pos);
    const base=()=>{b.clearMarks();b.setPos(pos);
      if(kind==='rescue'){b.mark('danger',[sqIdx(pz.target),sqIdx(pz.by)])}
      if(kind==='escape'){b.mark('check',[pos.kings.w]).mark('danger',[sqIdx(pz.checker)])}
      if(pz.last){b.mark('last',[sqIdx(pz.last.slice(0,2)),sqIdx(pz.last.slice(2,4))])}
      b.render()};
    base();
    const intro={
      mate:['Finde den Zug, der den König mattsetzt!','Kannst du Matt in einem Zug finden?','Schachmatt in einem Zug! Wo ist er?'],
      capture:['Eine meiner Figuren steht ganz allein. Schnapp sie dir!','Adlerauge! Welche Figur kannst du einfach schlagen?'],
      rescue:['Oh nein, eine deiner Figuren wird angegriffen! Rette sie!','Die rot blinkende Figur ist in Gefahr. Was machst du?'],
      escape:['Schach! Dein König muss gerettet werden!','Dein König wird angegriffen. Wie rettest du ihn?'],
      fork:['Finde einen Zug, der zwei Figuren gleichzeitig angreift!','Gabel-Zeit! Welcher Zug greift zwei Figuren an?'],
      pawncap:['Welcher Bauer kann etwas schlagen? Denk dran: schräg!','Bauern schlagen schräg. Wer kann schlagen?'],
      promote:['Bring einen Bauern ganz nach hinten!','Welcher Bauer kann sich verwandeln?'],
      castle:['Mach die Rochade! Tippe den König an und zieh ihn zwei Felder zur Seite.','Rochade! Wohin muss der König?'],
      nostale:['Setz den König matt! Aber Vorsicht vor der Patt-Falle.','Matt in einem Zug! Pass auf, dass es nicht Patt wird.'],
      enpassant:['Der schwarze Bauer ist gerade zwei Felder vorgesprungen. Schlag ihn en passant!','En passant! Dein Bauer geht schräg auf das leere Feld hinter dem schwarzen Bauern.'],
      pin:['Finde einen Zug, der eine Figur vor ihrem König oder ihrer Dame festbindet!','Fessel-Zeit! Welcher Zug bindet eine Figur fest?'],
      skewer:['Greif die vordere Figur an! Wenn sie weg muss, schnappst du die dahinter.','Spieß! Finde den Zug durch zwei Figuren hindurch.'],
      discover:['Zieh eine Figur zur Seite, damit die Figur dahinter Schach gibt! Und greif dabei etwas an.','Abzug! Welche Figur macht den Weg frei?'],
      mate2:['Matt in zwei Zügen! Finde den ersten Zug. Danach bin ich dran, und dann setzt du matt.','Zwei Züge bis zum Matt! Was ist der erste?']
    }[kind]||['Finde den besten Zug!'];
    Peter.say(pick(intro),'smile');
    const sols=new Set(pz.sol);
    const tactic=['pin','skewer','discover'].includes(kind);
    const showHint=()=>{const s=pz.sol[0];b.arrows([{from:sqIdx(s.slice(0,2)),to:sqIdx(s.slice(2,4)),kind:'hint'}]).render()};
    const autoSolve=()=>{
      const s=pz.sol[0];const m=pos.legal().find(x=>sqName(x.from)+sqName(x.to)===s&&(!x.promo||x.promo==='q'));
      if(!m)return;solved=true;b.opt.onTap=null;
      Peter.say(pick(['Das war knifflig! Schau, so geht es.','Ich zeige es dir. Schau genau hin!']),'smile');
      setTimeout(()=>{pos.make(m);b.clearMarks();b.setPos(pos);b.animate(m.from,m.to);m.cap?sfx.capture():sfx.move();
        if(kind==='mate')b.mark('check',[pos.kings.b]).render();
        P().stats.puzzles++;save();setTimeout(res,2600)},1200);
    };
    const fail=(text)=>{
      wrong++;sfx.nope();if(wrong===1){Runner.mistake();recordTask(skill,false,.7,true)}
      if(wrong>=4&&kind!=='escape'){autoSolve();return}
      Peter.say(text,'think');
      if(wrong>=(c.tier>=3?3:2))showHint();
    };
    b.opt.onTap=sq=>{
      if(solved)return;
      const p=pos.board[sq];
      if(sel<0||(p&&p[0]==='w'&&sq!==sel)){
        if(p&&p[0]==='w'){sel=sq;sfx.select();const ds=pos.pseudoFrom(sq);b.mark('sel',[sq]).mark('dot',ds.filter(m=>!m.cap).map(m=>m.to)).mark('ring',ds.filter(m=>m.cap).map(m=>m.to)).render()}
        else if(p){sfx.nope();b.flash(sq,'shake');Peter.say('Das ist meine Figur! Du spielst Weiß.','wow')}
        return;
      }
      if(sq===sel){sel=-1;b.mark('sel',[]).mark('dot',[]).mark('ring',[]).render();return}
      const pseudo=pos.pseudoFrom(sel).filter(m=>m.to===sq);
      const pt=pos.board[sel][1];
      if(!pseudo.length){
        sfx.nope();b.flash(sq,'bad');
        if(kind==='pawncap'&&pt==='p'&&sq===sel+16)Peter.say('Geradeaus kann der Bauer nicht schlagen. Bauern schlagen schräg!','think');
        else Peter.say(`So kann ${ART[pt]} ${NAME[pt]} nicht ziehen.`,'think');
        Skills.record('move_'+pt,false,.3);return;
      }
      let m=pseudo.find(x=>!x.promo||x.promo==='q')||pseudo[0];
      const uci=sqName(m.from)+sqName(m.to);
      if(!pos.isLegal(m)){fail(kind==='escape'?'Dann steht dein König immer noch im Schach!':'Das geht nicht, dann wäre dein König im Schach!');sel=-1;base();return}
      let ok=sols.has(uci);
      if(kind==='escape')ok=true;
      if(kind==='rescue')ok=Trainer.rescueOk(pos,m);
      if(kind==='castle')ok=m.flag==='k'||m.flag==='q';
      if(tactic&&!ok)ok=Trainer.winsMaterial(pos,m); /* jeder Zug, der sicher eine Figur gewinnt, zählt */
      if(kind==='mate2'&&!ok){pos.make(m);ok=pos.isMate();pos.unmake();if(!ok)ok=Trainer.forcesMate2(pos,m)}
      if(!ok){
        let t=pick(ENCOURAGE);
        if(kind==='castle'&&m.piece==='k')t='Fast! Bei der Rochade macht der König zwei Schritte zum Turm.';
        else if(kind==='castle')t='Bei der Rochade fängst du mit dem König an. Zwei Schritte zur Seite!';
        else if(kind==='mate'){pos.make(m);const ch=pos.inCheck();pos.unmake();t=ch?'Schach! Aber der König kann sich noch retten. Gibt es einen besseren Zug?':'Das ist noch kein Schach. Greif den König an, so dass er nicht mehr weg kann!'}
        else if(kind==='capture'&&m.cap)t='Vorsicht, die Figur ist beschützt! Dann schlage ich zurück. Such eine Figur, die ganz allein steht.';
        else if(kind==='capture')t='Schau nochmal genau: Welche Figur von mir steht ganz allein?';
        else if(kind==='rescue')t='Oh, dann kann ich immer noch eine Figur von dir schnappen!';
        else if(kind==='fork')t='Hmm, das greift noch nicht zwei Figuren an. Wo könnte dein Springer hinspringen?';
        else if(kind==='pawncap')t='Das schlägt noch nichts. Welcher Bauer kann schräg schlagen?';
        else if(kind==='nostale'){pos.make(m);const st=!pos.inCheck()&&pos.legal().length===0,ch=pos.inCheck();pos.unmake();t=st?'Oh nein, Patt! Der König steht nicht im Schach, kann aber nirgendwohin. Das wäre unentschieden.':ch?'Schach! Aber der König kann noch weg. Such das Matt!':'Das ist noch kein Schach. Greif den König so an, dass er nicht mehr weg kann!'}
        else if(kind==='enpassant')t=m.piece==='p'&&m.cap?'Das ist ein normaler Schlag. Beim En passant geht dein Bauer schräg auf das leere Feld hinter dem schwarzen Bauern.':'Such deinen Bauern direkt neben dem schwarzen Bauern. Er schlägt schräg nach vorne, auf das leere Feld.';
        else if(kind==='pin')t='Hmm, das bindet noch keine Figur fest. Welche Figur steht vor ihrem König?';
        else if(kind==='skewer')t='Schau auf die Linien: Wo stehen zwei Figuren hintereinander?';
        else if(kind==='discover')t='Welche deiner Figuren versperrt einer anderen den Weg zum König?';
        else if(kind==='mate2')t='Hmm, danach kann sich der König noch retten. Such einen Zug, nach dem es auf jeden Fall Matt gibt!';
        fail(t);
        if(kind==='rescue'||kind==='capture'){pos.make(m);b.setPos(pos);b.animate(m.from,m.to);setTimeout(()=>{pos.unmake();sel=-1;base();if(wrong>=2)showHint()},900)}
        else{sel=-1;base();if(wrong>=(c.tier>=3?3:2))showHint()}
        return;
      }
      solved=true;b.opt.onTap=null;
      pos.make(m);b.clearMarks();b.setPos(pos);b.animate(m.from,m.to);
      m.cap?sfx.capture():sfx.move();setTimeout(()=>sfx.good(),200);
      if(wrong===0)recordTask(skill,true,1,true);else{P().stats.puzzles++;save()}
      let t=praise();
      if(kind==='mate'){b.mark('check',[pos.kings.b]).render();t=pick(['Schachmatt! Super!','Matt! Der König kann nicht mehr weg!','Volltreffer, Schachmatt!'])}
      if(kind==='fork'){const tg=Trainer.forkTargets(pos,m.to);b.arrows(tg.map(x=>({from:m.to,to:x,kind:'bad'}))).render();t='Gabel! Du greifst zwei Figuren gleichzeitig an!';P().stats.forks++}
      if(kind==='promote')t='Juhu, der Bauer wird zur Dame!';
      if(kind==='castle')t='Rochade! Dein König ist jetzt in Sicherheit.';
      if(kind==='escape')t=m.piece==='k'?'Gerettet! Der König ist weggelaufen.':m.cap?'Gerettet! Du hast den Angreifer geschlagen.':'Gerettet! Du hast etwas dazwischen gestellt.';
      if(kind==='capture')t=pick(['Geschnappt! Adlerauge!','Lecker, die Figur gehört dir!','Super gesehen!']);
      if(kind==='rescue')t=pick(['Gerettet! Gut aufgepasst.','Super, jetzt ist alles sicher!']);
      if(kind==='nostale'){b.mark('check',[pos.kings.b]).render();t='Schachmatt, und nicht Patt! Super aufgepasst.'}
      if(kind==='enpassant')t='En passant! Der schwarze Bauer ist weg. Nimm ihn auch auf deinem Brett herunter.';
      if(kind==='mate2')t=pos.isMate()?'Sogar sofort Schachmatt! Super.':'Starker erster Zug!';
      const main=sols.has(uci);
      if(kind==='pin')t=main?'Gefesselt! Die Figur kann nicht mehr weg.':'Stark, damit gewinnst du etwas!';
      if(kind==='skewer')t=main?'Spieß! Jetzt muss die vordere Figur weg.':'Stark, damit gewinnst du etwas!';
      if(kind==='discover')t=pos.inCheck()?'Abzug mit Schach!':'Stark, damit gewinnst du etwas!';
      if(pz.show&&main)b.arrows(pz.show.map(a=>({from:sqIdx(a[0]),to:sqIdx(a[1]),kind:'bad'}))).render();
      Peter.bounce();
      if(pz.follow&&!pos.isMate()){Peter.say(t+' Jetzt bin ich dran.','wow');setTimeout(()=>followCapture(pos,b,stage,{mate:!!pz.mate,gold:c.tier>=3}).then(res),1700);return}
      Peter.say(t,'wow');
      setTimeout(res,1500);
    };
  });
}

/* ---------- Zweiter Zug: Rokko antwortet, das Kind holt sich die Figur ---------- */
function followCapture(pos,b,stage,opt){
  opt=opt||{};
  return new Promise(res=>{
    const reps=pos.legal();const r=opt.mate?pick(reps):Trainer.toughestReply(pos);if(!r){res();return}
    pos.make(r);b.clearMarks();b.setPos(pos);b.mark('last',[r.from,r.to]);b.animate(r.from,r.to);b.render();r.cap?sfx.capture():sfx.move();
    const wins=opt.mate?allMatesInOne(pos):Trainer.winningCaptures(pos);
    if(!wins.length){Peter.say('Ich konnte mich gerade noch retten. Trotzdem ein toller Zug!','think');setTimeout(res,1800);return}
    const ask=opt.mate?'Und jetzt: Schachmatt!':'Und jetzt? Schnapp dir eine Figur!';
    Peter.say(r.flag==='k'||r.flag==='q'?'Ich mache die Rochade. '+ask:`Ich ziehe ${ART[r.piece]==='die'?'die':'den'} ${NAME[r.piece]} nach ${SQ(r.to)}. ${ask}`,'think');
    const good=new Set(wins.map(m=>sqName(m.from)+sqName(m.to)));
    window.__pz={sol:[sqName(wins[0].from)+sqName(wins[0].to)]};
    let sel=-1,wrong=0,done=false;
    const hint=()=>{const w=wins[0];b.arrows([{from:w.from,to:w.to,kind:'hint'}]).render()};
    const finish=m=>{done=true;b.opt.onTap=null;pos.make(m);b.clearMarks();b.setPos(pos);b.animate(m.from,m.to);m.cap?sfx.capture():sfx.move();setTimeout(()=>sfx.good(),200);
      if(pos.isMate())b.mark('check',[pos.kings.b]).render();
      Peter.say(pos.isMate()?'Schachmatt! Die Taktik hat super geklappt.':pick(['Geschnappt! Die Taktik hat geklappt.','Lecker! Genau dafür war der Trick da.']),'wow');Peter.bounce();setTimeout(res,1600)};
    b.opt.onTap=sq=>{
      if(done)return;const p=pos.board[sq];
      if(p&&p[0]==='w'){sel=sq;sfx.select();const ds=pos.pseudoFrom(sq);b.mark('sel',[sq]).mark('dot',ds.filter(m=>!m.cap).map(m=>m.to)).mark('ring',ds.filter(m=>m.cap).map(m=>m.to)).render();return}
      if(sel<0)return;
      const m=pos.legal().find(x=>x.from===sel&&x.to===sq&&(!x.promo||x.promo==='q'));
      if(!m){sfx.nope();b.flash(sq,'bad');return}
      if(good.has(sqName(m.from)+sqName(m.to)))return finish(m);
      wrong++;sfx.nope();b.flash(sq,'bad');sel=-1;b.mark('sel',[]).mark('dot',[]).mark('ring',[]).render();
      if(wrong>=4){Peter.say('Schau, so geht es!','smile');return finish(wins[0])}
      const showH=wrong>=(opt.gold?3:2);
      Peter.say(showH?'Der gelbe Pfeil zeigt es dir.':opt.mate?'Das ist noch kein Matt. Greif den König so an, dass er nicht mehr weg kann!':'Hmm, da gibt es etwas Besseres. Welche Figur kannst du jetzt sicher schlagen?','think');
      if(showH)hint();
    };
  });
}

      else{bt.classList.add('wrong');bt.disabled=true;sfx.nope();if(first){Runner.mistake();recordTask('count',false,.6,true)}first=false;

/* Gefesselte Figur antippen */
function askPinned(pz,b,stage,c,i){
  return new Promise(res=>{
    const pos=new Pos(pz.fen),tg=sqIdx(pz.target);b.clearMarks();b.setPos(pos);b.render();window.__pz={tap:pz.target};
    Peter.say(i===0?'Eine schwarze Figur ist gefesselt: Sie steht vor ihrem König und darf nicht weg. Welche ist es? Tippe sie an!':pick(['Welche Figur ist hier gefesselt?','Finde die festgebundene Figur!']),'think');
    let wrong=0,done=false;
    b.opt.onTap=sq=>{
      if(done)return;const p=pos.board[sq];
      if(sq===tg){done=true;b.opt.onTap=null;sfx.good();recordTask('pin',wrong===0,.7,true);b.mark('danger',[tg]).arrows([{from:sqIdx(pz.by),to:sqIdx(pz.king),kind:'bad'}]).render();
        Peter.say(`Richtig! ${cap1(ART[p[1]])} ${NAME[p[1]]} ist gefesselt. Zieht ${PRON[p[1]]} weg, steht der König im Schach.`,'wow');Peter.bounce();setTimeout(res,2200);return}
      sfx.nope();b.flash(sq,'bad');wrong++;if(wrong===1){Runner.mistake();recordTask('pin',false,.7,true)}
      if(p&&p[0]==='w')Peter.say('Das ist deine Figur. Wir suchen eine schwarze Figur.','think');
      else if(p&&p[1]==='k')Peter.say('Fast! Das ist der König selbst. Welche Figur steht direkt vor ihm?','think');
      else Peter.say(wrong>=2?'Schau dem roten Pfeil nach!':'Die kann noch weg. Such die Figur zwischen einer weißen Figur und dem schwarzen König.','think');
      if(wrong>=2)b.arrows([{from:sqIdx(pz.by),to:sqIdx(pz.king),kind:'bad'}]).render();
    };
  });
}

function startTraining(id,fig){
  const tr=TRAININGS.find(t=>t.id===id);if(!tr)return;

  if(tr.pickPiece&&!fig){UI.pickPiece(tr,f=>startTraining(id,f));return}
  const w=fig&&WORLDS.find(x=>x.fig===fig&&x.id!=='brett');
  Runner.start({title:id==='piece'?NAME[fig]:tr.name+(fig?' · '+NAME[fig]:''),color:w?w.c:tr.c,steps:tr.steps(fig),training:tr});
}
function trainingForSkill(skill){
  if(skill.startsWith('move_')){const f=skill.slice(5);return()=>startTraining('piece',f)}
  const t=SKILLS[skill]&&SKILLS[skill].train;const tr=TRAININGS.find(x=>x.id===t);

}

   Rokko-Schach · Partie am echten Brett
   Alexander zieht am Brett und sagt (oder tippt) seinen Zug,
   Rokko antwortet, beobachtet und lernt mit.

/* ---------- Sprache verstehen ---------- */
const NUMW={eins:1,ein:1,eine:1,einz:1,zwei:2,zwo:2,drei:3,vier:4,'fünf':5,fuenf:5,funf:5,sechs:6,sieben:7,acht:8};
const LETW={a:'a',ah:'a',aa:'a',b:'b',be:'b',bee:'b',c:'c',ce:'c',zeh:'c',tse:'c',ze:'c',see:'c',d:'d',de:'d',dee:'d',e:'e',eh:'e',ee:'e',f:'f',ef:'f',eff:'f',g:'g',ge:'g',geh:'g',gay:'g',h:'h',ha:'h',hah:'h',haa:'h'};
const PIECEW=[[/^(bauer|bauern|bäuerchen|bauerchen|bauers)$/,'p'],[/^(springer|springers|pferd|pferdchen|pferdes|rössel|roessel|rössl|ross|pony|springa)$/,'n'],[/^(läufer|laeufer|laufer|leufer|läufers|läuferin)$/,'b'],[/^(turm|türme|tuerme|turme|turms|thurm)$/,'r'],[/^(dame|damen|königin|koenigin|konigin)$/,'q'],[/^(könig|koenig|konig|königs)$/,'k']];
function parseSpeech(raw){
  const s=(' '+String(raw||'').toLowerCase()+' ').replace(/[.,!?;:–—\-_/"'„“()]/g,' ').replace(/\s+/g,' ');
  const tokens=s.trim().split(' ').filter(Boolean);
  const out={squares:[],piece:null,castle:null,promo:null,cmd:null,text:raw};
  for(let i=0;i<tokens.length;i++){
    const tok=tokens[i];let mm;
    if((mm=tok.match(/^([a-h])([1-8])$/))){out.squares.push(mm[1]+mm[2]);continue}
    if((mm=tok.match(/^([a-h][1-8])([a-h][1-8])$/))){out.squares.push(mm[1],mm[2]);continue}
    if(LETW[tok]&&i+1<tokens.length){const nx=tokens[i+1];const n=/^[1-8]$/.test(nx)?+nx:NUMW[nx];if(n){out.squares.push(LETW[tok]+n);i++;continue}}
    for(const [re,pc] of PIECEW){if(re.test(tok)){if(/^(wird|zur|zum|umwandeln|umwandlung|in)$/.test(tokens[i-1]||''))out.promo=pc;else if(!out.piece)out.piece=pc;break}}
  }
  if(/rochade|rochier/.test(s))out.castle=/kurz/.test(s)?'k':/lang/.test(s)?'q':'any';
  if(!out.squares.length&&!out.castle){
    if(/zurück|zurueck|rückgängig|rueckgaengig|zurücknehmen/.test(s))out.cmd='undo';
    else if(/^ ?(ja|jo|jap|jawohl|ok|okay|gerne|bitte|klar) /.test(s))out.cmd='yes';
    else if(/^ ?(nein|nee|ne|nö|weiter|lass) /.test(s))out.cmd='no';
    else if(/tipp|tip |hilfe|hilf mir|was soll ich/.test(s))out.cmd='hint';
    else if(/neues spiel|von vorne|von vorn|nochmal spielen|noch mal spielen|neu anfangen/.test(s))out.cmd='new';
    else if(/wieder vor|vorwärts|vorwaerts|nach vorne| vor $/.test(s))out.cmd='redo';
    else if(/brett prüfen|prüfen|pruefen|stimmt nicht|brett stimmt|kontrollier/.test(s))out.cmd='check';
    else if(/wiederhol|nochmal sagen|noch mal sagen|was hast du gesagt|nicht verstanden|was hast du gezogen|wohin hast du|welchen zug|was war dein zug/.test(s))out.cmd='repeat';
    else if(/aufhören|aufhoeren|stopp|stop|pause|hör auf/.test(s))out.cmd='stop';
  }
  return out;
}
function pickPromo(c,promo){return c.find(m=>m.promo===(promo||'q'))||c[0]}
function resolveMove(pos,r,pendingFrom,legalFn){
  const legal=legalFn?legalFn(pos):pos.legal();
  if(r.castle){
    const c=legal.filter(m=>m.flag==='k'||m.flag==='q');
    const want=r.castle==='any'?c:c.filter(m=>m.flag===r.castle);
    if(want.length===1)return{move:want[0]};
    if(want.length>1)return{error:'Kurze oder lange Rochade?'};
    return{error:'Eine Rochade geht gerade nicht. König und Turm dürfen noch nicht gezogen haben, dazwischen muss alles frei sein, und dein König darf nicht im Schach stehen.'};
  }
  const sq=r.squares.map(sqIdx);
  if(sq.length>=2){
    const f=sq[0],t=sq[1];const c=legal.filter(m=>m.from===f&&m.to===t);
    if(c.length)return{move:pickPromo(c,r.promo)};
    const p=pos.board[f];
    if(!p||p[0]!==pos.turn)return{error:`Auf ${SQ(f)} steht keine Figur von dir.`};
    return{error:`${cap1(NOM_DEIN[p[1]])} auf ${SQ(f)} kann nicht nach ${SQ(t)} ziehen.`,show:f,illegalPiece:p[1]};
  }
  if(sq.length===1){
    const t=sq[0];
    if(pendingFrom!=null&&pendingFrom>=0){const c=legal.filter(m=>m.from===pendingFrom&&m.to===t);if(c.length)return{move:pickPromo(c,r.promo)}}
    let c=legal.filter(m=>m.to===t);
    if(r.piece)c=c.filter(m=>m.piece===r.piece);
    if(!c.length){
      const p=pos.board[t];
      if(p&&p[0]===pos.turn&&(!r.piece||r.piece===p[1]))return legal.some(m=>m.from===t)?{select:t}:{error:`${cap1(NOM_DEIN[p[1]])} auf ${SQ(t)} kann gerade nirgendwohin.`};
      if(r.piece)return{error:`${cap1(NOM_DEIN[r.piece])} kann nicht nach ${SQ(t)} ziehen.`,illegalPiece:r.piece};
      return{error:`Keine deiner Figuren kann nach ${SQ(t)} ziehen.`};
    }
    if(!r.piece){const pw=c.filter(m=>m.piece==='p');if(pw.length)c=pw}
    const froms=[...new Set(c.map(m=>m.from))];
    if(froms.length===1)return{move:pickPromo(c,r.promo)};
    return{which:froms,to:t};
  }
  if(r.piece){
    const fr=[...new Set(legal.filter(m=>m.piece===r.piece).map(m=>m.from))];
    if(fr.length===1)return{select:fr[0]};
    if(!fr.length)return{error:`${cap1(NOM_DEIN[r.piece])} kann gerade nicht ziehen.`};
    return{error:`Welcher ${NAME[r.piece]}, und wohin? Sag zum Beispiel: ${NAME[r.piece]} nach ${SQ(legal.find(m=>m.piece===r.piece).to)}.`};
  }
  return{error:null};
}
function moveText(m){
  if(m.flag==='k')return 'O-O';if(m.flag==='q')return 'O-O-O';
  return (LETTER[m.piece]?LETTER[m.piece]+' ':'')+SQ(m.from)+(m.cap?' × ':' – ')+SQ(m.to)+(m.promo?' = '+LETTER[m.promo]:'');
}
function moveFacts(m,who){
  const mine=who==='peter';
  if(m.flag==='k'||m.flag==='q'){const r=m.color==='b'||(!m.color&&mine)?8:1;return `${m.flag==='k'?'kurze':'lange'} Rochade (König von E${r} nach ${m.flag==='k'?'G':'C'}${r}, Turm von ${m.flag==='k'?'H':'A'}${r} nach ${m.flag==='k'?'F':'D'}${r})`}
  let s=`${NAME[m.piece]} von ${SQ(m.from)} nach ${SQ(m.to)}`;
  if(m.flag==='e')s+=', schlägt en passant';else if(m.cap)s+=`, schlägt ${mine?'den':'Rokkos'} ${NAME[m.cap]}`;
  if(m.promo)s+=`, der Bauer wird zur ${m.promo==='q'?'Dame':NAME[m.promo]}`;
  return s;
}
function fbPeterMove(m){
  const R=m.color==='w'?1:8;
  if(m.flag==='k')return pick([`So, ich mache die kurze Rochade. Mein König hüpft nach G${R} und der Turm auf F${R}.`,`Ich verstecke meinen König: kurze Rochade! König nach G${R}, Turm nach F${R}.`]);
  if(m.flag==='q')return `Ich mache die lange Rochade. Mein König geht nach C${R} und der Turm nach D${R}.`;
  if(m.flag==='e')return `Achtung, Spezialtrick! Mein Bauer schlägt en passant und landet auf ${SQ(m.to)}. Nimm deinen Bauern daneben vom Brett.`;
  let t;
  if(m.cap)t=pick([`Hehe, erwischt! ${cap1(NOM_MEIN[m.piece])} von ${SQ(m.from)} schnappt sich ${ACC_DEIN[m.cap]} auf ${SQ(m.to)}.`,`Zack! Ich schlage mit ${DAT_MEIN[m.piece]} von ${SQ(m.from)} auf ${SQ(m.to)}. Nimm ${ACC_DEIN[m.cap]} bitte vom Brett.`]);
  else t=pick([`Alles klar, ich hab's! ${cap1(NOM_MEIN[m.piece])} geht von ${SQ(m.from)} nach ${SQ(m.to)}.`,`Ich nehme ${ACC_MEIN[m.piece]} von ${SQ(m.from)} und stelle ${PRON_A[m.piece]} auf ${SQ(m.to)}.`,`Hmm, lass mich mal … ja! ${cap1(NOM_MEIN[m.piece])} zieht von ${SQ(m.from)} nach ${SQ(m.to)}.`,`Jetzt bin ich dran: ${NAME[m.piece]} von ${SQ(m.from)} nach ${SQ(m.to)}.`]);
  if(m.promo)t+=` Und mein Bauer wird zur ${m.promo==='q'?'Dame':NAME[m.promo]}!`;
  return t;
}

/* ---------- Rückblick für Kinder: die drei wichtigsten Momente, von Rokko erklärt ---------- */
const Review={
  GOOD:['goodMate','fork','goodCapture','castle','promo','saved'],
  LEARN:['missedMate','blunderMate','missedCapture','blunder'],
  pick(gm){
    const ev=(gm.events||[]).filter(e=>typeof e.ply==='number');
    const byPrio=list=>list.flatMap(k=>ev.filter(e=>e.kind===k));
    const G=byPrio(this.GOOD),L=byPrio(this.LEARN),out=[],seen=new Set();
    const add=e=>{if(!e||out.length>=3)return;const k=e.ply+':'+e.kind;if(seen.has(k))return;seen.add(k);out.push(e)};
    add(G[0]);add(L[0]);add(L.find(e=>!seen.has(e.ply+':'+e.kind)&&e.kind!==(L[0]&&L[0].kind))||L[1]);add(G.find(e=>!seen.has(e.ply+':'+e.kind)));
    return out.sort((a,b)=>a.ply-b.ply);
  },
  say(e){
    const n=Math.floor(e.ply/2)+1,Z=`Zug ${n}: `;
    switch(e.kind){
      case 'goodMate':return Z+'Schachmatt! Damit hast du gewonnen.';
      case 'fork':return Z+'Deine Gabel! Du hast zwei Figuren auf einmal angegriffen.';
      case 'goodCapture':return Z+'Adlerauge! Da hast du eine freie Figur geschnappt.';
      case 'castle':return Z+'Rochade! Danach war dein König gut versteckt.';
      case 'promo':return Z+'Dein Bauer ist ganz hinten angekommen und wurde zur Dame.';
      case 'saved':return Z+'Gut aufgepasst! Du hast deine bedrohte Figur gerettet.';
      case 'missedMate':return Z+'Hier gab es ein Schachmatt! Der gelbe Pfeil zeigt es dir.';
      case 'missedCapture':return Z+'Hier stand eine Figur ganz allein. Der gelbe Pfeil zeigt, wie du sie hättest schlagen können.';
      case 'blunderMate':return Z+'Hier musst du aufpassen: Danach war ein Schachmatt gegen dich möglich.';
      case 'blunder':return Z+`Hier kam ${NOM_DEIN[e.piece]||'eine Figur'} in Gefahr. Der rote Pfeil zeigt, wer angreift.`;
    }
    return Z+(e.text||'');
  },
  open(gm){
    const start=new Pos(gm.fen||(gm.variant==='pawns'?PAWNS_FEN:START_FEN)),fens=[start.fen()],moves=[],side=gm.side||'w';
    const lg=p=>gm.variant==='give'?giveLegal(p):p.legal();
    for(const u of gm.moves||[]){const m=lg(start).find(x=>sqName(x.from)+sqName(x.to)+(x.promo||'')===u);if(!m)break;start.make(m);moves.push(m);fens.push(start.fen())}
    const mom=this.pick(gm);let i=0;
    Ears.stop();
    UI.sheet(`<div style="display:flex;align-items:center;gap:10px"><h2 style="flex:1">Rückblick</h2><button class="iconbtn" data-x aria-label="Schließen">${ICON.close}</button></div>
      <div id="rvBoard"></div>
      <p class="rvtext" id="rvText"></p>
      <div class="cbstep"><button class="big ghost" data-prev aria-label="Voriger Moment">${ICON.back}</button><span class="rvdots" id="rvDots"></span><button class="big ghost" data-next aria-label="Nächster Moment">${ICON.next}</button></div>
      <button class="big go wide" data-x>${ICON.check} Fertig</button>`,(sh,close)=>{
      const b=new Board($('#rvBoard',sh),{names:'edge',flip:side==='b'});
      const show=()=>{
        b.clearMarks();
        if(!mom.length){b.setPos(new Pos(fens[fens.length-1]));b.render();$('#rvText',sh).textContent='Eine spannende Partie! Ich habe keine großen Fehler gesehen. Weiter so!';Voice.speak($('#rvText',sh).textContent,{interrupt:true});return}
        const e=mom[i],good=this.GOOD.includes(e.kind);
        const ply=e.best?e.ply:Math.min(fens.length-1,e.ply+1);
        const pos=new Pos(fens[ply]);b.setPos(pos);
        const m=moves[e.ply];const ar=[];
        if(e.best){ar.push({from:sqIdx(e.best.slice(0,2)),to:sqIdx(e.best.slice(2,4)),kind:'hint'})}
        else if(m){b.mark('last',[m.from,m.to])}
        if(/blunder/.test(e.kind)){const th=threatsAgainst(pos,side)[0];if(th){b.mark('danger',[th.sq]);ar.push({from:th.by,to:th.sq,kind:'bad'})}}
        if(e.kind==='fork'&&m){Trainer.forkTargets(pos,m.to).forEach(t=>ar.push({from:m.to,to:t,kind:'bad'}))}
        if(e.kind==='goodMate')b.mark('check',[pos.kings[side==='w'?'b':'w']]);
        b.arrows(ar).render();
        const t=this.say(e);$('#rvText',sh).innerHTML=`<span class="rvk ${good?'good':'learn'}">${good?ICON.check:ICON.bulb}</span><span>${esc(t)}</span>`;
        $('#rvDots',sh).innerHTML=mom.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('');
        $('[data-prev]',sh).disabled=i===0;$('[data-next]',sh).disabled=i===mom.length-1;
        Voice.speak(t,{interrupt:true,force:true});
      };
      show();
      sh.onclick=e=>{audioUnlock();
        if(e.target.closest('[data-x]')){Voice.stop();return close()}
        if(e.target.closest('[data-prev]')&&i>0){i--;sfx.tap();show()}
        if(e.target.closest('[data-next]')&&i<mom.length-1){i++;sfx.tap();show()}};
    });
  }
};

  vinfo(){return this.VARIANTS[this.variant]||this.VARIANTS.standard},
