  },
  exportSheet(){
    save();const code=Store.exportCode();
    UI.sheet(`<h2>Spielstand sichern</h2><p class="muted" style="margin:0">Diesen Code aufbewahren. Mit „Wiederherstellen“ holst du den Spielstand zurück.</p>
      <textarea class="field" id="expCode" rows="5" readonly style="font-size:.8rem;font-family:ui-monospace,monospace;word-break:break-all">${esc(code)}</textarea>
      <div class="row"><button class="big go" data-copy>Kopieren</button>${navigator.share?'<button class="big ghost" data-share>Teilen</button>':''}</div>
      <button class="big ghost" data-x>Schließen</button>`,(s,close)=>{
      $('[data-x]',s).onclick=close;
      $('[data-copy]',s).onclick=()=>{const t=$('#expCode',s);navigator.clipboard&&navigator.clipboard.writeText(code).then(()=>UI.toast(ICON.check,'Kopiert!'),()=>{t.select()})||t.select()};
      const sh=$('[data-share]',s);if(sh)sh.onclick=()=>{navigator.share({title:'Schach mit Rokko – Spielstand',text:code}).catch(()=>{})};
    });
  },
  importSheet(){
    UI.sheet(`<h2>Spielstand wiederherstellen</h2><p class="muted" style="margin:0">Füge den gesicherten Code ein. Der jetzige Spielstand wird vorher noch einmal gesichert.</p>
      ${navigator.clipboard&&navigator.clipboard.readText?'<button class="big" data-paste>Aus Zwischenablage einfügen</button>':''}
      <textarea class="field" id="impCode" rows="5" placeholder="ROKKO1:…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="font-size:.8rem;font-family:ui-monospace,monospace;word-break:break-all"></textarea>
      <div class="row"><button class="big go" data-ok>Übernehmen</button><button class="big ghost" data-x>Abbrechen</button></div>`,(s,close)=>{
      $('[data-x]',s).onclick=close;
      const ta=$('#impCode',s);
      const apply=txt=>{if(Store.importCode(txt)){close();UI.toast(ICON.check,'Spielstand wiederhergestellt');UI.go('parents');return true}
        sfx.nope();const n=String(txt||'').replace(/\s/g,'').length;
        UI.toast(ICON.close,n<200?'Da ist noch kein Code drin. Bitte zuerst einfügen.':'Der Code ist unvollständig ('+n+' Zeichen). Bitte nochmal ganz kopieren.');return false};
      const pb=$('[data-paste]',s);if(pb)pb.onclick=()=>{navigator.clipboard.readText().then(t=>{ta.value=t;apply(t)},()=>{ta.focus();UI.toast(ICON.close,'Bitte lang ins Feld tippen und „Einfügen“ wählen.')})};
      $('[data-ok]',s).onclick=()=>apply(ta.value);
    });
  },
  showText(t){UI.sheet(`<h2>Protokoll</h2><p class="small muted" style="margin:0">Text markieren und kopieren.</p><textarea class="field" style="min-height:240px;font:12px/1.4 ui-monospace,Menlo,monospace" readonly>${esc(t)}</textarea>`,(s)=>{const ta=$('textarea',s);ta.focus();ta.select()})},
  replay(gm){
    if(!gm)return;
    const start=new Pos(gm.fen||(gm.variant==='pawns'?PAWNS_FEN:START_FEN));const fens=[start.fen()],moves=[];
    for(const u of gm.moves){const m=(gm.variant==='give'?giveLegal(start):start.legal()).find(x=>sqName(x.from)+sqName(x.to)+(x.promo||'')===u);if(!m)break;start.make(m);moves.push(m);fens.push(start.fen())}
    let ply=fens.length-1;
    const keyEv=gm.events.filter(e=>!/illegal|hint/.test(e.kind));
    const evColor=k=>/blunder|missed/.test(k)?'var(--danger)':/good|castle|fork|saved|promo/.test(k)?'var(--good)':'var(--muted)';
    UI.sheet(`<div style="display:flex;align-items:center;gap:10px"><h2 style="flex:1">Partie ansehen</h2><button class="iconbtn" data-x aria-label="Schließen">${ICON.close}</button></div>
      <div id="rb"></div>
      <div class="row" style="align-items:center"><button class="big ghost" data-prev style="flex:0 0 64px">${ICON.back}</button><span id="rply" style="flex:1;text-align:center;font-family:var(--font-display);font-weight:700"></span><button class="big ghost" data-next style="flex:0 0 64px">${ICON.next}</button></div>
      ${keyEv.length?`<h3>Wichtige Momente</h3><ul class="moments">${keyEv.map((e,i)=>`<li><button data-ev="${i}"><span class="k" style="background:${evColor(e.kind)}"></span><span><b>Zug ${Math.floor(e.ply/2)+1}</b> · ${esc(e.text)}${e.move?' ('+esc(e.move)+')':''}</span></button></li>`).join('')}</ul>`:'<p class="muted" style="margin:0">Keine besonderen Momente.</p>'}`,(s,close)=>{
      const b=new Board($('#rb',s),{names:'edge',flip:gm.side==='b'});
      const show=()=>{const pos=new Pos(fens[ply]);b.clearMarks();b.setPos(pos);const m=moves[ply-1];
        let best=null;const ev=keyEv.find(e=>e.best&&e.ply===ply);
        if(m)b.mark('last',[m.from,m.to]);
        if(ev)best={from:sqIdx(ev.best.slice(0,2)),to:sqIdx(ev.best.slice(2,4)),kind:'hint'};
        b.arrows(best?[best]:[]).render();
        const mc=ply?new Pos(fens[ply-1]).turn:'w',who=gm.variant==='family'?(mc==='w'?P().name:(gm.opp||'Schwarz')):mc===(gm.side||'w')?P().name:'Rokko';
        $('#rply',s).textContent=ply?`Zug ${Math.ceil(ply/2)} (${who}): ${moveText(m)}`:'Anfangsstellung';
        if(ev)$('#rply',s).textContent+=' · Gelber Pfeil: besserer Zug';
        $$('[data-ev]',s).forEach(x=>{const k=keyEv[+x.dataset.ev];x.setAttribute('aria-pressed',String(k.best?k.ply===ply:k.ply===ply-1))});
      };
      show();
      s.onclick=e=>{if(e.target.closest('[data-x]'))close();if(e.target.closest('[data-prev]')&&ply>0){ply--;show()}if(e.target.closest('[data-next]')&&ply<fens.length-1){ply++;show()}
        const ev=e.target.closest('[data-ev]');if(ev){const k=keyEv[+ev.dataset.ev];ply=Math.min(fens.length-1,k.best?k.ply:k.ply+1);show()}};
    });
  }
};
UI.screens.parents=Parents;
UI.refreshVoiceSelect=()=>{if(UI.current==='parents'){const sel=$('#voiceSel');if(sel){const v=Voice.list();sel.innerHTML=v.length?v.map(x=>`<option value="${esc(x.id)}" ${x.id===P().settings.voice?'selected':''}>${esc(x.name)}${x.good?' ★':''}</option>`).join(''):'<option value="">Standardstimme</option>'}}};

/* ===================================================================
   Rokko-Schach · Start
   =================================================================== */
/* Läuft noch eine Partie? Dann kann man sie mit einem Tippen fortsetzen (auch nach einem Absturz). */
function runningGame(){const c=P().game.current;return c&&c.moves&&(c.moves.length>0||c.variant==='family')&&!c.lesson?c:null}
function splash(chosen){
  const d=Store.data,list=Object.values(d.profiles),p=P();
  const el=$('#splash');el.hidden=false;
  const rg=list.length>1&&!chosen?null:runningGame();
  el.innerHTML=`<div class="splash-in">
    <div class="peter" data-mood="smile">${peterSVG(p.outfit)}</div>
    <h1>Schach mit Rokko</h1>
    ${rg?`<div class="resume"><div class="resume-board" id="resumeBoard" aria-hidden="true"></div>
        <button class="big go wide" data-resume style="min-height:66px;font-size:1.3rem">${ICON.play} Partie weiterspielen</button></div>
        <button class="big ghost" data-go style="min-height:48px;font-size:1.05rem">${ICON.home} Zum Start</button>`
    :`<p class="muted" style="margin:0">Lernen, rätseln und am echten Brett gegen Rokko spielen.</p>
    ${list.length>1?`<div class="profiles">${list.map(x=>`<button data-p="${x.id}"><span class="avatar" style="${x.id===d.current?'border-color:var(--sun)':''}">${avatarSVG(x.avatar)}</span>${esc(x.name)}</button>`).join('')}</div>`
      :`<button class="big go wide" data-go style="min-height:66px;font-size:1.35rem">${ICON.play} Los geht's, ${esc(p.name)}!</button>
        <button class="big ghost" data-other style="min-height:44px;font-size:1rem">Jemand anderes spielt</button>`}`}
    <p class="hint-line">Ton an! Rokko spricht mit dir.</p>
  </div>`;
  if(rg){try{const g=new Pos(rg.variant==='pawns'?PAWNS_FEN:START_FEN);for(const u of rg.moves){const m=g.legal().find(x=>sqName(x.from)+sqName(x.to)+(x.promo||'')===u);if(!m)break;g.make(m)}
    const b=new Board($('#resumeBoard',el),{names:false});b.setPos(g)}catch(e){}}
  el.onclick=e=>{
    const b=e.target.closest('[data-p],[data-go],[data-other],[data-resume]');if(!b)return;
    audioUnlock();Awake.on();
    if(b.dataset.p){d.current=b.dataset.p;if(runningGame()){save();splash(true);return}}
    if(b.hasAttribute('data-other')){el.hidden=true;Profiles.create(false);boot();return}
    save();Voice.pickVoice();applyTheme();
    sfx.star();
    if(b.hasAttribute('data-resume')){el.hidden=true;Rewards.touchDay();Game.start({variant:rg.variant,resumed:true});return}
    /* iOS gibt die Stimme nur nach einem Tippen frei: sofort ein kurzes Wort sprechen */
    Voice.speak('Hallo!');
    el.hidden=true;boot();
  };
}
function boot(){
  Rewards.touchDay();
  UI.go('home');
  setTimeout(()=>Pause.check(),800);
  setTimeout(()=>Rewards.checkBadges(),1500);
}
function trackTime(){
  setInterval(()=>{
    if(document.visibilityState!=='visible'||!$('#splash').hidden)return;
    const p=P();p.stats.seconds+=15;p.stats.daySecs=p.stats.daySecs||{};const d=today();p.stats.daySecs[d]=(p.stats.daySecs[d]||0)+15;
    const keys=Object.keys(p.stats.daySecs);if(keys.length>40)delete p.stats.daySecs[keys.sort()[0]];
    if(p.streak.last!==d)Rewards.touchDay();
    save();
    Pause.check();
  },15000);
}
/* ---------- Spielzeit-Wecker: sanfte Pause, wenn die Tageszeit um ist ---------- */
const Pause={
  limitSecs(){const p=P(),lim=p.settings.dayLimit||0;if(!lim)return 0;const ex=p.stats.limitExtra&&p.stats.limitExtra.d===today()?p.stats.limitExtra.m:0;return (lim+ex)*60},
  due(){const L=this.limitSecs();return L>0&&(((P().stats.daySecs||{})[today()]||0)>=L)},
  check(){
    if(!this.due()||$('.pause'))return;
    if(['lesson','play','done'].includes(UI.current))return; /* angefangene Aufgabe erst fertig machen */
    this.show();
  },
  show(){
    Voice.stop();Ears.stop();
    const o=document.createElement('div');o.className='pause';
    o.innerHTML=`<div class="pause-in"><div class="peter" data-mood="sleep">${peterSVG(P().outfit)}</div><h1>Zeit für eine Pause!</h1><p>Du hast heute toll gespielt. Morgen geht es weiter.</p>
      <button class="big ghost" data-more>${ICON.lock} Eltern: 15 Minuten mehr</button></div>`;
    document.body.appendChild(o);
    setTimeout(()=>Peter.say?Voice.speak(`Puh, ${P().name}, wir haben heute so toll gespielt! Jetzt machen wir eine Pause. Morgen geht es weiter. Tschüss!`):0,400);
    $('[data-more]',o).onclick=()=>Parents.gateThen(()=>{const p=P();const ex=p.stats.limitExtra&&p.stats.limitExtra.d===today()?p.stats.limitExtra.m:0;p.stats.limitExtra={d:today(),m:ex+15};save();o.remove();Voice.stop()},'15 Minuten mehr?');
  }
};

const Awake={
  lock:null,vid:null,warned:false,
  ios(){return /iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)},
  async on(){
    if(Native.ok||document.visibilityState!=='visible')return;
    if('wakeLock' in navigator&&(!this.lock||this.lock.released)){
      try{this.lock=await navigator.wakeLock.request('screen');this.lock.addEventListener('release',()=>{this.lock=null})}
      catch(e){this.lock=null;if(!this.warned){this.warned=true;Diag.log('Bildschirm','Wach halten ging nicht: '+(e&&e.name||e))}}

      if(this.vid.paused){const p=this.vid.play();if(p&&p.catch)p.catch(()=>{})}

/* ---------- Absturz erkennen ----------
   Alle paar Sekunden ein Lebenszeichen. Fehlt beim nächsten Start das „ordentlich beendet“,
   wurde die App unterwegs beendet: das kommt ins Protokoll, und die Partie wird zum Fortsetzen angeboten. */
const Alive={
  KEY:'rokko.alive',
  read(){try{return JSON.parse(localStorage.getItem(this.KEY)||'null')}catch(e){return null}},
  write(o){try{localStorage.setItem(this.KEY,JSON.stringify(o))}catch(e){}},
  beat(){if(document.visibilityState==='visible')this.write({t:Date.now(),scr:UI.current||'',vis:1,v:window.ROKKO_VERSION})},
  away(){this.write({t:Date.now(),scr:UI.current||'',vis:0,v:window.ROKKO_VERSION})},
  check(){
    const a=this.read();if(!a)return;
    const gap=Math.round((Date.now()-a.t)/1000);
    if(a.vis&&gap<900)Diag.log('Neustart',`App wurde unerwartet neu gestartet (zuletzt in „${a.scr||'?'}“, vor ${gap} s)`);
    else if(!a.vis&&a.scr)Diag.log('Start',`Neu geöffnet (vorher im Hintergrund in „${a.scr}“)`);
  }
};
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){Awake.on();Alive.beat();audioUnlock()}
  else{Alive.away();if(['play','lesson'].includes(UI.current))Diag.log('Hintergrund','App verlassen in „'+UI.current+'“')}
});
window.addEventListener('pagehide',()=>Alive.away());
window.addEventListener('pageshow',e=>{if(e.persisted)Alive.beat()});

(function init(){
  Store.load();
  Voice.init();Ears.init();Brain.init();Piper.init();
  UI.tabs();
  trackTime();
  applyTheme();
  Alive.check();Alive.beat();setInterval(()=>Alive.beat(),4000);
  { const go=UI.go.bind(UI);UI.go=function(id,arg){const r=go(id,arg);Alive.beat();return r} }
  /* bei jeder Berührung: Ton freigeben und Bildschirm wach halten (iOS verliert beides gern unterwegs) */
  let lastTouch=0;
  document.addEventListener('pointerdown',()=>{audioUnlock();const n=Date.now();if(n-lastTouch>3000){lastTouch=n;Awake.on()}},true);
  splash();
})();

if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
