<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Schach mit Peter</title>
<meta name="theme-color" content="#0E8C7E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Peter">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}
body{margin:0}
img{max-width:100%}[hidden]{display:none!important}
/* Layout: eine Handy-Spalte (max. 600px) mit fester Tab-Leiste unten; jede Ansicht ist eine Szene in Peters Schachland. */
:root{
  --bg:#E9F2F4;
  --bg2:#DCEBEF;
  --surface:#FFFFFF;
  --ink:#14232C;
  --muted:#56707C;
  --line:#C9DAE0;
  --peter:#0E8C7E;
  --on-peter:#FFFFFF;
  --peter-soft:#D3EFE9;
  --sun:#F6B91F;
  --sun-ink:#3A2A00;
  --good:#278442;
  --on-good:#FFFFFF;
  --on-danger:#FFFFFF;
  --good-soft:#DDF3E3;
  --danger:#D6402F;
  --danger-soft:#FBE3DF;
  --light-sq:#F0D9B5;
  --dark-sq:#B58863;
  --coord-light:#8D6747;
  --coord-dark:#FBEBD3;
  --last:rgba(246,205,60,.55);
  --shadow:0 4px 0 rgba(20,35,44,.12);
  --font-display:"Fredoka",ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A20;--bg2:#15232A;--surface:#1B2A32;--ink:#E8F1F4;--muted:#9DB4BE;--line:#2D414B;
  --peter:#3CC6B3;--on-peter:#062420;--peter-soft:#173C37;--sun:#F7C64A;--sun-ink:#2A1E00;
  --good:#53C978;--good-soft:#173826;--danger:#F2705E;--on-good:#0B2A14;--on-danger:#2A0A05;--danger-soft:#3D1E1A;
  --light-sq:#E6CFA8;--dark-sq:#A57A55;--coord-light:#7E5C3F;--coord-dark:#FBEBD3;--last:rgba(246,205,60,.5);
  --shadow:0 4px 0 rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A20;--bg2:#15232A;--surface:#1B2A32;--ink:#E8F1F4;--muted:#9DB4BE;--line:#2D414B;
  --peter:#3CC6B3;--on-peter:#062420;--peter-soft:#173C37;--sun:#F7C64A;--sun-ink:#2A1E00;
  --good:#53C978;--good-soft:#173826;--danger:#F2705E;--on-good:#0B2A14;--on-danger:#2A0A05;--danger-soft:#3D1E1A;
  --light-sq:#E6CFA8;--dark-sq:#A57A55;--coord-light:#7E5C3F;--coord-dark:#FBEBD3;--last:rgba(246,205,60,.5);
  --shadow:0 4px 0 rgba(0,0,0,.35);color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

#app{max-width:600px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.view{flex:1;padding-block:12px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.view.full{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}

/* ---------- Tab-Leiste ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1.5px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
.tab{border:0;background:transparent;border-radius:14px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--font-display);font-weight:600;font-size:.78rem;color:var(--muted)}
.tab svg{width:28px;height:28px}
.tab[aria-current="page"]{color:var(--peter);background:var(--peter-soft)}
.tabs[hidden]{display:none}

/* ---------- Kopfzeile ---------- */
.hud{display:flex;align-items:center;gap:10px}
.avatar{flex:0 0 auto;width:52px;height:52px;border-radius:50%;background:var(--surface);border:3px solid var(--peter);display:flex;align-items:center;justify-content:center;padding:0}
.avatar svg{width:36px;height:36px}
.hud-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.hud-name{font-family:var(--font-display);font-weight:700;font-size:1.25rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-rank{font-size:.85rem;color:var(--muted);font-weight:700}
.xpbar{height:10px;border-radius:99px;background:var(--bg2);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),#FF9F2E);border-radius:99px;transition:width .6s ease}
.chips{display:flex;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1.5px solid var(--line);border-radius:99px;padding:4px 10px;font-family:var(--font-display);font-weight:700;font-size:1rem;font-variant-numeric:tabular-nums}
.chip .i{width:20px;height:20px}
.iconbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;padding:0}
.iconbtn svg{width:24px;height:24px}

/* ---------- Peter ---------- */
.peter{width:72px;height:72px;flex:0 0 auto;cursor:pointer;background:none;border:0;padding:0}
.peter svg{width:100%;height:100%;display:block;overflow:visible}
.peter .m{display:none}
.peter[data-mood="smile"] .m-smile,.peter[data-mood="wow"] .m-wow,.peter[data-mood="worry"] .m-worry,.peter[data-mood="think"] .m-think{display:block}
.peter.talking .m{display:none}
.peter.talking .m-talk{display:block;transform-origin:40px 52px;animation:talk .22s ease-in-out infinite alternate}
.peter[data-mood="think"] .eyes{animation:look 1s ease-in-out infinite alternate}
.peter.bounce{animation:bounce .55s ease}
.peter .hat{display:none}
@keyframes talk{from{transform:scaleY(.3)}to{transform:scaleY(1.2)}}
@keyframes look{from{transform:translateX(-3px)}to{transform:translateX(3px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}35%{transform:translateY(-12px) rotate(-5deg)}70%{transform:translateY(0) rotate(3deg)}}
.talkrow{display:flex;gap:10px;align-items:center}
.bubble{position:relative;flex:1;min-width:0;background:var(--surface);border:2.5px solid var(--peter);border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:8px;min-height:64px;box-shadow:var(--shadow)}
.bubble::before{content:"";position:absolute;left:-10px;top:50%;margin-top:-8px;width:16px;height:16px;background:var(--surface);border-left:2.5px solid var(--peter);border-bottom:2.5px solid var(--peter);transform:rotate(45deg)}
.say{flex:1;min-width:0;margin:0;font-family:var(--font-display);font-weight:600;font-size:clamp(1.08rem,4.4vw,1.32rem);line-height:1.25;text-wrap:pretty}
.speak{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:0;background:var(--peter-soft);color:var(--peter);display:flex;align-items:center;justify-content:center;padding:0}
.speak svg{width:22px;height:22px}
.speak.listening{background:var(--danger);color:var(--on-danger);animation:pulse .7s ease-in-out infinite alternate}

/* ---------- Karten & Knöpfe ---------- */
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.card h2{font-size:1.25rem}
.card h3{font-size:1.08rem}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.big{border:0;border-radius:16px;padding:0 18px;font-family:var(--font-display);font-weight:700;font-size:1.15rem;min-height:56px;display:inline-flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .08s}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.big svg{width:26px;height:26px;flex:0 0 auto}
.go{background:var(--peter);color:var(--on-peter)}
.sunbtn{background:var(--sun);color:var(--sun-ink)}
.ghost{background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.dangerbtn{background:var(--danger);color:var(--on-danger)}
.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.big{flex:1 1 140px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

/* ---------- Startseite ---------- */
.hero{display:flex;flex-direction:column;gap:12px;border-radius:22px;padding:16px;color:#fff;background:var(--wc,var(--peter));box-shadow:0 5px 0 rgba(0,0,0,.18);position:relative;overflow:hidden;border:0;text-align:left}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .eyebrow{font-family:var(--font-display);font-weight:600;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.hero h2{font-size:1.6rem;line-height:1.1}
.hero .cta{align-self:flex-start;background:#fff;color:var(--wc,var(--peter));border-radius:14px;padding:10px 18px;font-family:var(--font-display);font-weight:700;font-size:1.1rem;display:inline-flex;gap:8px;align-items:center;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.hero .cta svg{width:22px;height:22px}
.hero .glyph{position:absolute;right:14px;bottom:8px;width:84px;height:84px;opacity:.95}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow);min-height:132px}
.tile .ti{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--tc,var(--peter-soft));color:var(--tci,var(--peter))}
.tile .ti svg{width:30px;height:30px}
.tile b{font-family:var(--font-display);font-size:1.12rem}
.tile span{font-size:.86rem;color:var(--muted)}
.mission li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.mission li:last-child{border-bottom:0}
.mission ul{list-style:none;margin:8px 0 0;padding:0}
.mission .ck{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.mission .ck svg{width:18px;height:18px}
.mission li.done .ck{background:var(--good);border-color:var(--good);color:var(--on-good)}
.mission li.done .t{text-decoration:line-through;color:var(--muted)}
.mission .t{flex:1;min-width:0;font-weight:700}
.mission .n{font-family:var(--font-display);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.chest{width:64px;height:64px;flex:0 0 auto}
.chest.ready{animation:wiggle 1s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}

/* ---------- Abenteuerkarte ---------- */
.world{border-radius:24px;padding:16px 12px 22px;background:color-mix(in srgb,var(--wc) 15%,var(--surface));position:relative;display:flex;flex-direction:column;gap:6px}
.world-head{display:flex;align-items:center;gap:12px;padding:0 4px 6px}
.world-head .wi{width:56px;height:56px;border-radius:18px;background:var(--wc);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.world-head .wi svg{width:42px;height:42px}
.world-head h2{font-size:1.3rem;color:color-mix(in srgb,var(--wc) 72%,var(--ink))}
.world-head p{margin:0;font-size:.88rem;color:var(--muted)}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;position:relative}
.node{--x:0px;transform:translateX(var(--x));display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:0}
.node .disc{width:76px;height:76px;border-radius:50%;background:var(--wc);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 var(--wdark),0 8px 14px rgba(0,0,0,.15);position:relative}
.node .disc svg{width:40px;height:40px}
.node.locked .disc{background:var(--bg2);color:var(--muted);box-shadow:0 6px 0 var(--line)}
.node.current .disc{animation:hop 1.4s ease-in-out infinite}
.node.current .disc::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid var(--wc);opacity:.5;animation:ring 1.4s ease-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes ring{from{transform:scale(.9);opacity:.6}to{transform:scale(1.25);opacity:0}}
.node .lbl{font-family:var(--font-display);font-weight:600;font-size:.92rem;max-width:150px;text-align:center;line-height:1.15;color:var(--ink)}
.node.locked .lbl{color:var(--muted)}
.node .st{display:flex;gap:1px;height:18px}
.node .st svg{width:18px;height:18px}
.node .badge-board{position:absolute;right:-6px;top:-6px;background:var(--sun);color:var(--sun-ink);border-radius:10px;padding:2px 5px;font-size:.7rem;font-weight:700;font-family:var(--font-display);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.friend-pop{position:absolute;right:10px;top:12px;width:64px;height:64px}

/* ---------- Brett ---------- */
.boardwrap{position:relative;width:100%;max-width:520px;margin-inline:auto}
.board{container-type:inline-size;width:100%;aspect-ratio:1/1;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:12px;overflow:hidden;border:5px solid var(--dark-sq);box-shadow:0 6px 0 rgba(0,0,0,.16);user-select:none;-webkit-user-select:none;touch-action:manipulation;background:var(--dark-sq)}
.sq{position:relative;border:0;padding:0;margin:0;display:flex;align-items:center;justify-content:center;background:var(--light-sq);min-width:0;min-height:0}
.sq.dk{background:var(--dark-sq)}
.sq.last::before{content:"";position:absolute;inset:0;background:var(--last)}
.sq .pc{position:relative;z-index:2;width:88%;height:88%;transition:transform .15s;pointer-events:none;filter:drop-shadow(0 .5cqw 0 rgba(0,0,0,.25))}
.sq .pc.flying{z-index:6}
.sq.sel .pc{transform:scale(1.15) translateY(-6%)}
.sq.sel::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 .9cqw var(--peter);z-index:3}
.sq.dot::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(14,110,98,.55);z-index:3;animation:breathe 1.2s ease-in-out infinite alternate}
.sq.ring::after{content:"";position:absolute;inset:5%;border-radius:50%;box-shadow:0 0 0 .9cqw rgba(214,64,47,.8);z-index:3;animation:breathe 1.2s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scale(.85)}to{transform:scale(1.05)}}
.sq.check{background:radial-gradient(circle,#ff5a4a 0%,#e0402f 45%,transparent 75%),var(--light-sq)}
.sq.dk.check{background:radial-gradient(circle,#ff5a4a 0%,#e0402f 45%,transparent 75%),var(--dark-sq)}
.sq.danger::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1.1cqw var(--danger);z-index:3;animation:pulse .6s ease-in-out infinite alternate}
.sq.goal::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1.1cqw var(--sun);z-index:3;animation:pulse .8s ease-in-out infinite alternate}
.sq.which::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1.1cqw var(--peter);z-index:3;animation:pulse .7s ease-in-out infinite alternate}
.sq.ok{background:var(--good)!important}
.sq.ok .nm{color:var(--on-good)!important;opacity:1;text-shadow:none}
.sq.bad{animation:shake .4s ease}
.sq.bad::before{content:"";position:absolute;inset:0;background:rgba(214,64,47,.55);z-index:1}
.sq.found::before{content:"";position:absolute;inset:8%;border-radius:22%;background:var(--good);opacity:.85;z-index:1;animation:popin .3s ease}
.sq.shake{animation:shake .4s ease}
@keyframes pulse{from{opacity:.4}to{opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7%)}75%{transform:translateX(7%)}}
@keyframes popin{from{transform:scale(.6);opacity:.2}to{transform:scale(1);opacity:1}}
.sq .nm{position:absolute;left:0;right:0;bottom:2%;text-align:center;font-family:var(--font-display);font-weight:700;font-size:3.4cqw;color:var(--coord-light);opacity:.85;z-index:1;pointer-events:none}
.sq.dk .nm{color:var(--coord-dark);text-shadow:0 1px 1px rgba(60,35,15,.55)}
.sq:not(.has) .nm{top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:4.6cqw;opacity:.75}
.board.nonames .nm{display:none}
.board.edge .nm{display:none}
.board .cf,.board .cr{position:absolute;font-family:var(--font-display);font-weight:700;font-size:3cqw;z-index:1;color:var(--coord-light);pointer-events:none}
.board .sq.dk .cf,.board .sq.dk .cr{color:var(--coord-dark)}
.board .cf{right:5%;bottom:1%}.board .cr{left:5%;top:1%}
.board:not(.edge) .cf,.board:not(.edge) .cr{display:none}
.sq .star,.sq .rock{position:absolute;inset:14%;z-index:2;pointer-events:none}
.sq .star{animation:twinkle 1.6s ease-in-out infinite alternate}
@keyframes twinkle{from{transform:scale(.9) rotate(-6deg)}to{transform:scale(1.05) rotate(6deg)}}
.sq .star.got{animation:collect .5s ease forwards}
@keyframes collect{to{transform:scale(1.8) translateY(-40%);opacity:0}}
.arrows{position:absolute;inset:5px;width:calc(100% - 10px);height:calc(100% - 10px);pointer-events:none;z-index:7}
.tray{min-height:1.7rem;display:flex;align-items:center;gap:4px;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.tray svg{width:22px;height:22px}

/* ---------- Lektionen ---------- */
.lesson-top{display:flex;align-items:center;gap:10px}
.prog{flex:1;height:16px;border-radius:99px;background:var(--bg2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--wc,var(--peter));border-radius:99px;transition:width .4s ease;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.task{font-family:var(--font-display);font-weight:700;font-size:1.25rem;text-align:center;margin:0}
.task .sqbig{display:inline-block;background:var(--sun);color:var(--sun-ink);border-radius:12px;padding:2px 12px;font-size:1.6rem;margin-left:6px;vertical-align:middle}
.counter{display:flex;justify-content:center;gap:14px;font-family:var(--font-display);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.opt{border:2.5px solid var(--line);background:var(--surface);border-radius:16px;min-height:62px;font-family:var(--font-display);font-weight:700;font-size:1.25rem;box-shadow:0 4px 0 var(--line);padding:8px}
.opt.right{background:var(--good-soft);border-color:var(--good);box-shadow:0 4px 0 var(--good)}
.opt.wrong{background:var(--danger-soft);border-color:var(--danger);box-shadow:0 4px 0 var(--danger);animation:shake .4s ease}
.feedback{border-radius:16px;padding:12px 14px;font-weight:700;display:flex;gap:10px;align-items:center;animation:popin .25s ease}
.feedback.good{background:var(--good-soft);color:var(--ink);border:2px solid var(--good)}
.feedback.bad{background:var(--danger-soft);color:var(--ink);border:2px solid var(--danger)}
.feedback svg{width:30px;height:30px;flex:0 0 auto}
.done-screen{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:20px}
.done-screen h1{font-size:2rem}
.bigstars{display:flex;gap:6px}
.bigstars svg{width:72px;height:72px;opacity:.25;transform:scale(.6);transition:all .4s cubic-bezier(.3,1.6,.5,1)}
.bigstars svg.on{opacity:1;transform:scale(1)}
.bigstars svg:nth-child(2){transform:translateY(-14px) scale(.6)}
.bigstars svg:nth-child(2).on{transform:translateY(-14px) scale(1.1)}

/* ---------- Partie ---------- */
.status{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.turn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;font-size:1.15rem;padding:6px 14px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-variant-numeric:tabular-nums}

.turn.peter-turn .dot{background:#1C1C1C;border-color:#1C1C1C}

.level-pick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}

/* ---------- Training ---------- */
.tip{display:flex;gap:12px;align-items:center;border:2.5px solid var(--sun);background:var(--surface);border-radius:20px;padding:14px;box-shadow:0 4px 0 var(--sun)}

const MATE=100000;
function evaluate(pos){
  let s=0;const B=pos.board;
  for(const i of ALL_SQ){
    const p=B[i];if(!p)continue;
    const r=i>>4,f=i&7,rr=p[0]==='w'?r:7-r;
    const cent=3.5-Math.max(Math.abs(f-3.5),Math.abs(r-3.5));
    let v=VAL[p[1]];
    switch(p[1]){
      case 'p':v+=rr*6+((f===3||f===4)?rr*5:0);break;
      case 'n':v+=cent*12-(rr===0?12:0);break;
      case 'b':v+=cent*6-(rr===0?12:0);break;
      case 'r':v+=(rr===6?15:0);break;
      case 'q':v+=cent*2;break;
      case 'k':v+=(rr===0&&(f<=2||f>=6))?25:(rr>1?-20:0);break;
    }
    s+=p[0]==='w'?v:-v;
  }
  return s;
}
function orderMoves(ms){
  for(const m of ms)m._o=(m.cap?10*AVAL[m.cap]-AVAL[m.piece]/10+1000:0)+(m.promo==='q'?800:0);
  return ms.sort((a,b)=>b._o-a._o);
}

  const caps=orderMoves(pos.legal().filter(m=>m.cap||m.promo));
  for(const m of caps){pos.make(m);const sc=-quiesce(pos,-beta,-alpha,q-1);pos.unmake();if(sc>=beta)return sc;if(sc>alpha)alpha=sc}
  return alpha;
}

  const ms=pos.legal();
  if(!ms.length)return pos.inCheck()?-MATE+ply:0;
  orderMoves(ms);
  for(const m of ms){pos.make(m);const sc=-search(pos,depth-1,-beta,-alpha,ply+1,q);pos.unmake();if(sc>=beta)return sc;if(sc>alpha)alpha=sc}
  return alpha;
}
const LEVELS=[null,
  {name:'Küken',fig:'p',random:true},
  {name:'Hüpfer',fig:'n',depth:1,q:0,noise:110,randomP:0.2},
  {name:'Kluger Läufer',fig:'b',depth:2,q:2,noise:60},
  {name:'Starker Turm',fig:'r',depth:2,q:4,noise:20},

function mateInOne(pos){
  for(const m of pos.legal()){pos.make(m);const mate=pos.isMate();pos.unmake();if(mate)return m}
  return null;
}
function allMatesInOne(pos){

}
function bestMove(pos,cfg){

  const noise=cfg.noise||0;let best=null,bestRaw=-Infinity,bestNoisy=-Infinity;
  for(const m of ms){

    const raw=-search(pos,cfg.depth-1,-Infinity,-lo,1,cfg.q);
    pos.unmake();
    const noisy=raw+(Math.random()*2-1)*noise;
    if(raw>bestRaw)bestRaw=raw;

function chooseMove(pos,level){
  const L=LEVELS[level]||LEVELS[1];

  const rnd=a=>a[Math.floor(Math.random()*a.length)];
  if(L.random){
    const mate=mateInOne(pos);if(mate&&Math.random()<0.4)return mate;
    const caps=ms.filter(m=>m.cap);
    if(caps.length&&Math.random()<0.35)return rnd(caps);
    const quiet=ms.filter(m=>m.piece!=='k'||m.flag==='k'||m.flag==='q');
    return rnd(quiet.length?quiet:ms);

function pawnGameResult(pos){
  for(const f of [0,1,2,3,4,5,6,7]){const a=pos.board[112+f],b=pos.board[f];if(a&&a[0]==='w')return 'w';if(b&&b[0]==='b')return 'b'}

}

    if(p[0]==='w'){s+=100+r*r*4;const free=![1,2,3,4,5,6].some(k=>{const t=i+16*k;return onBoard(t)&&(pos.board[t]==='bp'||pos.board[t-1]==='bp'||pos.board[t+1]==='bp')});if(free)s+=r*30}

function hanging(pos,color){
  const o=opp(color),B=pos.board,res=[];
  for(const i of ALL_SQ){
    const p=B[i];if(!p||p[0]!==color||p[1]==='k')continue;
    const att=pos.attackers(i,o);if(!att.length)continue;
    const def=pos.attackers(i,color);
    let by=att[0];for(const a of att)if(AVAL[B[a][1]]<AVAL[B[by][1]])by=a;
    if(!def.length||AVAL[B[by][1]]<VAL[p[1]])res.push({sq:i,piece:p[1],by,byPiece:B[by][1],value:VAL[p[1]],defended:def.length>0});
  }

}
/* Figuren der Seite am Zug, die der Gegner tatsächlich gewinnbringend schlagen könnte */
function threatsAgainst(pos,color){

/* ---------- Wohin kann ich ziehen? ---------- */
function fenFrom(pieces,turn){
  const b=new Array(128).fill(null);for(const p of pieces)b[p.sq]=p.c+p.t;
  let s='';
  for(let r=7;r>=0;r--){let e=0;for(let f=0;f<8;f++){const p=b[r*16+f];if(!p){e++;continue}if(e){s+=e;e=0}s+=p[0]==='w'?p[1].toUpperCase():p[1]}if(e)s+=e;if(r)s+='/'}
  return s+' '+(turn||'w')+' - - 0 1';
}
function genReach(type,level){
  for(let tries=0;tries<200;tries++){
    const pieces=[];const used=new Set();
    let from;
    if(type==='p'){from=sq(ri(0,7),level>=2?ri(1,5):1)}
    else from=level<=1?sq(ri(2,5),ri(2,5)):pickR(ALL_SQ);
    used.add(from);pieces.push({sq:from,c:'w',t:type});
    const nOwn=level<=1?0:ri(1,level),nEnemy=level<=1?(type==='p'?ri(1,2):0):ri(1,level+1);
    const near=()=>{const cand=ALL_SQ.filter(s=>!used.has(s)&&Math.abs((s&7)-(from&7))<=3&&Math.abs((s>>4)-(from>>4))<=3);return cand.length?pickR(cand):null};
    for(let i=0;i<nOwn;i++){const s=near();if(s==null)break;used.add(s);pieces.push({sq:s,c:'w',t:'p'})}
    for(let i=0;i<nEnemy;i++){let s;
      if(type==='p'&&i===0){const r=(from>>4)+1,f=(from&7)+pickR([-1,1]);if(f<0||f>7)continue;s=sq(f,r);if(used.has(s))continue}
      else s=near();
      if(s==null)break;used.add(s);pieces.push({sq:s,c:'b',t:pickR(['p','n','b','r'])})}
    if(pieces.some(p=>p.t==='p'&&((p.sq>>4)===0||(p.sq>>4)===7)))continue;
    const pos=new Pos(fenFrom(pieces,'w'));
    const targets=[...new Set(pos.pseudoFrom(from).map(m=>m.to))];
    if(targets.length<2)continue;
    return{type,from,fen:pos.fen(),targets};
  }
  return null;
}

/* ---------- Zufallsstellungen ---------- */
function place(spec){
  /* spec: Liste von {c,t,where} – where: Funktion(sq)->bool */
  const b=[],used=new Set();
  for(const p of spec){
    let s,g=0;
    do{s=pickR(ALL_SQ);g++}while(g<200&&(used.has(s)||(p.where&&!p.where(s))||(p.t==='p'&&((s>>4)===0||(s>>4)===7))));
    if(g>=200)return null;
    used.add(s);b.push({sq:s,c:p.c,t:p.t});
  }
  return b;
}
function kingsOk(pos){
  const w=pos.kings.w,b=pos.kings.b;if(w<0||b<0)return false;
  return Math.max(Math.abs((w&7)-(b&7)),Math.abs((w>>4)-(b>>4)))>1;
}
const edge=s=>(s>>4)===7;
const anyw=()=>true;
const not8=s=>(s>>4)<7;

/* Matt in 1 */
function genMate(level){
  for(let tries=0;tries<6000;tries++){
    let spec;const fam=level<=1?pickR(['Q','R','RR']):level===2?pickR(['Q','R','BR','RR','QB']):pickR(['BR','QB','QN','RB','BRx']);
    if(fam==='BR'||fam==='BRx'){
      const kf=ri(5,7),ks=sq(kf,7);
      spec=[{c:'b',t:'k',where:s=>s===ks}];
      for(const f of [kf-1,kf,kf+1])if(f>=0&&f<=7&&rand()<.85)spec.push({c:'b',t:'p',where:(ff=>s=>s===sq(ff,6))(f)});
      spec.push({c:'w',t:'k',where:s=>(s>>4)<=2});
      spec.push({c:'w',t:pickR(['r','q']),where:s=>(s>>4)<=4});
      if(fam==='BRx'){spec.push({c:'b',t:pickR(['r','n','b']),where:s=>(s>>4)>=4});spec.push({c:'w',t:pickR(['p','n','b']),where:s=>(s>>4)<=4})}
    }else if(fam==='Q'){spec=[{c:'b',t:'k',where:edge},{c:'w',t:'k',where:s=>(s>>4)>=4},{c:'w',t:'q',where:anyw}]}
    else if(fam==='R'){spec=[{c:'b',t:'k',where:edge},{c:'w',t:'k',where:s=>(s>>4)===5},{c:'w',t:'r',where:not8}]}
    else if(fam==='RR'){spec=[{c:'b',t:'k',where:edge},{c:'w',t:'k',where:s=>(s>>4)<=3},{c:'w',t:'r',where:s=>(s>>4)===6},{c:'w',t:'r',where:s=>(s>>4)<=5}]}
    else if(fam==='QB'){spec=[{c:'b',t:'k',where:s=>(s>>4)>=6},{c:'b',t:'p',where:s=>(s>>4)>=5},{c:'b',t:'p',where:s=>(s>>4)>=5},{c:'w',t:'k',where:s=>(s>>4)<=2},{c:'w',t:'q',where:anyw},{c:'w',t:'b',where:anyw}]}
    else if(fam==='QN'){spec=[{c:'b',t:'k',where:s=>(s>>4)>=6},{c:'b',t:'p',where:s=>(s>>4)>=5},{c:'b',t:pickR(['r','b']),where:s=>(s>>4)>=5},{c:'w',t:'k',where:s=>(s>>4)<=2},{c:'w',t:'q',where:anyw},{c:'w',t:'n',where:anyw}]}
    else{spec=[{c:'b',t:'k',where:s=>(s>>4)>=6},{c:'b',t:'p',where:s=>(s>>4)>=5},{c:'b',t:'p',where:s=>(s>>4)>=5},{c:'w',t:'k',where:s=>(s>>4)<=2},{c:'w',t:'r',where:anyw},{c:'w',t:'b',where:anyw}]}
    const pcs=place(spec);if(!pcs)continue;
    const pos=new Pos(fenFrom(pcs,'w'));
    if(!kingsOk(pos)||pos.inCheck('b')||pos.inCheck('w'))continue;
    const ms=pos.legal();if(ms.length<6)continue;
    const mates=allMatesInOne(pos);
    const maxM=level<=1?2:1;
    if(mates.length<1||mates.length>maxM)continue;
    if(mates.some(m=>m.promo))continue;
    /* keine Figur von Weiß steht einfach so herum, die Schwarz nehmen könnte, damit die Stellung "fair" aussieht */
    return{kind:'mate',fen:pos.fen(),sol:mates.map(m=>sqName(m.from)+sqName(m.to))};
  }
  return null;
}

/* Adlerauge: eine freie Figur schlagen */
function freeCaptures(pos){
  const res=[];
  for(const m of pos.legal()){
    if(!m.cap)continue;
    const defended=pos.attackers(m.to,opp(pos.turn)).length>0;
    if(!defended||VAL[m.cap]>VAL[m.piece]+50){
      /* nach dem Schlagen kein sofortiges Matt gegen uns */
      pos.make(m);const bad=mateInOne(pos);pos.unmake();
      if(!bad)res.push(m);
    }
  }
  return res;
}
function genCapture(level){
  for(let tries=0;tries<4000;tries++){
    const wN=level<=1?1:level===2?2:3,bN=level<=1?2:level===2?3:4;
    const spec=[{c:'w',t:'k',where:s=>(s>>4)<=2},{c:'b',t:'k',where:s=>(s>>4)>=5}];
    for(let i=0;i<wN;i++)spec.push({c:'w',t:pickR(['n','b','r','q','n','b','r']),where:anyw});
    for(let i=0;i<bN;i++)spec.push({c:'b',t:pickR(['p','n','b','r','q','p','n','b','r']),where:anyw});
    if(level>=2)spec.push({c:'w',t:'p',where:s=>(s>>4)>=1&&(s>>4)<=4},{c:'b',t:'p',where:s=>(s>>4)>=3&&(s>>4)<=6});
    const pcs=place(spec);if(!pcs)continue;
    const pos=new Pos(fenFrom(pcs,'w'));
    if(!kingsOk(pos)||pos.inCheck('b')||pos.inCheck('w'))continue;
    const fc=freeCaptures(pos);
    const targets=[...new Set(fc.map(m=>m.to))];
    if(targets.length!==1)continue;
    const val=VAL[pos.board[targets[0]][1]];
    if(val<300&&level>=2)continue;
    /* es gibt andere Schlagzüge, die schlecht wären – nur ab Stufe 2 */
    const allCaps=pos.legal().filter(m=>m.cap);
    if(level>=3&&allCaps.length<2)continue;
    return{kind:'capture',fen:pos.fen(),target:sqName(targets[0]),sol:fc.map(m=>sqName(m.from)+sqName(m.to))};
  }
  return null;
}

/* Schutzschild: eine bedrohte Figur retten */
function rescueOk(pos,m){
  pos.make(m);
  let ok=!mateInOne(pos);
  if(ok){const th=hanging(pos,'w').filter(h=>h.value>=300&&pos.legal().some(x=>x.to===h.sq));ok=th.length===0}
  pos.unmake();
  return ok;
}
function genRescue(level){
  for(let tries=0;tries<4000;tries++){
    const spec=[{c:'w',t:'k',where:s=>(s>>4)<=2},{c:'b',t:'k',where:s=>(s>>4)>=5}];
    const nW=level<=1?1:2,nB=level<=1?1:level===2?2:3;
    for(let i=0;i<nW;i++)spec.push({c:'w',t:pickR(['n','b','r','q']),where:anyw});
    for(let i=0;i<nB;i++)spec.push({c:'b',t:pickR(['p','n','b','r']),where:anyw});
    if(level>=2)spec.push({c:'w',t:'p',where:s=>(s>>4)>=1&&(s>>4)<=3},{c:'w',t:'p',where:s=>(s>>4)>=1&&(s>>4)<=3});
    const pcs=place(spec);if(!pcs)continue;
    const pos=new Pos(fenFrom(pcs,'w'));
    if(!kingsOk(pos)||pos.inCheck('b')||pos.inCheck('w'))continue;
    const th=threatsAgainst(pos,'w').filter(h=>h.value>=300);
    if(th.length!==1)continue;
    if(freeCaptures(pos).length)continue; /* sonst wäre "schlagen" die einfachere Idee */
    const ms=pos.legal();const good=ms.filter(m=>rescueOk(pos,m));
    if(!good.length||good.length>ms.length*0.6)continue;
    return{kind:'rescue',fen:pos.fen(),target:sqName(th[0].sq),by:sqName(th[0].by),sol:good.map(m=>sqName(m.from)+sqName(m.to))};
  }
  return null;
}

/* Schach-Retter: der weiße König steht im Schach */
function genEscape(level){
  for(let tries=0;tries<4000;tries++){
    const spec=[{c:'w',t:'k',where:anyw},{c:'b',t:'k',where:anyw},{c:'b',t:pickR(['r','q','b','n']),where:anyw}];
    if(level>=2)spec.push({c:'w',t:pickR(['r','b','n']),where:anyw},{c:'w',t:'p',where:s=>(s>>4)<=3});
    if(level>=3)spec.push({c:'b',t:pickR(['r','b','n','p']),where:anyw});
    const pcs=place(spec);if(!pcs)continue;
    const pos=new Pos(fenFrom(pcs,'w'));
    if(!kingsOk(pos)||!pos.inCheck('w')||pos.inCheck('b'))continue;
    const ms=pos.legal();if(!ms.length)continue;
    const kingMoves=ms.filter(m=>m.piece==='k').length;
    if(level>=2&&ms.length>6)continue;
    if(level===1&&kingMoves<1)continue;
    const checker=pos.attackers(pos.kings.w,'b');
    return{kind:'escape',fen:pos.fen(),checker:sqName(checker[0]),sol:ms.map(m=>sqName(m.from)+sqName(m.to))};
  }
  return null;
}

/* Gabel: eine Figur greift zwei Ziele gleichzeitig an */
function forkTargets(pos,sqTo){
  const me=pos.board[sqTo];if(!me)return[];
  const meVal=AVAL[me[1]],c=me[0],o=opp(c),out=[];
  const t=pos.clone();t.turn=c;t.ep=-1;
  for(const m of t.gen()){
    if(m.from!==sqTo||!m.cap)continue;
    const tgt=t.board[m.to];
    if(tgt[1]==='k'){out.push(m.to);continue}
    const def=t.attackers(m.to,o).length>0;
    if(VAL[tgt[1]]>=300&&(!def||VAL[tgt[1]]>meVal))out.push(m.to);
  }
  return out;
}
function genFork(level){
  for(let tries=0;tries<8000;tries++){
    const forker=level<=1?'n':pickR(['n','n','b','r','q','p']);
    const spec=[{c:'w',t:'k',where:s=>(s>>4)<=2},{c:'b',t:'k',where:s=>(s>>4)>=4},{c:'w',t:forker,where:anyw},
      {c:'b',t:pickR(['r','q','r']),where:anyw},{c:'b',t:pickR(['r','q','b','n']),where:anyw}];
    if(level>=2)spec.push({c:'b',t:'p',where:s=>(s>>4)>=4},{c:'w',t:'p',where:s=>(s>>4)<=3});
    const pcs=place(spec);if(!pcs)continue;
    const pos=new Pos(fenFrom(pcs,'w'));
    if(!kingsOk(pos)||pos.inCheck('b')||pos.inCheck('w'))continue;
    if(freeCaptures(pos).length)continue;
    const sols=[];
    for(const m of pos.legal()){
      if(m.cap)continue;
      pos.make(m);
      const safe=!pos.attacked(m.to,'b');
      const tg=safe?forkTargets(pos,m.to):[];
      pos.unmake();
      if(tg.length>=2)sols.push({m,tg});
    }
    if(sols.length!==1)continue;
    if(level<=1&&sols[0].m.piece!=='n')continue;
    return{kind:'fork',fen:pos.fen(),sol:[sqName(sols[0].m.from)+sqName(sols[0].m.to)],targets:sols[0].tg.map(sqName)};
  }
  return null;
}

/* Bauern schlagen schräg (ohne Könige) */
function genPawnCap(level){
  for(let tries=0;tries<3000;tries++){
    const spec=[];const nP=level<=1?2:level===2?3:4,nB=level<=1?2:level===2?3:4;
    for(let i=0;i<nP;i++)spec.push({c:'w',t:'p',where:s=>(s>>4)>=1&&(s>>4)<=5});
    for(let i=0;i<nB;i++)spec.push({c:'b',t:pickR(['n','b','r','q','p']),where:s=>(s>>4)>=2&&(s>>4)<=6});
    const pcs=place(spec);if(!pcs)continue;
    const pos=new Pos(fenFrom(pcs,'w'));
    const caps=pos.legal().filter(m=>m.cap&&m.piece==='p'&&!m.promo);
    if(caps.length!==1)continue;
    /* Bauern, die gerade nach vorne "schlagen" könnten (das geht nicht), als Falle */
    const fake=pos.pieces('w').some(p=>p.type==='p'&&pos.board[p.sq+16]&&pos.board[p.sq+16][0]==='b');
    if(level>=2&&!fake)continue;
    return{kind:'pawncap',fen:pos.fen(),sol:caps.map(m=>sqName(m.from)+sqName(m.to))};
  }
  return null;
}

/* Bauer wird Dame */
function genPromote(level){
  for(let tries=0;tries<3000;tries++){
    const spec=[{c:'w',t:'p',where:s=>(s>>4)===6}];
    if(level>=2)spec.push({c:'w',t:'p',where:s=>(s>>4)===6});
    for(let i=0;i<level;i++)spec.push({c:'b',t:pickR(['n','b','r']),where:s=>(s>>4)===7});
    spec.push({c:'w',t:'p',where:s=>(s>>4)>=2&&(s>>4)<=4});
    const pcs=place(spec);if(!pcs)continue;
    const pos=new Pos(fenFrom(pcs,'w'));
    const pr=pos.legal().filter(m=>m.promo==='q');
    if(!pr.length)continue;
    if(level>=2&&pr.length>2)continue;
    return{kind:'promote',fen:pos.fen(),sol:pr.map(m=>sqName(m.from)+sqName(m.to))};
  }
  return null;
}

/* Rochade */
function genCastle(level){
  const variants=[
    {fen:'r3k2r/pppq1ppp/2npbn2/2b1p3/2B1P3/2NP1N2/PPP2PPP/R2QK2R w KQkq - 0 1',want:'k'},
    {fen:'rnbqk2r/pppp1ppp/5n2/2b1p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 0 1',want:'k'},
    {fen:'r1bqk2r/pppp1ppp/2n2n2/2b1p3/2B1P3/3P1N2/PPP2PPP/RNBQK2R w KQkq - 0 1',want:'k'},
    {fen:'rn2kbnr/ppp1pppp/3q4/3p1b2/3P1B2/2NQ4/PPP1PPPP/R3KBNR w KQkq - 0 1',want:'q'},
    {fen:'r3kbnr/ppp2ppp/2nq4/3pp3/3P1Bb1/2NQ4/PPP1PPPP/R3KBNR w KQkq - 0 1',want:'q'},
    {fen:'r1bqk2r/ppp2ppp/2np1n2/2b1p3/2B1P3/2NP1N2/PPP2PPP/R1BQK2R w KQkq - 0 1',want:'k'}
  ];
  const v=variants[ri(0,variants.length-1)];
  const pos=new Pos(v.fen);
  const ms=pos.legal().filter(m=>m.flag==='k'||m.flag==='q');
  return{kind:'castle',fen:v.fen,sol:ms.map(m=>sqName(m.from)+sqName(m.to))};
}

/* Ist das Schachmatt? (Ja/Nein) */
function genIsMate(level){
  const p=genMate(level);if(!p)return null;
  const pos=new Pos(p.fen);
  const mates=allMatesInOne(pos);
  if(rand()<.5){const m=mates[0];pos.make(m);return{kind:'ismate',fen:pos.fen(),answer:true,last:sqName(m.from)+sqName(m.to)}}
  const checks=pos.legal().filter(m=>{pos.make(m);const r=pos.inCheck()&&!pos.isMate();pos.unmake();return r});
  if(!checks.length){const m=mates[0];pos.make(m);return{kind:'ismate',fen:pos.fen(),answer:true,last:sqName(m.from)+sqName(m.to)}}
  const m=pickR(checks);pos.make(m);
  const esc=pos.legal()[0];
  return{kind:'ismate',fen:pos.fen(),answer:false,last:sqName(m.from)+sqName(m.to),escape:sqName(esc.from)+sqName(esc.to)};
}

    let d=this.read(STORE_KEY);

    if(!d)d=this.read(STORE_KEY+'.backup')||this.read(STORE_KEY+'.daily');

      let old=null;try{old=JSON.parse(localStorage.getItem('peterSchach.v1'))}catch(e){}

      if(old&&old.prof){p.game.level=old.prof.level||1;p.game.w=old.prof.w||0;p.game.l=old.prof.l||0;p.game.d=old.prof.d||0}
      d.profiles[p.id]=p;d.current=p.id;
    }else{
      /* Sicherung beim Start: so geht bei einem Update nichts verloren */
      try{localStorage.setItem(STORE_KEY+'.backup',JSON.stringify(d))}catch(e){}
      try{const day=localStorage.getItem(STORE_KEY+'.dailyDate');if(day!==today()){localStorage.setItem(STORE_KEY+'.daily',JSON.stringify(d));localStorage.setItem(STORE_KEY+'.dailyDate',today())}}catch(e){}
    }
    /* neue Felder ergänzen, ohne etwas zu überschreiben */
    for(const id in d.profiles)fillDefaults(d.profiles[id],newProfile(d.profiles[id].name||'Kind',d.profiles[id].avatar||{fig:'n',color:'#2B7BD8'}));
    if(!d.profiles[d.current])d.current=Object.keys(d.profiles)[0];

  decodeCode(code){
    // Robust gegen alles, was iOS beim Kopieren/Teilen dazupackt: unsichtbare Zeichen, Umbrüche, Titelzeilen, fehlendes Padding
    let s=String(code||'').normalize('NFKC');
    const i=s.toUpperCase().lastIndexOf('PETER1');
    if(i>=0)s=s.slice(i+6);
    s=s.replace(/-/g,'+').replace(/_/g,'/').replace(/[^A-Za-z0-9+/]/g,'');
    const j=s.indexOf('eyJ');if(j>0)s=s.slice(j);
    if(!s)return null;
    for(let cut=0;cut<Math.min(s.length,400);cut++){
      let t=s.slice(0,s.length-cut);while(t.length%4)t+='=';
      try{const d=JSON.parse(decodeURIComponent(escape(atob(t))));if(d&&d.profiles&&Object.keys(d.profiles).length)return d}catch(e){}
    }
    return null;
  },

    const d=this.decodeCode(code);if(!d)return false;
    try{localStorage.setItem(STORE_KEY+'.beforeImport',JSON.stringify(this.data))}catch(e){}
    this.data=d;this.save();try{this.load()}catch(e){}return true;
  }

}

      const src=`let t=null;onmessage=async e=>{const d=e.data;try{if(!t)t=await import(d.lib);const b=await t.predict({text:d.text,voiceId:d.voice});const buf=await b.arrayBuffer();postMessage({id:d.id,buf},[buf])}catch(err){postMessage({id:d.id,err:String(err&&err.message||err)})}}`;
      this.worker=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})),{type:'module'});
      this.wcount=0;
    }catch(e){this.worker=null}
    return this.worker;
  },
  killWorker(){if(this.worker){try{this.worker.terminate()}catch(e){}this.worker=null}},
  synth(text){
    if(this.cache.has(text))return Promise.resolve(this.cache.get(text));
    const gen=Voice.pseq;
    const p=new Promise((res,rej)=>{this.q.push({text,gen,res,rej});this.pump()});
    p.catch(()=>{});
    return p;
  },
  async pump(){
    if(this.busy)return;
    const it=this.q.shift();if(!it)return;
    if(it.gen!==Voice.pseq){it.rej(new Error('alt'));return this.pump()}
    this.busy=true;
    try{
      audioUnlock();if(!ac)throw new Error('kein Audio');
      let data;
      const w=this.makeWorker();
      if(w){
        data=await new Promise((res,rej)=>{
          const id=++this.reqId;
          const to=setTimeout(()=>{w.removeEventListener('message',on);this.killWorker();rej(new Error('Zeit'))},15000);
          const on=e=>{if(e.data.id!==id)return;clearTimeout(to);w.removeEventListener('message',on);e.data.err?rej(new Error(e.data.err)):res(e.data.buf)};
          w.addEventListener('message',on);
          w.postMessage({id,text:it.text,voice:this.VOICE,lib:this.LIB});
        });
        if(++this.wcount>=15)this.killWorker();
      }else{
        const t=await this.lib();data=await (await t.predict({text:it.text,voiceId:this.VOICE})).arrayBuffer();
      }
      const buf=await ac.decodeAudioData(data);
      if(it.text.length<=60){this.cache.set(it.text,buf);if(this.cache.size>40)this.cache.delete(this.cache.keys().next().value)}
      it.res(buf);
    }catch(e){it.rej(e)}
    finally{this.busy=false;this.pump()}
  },
  /* einzelne Sätze, damit Peter schon spricht, während der nächste Satz entsteht */
  sentences(t){return (t.match(/[^.!?…]+[.!?…]*/g)||[t]).map(x=>x.trim()).filter(Boolean)},
  usable(){return this.state==='ready'&&P().settings.natural!==false&&P().settings.sound}
};

/* ---------- Peters Stimme ---------- */
const Voice={
  pseq:0,voices:[],voice:null,ok:false,failed:false,seq:0,pending:{},nativeVoices:[],
  init(){
    if(Native.ok){
      Native.on('speechEnd',m=>{const r=this.pending[m.id];if(r){delete this.pending[m.id];r()}Peter.talking(false)});
      Native.on('speechStart',()=>{this.ok=true;Peter.talking(true)});
      Native.on('voices',m=>{this.nativeVoices=m.list||[];UI.refreshVoiceSelect&&UI.refreshVoiceSelect()});
      Native.post({type:'voices'});
      return;
    }
    if(!('speechSynthesis' in window))return;
    const load=()=>{try{this.voices=speechSynthesis.getVoices().filter(v=>/^de/i.test(v.lang)).sort((a,b)=>this.score(b)-this.score(a));this.pickVoice();UI.refreshVoiceSelect&&UI.refreshVoiceSelect()}catch(e){}};
    load();try{speechSynthesis.addEventListener('voiceschanged',load)}catch(e){}
  },
  score(v){
    let s=0;const n=v.name||'';
    if(/premium|enhanced|verbessert|natural|neural|wavenet|studio|siri/i.test(n))s+=20;
    if(/google/i.test(n))s+=8;if(/^de[-_]DE/i.test(v.lang))s+=3;
    if(/anna|petra|helena|katja|markus|yannick|conrad|amala|vicki|marlene|hans/i.test(n))s+=2;
    if(/eddy|flo|grandma|grandpa|oma|opa|reed|rocko|sandy|shelley|compact|kompakt|eloquence|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|albert|fred|junior|kathy|ralph/i.test(n))s-=25;
    return s;
  },
  list(){return Native.ok?this.nativeVoices.map(v=>({id:v.id,name:v.name,good:v.quality>=2})):this.voices.map(v=>({id:v.name,name:v.name,good:this.score(v)>=20}))},
  pickVoice(){const want=P()&&P().settings.voice;this.voice=this.voices.find(v=>v.name===want)||this.voices[0]||null},
  spoken(t){return upSq(t).replace(/\b([A-H])([1-8])\b/g,'$1 $2').replace(/\bO-O-O\b/g,'lange Rochade').replace(/\bO-O\b/g,'kurze Rochade')},
  stop(){this.pseq=(this.pseq||0)+1;if(this.src){try{this.src.stop()}catch(e){}this.src=null}if(this.pdone){const d=this.pdone;this.pdone=null;d()}if(Native.ok){Native.post({type:'stop'});Object.values(this.pending).forEach(r=>r());this.pending={}}else try{speechSynthesis.cancel()}catch(e){}Peter.talking(false)},
  speak(text){
    const s=P().settings;
    if(!s.sound)return sleep(Math.min(2200,400+text.length*28));
    if(Native.ok){
      const id=++this.seq;
      return new Promise(res=>{this.pending[id]=res;Native.post({type:'speak',id,text:this.spoken(text),voice:s.voice||'',rate:s.speechRate||1});setTimeout(()=>{if(this.pending[id]){delete this.pending[id];res()}},Math.max(4000,text.length*120))});
    }
    if(Piper.usable())return this.speakNatural(text).then(()=>{Piper.fails=0},e=>{if(e&&e.message==='alt')return;Piper.fails=(Piper.fails||0)+1;if(Piper.fails>=3){Piper.state='broken';Piper.emit()}return this.speakWeb(text)});
    return this.speakWeb(text);
  },
  async speakNatural(text){
    const s=P().settings;
    this.stop();const my=this.pseq;
    const parts=Piper.sentences(this.spoken(text));
    let next=Piper.synth(parts[0]);
    const first=await Promise.race([next,sleep(9000).then(()=>{throw new Error('zu langsam')})]);
    for(let i=0;i<parts.length;i++){
      if(my!==this.pseq)return;
      const buf=i===0?first:await next;
      if(my!==this.pseq)return;
      if(i+1<parts.length)next=Piper.synth(parts[i+1]);
      await new Promise(res=>{
        const src=ac.createBufferSource();src.buffer=buf;src.playbackRate.value=s.speechRate||1;src.connect(ac.destination);
        this.src=src;this.pdone=res;
        src.onended=()=>{if(this.src===src)this.src=null;this.pdone=null;res()};
        this.ok=true;this.failed=false;Peter.talking(true);src.start();
      });
    }
    if(my===this.pseq)Peter.talking(false);
  },
  speakWeb(text){
    const s=P().settings;
    return new Promise(res=>{
      let finished=false;const done=()=>{if(finished)return;finished=true;Peter.talking(false);res()};
      const synth=window.speechSynthesis;
      if(!synth||!window.SpeechSynthesisUtterance){this.failed=true;UI.soundHint&&UI.soundHint();setTimeout(done,Math.min(2000,500+text.length*30));return}
      try{
        if(synth.speaking||synth.pending)synth.cancel();
        synth.resume();
        const u=new SpeechSynthesisUtterance(this.spoken(text));
        u.lang=this.voice?this.voice.lang:'de-DE';if(this.voice)u.voice=this.voice;u.rate=s.speechRate||1;u.pitch=1.05;u.volume=1;
        let started=false;
        u.onstart=()=>{started=true;this.ok=true;this.failed=false;Peter.talking(true)};
        u.onend=done;u.onerror=()=>{if(!started){this.failed=true;UI.soundHint&&UI.soundHint()}done()};
        synth.speak(u);
        setTimeout(()=>{if(!started&&!this.ok){this.failed=true;UI.soundHint&&UI.soundHint();done()}},2800);
        setTimeout(done,Math.max(2600,text.length*95));
      }catch(e){done()}
    });
  }
};

const Ears={

    }catch(e){this.blocked=true;return false}

const Brain={
  fn:null,dead:false,
  async init(){try{if(window.claude&&window.claude.use)this.fn=await window.claude.use('sample')}catch(e){this.fn=null}},
  on(){return !!this.fn&&!this.dead&&P().settings.ai},
  clean(t){return String(t||'').replace(/[*_#`>"„“”«»]/g,'').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,'').replace(/\s+/g,' ').trim()},
  persona(){const n=P().name;return `Du bist Peter, ein lustiger, warmherziger Schachroboter. Du spielst an einem echten Schachbrett mit ${n}, einem Kind, das gerade Schach lernt. ${n} spielt Weiß, du spielst Schwarz. Was du schreibst, wird laut vorgelesen.
So sprichst du: wie ein netter großer Freund, natürlich und locker, begeistert und kindgerecht, mit einfachen Wörtern und kurzen Sätzen. Nie belehrend, nie steif, nie roboterhaft. Fang nicht jedes Mal gleich an. Sprich ${n} mit du an und ab und zu mit Namen.
Regeln: Schachfelder immer als Großbuchstabe plus Zahl, zum Beispiel E4. Keine Emojis, keine Sternchen, keine Listen, keine Anführungszeichen. Antworte nur mit dem, was Peter laut sagt.${Peter.last?`\nZuletzt hast du gesagt: ${Peter.last}\nFormuliere diesmal anders.`:''}`},
  async ask(task,timeout,check){
    if(!this.on())return null;
    const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),timeout||5000);
    try{
      const r=await this.fn(this.persona()+'\n\n'+task,{modelTier:'quick',cache:false,signal:ctl.signal});

    finally{clearTimeout(t)}
  }

class Board{
  constructor(host,opt){
    opt=opt||{};this.opt=opt;this.host=host;
    this.cells={};this.pieces=new Array(128).fill(null);
    this.marks={};this.arrowsList=[];
    host.innerHTML=`<div class="boardwrap"><div class="board" role="grid" aria-label="Schachbrett"></div>
      <svg class="arrows" viewBox="0 0 8 8" aria-hidden="true"><defs>
      <marker id="ahP" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--peter)"/></marker>
      <marker id="ahH" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--sun)"/></marker>
      <marker id="ahR" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--danger)"/></marker>
      </defs><g class="ag"></g></svg></div>`;
    this.el=$('.board',host);this.ag=$('.ag',host);
    for(let r=7;r>=0;r--)for(let f=0;f<8;f++){
      const i=r*16+f,b=document.createElement('button');
      b.type='button';b.className='sq'+((r+f)%2===0?' dk':'');b.setAttribute('role','gridcell');
      b.innerHTML=`<span class="nm">${SQ(i)}</span>${f===0?`<span class="cr">${r+1}</span>`:''}${r===0?`<span class="cf">${FILES[f].toUpperCase()}</span>`:''}<span class="slot"></span>`;
      b.addEventListener('click',()=>{audioUnlock();this.opt.onTap&&this.opt.onTap(i)});
      this.el.appendChild(b);this.cells[i]=b;
    }
    this.setNames(opt.names!==undefined?opt.names:true);
  }
  setNames(mode){/* true = Namen auf allen Feldern, 'edge' = nur am Rand, false = keine */
    this.el.classList.toggle('nonames',mode===false);this.el.classList.toggle('edge',mode==='edge');
  }
  setPos(pos){for(const i of ALL_SQ)this.pieces[i]=pos.board[i];this.render()}
  setPieces(arr){for(const i of ALL_SQ)this.pieces[i]=arr[i]||null;this.render()}
  mark(name,list){this.marks[name]=new Set(list||[]);return this}
  clearMarks(){this.marks={};this.arrowsList=[];return this}
  arrows(list){this.arrowsList=list||[];return this}
  render(){
    const M=this.marks,has=(n,i)=>!!(M[n]&&M[n].has(i));
    for(const i of ALL_SQ){
      const el=this.cells[i],p=this.pieces[i],slot=el.lastElementChild;
      let html='';
      if(p)html=pieceSVG(p[0],p[1]);
      if(has('star',i))html+=STARSHAPE;
      if(has('rock',i))html+=ROCK;
      if(slot.innerHTML!==html)slot.innerHTML=html;
      el.classList.toggle('has',!!p||has('star',i)||has('rock',i));
      for(const c of ['last','sel','dot','ring','check','danger','goal','which','found','ok'])el.classList.toggle(c,has(c,i));
      el.setAttribute('aria-label',SQ(i)+(p?', '+(p[0]==='w'?'weiß ':'schwarz ')+NAME[p[1]]:has('star',i)?', Stern':', leer'));
    }
    const xy=i=>[(i&7)+.5,7-(i>>4)+.5];
    this.ag.innerHTML=this.arrowsList.map(a=>{
      const[x1,y1]=xy(a.from),[x2,y2]=xy(a.to);const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),k=(len-.3)/len;
      const col=a.kind==='hint'?'--sun':a.kind==='bad'?'--danger':'--peter',mk=a.kind==='hint'?'ahH':a.kind==='bad'?'ahR':'ahP';
      return `<line x1="${x1}" y1="${y1}" x2="${(x1+dx*k).toFixed(3)}" y2="${(y1+dy*k).toFixed(3)}" stroke="var(${col})" stroke-width=".18" stroke-linecap="round" opacity=".9" marker-end="url(#${mk})"/>`;
    }).join('');
  }
  flash(i,cls,ms){const el=this.cells[i];if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),ms||450)}
  animate(from,to){
    if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    const pc=this.cells[to]&&this.cells[to].querySelector('.slot .pc');if(!pc)return;
    const a=this.cells[from].getBoundingClientRect(),b=this.cells[to].getBoundingClientRect();
    pc.classList.add('flying');pc.style.transition='none';pc.style.transform=`translate(${a.left-b.left}px,${a.top-b.top}px) scale(1.2)`;
    void pc.getBoundingClientRect();pc.style.transition='transform .6s cubic-bezier(.2,.8,.2,1)';pc.style.transform='';
    setTimeout(()=>{pc.classList.remove('flying');pc.style.transition=''},650);
  }
  collectStar(i){const s=this.cells[i]&&this.cells[i].querySelector('.star');if(s)s.classList.add('got')}
}

const RANKS=['Schach-Küken','Bauern-Lehrling','Bauern-Profi','Turm-Wächter','Läufer-Kundschafter','Springer-Ritter','Damen-Held','Königs-Freund','Schach-Meister','Großmeister'];
function rankInfo(xp){
  let lvl=1,need=60,base=0;
  while(xp>=base+need){base+=need;lvl++;need=60+lvl*30}
  return{lvl,title:RANKS[Math.min(RANKS.length-1,lvl-1)],into:xp-base,need,pct:Math.round((xp-base)/need*100)};
}

/* ---------- Belohnungen, Serie, Tagesmission ---------- */
const Rewards={
  touchDay(){
    const p=P(),d=today();
    if(p.streak.last===d)return;
    const diff=p.streak.last?dayDiff(p.streak.last,d):99;
    p.streak.count=diff===1?p.streak.count+1:1;p.streak.last=d;p.stats.days++;
    Skills.snapshot();save();
  },
  addXP(n){
    const p=P(),before=rankInfo(p.xp).lvl;p.xp+=n;const after=rankInfo(p.xp);
    if(after.lvl>before)setTimeout(()=>UI.celebrate(`Neuer Rang: ${after.title}!`,'Du bist jetzt auf Level '+after.lvl+'.','trophy'),500);
  },
  addStars(n){P().stars+=n;this.addXP(n*10)},
  checkBadges(){
    const p=P();const got=[];
    for(const b of BADGES){if(!p.badges[b.id]&&b.test(p)){p.badges[b.id]=today();got.push(b)}}
    got.forEach((b,i)=>setTimeout(()=>{UI.toast(badgeMedal(b,true),'Neues Abzeichen: '+b.name);sfx.star()},800+i*1600));
    if(got.length)save();
    return got;
  },
  daily(){
    const p=P(),d=today();
    if(p.daily&&p.daily.date===d)return p.daily;
    const weak=Skills.weakest(['capture','protect','escape','mate','fork','move_n','move_b','move_r','move_q','move_k','coords'])||pick(['capture','mate','move_n']);
    const nl=nextLesson();
    const tasks=[
      {id:'skill',skill:weak,goal:3,have:0,label:`${SKILLS[weak].name}: 3 Aufgaben`},
      nl?{id:'lesson',goal:1,have:0,label:`Lektion: ${nl.name}`}:{id:'puzzles',goal:5,have:0,label:'5 Rätsel lösen'},
      {id:'game',goal:1,have:0,label:'Eine Partie mit Peter'}
    ];
    p.daily={date:d,tasks,claimed:false};save();return p.daily;
  },
  progress(kind,info){
    const dl=this.daily();let changed=false;
    for(const t of dl.tasks){
      if(t.have>=t.goal)continue;
      if(t.id==='skill'&&kind==='task'&&info&&info.skill===t.skill&&info.ok){t.have++;changed=true}
      if(t.id==='puzzles'&&kind==='task'&&info&&info.ok&&info.puzzle){t.have++;changed=true}
      if(t.id==='lesson'&&kind==='lesson'){t.have++;changed=true}
      if(t.id==='game'&&kind==='game'){t.have++;changed=true}
      if(changed&&t.have>=t.goal){setTimeout(()=>{UI.toast(ICON.check,'Mission geschafft: '+t.label);sfx.good()},300)}
    }
    if(changed)save();
  },
  dailyDone(){const d=this.daily();return d.tasks.every(t=>t.have>=t.goal)},
  openChest(){
    const p=P();const lockedHats=Object.keys(HATS).filter(h=>!p.outfit.hats.includes(h));
    const lockedCols=PETER_COLORS.filter(c=>!p.outfit.colors.includes(c));
    let prize;
    if(lockedHats.length&&(Math.random()<.6||!lockedCols.length)){const h=pick(lockedHats);p.outfit.hats.push(h);prize={kind:'hat',id:h,name:HAT_NAMES[h]}}
    else if(lockedCols.length){const c=pick(lockedCols);p.outfit.colors.push(c);prize={kind:'color',id:c,name:'Neue Farbe für Peter'}}
    else{prize={kind:'xp',name:'50 Bonuspunkte'};this.addXP(50)}
    this.addXP(30);save();return prize;
  }
};

      <div class="bubble"><p class="say" data-live aria-live="polite"></p><button class="speak" data-act="repeat" aria-label="Nochmal vorlesen">${ICON.speaker}</button></div></div>
      <div class="card" id="soundHelp" hidden style="border-color:var(--sun)"><b>Peter ist stumm?</b> <span class="small">Lautstärke hochdrehen. Am iPhone den Stummschalter an der Seite auf „laut“ stellen.</span></div>
      <div id="stage" style="display:flex;flex-direction:column;gap:12px"></div></div>`;
  },
  mount(el){
    el.addEventListener('click',e=>{
      const a=e.target.closest('[data-act]');if(!a)return;
      if(a.dataset.act==='quit')this.quit();
      if(a.dataset.act==='repeat'){audioUnlock();Peter.repeat()}
      if(a.dataset.act==='peter'){Peter.bounce();sfx.boing()}
    });
    this.run();
  },
  progress(n){const c=this.cur;c.done=Math.min(c.items,c.done+(n===0?0:(n||1)));const b=$('.prog i');if(b)b.style.width=Math.round(c.done/c.items*100)+'%'},
  mistake(){this.cur.mistakes++},
  quit(){
    Voice.speak('Möchtest du aufhören? Grün heißt weiterspielen.');
    UI.confirm('Aufhören?','Du kannst später genau hier weitermachen.','Weiterspielen','Aufhören',{yesIcon:'play',noIcon:'home'}).then(stay=>{if(!stay){this.cur.alive=false;Voice.stop();UI.go(this.cur.training?'train':'home')}else Voice.stop()});
  },
  async run(){
    const c=this.cur;
    setTimeout(()=>this.progress(0),50);
    for(c.stepIdx=c.startStep||0;c.stepIdx<c.steps.length;c.stepIdx++){
      if(!c.alive)return;
      const step=c.steps[c.stepIdx];
      if(c.lesson){P().resume={id:c.lesson.id,step:c.stepIdx,mistakes:c.mistakes,date:today()};save()}
      const fn=STEP[step.t];if(!fn)continue;
      const stage=$('#stage');if(!stage)return;
      stage.innerHTML='';
      await fn(step,stage,c);
      if(!c.alive)return;
      if(step.t==='duel')return; /* Partie übernimmt */
    }
    this.finish();
  },
  starsFor(c){
    if(c.starsFromDuel!=null)return c.starsFromDuel;
    const r=c.mistakes/Math.max(1,c.items);
    return c.mistakes<=2?3:r<=.5?2:1;
  },
  finish(){
    const c=this.cur;if(!c||!c.alive)return;c.alive=false;
    const p=P(),stars=this.starsFor(c);
    if(c.lesson)p.resume=null;
    let newStars=stars,friend=null,worldNow=false;
    if(c.lesson){
      const prev=p.lessons[c.lesson.id]||0;newStars=Math.max(0,stars-prev);
      const wasDone=worldDone(c.lesson.world);
      p.lessons[c.lesson.id]=Math.max(prev,stars);
      if(!prev){p.stats.lessons++;Rewards.progress('lesson')}
      if(!wasDone&&worldDone(c.lesson.world)){worldNow=true;friend=FRIENDS.find(f=>f.world===c.lesson.world.id);p.chests++}
    }
    Rewards.addStars(newStars);Rewards.addXP(c.lesson?15:10);
    save();
    const badges=Rewards.checkBadges();
    UI.showDone({stars,newStars,lesson:c.lesson,training:c.training,friend,worldNow,title:c.title,color:c.color});
  }
};

/* ---------- Hilfen ---------- */
function stageHTML(task,extra,pic){return `<button class="taskline" data-act="repeat" aria-label="Aufgabe vorlesen">${pic?`<span class="tpic">${pic}</span>`:''}<span class="task">${task}</span><span class="tspk">${ICON.speaker}</span></button><div class="bd"></div>${extra||''}<div class="ctl"></div>`}
const KIND_PIC={mate:ICON.crown,capture:ICON.eye,rescue:ICON.shield,escape:ICON.ring,fork:ICON.fork,pawncap:'p',promote:'q',castle:ICON.castle,ismate:ICON.crown};
const picOf=k=>k&&k.length===1?pieceSVG('w',k,'i'):k;
function dots(n,total){let h='<span class="dots">';for(let i=0;i<total;i++)h+=`<i class="${i<n?'on':''}"></i>`;return h+'</span>'}
function waitClick(el){return new Promise(r=>el.addEventListener('click',()=>{audioUnlock();r()},{once:true}))}
function continueBtn(stage,label,cls){
  const ctl=$('.ctl',stage)||stage;
  ctl.innerHTML=`<button class="big ${cls||'go'} wide nextbtn" data-cont style="background:var(--wc);color:#fff" aria-label="${esc(label||'Weiter')}"><span>${label||'Weiter'}</span><span class="nexticon">${label&&/Fertig|Erledigt|aufgebaut/.test(label)?ICON.check:ICON.next}</span></button>`;
  return waitClick($('[data-cont]',ctl));
}
function feedback(stage,good,text){
  const ctl=$('.ctl',stage);if(!ctl)return;
  ctl.innerHTML=`<div class="feedback ${good?'good':'bad'}">${good?ICON.check:ICON.bulb}<span>${esc(text)}</span></div>`;
}
const praise=()=>pick(PRAISE);
const recordTask=(skill,ok,w,puzzle)=>{Skills.record(skill,ok,w);if(ok){P().stats.puzzlesOk+=puzzle?1:0}if(puzzle)P().stats.puzzles++;Rewards.progress('task',{skill,ok,puzzle});save()};

/* ---------- Aufgabenarten ---------- */
const STEP={
  async talk(step,stage,c){
    stage.innerHTML=`<div class="bd"></div><div class="ctl"></div>`;

  async coordFind(step,stage,c){

          else{bt.classList.add('wrong');sfx.nope();if(first){Runner.mistake();recordTask('coords',false,.6,false)}first=false;Peter.say('Nein, schau auf den Buchstaben unten und die Zahl an der Seite.','think')}};

  async reach(step,stage,c){
    const type=step.type;
    stage.innerHTML=stageHTML(`Wohin kann ${ART[type]} ${NAME[type]}?`,'<div class="counter" id="rc"></div>',pieceSVG('w',type,'i'));
    const b=new Board($('.bd',stage),{names:'edge'});

      const pos=new Pos(lv.fen);b.clearMarks();b.setPos(pos);b.mark('sel',[lv.from]).render();window.__reach=lv;

      const upd=()=>{$('#rc').innerHTML=`<span class="cnt">${ICON.check}<b>${found.size}</b> / ${lv.targets.length}</span>`};upd();
      Peter.say(i===0?`Wohin kann ${ART[type]} ${NAME[type]} ziehen? Tippe alle Felder an!`:pick(['Und hier? Tippe alle Felder!','Nächste Runde! Wohin geht es?']),'smile');

        b.opt.onTap=sq=>{

    const type=step.type;
    stage.innerHTML=stageHTML(`Sammle alle Sterne!`,'<div class="counter"><span id="mv" class="cnt"></span></div>',pieceSVG('w',type,'i'));
    const ctl=$('.ctl',stage);
    const b=new Board($('.bd',stage),{names:'edge'});
    for(let i=0;i<step.count;i++){
      if(!c.alive)return;
      const nStars=Math.min(5,step.stars+(i>=2?1:0));
      const lv=Trainer.genStars(type,{stars:nStars,rocks:step.rocks,maxPar:step.maxPar||Math.max(6,nStars+3)});
      if(!lv){Runner.progress(1);continue}
      let cur,left,moves,wrong=0;
      let helping=false;
      const showHelp=(say)=>{
        const path=Trainer.starPath(type,cur,[...left],new Set(lv.rocks));
        if(!path.length)return;helping=true;b.mark('goal',[path[0]]).render();
        if(say)Peter.say(pick(['Ich helfe dir! Zieh auf das gelbe Feld.','Schau mal, das gelbe Feld! Da geht es weiter.']),'smile');
      };
      const reset=()=>{cur=lv.start;left=new Set(lv.stars);moves=0;helping=false;const arr=new Array(128).fill(null);arr[cur]='w'+type;b.clearMarks();b.setPieces(arr);b.mark('star',[...left]).mark('rock',lv.rocks).mark('sel',[cur]).render();upd()};
      const upd=()=>{$('#mv').innerHTML=`${ICON.footprints.replace('<svg','<svg aria-label="Züge"')}<b>${moves}</b>&nbsp;/ ${lv.par}`;$('#mv').classList.toggle('over',moves>lv.par)};
      ctl.innerHTML=`<button class="big ghost wide" data-reset>${ICON.refresh} Nochmal von vorne</button>`;window.__stars={lv,get cur(){return cur},get left(){return [...left]}};
      reset();
      Peter.say(i===0?`Sammle alle Sterne ein! Schaffst du es in ${lv.par} Zügen?`:pick([`Neue Sterne! Ziel: ${lv.par} Züge.`,`Weiter geht's! Wie wäre es mit ${lv.par} Zügen?`]),'smile');
      await new Promise(res=>{
        $('[data-reset]',ctl).onclick=()=>{sfx.tap();reset()};

          if(sq===cur)return;

      {t:'Jetzt die Dame. Sie steht auf ihrer Farbe: die weiße Dame auf dem hellen Feld D1, die schwarze Dame auf dem dunklen Feld D8.',pcs:['d1Q','d8q']},
      {t:'Der König kommt auf das letzte freie Feld daneben: E1 und E8.',pcs:['e1K','e8k']},
      {t:'Zum Schluss die Bauern. Sie stehen alle in einer Reihe davor.',pcs:'abcdefgh'.split('').flatMap(f=>[f+'2P',f+'7p'])}
    ];
    stage.innerHTML=stageHTML('Bau dein echtes Brett auf','',ICON.board);
    const b=new Board($('.bd',stage),{names:'edge'});
    const arr=new Array(128).fill(null);b.setPieces(arr);
    for(let k=0;k<S.length;k++){

      const s=S[k];const newSq=[];

    stage.innerHTML=`<div class="card center" style="display:flex;flex-direction:column;gap:12px">

      <div class="bd"></div></div><div class="ctl"></div>`;
    const b=new Board($('.bd',stage),{names:'edge'});b.setPos(new Pos(step.variant==='pawns'?PAWNS_FEN:START_FEN));
    Peter.say(step.variant==='pawns'?'Bauernschlacht! Stell nur die Bauern auf. Wer zuerst ganz hinten ankommt, gewinnt.':'Zeit für ein echtes Duell! Bau dein Brett auf, dann geht es los.','smile');

    Game.start({variant:step.variant,fresh:!cont,lesson:c.lesson&&c.lesson.id,lessonCb:(result)=>{

      Runner.cur=c;c.alive=true;Runner.finish();

/* ---------- Bilder für Antworten (für Kinder, die noch nicht lesen) ---------- */
function quizPic(p){
  if(p==='yes')return `<span class="qp yes">${ICON.check}</span>`;
  if(p==='no')return `<span class="qp no">${ICON.close}</span>`;
  if(p==='light'||p==='dark')return `<span class="qp sqsw ${p}"></span>`;
  if(p.startsWith('sq:')){const[,s,pc]=p.split(':');return miniBoard(sqIdx(s),pc)}
  return '';
}
function miniBoard(hl,pc){
  /* Ausschnitt: 3×2 Felder rund um das Feld, groß genug, um Farbe und Figur zu erkennen */
  const hx=hl&7,hr=hl>>4,c0=Math.max(0,Math.min(5,hx-1)),r0=Math.max(0,Math.min(6,hr));let r='';
  for(let y=0;y<2;y++)for(let x=0;x<3;x++){const rank=r0+1-y,file=c0+x,sq=rank*16+file;r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${(file+rank)%2===0?'var(--dark-sq)':'var(--light-sq)'}"/>`;if(sq===hl)r+=`<rect x="${x+.04}" y="${y+.04}" width=".92" height=".92" fill="none" stroke="var(--sun)" stroke-width=".08"/>`}
  const x=hx-c0,y=r0+1-hr;const col=pc&&pc===pc.toUpperCase()?'w':'b';
  return `<svg class="qp mini" viewBox="0 0 3 2" aria-hidden="true">${r}${pc?`<svg x="${x+.06}" y="${y+.04}" width=".88" height=".88" class="p${col}">${pieceUses(col,pc.toLowerCase())}</svg>`:''}</svg>`;
}

/* ---------- Rätsel mit Zug ---------- */
function solveMove(pz,b,stage,c,i,skill,kind){
  return new Promise(res=>{
    const pos=new Pos(pz.fen);let sel=-1,wrong=0,solved=false;window.__pz=pz;
    b.clearMarks();b.setPos(pos);
    const base=()=>{b.clearMarks();b.setPos(pos);
      if(kind==='rescue'){b.mark('danger',[sqIdx(pz.target),sqIdx(pz.by)])}
      if(kind==='escape'){b.mark('check',[pos.kings.w]).mark('danger',[sqIdx(pz.checker)])}
      b.render()};
    base();
    const intro={
      mate:['Finde den Zug, der den König mattsetzt!','Kannst du Matt in einem Zug finden?','Schachmatt in einem Zug! Wo ist er?'],
      capture:['Eine meiner Figuren steht ganz allein. Schnapp sie dir!','Adlerauge! Welche Figur kannst du einfach schlagen?'],
      rescue:['Oh nein, eine deiner Figuren wird angegriffen! Rette sie!','Die rot blinkende Figur ist in Gefahr. Was machst du?'],
      escape:['Schach! Dein König muss gerettet werden!','Dein König wird angegriffen. Wie rettest du ihn?'],
      fork:['Finde einen Zug, der zwei Figuren gleichzeitig angreift!','Gabel-Zeit! Welcher Zug greift zwei Figuren an?'],
      pawncap:['Welcher Bauer kann etwas schlagen? Denk dran: schräg!','Bauern schlagen schräg. Wer kann schlagen?'],
      promote:['Bring einen Bauern ganz nach hinten!','Welcher Bauer kann sich verwandeln?'],
      castle:['Mach die Rochade! Tippe den König an und zieh ihn zwei Felder zur Seite.','Rochade! Wohin muss der König?']
    }[kind];
    Peter.say(pick(intro),'smile');
    const sols=new Set(pz.sol);
    const showHint=()=>{const s=pz.sol[0];b.arrows([{from:sqIdx(s.slice(0,2)),to:sqIdx(s.slice(2,4)),kind:'hint'}]).render()};
    const autoSolve=()=>{
      const s=pz.sol[0];const m=pos.legal().find(x=>sqName(x.from)+sqName(x.to)===s&&(!x.promo||x.promo==='q'));
      if(!m)return;solved=true;b.opt.onTap=null;
      Peter.say(pick(['Das war knifflig! Schau, so geht es.','Ich zeige es dir. Schau genau hin!']),'smile');
      setTimeout(()=>{pos.make(m);b.clearMarks();b.setPos(pos);b.animate(m.from,m.to);m.cap?sfx.capture():sfx.move();
        if(kind==='mate')b.mark('check',[pos.kings.b]).render();
        P().stats.puzzles++;save();setTimeout(res,2600)},1200);
    };
    const fail=(text)=>{
      wrong++;sfx.nope();if(wrong===1){Runner.mistake();recordTask(skill,false,.7,true)}
      if(wrong>=4&&kind!=='escape'){autoSolve();return}
      Peter.say(text,'think');
      if(wrong>=2)showHint();
    };
    b.opt.onTap=sq=>{
      if(solved)return;
      const p=pos.board[sq];
      if(sel<0||(p&&p[0]==='w'&&sq!==sel)){
        if(p&&p[0]==='w'){sel=sq;sfx.select();const ds=pos.pseudoFrom(sq);b.mark('sel',[sq]).mark('dot',ds.filter(m=>!m.cap).map(m=>m.to)).mark('ring',ds.filter(m=>m.cap).map(m=>m.to)).render()}
        else if(p){sfx.nope();b.flash(sq,'shake');Peter.say('Das ist meine Figur! Du spielst Weiß.','wow')}
        return;
      }
      if(sq===sel){sel=-1;b.mark('sel',[]).mark('dot',[]).mark('ring',[]).render();return}
      const pseudo=pos.pseudoFrom(sel).filter(m=>m.to===sq);
      const pt=pos.board[sel][1];
      if(!pseudo.length){
        sfx.nope();b.flash(sq,'bad');
        if(kind==='pawncap'&&pt==='p'&&sq===sel+16)Peter.say('Geradeaus kann der Bauer nicht schlagen. Bauern schlagen schräg!','think');
        else Peter.say(`So kann ${ART[pt]} ${NAME[pt]} nicht ziehen.`,'think');
        Skills.record('move_'+pt,false,.3);return;
      }
      let m=pseudo.find(x=>!x.promo||x.promo==='q')||pseudo[0];
      const uci=sqName(m.from)+sqName(m.to);
      if(!pos.isLegal(m)){fail(kind==='escape'?'Dann steht dein König immer noch im Schach!':'Das geht nicht, dann wäre dein König im Schach!');sel=-1;base();return}
      let ok=sols.has(uci);
      if(kind==='escape')ok=true;
      if(kind==='rescue')ok=Trainer.rescueOk(pos,m);
      if(kind==='castle')ok=m.flag==='k'||m.flag==='q';
      if(!ok){
        let t=pick(ENCOURAGE);
        if(kind==='castle'&&m.piece==='k')t='Fast! Bei der Rochade macht der König zwei Schritte zum Turm.';
        else if(kind==='castle')t='Bei der Rochade fängst du mit dem König an. Zwei Schritte zur Seite!';
        else if(kind==='mate'){pos.make(m);const ch=pos.inCheck();pos.unmake();t=ch?'Schach! Aber der König kann sich noch retten. Gibt es einen besseren Zug?':'Das ist noch kein Schach. Greif den König an, so dass er nicht mehr weg kann!'}
        else if(kind==='capture'&&m.cap)t='Vorsicht, die Figur ist beschützt! Dann schlage ich zurück. Such eine Figur, die ganz allein steht.';
        else if(kind==='capture')t='Schau nochmal genau: Welche Figur von mir steht ganz allein?';
        else if(kind==='rescue')t='Oh, dann kann ich immer noch eine Figur von dir schnappen!';
        else if(kind==='fork')t='Hmm, das greift noch nicht zwei Figuren an. Wo könnte dein Springer hinspringen?';
        else if(kind==='pawncap')t='Das schlägt noch nichts. Welcher Bauer kann schräg schlagen?';
        fail(t);
        if(kind==='rescue'||kind==='capture'){pos.make(m);b.setPos(pos);b.animate(m.from,m.to);setTimeout(()=>{pos.unmake();sel=-1;base();if(wrong>=2)showHint()},900)}
        else{sel=-1;base();if(wrong>=2)showHint()}
        return;
      }
      solved=true;b.opt.onTap=null;
      pos.make(m);b.clearMarks();b.setPos(pos);b.animate(m.from,m.to);
      m.cap?sfx.capture():sfx.move();setTimeout(()=>sfx.good(),200);
      if(wrong===0)recordTask(skill,true,1,true);else{P().stats.puzzles++;save()}
      let t=praise();
      if(kind==='mate'){b.mark('check',[pos.kings.b]).render();t=pick(['Schachmatt! Super!','Matt! Der König kann nicht mehr weg!','Volltreffer, Schachmatt!'])}
      if(kind==='fork'){const tg=Trainer.forkTargets(pos,m.to);b.arrows(tg.map(x=>({from:m.to,to:x,kind:'bad'}))).render();t='Gabel! Du greifst zwei Figuren gleichzeitig an!';P().stats.forks++}
      if(kind==='promote')t='Juhu, der Bauer wird zur Dame!';
      if(kind==='castle')t='Rochade! Dein König ist jetzt in Sicherheit.';
      if(kind==='escape')t=m.piece==='k'?'Gerettet! Der König ist weggelaufen.':m.cap?'Gerettet! Du hast den Angreifer geschlagen.':'Gerettet! Du hast etwas dazwischen gestellt.';
      if(kind==='capture')t=pick(['Geschnappt! Adlerauge!','Lecker, die Figur gehört dir!','Super gesehen!']);
      if(kind==='rescue')t=pick(['Gerettet! Gut aufgepasst.','Super, jetzt ist alles sicher!']);
      Peter.say(t,'wow');Peter.bounce();
      setTimeout(res,1500);
    };
  });
}
function askIsMate(pz,b,stage,c,i){
